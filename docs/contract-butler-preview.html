<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>协议管家 · 契约工作台</title>
<style>
  /* ============ 液态玻璃 · 卡片式 ============
     沿用 docs/ios-glass-preview.html 的玻璃语言：
     三层玻璃(regular/thin/clear) + backdrop-filter + 高光内描边 + 分离度降级 */

  :root {
    color-scheme: light;
    --bg: #e9ecf4;

    /* 玻璃三层 */
    --glass-regular: rgba(255,255,255,.70);
    --glass-thin:    rgba(255,255,255,.50);
    --glass-clear:   rgba(255,255,255,.26);
    --glass-edge:      rgba(255,255,255,.62);
    --glass-edge-soft: rgba(255,255,255,.34);
    --glass-spec:      rgba(255,255,255,.72);

    /* 填充 */
    --fill: rgba(118,118,128,.11);
    --fill-secondary: rgba(118,118,128,.07);
    --fill-selected: rgba(0,122,255,.12);

    /* 兼容旧变量名（JS 内联样式在用） */
    --panel: var(--glass-regular);
    --hover: var(--fill-secondary);
    --sel:   var(--fill-selected);
    --line:  rgba(60,60,67,.13);
    --line2: rgba(60,60,67,.22);

    --ink:  #14141a;
    --ink2: rgba(50,50,60,.72);
    --ink3: rgba(50,50,60,.46);

    --ok: #16a34a; --warn: #c07600; --bad: #dc2b22; --accent: #007aff;

    /* 状态光晕：契约的状态从玻璃里透出来 */
    --glow-ok:      rgba(52,199,89,.34);
    --glow-changed: rgba(255,149,0,.34);
    --glow-bad:     rgba(255,59,48,.32);

    --shadow:      0 28px 80px rgba(30,35,60,.20), 0 8px 24px rgba(30,35,60,.10);
    --shadow-soft: 0 10px 30px rgba(30,35,60,.10), 0 2px 8px rgba(30,35,60,.06);

    --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 30px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
  }

  body.dark {
    color-scheme: dark;
    --bg: #06060a;
    --glass-regular: rgba(40,40,48,.70);
    --glass-thin:    rgba(40,40,48,.50);
    --glass-clear:   rgba(40,40,48,.24);
    --glass-edge:      rgba(255,255,255,.13);
    --glass-edge-soft: rgba(255,255,255,.08);
    --glass-spec:      rgba(255,255,255,.15);
    --fill: rgba(120,120,130,.22);
    --fill-secondary: rgba(120,120,130,.13);
    --fill-selected: rgba(10,132,255,.24);
    --line:  rgba(235,235,245,.13);
    --line2: rgba(235,235,245,.22);
    --ink:  #f5f5f7;
    --ink2: rgba(235,235,245,.72);
    --ink3: rgba(235,235,245,.46);
    --ok: #34c759; --warn: #ff9f0a; --bad: #ff453a; --accent: #0a84ff;
    --glow-ok:      rgba(52,199,89,.26);
    --glow-changed: rgba(255,159,10,.26);
    --glow-bad:     rgba(255,69,58,.26);
    --shadow:      0 32px 90px rgba(0,0,0,.62), 0 10px 28px rgba(0,0,0,.42);
    --shadow-soft: 0 14px 34px rgba(0,0,0,.36), 0 3px 10px rgba(0,0,0,.26);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--ui); font-size: 13px; line-height: 1.55;
    letter-spacing: -.011em; -webkit-font-smoothing: antialiased;
  }
  button, input, label { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 8px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============ 背景：会动的色斑（玻璃要真的"液"） ============ */
  .liquid { position: fixed; inset: -18%; z-index: 0; pointer-events: none; }
  .liquid span {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: .52;
    animation: drift 36s ease-in-out infinite alternate;
  }
  .liquid span:nth-child(1) { width: 46vw; height: 46vw; left: -6%; top: -10%;
    background: radial-gradient(circle, rgba(0,122,255,.50), transparent 68%); }
  .liquid span:nth-child(2) { width: 40vw; height: 40vw; right: -6%; top: 0%;
    background: radial-gradient(circle, rgba(175,82,222,.42), transparent 68%);
    animation-duration: 46s; animation-direction: alternate-reverse; }
  .liquid span:nth-child(3) { width: 44vw; height: 44vw; left: 20%; bottom: -16%;
    background: radial-gradient(circle, rgba(52,199,89,.36), transparent 68%);
    animation-duration: 40s; }
  .liquid span:nth-child(4) { width: 32vw; height: 32vw; right: 14%; bottom: -8%;
    background: radial-gradient(circle, rgba(255,149,0,.30), transparent 68%);
    animation-duration: 50s; animation-direction: alternate-reverse; }
  body.dark .liquid span { opacity: .48; }
  @keyframes drift {
    0%   { transform: translate3d(0,0,0) scale(1); }
    50%  { transform: translate3d(4vw,3vh,0) scale(1.14); }
    100% { transform: translate3d(-3vw,4vh,0) scale(.94); }
  }

  /* ============ 三张卡片：header / 侧边栏 / 内容 ============ */
  .stage {
    position: relative; z-index: 1; height: 100vh; padding: 16px;
    display: grid; gap: 14px;
    grid-template-columns: 306px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "head head" "side main";
  }
  /* 玻璃卡片 + 状态光晕从右上透出来 */
  .card {
    position: relative; min-width: 0;
    border-radius: var(--r-lg); border: 1px solid var(--glass-edge);
    background:
      radial-gradient(760px 380px at 90% -16%, var(--glow, transparent), transparent 72%),
      var(--glass-regular);
    box-shadow: var(--shadow-soft), inset 0 1px 0 var(--glass-spec);
    backdrop-filter: blur(24px) saturate(1.75); -webkit-backdrop-filter: blur(24px) saturate(1.75);
  }
  .g-ok      { --glow: var(--glow-ok); }
  .g-changed { --glow: var(--glow-changed); }
  .g-bad     { --glow: var(--glow-bad); }

  /* ============ 顶栏 ============ */
  .topbar {
    grid-area: head; padding: 11px 22px; z-index: 6;   /* 抬起来，否则下拉会被下面两张卡盖住 */
    display: flex; align-items: center; gap: 18px;
  }
  .tb-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

  /* 版本条：这次对比的是哪两版，两端都能点开换 */
  .tb-range { display: flex; align-items: center; gap: 7px; margin-left: auto; flex-wrap: wrap; }
  .revproj { font-size: 12px; font-weight: 600; color: var(--ink2); margin-right: 3px; }
  .revbtn {
    position: relative; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 6px 10px; font-family: var(--mono); font-size: 11.5px; font-weight: 600;
    color: var(--ink); border: 1px solid var(--glass-edge-soft); border-radius: 999px;
    background: var(--glass-thin); box-shadow: inset 0 1px 0 var(--glass-spec);
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  }
  .revbtn:hover { border-color: var(--line2); }
  .revbtn .revtag { font-family: var(--ui); font-size: 10px; font-weight: 600;
    padding: 1px 6px; border-radius: 999px; color: var(--ink2); background: var(--fill); }
  .revbtn .revtag.wt { color: var(--warn);
    background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .revbtn .revcaret { font-size: 9px; color: var(--ink3); }
  .revarrow { font-size: 12px; color: var(--ink3); }
  .revsum { font-size: 11.5px; color: var(--ink3); margin-left: 3px; }
  .revpop { left: 0; right: auto; min-width: 330px; max-height: 46vh; overflow: auto; }
  .revopt .flabel { flex: none; font-family: var(--mono); font-size: 11.5px; }
  .revopt .fsub { flex: 1; min-width: 0; text-align: left; font-size: 11.5px; color: var(--ink2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .revopt .fhint { flex: none; font-size: 10.5px; }
  .htitle { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .hsub { font-size: 12px; color: var(--ink3); }
  .mark {
    width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center;
    color: #fff; font-size: 12px; font-weight: 700;
    background: linear-gradient(145deg, #37a3ff, #0066e0);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.48), 0 5px 14px rgba(0,122,255,.30);
  }
  .title { font-weight: 700; font-size: 13.5px; }
  .subtitle { font-size: 11.5px; color: var(--ink3); }
  .spacer { flex: 1; }

  .ghost {
    padding: 6px 12px; cursor: pointer; font-size: 12px; color: var(--ink2);
    border: 1px solid var(--glass-edge-soft); border-radius: 999px;
    background: var(--glass-thin);
    box-shadow: inset 0 1px 0 var(--glass-spec);
    transition: background .18s ease, color .18s ease;
  }
  .ghost:hover { background: var(--fill); color: var(--ink); }

  .seg { display: flex; gap: 3px; padding: 3px; border-radius: 999px;
    border: 1px solid var(--glass-edge-soft); background: var(--glass-thin);
    box-shadow: inset 0 1px 0 var(--glass-spec); }
  .seg button {
    padding: 4px 11px; border: 0; border-radius: 999px; cursor: pointer; font-size: 12px;
    color: var(--ink2); background: transparent; transition: background .18s ease, color .18s ease;
  }
  .seg button.on { color: var(--accent); background: var(--fill-selected); }

  /* ============ 两栏 ============ */
  .sidebar {
    grid-area: side; display: flex; flex-direction: column;
    min-height: 0; overflow: hidden;
  }
  .side-top { flex: none; padding: 12px; display: grid; gap: 9px; border-bottom: 1px solid var(--glass-edge-soft); }
  .side-foot { flex: none; display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-top: 1px solid var(--glass-edge-soft); }
  .side-foot .seg { margin-right: auto; }
  .search {
    width: 100%; padding: 8px 12px; font-size: 12.5px; outline: none;
    border: 1px solid var(--glass-edge-soft); border-radius: 999px;
    background: var(--glass-regular); color: var(--ink);
    box-shadow: inset 0 1px 0 var(--glass-spec);
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  }
  .search::placeholder { color: var(--ink3); }
  .search:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  /* 搜索 + 筛选按钮一行；下拉从这一行下面展开 */
  .filtwrap { position: relative; display: flex; align-items: center; gap: 8px; }
  .filtwrap .search { flex: 1; min-width: 0; }
  .filtbtn {
    flex: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 8px 11px; font-family: var(--ui); font-size: 12.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--glass-edge-soft); border-radius: 999px;
    background: var(--glass-thin); box-shadow: inset 0 1px 0 var(--glass-spec);
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  }
  .filtbtn:hover { color: var(--ink); }
  .filtbtn.on { color: var(--accent); background: var(--fill-selected);
    border-color: color-mix(in srgb, var(--accent) 42%, transparent); }
  .filtbtn .fico { width: 11px; height: 11px; flex: none; display: block; }
  .fbadge { min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px;
    font-size: 10px; font-weight: 700; line-height: 15px; text-align: center;
    color: #fff; background: var(--accent); }
  .filtpop {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 40;
    padding: 6px; display: grid; gap: 1px; border-radius: var(--r-md);
    border: 1px solid var(--glass-edge); background: var(--glass-regular);
    box-shadow: var(--shadow-soft), inset 0 1px 0 var(--glass-spec);
    backdrop-filter: blur(24px) saturate(1.7); -webkit-backdrop-filter: blur(24px) saturate(1.7);
  }
  .filtpop[hidden] { display: none; }
  .fopt { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 7px 9px; border: 0; border-radius: 10px; cursor: pointer;
    font-family: var(--ui); font-size: 12px; color: var(--ink2); background: none; }
  .fopt:hover { background: var(--fill-secondary); }
  .fopt:focus { outline: none; }
  .fopt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .fopt.on { color: var(--ink); }
  .fopt .box { width: 15px; height: 15px; flex: none; position: relative;
    border-radius: 4.5px; border: 1.5px solid var(--line2); }
  .fopt.on .box { border-color: var(--accent); background: var(--accent); }
  .fopt.on .box::after { content: ''; position: absolute; left: 4.5px; top: 1.5px;
    width: 4.5px; height: 8px; border-right: 1.8px solid #fff; border-bottom: 1.8px solid #fff;
    transform: rotate(40deg); }
  .fopt .flabel { flex: none; }
  .fopt .fhint { flex: 1; text-align: right; font-size: 10.5px; color: var(--ink3); }
  .filtclear { margin-top: 3px; padding: 7px 9px; border: 0; border-radius: 10px; cursor: pointer;
    text-align: left; font-family: var(--ui); font-size: 11.5px; color: var(--ink3); background: none; }
  .filtclear:hover { background: var(--fill-secondary); color: var(--ink); }
  .filtclear:disabled, .filtclear.hint { cursor: default; }
  .filtclear.hint:hover { background: none; color: var(--ink3); }

  /* ============ 树 ============ */
  .tree { flex: 1; overflow: auto; padding: 8px 8px 18px; }
  .trow {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 10px; margin-bottom: 1px; cursor: pointer;
    border: 1px solid transparent; border-radius: var(--r-sm); background: transparent;
    transition: background .16s ease, border-color .16s ease;
  }
  .trow:hover { background: var(--fill-secondary); }
  .trow.on {
    background: var(--fill-selected);
    border-color: color-mix(in srgb, var(--accent) 34%, transparent);
    box-shadow: inset 0 1px 0 var(--glass-spec);
  }
  .caret { width: 10px; flex: none; font-size: 9px; color: var(--ink3); }
  .tname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cnt { flex: none; font-size: 10.5px; color: var(--ink3); font-family: var(--mono); }
  .cnt.zero { opacity: .4; }
  .selfb {
    flex: none; font-size: 10px; padding: 1px 7px; border-radius: 999px; color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 36%, transparent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }

  .t-proj { font-weight: 700; font-size: 12.5px; margin-top: 4px; }
  .t-proj .tpath { font-weight: 400; font-size: 10px; color: var(--ink3); font-family: var(--mono); }
  .t-proj { display: flex; align-items: center; gap: 6px; }
  .t-proj .caretbtn { width: 16px; flex: none; padding: 2px 0; border: 0; border-radius: 5px;
    background: transparent; color: var(--ink3); font-size: 9px; cursor: pointer; }
  .t-proj .caretbtn:hover { background: var(--fill-secondary); color: var(--ink); }
  .t-proj .namebtn { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px;
    padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer;
    color: inherit; font: inherit; font-weight: inherit; }
  .t-kind { padding-left: 16px; color: var(--ink2); font-size: 12px; }
  .t-con { padding-left: 30px; }
  .t-con .tname { font-family: var(--mono); font-size: 11.5px; }
  .t-gap { padding-left: 30px; }
  .t-gap .tname { font-size: 12px; color: var(--ink2); }
  .t-dir { padding-left: 14px; color: var(--ink2); font-size: 12px; }
  .t-dir .tdirname { font-family: var(--mono); font-size: 11px; }
  .t-dir .tfilen { font-family: var(--mono); font-size: 10.5px; color: var(--accent);
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-file { padding-left: 26px; color: var(--ink2); font-size: 11.5px; }
  .t-file .tname { font-family: var(--mono); font-size: 11px; }
  .t-con.inline { padding-left: 28px; }
  .t-gapband .tdirname { color: var(--bad); }
  .t-extband .tdirname { color: var(--ink3); }
  .t-gaphead { padding-left: 16px; cursor: default; color: var(--ink3); font-size: 12px; }
  .caret.hit { cursor: pointer; border-radius: 4px; }
  .caret.hit:hover { background: var(--fill-secondary); color: var(--ink); }
  .tree .trow.foc {
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border-color: color-mix(in srgb, var(--accent) 42%, transparent);
  }
  .gband.foc {
    border-color: color-mix(in srgb, var(--accent) 58%, transparent);
    background: radial-gradient(620px 300px at 90% -16%,
      color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%), var(--glass-thin);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent),
      var(--shadow-soft), inset 0 1px 0 var(--glass-spec);
  }
  .gband.dim { opacity: .38; }
  .gband { transition: opacity .18s ease, border-color .18s ease; }

  /* ---- 目录树：连接线（├ └ │ 用 CSS 画，跨过 padding 才连续）---- */
  .tree .trow { padding: 6px 8px; gap: 3px; margin-bottom: 0; }
  .tree .t-dir, .tree .t-file, .tree .t-con, .tree .t-gap,
  .tree .t-gapband, .tree .t-extband { padding-left: 8px; }
  /* 负 margin 要抵消 padding(6px) + 行 1px 透明边框，行高 31px 时才正好接上，
     否则每行之间会断 2px */
  .t-guides { flex: none; display: flex; align-self: stretch; margin: -7px 0; }
  .t-guides i { width: 13px; display: block; position: relative; }
  .t-guides i::before, .t-guides i::after {
    content: ''; position: absolute; background: var(--line2);
  }
  .t-guides i::before { left: 6px; width: 1px; top: 0; bottom: 0; }
  .t-guides i::after { left: 6px; right: 0; top: 50%; height: 1px; display: none; }
  .t-guides i.elbow::before { bottom: auto; height: 50%; }
  .t-guides i.tee::after, .t-guides i.elbow::after { display: block; }
  .tree .t-con { font-size: 12px; }
  .tree .t-con .tname { font-size: 11.5px; }
  .t-sub { flex: none; font-size: 10px; color: var(--ink3); }
  .t-gaphead:hover { background: transparent; }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .d-ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .d-changed { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }
  .d-brk { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 26%, transparent), 0 0 0 4.5px color-mix(in srgb, var(--warn) 13%, transparent); }
  .d-bad { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent); }

  /* ============ 中间：一张卡片装下全部内容 ============ */
  .main {
    grid-area: main; display: flex; flex-direction: column;
    min-height: 0; overflow: hidden;
  }
  .content {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    padding: 22px 30px 0;
  }
  .scrollarea { flex: 1; min-height: 0; overflow: auto; padding-bottom: 30px;
    scrollbar-gutter: stable; }

  /* 内容卡顶部：也只有两行 —— 标题 / 说明 */
  .chead { flex: none; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .cline1 { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ctitle { font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: -.022em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back { flex: none; padding: 2px 8px; border: 0; border-radius: 7px; cursor: pointer;
    background: transparent; color: var(--accent); font-family: var(--mono); font-size: 11.5px; }
  .back:hover { background: var(--fill-secondary); }
  .cline2 { display: flex; align-items: baseline; gap: 14px; margin-top: 5px; }
  .cdesc { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink2); }
  .cmeta2 { flex: none; font-size: 11px; color: var(--ink3); font-family: var(--mono); }

  /* 区段：靠分隔线分节，整张卡才是玻璃 */
  .block { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line); }
  .scrollarea > .block:first-child { margin-top: 0; padding-top: 0; border-top: none; }

  /* 两个标记互相独立，都没有就什么都不画：
     变过 = 相对基线版本有改动；不符 = 观测到与契约不合 */
  .facts { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }

  return (c.changes || []).filter(function (x) { return inRange(c, x.sha); });
}
function oldChanges(c) {
  var fr = revRank(c.p, rangeOf(c.p).from);
  return (c.changes || []).filter(function (x) { return revRank(c.p, x.sha) >= fr; });
}
function afterChanges(c) {
  var tr = revRank(c.p, rangeOf(c.p).to);
  return (c.changes || []).filter(function (x) { return revRank(c.p, x.sha) < tr; });
}
function changedOf(c) { return freshChanges(c).length > 0 || wtInRange(c); }
function breakingOf(c) { return freshChanges(c).some(function (x) { return x.k === '破坏'; }); }
/* 不符 = 观测到与契约不合的地方：调用不符的算一处，同一处的细节不重复计数 */
function findingsOf(c) {
  var bad = (c.calls || []).filter(function (x) { return !x.ok; }).length;
  if (bad) return bad;
  return (c.diffs || []).filter(function (x) { return x.tone === 'bad'; }).length;
}
/* 图上卡片只要一个点：有发现最优先，其次变更，什么都没有就不画 */
function nodeMark(c) {
  if (findingsOf(c)) return 'd-bad';
  if (changedOf(c)) return breakingOf(c) ? 'd-brk' : 'd-changed';
  return '';
}
function nodeTip(c) {
  var t = [], fc = freshChanges(c).length;
  if (fc) t.push('相对基线 ' + baselineId(c.p) + ' 变过 ' + fc + ' 次');
  if (c.wt) t.push('工作区改了，还没提交');
  var f = findingsOf(c);
  if (f) t.push('观测到 ' + f + ' 处与契约不合');
  return t.join('；');
}
/* 列表里用的标记：各自独立，都没有就不画 */
function factsChips(c) {
  var out = [], fc = freshChanges(c).length;
  if (fc) out.push(el('span', { class: 'chip chip-warn' + (breakingOf(c) ? ' brk' : ''),
    title: '相对基线 ' + baselineId(c.p) + ' 改过 ' + fc + ' 次',
    text: (breakingOf(c) ? '破坏性变更 ' : '变过 ') + fc + ' 次' }));
  if (c.wt) out.push(el('span', { class: 'chip chip-warn',
    title: '工作区改过，还没提交', text: '未提交' }));
  var f = findingsOf(c);
  if (f) out.push(el('span', { class: 'chip chip-bad',
    title: '观测到与契约不合 ' + f + ' 处', text: '不符 ' + f }));
  return out;
}
/* 项目整体：有发现就红，否则有变更就黄，否则什么都不加 */
function projFacts(pid) {
  var cs = contractsOf(pid);
  for (var i = 0; i < cs.length; i++) if (findingsOf(cs[i])) return 'bad';
  for (var j = 0; j < cs.length; j++) if (changedOf(cs[j])) return 'changed';
  return 'none';
}

/* ---------- 过滤 ---------- */
function match(c) {
  if (filtActive() && !hitFilt(c)) return false;
  if (!S.q) return true;
  var q = S.q.toLowerCase();
  return (c.name + ' ' + (c.file || c.home || '') + ' ' + c.boundary
    + ' ' + c.lead).toLowerCase().indexOf(q) >= 0;
}
function matchGap(g) {
  /* 缺口要单独选「还没有契约」才显示，不跟着契约的选项走 */
  if (filtActive() && !S.filt.gap) return false;
  if (!S.q) return true;
  return (g.name + ' ' + g.io).toLowerCase().indexOf(S.q.toLowerCase()) >= 0;
}
var filtering = function () { return !!(S.q || filtActive()); };
function pOpen(p) {
  if (filtering() || (S.reveal && selIn(p))) return true;
  if (S.openP[p.id] !== undefined) return S.openP[p.id];
  /* 默认只展开「当前选中的项目」—— 侧边栏始终跟着图走，两者不会脱节 */
  return p.id === S.proj;
}
function kOpen(pid, k) {
  if (filtering()) return true;
  var sc = S.sel ? byId(S.sel) : null;
  if (S.reveal && sc && sc.p === pid && sc.kind === k) return true;
  var key = pid + '|' + k;
  return S.openK[key] !== undefined ? S.openK[key] : true;
}

/* ---------- 侧边栏这棵树 ---------- */
/* 树里点的那个节点（目录/文件/缺口/外部），对应图上是哪些归属带 */
function focusBands(L, key) {
  var m = {};
  if (!key) return m;
  if (key === 'D:__gap') { m.gap = 1; return m; }
  if (key === 'D:__ext' || key.indexOf('D:__home:') === 0) { m.ext = 1; return m; }
  var dir = null;
  if (key.indexOf('D:') === 0) dir = key.slice(2);
  else if (key.indexOf('F:') === 0) dir = dirOf(key.slice(2));
  if (dir === null) return m;
  L.bands.forEach(function (b) {
    /* 点父目录要把它下面所有子目录的带一起点亮 */
    if (b.key === 'd:' + dir || b.key.indexOf('d:' + dir + '/') === 0) m[b.key] = 1;
  });
  return m;
}

/* 侧边栏数据 = 真正的目录树：项目 → 目录 → 文件 → 契约（单链目录合并，和 VS Code 一样） */
function dirTreeOf(pid) {
  /* 过滤就落在这一层：目录、文件、计数、缺口、外部框全都跟着它走，
     被滤空的目录和文件自然消失 */
  var cs = contractsOf(pid).filter(match);
  var gs = ((typeof gapsOf === 'function') ? gapsOf(pid)
         : GAPS.filter(function (g) { return g.p === pid; })).filter(matchGap);
  var root = { dirs: {}, files: {} };

  cs.forEach(function (c) {
    if (!c.file) return;
    var parts = c.file.split('/'), fn = parts.pop(), node = root;
    parts.forEach(function (d) {
      if (!node.dirs[d]) node.dirs[d] = { name: d, path: (node.path ? node.path + '/' : '') + d, dirs: {}, files: {} };
      node = node.dirs[d];
    });
    if (!node.files[fn]) node.files[fn] = { name: fn, path: c.file, items: [] };
    node.files[fn].items.push(c);
  });

  /* 单链目录合并成一行：packages/dsh-contract-butler/src/host */
  (function compact(node) {
    Object.keys(node.dirs).forEach(function (k) {
      var d = node.dirs[k];
      compact(d);
      var guard = 0;
      while (Object.keys(d.dirs).length === 1 && Object.keys(d.files).length === 0 && guard++ < 30) {
        var only = d.dirs[Object.keys(d.dirs)[0]];
        d.name = d.name + '/' + only.name;
        d.path = only.path;
        d.dirs = only.dirs;
        d.files = only.files;
      }
    });
  })(root);

  function countIn(node) {
    var n = 0;
    Object.keys(node.files).forEach(function (k) { n += node.files[k].items.length; });
    Object.keys(node.dirs).forEach(function (k) { n += countIn(node.dirs[k]); });
    return n;
  }

  /* 当前选中项要能自动露出来 */
  var force = {}, focus = S.gap || S.sel;
  if (focus) {
    var fc = null;
    C.forEach(function (c) { if (c.id === focus) fc = c; });
    if (fc) {
      if (fc.file) {
        var ps = fc.file.split('/'); ps.pop();
        var acc = '';
        ps.forEach(function (d) {
          acc = acc ? acc + '/' + d : d;
          force['D:' + acc] = 1;
        });
        force['F:' + fc.file] = 1;
      } else if (fc.home) {
        force['D:__ext'] = 1;
        force['D:__home:' + fc.home] = 1;
      }
    } else if (gs.length) {
      force['D:__gap'] = 1;
    }
  }

  var rows = [];
  function emit(kind, key, guides, name, extra) {
    var r = { kind: kind, key: key, guides: guides, name: name };
    if (extra) for (var k in extra) r[k] = extra[k];
    rows.push(r);
    return r;
  }
  function openOf(key) { return force[key] ? true : S.openD[key] !== false; }

  function walk(node, gp, tail) {
    var kids = [];
    Object.keys(node.dirs).forEach(function (k) { kids.push({ t: 'd', k: k, n: node.dirs[k] }); });
    Object.keys(node.files).forEach(function (k) { kids.push({ t: 'f', k: k, n: node.files[k] }); });
    kids.sort(function (x, y) { return x.k < y.k ? -1 : (x.k > y.k ? 1 : 0); });
    kids.forEach(function (kid, i) {
      /* tail=true 表示这一层后面还跟着特殊节点（缺口 / 外部），
         那最后一项就不能画成「最后一个」的肘形，否则竖线会断 */
      var last = (i === kids.length - 1) && !tail;
      var g = gp.map(function (v) { return v ? 'v' : 'blank'; });
      g.push(last ? 'elbow' : 'tee');
      var below = gp.concat([!last]);
      if (kid.t === 'd') {
        var dk = 'D:' + kid.n.path, dop = openOf(dk);
        emit('dir', dk, g, kid.n.name, { count: countIn(kid.n), open: dop, fold: true });
        if (dop) walk(kid.n, below, false);
      } else {
        var fk = 'F:' + kid.n.path, fop = openOf(fk);
        emit('file', fk, g, kid.n.name, { count: kid.n.items.length, open: fop, fold: true });
        if (!fop) return;
        kid.n.items.forEach(function (c, j) {
          var g2 = below.map(function (v) { return v ? 'v' : 'blank'; });
          g2.push(j === kid.n.items.length - 1 ? 'elbow' : 'tee');
          emit('con', 'C:' + c.id, g2, c.name, { item: c, sub: KIND[c.kind] });
        });
      }
    });
  }
  /* 文件系统之外还有两个顶层节点要跟在后面，先告诉 walk */
  var hasSpecial = gs.length > 0 || cs.some(function (c) { return !c.file && c.home; });
  walk(root, [], hasSpecial);

  /* 两个特殊顶层：缺口 / 外部（它们不是目录，但在这个结构里有确切位置） */
  var byHome = {}, homes = [];
  cs.forEach(function (c) {
    if (c.file || !c.home) return;
    if (!byHome[c.home]) { byHome[c.home] = []; homes.push(c.home); }
    byHome[c.home].push(c);
  });
  homes.sort(function (x, y) { return x < y ? -1 : 1; });
  var specials = [];
  if (gs.length) specials.push('gap');
  if (homes.length) specials.push('ext');

  specials.forEach(function (sp, si) {
    var last = (si === specials.length - 1);
    var g = [last ? 'elbow' : 'tee'];
    var below = [!last];
    if (sp === 'gap') {
      var gk = 'D:__gap', gop = openOf(gk);
      emit('band', gk, g, '还没有契约的地方', { count: gs.length, open: gop, fold: true, cls: 't-gapband', sub: '该有契约，现在没有' });
      if (!gop) return;
      gs.forEach(function (x, j) {
        var g2 = below.map(function (v) { return v ? 'v' : 'blank'; });
        g2.push(j === gs.length - 1 ? 'elbow' : 'tee');
        emit('gap', 'G:' + x.id, g2, x.name, { item: x, sub: '还没有契约' });
      });
    } else {
      var ek = 'D:__ext', eop = openOf(ek), total = 0;
      homes.forEach(function (h) { total += byHome[h].length; });
      emit('band', ek, g, '外部 / 不在本仓库', { count: total, open: eop, fold: true, cls: 't-extband', sub: '代码不在本仓库' });
      if (!eop) return;
      if (homes.length === 1) {
        var arr = byHome[homes[0]];
        arr.forEach(function (c, ci) {
          var g2 = below.map(function (v) { return v ? 'v' : 'blank'; });
          g2.push(ci === arr.length - 1 ? 'elbow' : 'tee');
          emit('con', 'C:' + c.id, g2, c.name, { item: c, sub: KIND[c.kind] });
        });
      } else {
        homes.forEach(function (h, hi) {
          var hlast = (hi === homes.length - 1);
          var hg = below.map(function (v) { return v ? 'v' : 'blank'; });
          hg.push(hlast ? 'elbow' : 'tee');
          var hk = 'D:__home:' + h, hop = openOf(hk);
          emit('home', hk, hg, h, { count: byHome[h].length, open: hop, fold: true });
          if (!hop) return;
          var arr2 = byHome[h], below2 = below.concat([!hlast]);
          arr2.forEach(function (c, ci) {
            var g2 = below2.map(function (v) { return v ? 'v' : 'blank'; });
            g2.push(ci === arr2.length - 1 ? 'elbow' : 'tee');
            emit('con', 'C:' + c.id, g2, c.name, { item: c, sub: KIND[c.kind] });
          });
        });
      }
    }
  });
  return rows;
}

function treeRow(r) {
  var cls = 'trow';
  if (r.kind === 'dir' || r.kind === 'home') cls += ' t-dir';
  if (r.kind === 'file') cls += ' t-file';
  if (r.kind === 'con') cls += ' t-con';
  if (r.kind === 'gap') cls += ' t-gap';
  if (r.kind === 'band') cls += ' t-dir ' + r.cls;
  var row = el('button', { class: cls });

  /* 连接线：每一层一个格子，用 CSS 画 ├ └ │ */
  var guides = el('span', { class: 't-guides' });
  r.guides.forEach(function (k) { guides.appendChild(el('i', { class: k === 'blank' ? '' : k })); });
  row.appendChild(guides);

  /* 箭头只负责折叠/展开，点行本身是「聚焦到图上对应的模块」 */
  var caret = el('span', { class: 'caret' + (r.fold ? ' hit' : ''),
    text: r.fold ? (r.open ? '\u25be' : '\u25b8') : '' });
  if (r.fold) {
    caret.addEventListener('click', function (e) {
      e.stopPropagation();
      e.preventDefault();
      S.reveal = false;
      if (r.key.charAt(0) === 'F') S.openF[r.key] = !(S.openF[r.key] !== false);
      else S.openD[r.key] = !(S.openD[r.key] !== false);
      renderTree();
    });
  }
  row.appendChild(caret);

  if (r.kind === 'band') {
    row.appendChild(el('span', { class: 'tdirname', text: r.name }));
    row.appendChild(el('span', { class: 't-sub', text: r.sub || '' }));
    row.appendChild(el('span', { class: 'cnt', text: String(r.count) }));
  } else if (r.kind === 'dir' || r.kind === 'home') {
    row.appendChild(el('span', { class: 'tdirname', text: r.name }));
    row.appendChild(el('span', { class: 'cnt', text: String(r.count) }));
  } else if (r.kind === 'file') {
    row.appendChild(el('span', { class: 'tname', text: r.name }));
    row.appendChild(el('span', { class: 'cnt', text: String(r.count) }));
  } else if (r.kind === 'con') {
    row.appendChild(el('span', { class: 'tname', text: r.name }));
    if (r.item && r.item.self) row.appendChild(el('span', { class: 'selfb', text: '本页' }));
    if (r.item) factsChips(r.item).forEach(function (x) { row.appendChild(x); });
  } else {
    row.appendChild(el('span', { class: 'tname', text: r.name }));
    row.appendChild(el('span', { class: 'chip chip-gap', text: '没有契约' }));
  }

  /* 目录 / 文件 / 两个特殊模块：点一下聚焦到图上对应的归属带，再点一次取消 */
  if (r.kind !== 'con' && r.kind !== 'gap') {
    if (S.focus === r.key) row.classList.add('foc');
    row.addEventListener('click', function (e) {
      e.stopPropagation();
      S.reveal = false;
      S.sel = null;
      S.gap = null;
      S.focus = (S.focus === r.key) ? null : r.key;
      renderAll();
    });
    return row;
  }

  var id = r.item ? r.item.id : null;
  if (id && S.sel === id) row.classList.add('on');
  if (id && S.gap === id) row.classList.add('on');
  if (id) row.addEventListener('click', function (e) {
    e.stopPropagation();
    S.reveal = true;
    S.focus = null;
    S.sel = (r.kind === 'gap') ? null : id;
    S.gap = (r.kind === 'gap') ? id : null;
    renderAll();
  });
  else row.disabled = true;
  return row;
}

function renderTree() {
  var box = $('#tree');
  box.innerHTML = '';

  /* 项目 = 树的根，三个项目就是三棵树。点项目名即切换：
     当前这个展开、其它自动收起（手风琴），箭头只负责单独收起/展开 */
  PROJECTS.forEach(function (p) {
    var open = pOpen(p);
    var pr = el('div', { class: 'trow t-proj' + (p.id === S.proj ? ' on' : '') });
    pr.appendChild(el('span', { class: 't-guides' }));

    var pc = el('button', { class: 'caretbtn', text: open ? '\u25be' : '\u25b8' });
    pc.addEventListener('click', function (e) {
      e.stopPropagation();
      e.preventDefault();
      S.openP[p.id] = !pOpen(p);
      S.reveal = false;
      renderTree();
    });
    pr.appendChild(pc);

    var nb = el('button', { class: 'namebtn' });
    nb.appendChild(el('span', { text: p.name }));
    nb.appendChild(el('span', { class: 'tpath', text: p.path }));
    nb.addEventListener('click', function (e) {
      e.stopPropagation();
      e.preventDefault();
      /* 清掉显式状态 -> 回到默认：当前项目展开、其它收起 */
      delete S.openP[p.id];
      selectProj(p.id);
    });
    pr.appendChild(nb);
    /* 计数跟着筛选走：筛选时显示这个项目实际会渲染出几行，
       否则项目行会报一个下面根本看不到的数字 */
    var fOn = filtActive();
    var nHit = contractsOf(p.id).filter(match).length;   /* 只数契约，缺口由它自己那条带子报数 */
    pr.appendChild(el('span', { class: 'cnt' + (fOn && nHit === 0 ? ' zero' : ''),
      text: String(fOn ? nHit : contractsOf(p.id).length),
      title: fOn ? nHit + ' 条命中当前筛选' : contractsOf(p.id).length + ' 条契约' }));
    box.appendChild(pr);

    if (!open) return;
    dirTreeOf(p.id).forEach(function (r) { box.appendChild(treeRow(r)); });
  });

  /* 滚到选中项：契约/缺口优先，其次才是项目行 */
  var on = box.querySelector('.t-con.on, .t-gap.on') || box.querySelector('.t-proj.on');
  if (on && S.reveal) { try { on.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
}

/* ---------- 右侧 ---------- */
function fieldTable(rows, dir) {
  var t = el('tbody');
  rows.forEach(function (f) {
    t.append(el('tr', {},
      el('td', { class: 'mono', text: f.n }),
      el('td', { class: 'mono ttype', text: f.t }),
      el('td', {}, f.r ? el('span', { class: 'req', text: '必填' }) : el('span', { class: 'opt', text: '可选' })),
      el('td', { style: 'color:var(--ink2)', text: f.d || '' })));
  });
  return el('div', {},
    el('div', { class: 'dir', text: dir }),
    el('table', { class: 'f' },
      el('thead', {}, el('tr', {}, el('th', { text: '字段' }), el('th', { text: '类型' }),
        el('th', { text: '是否必填' }), el('th', { text: '说明' }))), t));
}

function blockWhat(c) {
  var b = el('div', { class: 'block' });
  b.append(el('div', { class: 'bh' }, el('h2', { text: '它是什么' }),
    el('span', { class: 'sub', text: srcLabel(c) })));
  if (c.twinNote) b.append(el('div', { class: 'note', text: c.twinNote }));
  if (c.in && c.in.length) b.append(fieldTable(c.in, '输入'));
  if (c.out && c.out.length) b.append(fieldTable(c.out, '输出'));
  if (!c.in.length && !c.out.length) b.append(el('div', { class: 'empty', text: '没有记录到字段。' }));
  b.append(el('div', { class: 'verdict' }, c.wv));
  return b;
}

function blockChanges(c) {
  var b = el('div', { class: 'block' });
  var r = repoOf(c.p), fresh = freshChanges(c), old = oldChanges(c),
      after = afterChanges(c), rg = rangeOf(c.p), bh;
  /* 表头把「这条契约是拿哪两版比的」写在卡片里，和顶部那条是同一件事 */
  bh = el('div', { class: 'bh' }, el('h2', { text: '变了什么' }));
  if (r) bh.append(el('span', { class: 'cmp' },
    el('code', { text: revLabel(c.p, rg.from) }),
    el('span', { class: 'arrow', text: '→' }),
    el('code', { text: revLabel(c.p, rg.to) }),
    (rg.to === 'wt') ? el('span', { class: 'k', text: '未提交' }) : null));
  b.append(bh);

  function chRow(ch, dim) {
    var cm = commitOf(c.p, ch.sha);
    return el('div', { class: 'row' + (dim ? ' old' : '') },
      el('span', { class: 'when', title: cm ? cm.subject + '（' + cm.at + '）' : '' },
        el('span', { class: 'sha', text: ch.sha }),
        el('span', { class: 'at', text: ch.at })),
      el('span', { class: 'what', html: ch.w }),
      el('span', { class: 'tag ' + (ch.tone || ''), text: ch.k }));
  }
  if (fresh.length) fresh.forEach(function (ch) { b.append(chRow(ch, false)); });
  if (wtInRange(c)) b.append(el('div', { class: 'row' },
    el('span', { class: 'when' }, el('span', { class: 'at', text: '工作区' })),
    el('span', { class: 'what', html: '改了 <code>' + (r && r.dirty.length
      ? r.dirty[0].file.split('/').pop() : '相关文件') + '</code>，还没提交' }),
    el('span', { class: 'tag warn', text: '未提交' })));
  if (!fresh.length && !wtInRange(c)) b.append(el('div', { class: 'note', style: 'color:var(--ink3)',
    text: '在 ' + rangeText(c.p) + ' 之间，这条契约没有改过。' }));
  if (old.length) {
    b.append(el('div', { class: 'oldnote',
      text: '左端 ' + revLabel(c.p, rg.from) + ' 之前还改过 ' + old.length
        + ' 次（左端那版里就已经是这样，不在这次对比里）：' }));
    old.forEach(function (ch) { b.append(chRow(ch, true)); });
  }
  if (after.length) {
    b.append(el('div', { class: 'oldnote',
      text: '右端 ' + revLabel(c.p, rg.to) + ' 之后还改过 ' + after.length + ' 次（还没发生）：' }));
    after.forEach(function (ch) { b.append(chRow(ch, true)); });
  }
  b.append(el('div', { class: 'verdict' + (breakingOf(c) ? ' bad' : '') }, c.cv));
  return b;
}

function blockCalls(c, withVerdict) {
  var b = el('div', { class: 'block' });
  var badN = c.calls.filter(function (x) { return !x.ok; }).length;
  b.append(el('div', { class: 'bh' }, el('h2', { text: '现在对不对' }),
    el('span', { class: 'sub', text: '契约声明 ↔ 最近 ' + c.calls.length + ' 次调用' })));
  if (!c.calls.length) {
    b.append(el('div', { class: 'note', style: 'color:var(--ink3)', text: '还没有观测到调用。' }));
  } else {
    c.calls.forEach(function (cl) {
      var wrap = el('div', { class: 'call' });
      wrap.append(el('div', { class: 'call-h' },
        el('span', { class: 'dot ' + (cl.ok ? 'd-ok' : 'd-bad') }),
        el('span', { class: 'when', text: cl.at }),
        el('span', { class: 'call-who', text: cl.who }),
        el('span', { class: 'tag ' + (cl.ok ? 'ok' : 'bad'), text: cl.ok ? '符合' : '不符' }),
        cl.d ? el('span', { style: 'font-size:11.5px;color:var(--ink3)', text: cl.d }) : null));
      (cl.f || []).forEach(function (f) {
        wrap.append(el('div', { class: 'finding ' + (f.tone === 'warn' ? 'warn' : '') },
          el('div', { html: f.w }),
          el('div', { style: 'margin-top:3px' },
            el('span', { style: 'color:var(--ink3)', text: '契约要求 ' }),
            el('code', { text: f.e }),
            el('span', { style: 'color:var(--ink3)', text: ' · 实际 ' }),
            el('code', { text: f.a }))));
      });
      b.append(wrap);
    });
  }
  if (withVerdict !== false) b.append(el('div', { class: 'verdict' + (badN ? ' bad' : '') }, c.cav));
  return b;
}


/* ============================================================
   项目关系图。确定性分层布局（不跑力导向）——
   坐标可以数值验证，不会出现节点重叠或随机乱飞。
   ============================================================ */
var RELCOLOR = { '引用': '#0a84ff', '投影': '#af52de', '产出': '#5ac8fa', '协作': '#34c759', '缺口': '#ff453a' };
var REL_ORDER = ['引用', '投影', '产出', '协作', '缺口'];
var NW = 232, NH = 58, ROWGAP = 14, PAD = 24;
var COLGAP = 38, GUT = 38, BANDGAP = 26, BANDHEAD = 28, BANDPAD = 20, FILEHEAD = 20, FILEGAP = 12;
var ZOOM_MAX = 3.2, FOCPAD = 26;   /* 聚焦放大上限 / 聚焦包围盒外扩 */
var ZOOM_MS = 340, ZANIM = 0;       /* 聚焦动画时长 / 动画代次 */
var MAXCOL = 4;

function projOf(id) { for (var i = 0; i < PROJECTS.length; i++) if (PROJECTS[i].id === id) return PROJECTS[i]; return null; }
/* 几份表示对不对得上：同一件事在落盘 / 接口 / 事件 / proto 里各有写法，
   拿它们互相校对。每份单独看都没错，合起来对不上——这一块专管这个。 */
function blockDiffs(c) {
  if (!c.diffs || !c.diffs.length) return null;
  var b = el('div', { class: 'block' });
  var hard = c.diffs.some(function (x) { return x.tone === 'bad'; });
  b.append(el('div', { class: 'bh' }, el('h2', { text: '几份表示对不对得上' }),
    el('span', { class: 'sub', text: c.twin ? c.twin.left + '  ↔  ' + c.twin.right : '' })));
  c.diffs.forEach(function (d) {
    b.append(el('div', { class: 'finding ' + (d.tone === 'warn' ? 'warn' : '') },
      el('div', { html: d.w }),
      el('div', { style: 'margin-top:3px' },
        el('span', { style: 'color:var(--ink3)', text: '应该 ' }), el('code', { text: d.e }),
        el('span', { style: 'color:var(--ink3)', text: ' · 实际 ' }), el('code', { text: d.a }))));
  });
  if (c.cav) b.append(el('div', { class: 'verdict' + (hard ? ' bad' : '') }, c.cav));
  return b;
}

function contractsOf(pid) { return C.filter(function (c) { return c.p === pid; }); }
function gapsOf(pid) { return GAPS.filter(function (g) { return g.p === pid; }); }
/* 出处：file 是仓库内的路径（可为计划中），home 是仓库外的落脚点 */
function srcOf(c) { return c.file || c.home || ''; }
function srcLabel(c) {
  if (c.file) return c.file + (c.planned ? ' · 计划中' : '');
  return (c.home || '出处未知') + ' · 不在本仓库';
}
function dirOf(f) {
  var i = f.lastIndexOf('/');
  return i < 0 ? '' : f.slice(0, i);
}
function baseOf(f) {
  var i = f.lastIndexOf('/');
  return i < 0 ? f : f.slice(i + 1);
}
function isExternal(c) { return !c.file; }

/* ── 唯一的分组真源 ────────────────────────────────────────────────
   侧边栏树和关系图都从这里取结构：目录 → 文件 → 契约。
   两者共用一份数据，从结构上不可能走偏。 */
function groupOf(pid) {
  var cs = contractsOf(pid), gs = gapsOf(pid), out = [];
  var dirs = [];
  cs.forEach(function (c) {
    if (!c.file) return;
    var d = dirOf(c.file);
    if (dirs.indexOf(d) < 0) dirs.push(d);
  });
  dirs.sort();
  dirs.forEach(function (d) {
    var files = [], fmap = {};
    cs.filter(function (c) { return c.file && dirOf(c.file) === d; })
      .forEach(function (c) {
        var f = baseOf(c.file);
        if (!fmap[f]) { fmap[f] = { key: c.file, label: f, items: [] }; files.push(fmap[f]); }
        fmap[f].items.push(c);
      });
    out.push({ key: 'd:' + d, label: d, note: '仓库里的目录', files: files });
  });
  if (gs.length) out.push({ key: 'gap', label: '还没有契约的地方', note: '该有契约，现在没有',
    files: [{ key: 'gap', label: '缺口', items: gs, isGap: true }] });
  var ext = cs.filter(function (c) { return !c.file; });
  if (ext.length) {
    var homes = [], hmap = {};
    ext.forEach(function (c) {
      var h = c.home || '外部';
      if (!hmap[h]) { hmap[h] = { key: 'h:' + h, label: h, items: [] }; homes.push(hmap[h]); }
      hmap[h].items.push(c);
    });
    out.push({ key: 'ext', label: '外部 / 不在本仓库',
      note: '代码不在本仓库，只看得到形状', files: homes });
  }
  return out;
}

/* 按边的方向给节点分层：rank 0 = 源头。有环时回边不参与分层，不会爆栈。 */
function rankOf(pid, nodes) {
  var byId = {}, ins = {};
  nodes.forEach(function (n) { byId[n.id] = n; ins[n.id] = []; });
  LINKS.forEach(function (l) {
    if (l.p !== pid) return;
    if (byId[l.from] && byId[l.to] && l.from !== l.to) ins[l.to].push(l.from);
  });
  var memo = {};
  function depth(id, stack) {
    if (memo[id] !== undefined) return memo[id];
    if (stack[id]) return 0;
    stack[id] = 1;
    var r = 0;
    ins[id].forEach(function (f) { var v = depth(f, stack) + 1; if (v > r) r = v; });
    delete stack[id];
    memo[id] = r;
    return r;
  }
  nodes.forEach(function (n) { n.rank = depth(n.id, {}); });
}

/* ── 量文字：用同一套 class 在屏幕外造一张真卡片，直接量它需要多高 ──
   （canvas 的 measureText 拿不到 CSS 里的 --mono，会退回默认字体、算窄，不能用） */
var _root = null;
function probeRoot() {
  /* 必须挂到真元素同一个祖先里：字体上下文不同会让换行行数算错（和 button/div 同类坑） */
  if (!_root) {
    _root = document.getElementById('mainCard')
         || document.querySelector('.card') || document.body || document.documentElement;
  }
  return _root;
}
/* 归属框标题：不靠「猜宽度把框撑开」，改成让它在框内按段换行 ——
   盒子由 left/right 定宽，换行由浏览器保证，任何一段都不可能捅出框外 */
var _hhead = null;
function headerBoxH(b, w) {
  if (!_hhead) {
    _hhead = document.createElement('div');
    _hhead.className = 'gbandhead';
    _hhead.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;height:auto';
    probeRoot().appendChild(_hhead);
  }
  _hhead.style.width = Math.max(80, w - 32) + 'px';
  var spec = [['gbandname', b.label || (b.groups[0] && b.groups[0].label) || '']];
  if (b.inline && b.label) spec.push(['gbandfile', '/ ' + b.groups[0].label]);
  spec.push(['gbandnote', b.note || '']);
  spec.push(['gbandcount', b.nodes.length + ' 条']);
  _hhead.innerHTML = spec.map(function (sp) { return '<span class="' + sp[0] + '"></span>'; }).join('');
  spec.forEach(function (sp, i) { _hhead.children[i].textContent = sp[1]; });
  return Math.ceil(_hhead.getBoundingClientRect().height);
}
var _fhead = null;
function fileHeadH(label, w) {
  if (!_fhead) {
    _fhead = document.createElement('div');
    _fhead.className = 'gfilehead';
    _fhead.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;height:auto';
    probeRoot().appendChild(_fhead);
  }
  _fhead.style.width = Math.max(80, w - 32) + 'px';
  _fhead.textContent = String(label == null ? '' : label);
  return Math.ceil(_fhead.getBoundingClientRect().height);
}
var _card = null;
function nodeH(n) {
  if (!_card) {
    /* 必须和真卡片同款标签：nodeEl 用的是 <button>，button 的 UA 样式会改变内容盒，用 div 量会偏 */
    _card = document.createElement('button');
    _card.type = 'button';
    _card.className = 'gnode';
    _card.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;height:auto';
    _card.style.width = NW + 'px';
    _card.innerHTML = '<span class="gtext"><span class="gname"></span><span class="gkind"></span></span>';
    probeRoot().appendChild(_card);
  }
  _card.querySelector('.gname').textContent = n.name;
  _card.querySelector('.gkind').textContent = n.kind + (n.planned ? ' · 计划中' : '');
  /* 有没有那个点，会改变文字的可用宽度 —— 必须和真卡片完全一致地重建 */
  var oldDot = _card.querySelector('.dot');
  if (oldDot) _card.removeChild(oldDot);
  if (n.mark) _card.insertBefore(el('span', { class: 'dot ' + n.mark }), _card.firstChild);
  /* 高度自然撑开，量出来的就是这张卡片真正需要的高度 */
  /* +1 吸收亚像素舍入，宁可多半像素也不能切字 */
  return Math.max(NH, Math.ceil(_card.getBoundingClientRect().height) + 1);
}

function layoutGraph(pid, avail) {
  var cs = contractsOf(pid);
  var availW = Math.max(560, avail);
  /* 可用宽度上限：只用来决定每个带最多能摆几列 */
  var maxBWavail = availW - PAD * 2 - GUT;
  if (maxBWavail < 320) maxBWavail = Math.max(220, availW - PAD * 2);

  var nodes = [], byCid = {};
  cs.forEach(function (c) {
    var n = { id: c.id, name: c.name, kind: KIND[c.kind],
              mark: nodeMark(c), tip: nodeTip(c),
              isGap: false, planned: c.planned, rank: 0 };
    nodes.push(n); byCid[n.id] = n;
  });

  var bands = groupOf(pid).map(function (g, bi) {
    var b = { key: g.key, label: g.label, note: g.note, groups: [], nodes: [], bi: bi };
    g.files.forEach(function (f, fi) {
      var fg = { label: f.label, nodes: [], fi: fi };
      f.items.forEach(function (it) {
        var n;
        if (f.isGap) {
          n = { id: it.id, name: it.name, kind: '还没有契约', mark: 'd-bad',
                tip: '还没有契约', isGap: true, planned: false, rank: 0 };
          nodes.push(n); byCid[n.id] = n;
        } else { n = byCid[it.id]; }
        if (!n) return;
        n.band = bi; n.gi = fi;
        fg.nodes.push(n); b.nodes.push(n);
      });
      b.groups.push(fg);
    });
    return b;
  });

  rankOf(pid, nodes);
  var maxRank = 0;
  nodes.forEach(function (n) { if (n.rank > maxRank) maxRank = n.rank; });
  var byWidth = Math.floor((maxBWavail - BANDPAD * 2 - NW) / (NW + COLGAP)) + 1;
  if (byWidth > MAXCOL) byWidth = MAXCOL;
  if (byWidth < 1) byWidth = 1;
  /* 每个归属带按自己的内容定宽：几个节点就摆几列，不再一律拉满整行。
     列距固定成 NW+COLGAP，所以卡片是紧凑挨着的，不会像以前那样被均匀拉开 */
  bands.forEach(function (b) {
    /* inline 必须在量标题之前就定好：标题里要不要多一段 "/ 文件名" 取决于它，
       晚一步算就会少算一段、把两行标题当一行 */
    b.inline = (b.key !== 'gap' && b.groups.length === 1);
    var nc = Math.min(b.nodes.length, byWidth);
    if (nc < 1) nc = 1;
    b.nCol = nc;
    b.w = BANDPAD * 2 + nc * NW + (nc - 1) * COLGAP;
    b.pitch = nc > 1 ? (NW + COLGAP) : 0;
    b.nodes.forEach(function (n) { n.rk = Math.min(n.rank, nc - 1); });
    /* 标题在框内换行后实际占多高，就给标题留多高（含 top:9px），绝不让它压到卡片 */
    b.headH = Math.max(BANDHEAD, 9 + headerBoxH(b, b.w) + 8);
    if (!b.inline && b.key !== 'gap') {
      b.groups.forEach(function (g) { g.headH = Math.max(FILEHEAD, fileHeadH(g.label, b.w) + 4); });
    }
  });
  nodes.forEach(function (n) { n.h = nodeH(n); });
  var maxBW = 0;
  bands.forEach(function (b) { if (b.w > maxBW) maxBW = b.w; });
  if (!bands.length) maxBW = maxBWavail;
  var W = PAD * 2 + maxBW + GUT;
  /* 走线区放在「最宽那个带」的右边：所有带都比它窄，所以这条竖线不会穿过任何带 */
  var GUTX = PAD + maxBW + GUT / 2;
  function colX(bi, c) { return PAD + BANDPAD + c * bands[bi].pitch; }
  function chanR(bi, c) {
    var b = bands[bi];
    if (c >= b.nCol - 1) return PAD + b.w - BANDPAD / 2;
    return colX(bi, c) + NW + COLGAP / 2;
  }

  var y = PAD;
  bands.forEach(function (b) {
    b.x = PAD; b.y = y;
    var iy = y + b.headH;
    b.groups.forEach(function (g, gi) {
      if (gi > 0) iy += FILEGAP;
      if (!b.inline) { g.y = iy; iy += (g.headH || FILEHEAD); }
      var byRk = {}, rks = [];
      g.nodes.forEach(function (n) {
        if (!byRk[n.rk]) { byRk[n.rk] = []; rks.push(n.rk); }
        byRk[n.rk].push(n);
      });
      rks.sort(function (p, q) { return p - q; });
      /* 按 rank 排序后「先纵向填满一列、再换下一列」：
         rank 顺序在阅读方向（上到下、左到右）上保持，列数不超过 nCol，
         行数 = ceil(n / nCol) —— 同 rank 的多个节点会自然摊到多列，不会叠成一长条 */
      var arr = g.nodes.slice().sort(function (p2, q2) { return p2.rk - q2.rk; });
      var rows = Math.max(1, Math.ceil(arr.length / b.nCol));
      var rowMax = [];
      arr.forEach(function (n, i) {
        n.col = Math.floor(i / rows);
        n.row = i % rows;
        n.x = colX(b.bi, n.col);
        if (!rowMax[n.row] || n.h > rowMax[n.row]) rowMax[n.row] = n.h;
      });
      var rowTop = [], ry = iy;
      for (var ri = 0; ri < rows; ri++) { rowTop[ri] = ry; ry += (rowMax[ri] || NH) + ROWGAP; }
      arr.forEach(function (n) {
        n.y = rowTop[n.row];
        n.rowBot = rowTop[n.row] + (rowMax[n.row] || NH);   /* 本行真正的底 */
      });
      g.rows = rows;
      iy = ry - ROWGAP;
    });
    b.cbot = iy;
    b.h = (iy - y) + BANDPAD;
    y += b.h + BANDGAP;
  });
  var H = y - BANDGAP + PAD;

  function belowY(n) {
    var b = bands[n.band];
    return Math.min((n.rowBot || (n.y + n.h)) + ROWGAP / 2, b.cbot + BANDPAD / 2);
  }

  var nmap = {};
  nodes.forEach(function (n) { nmap[n.id] = n; if (!nmap[n.name]) nmap[n.name] = n; });
  var links = LINKS.filter(function (l) { return l.p === pid && nmap[l.from] && nmap[l.to]; })
    .map(function (l) { return { from: nmap[l.from].id, to: nmap[l.to].id,
                                 rel: l.rel, note: l.note }; });

  /* ── 通道分配：同一条通道里的多条边占不同的道，杜绝共线重叠 ── */
  var bandUse = {}, gutUse = [];
  links.forEach(function (l) {
    var A = nmap[l.from], B = nmap[l.to];
    [A.band, B.band].forEach(function (bi) {
      if (!bandUse[bi]) bandUse[bi] = [];
      if (bandUse[bi].indexOf(l) < 0) bandUse[bi].push(l);
    });
    if (A.band !== B.band) gutUse.push(l);
  });
  function chYof(bi, l) {
    var arr = bandUse[bi] || [], n = arr.length, b = bands[bi];
    var i = arr.indexOf(l);
    var span = Math.min(BANDPAD - 6, Math.max(0, (n - 1) * 5));
    return b.cbot + BANDPAD / 2 + (n > 1 ? (-span / 2 + i * (span / (n - 1))) : 0);
  }
  function gutXof(l) {
    var n = gutUse.length, i = gutUse.indexOf(l);
    var span = Math.min(GUT - 10, Math.max(0, (n - 1) * 6));
    return GUTX + (n > 1 ? (-span / 2 + i * (span / (n - 1))) : 0);
  }

  /* ── 正交路由：所有走线只经过「节点下方空条 / 列通道 / 带底通道 / 右侧走线区」
        这四类无节点区域，且永远不高于端点所在行 —— 所以既不压节点也不压标题行 ── */
  var routes = {};
  links.forEach(function (l, li) {
    var A = nmap[l.from], B = nmap[l.to];
    var acx = A.x + NW / 2, bcx = B.x + NW / 2;
    /* 卡片高度不一：横向快路的 y 取两个卡片竖直方向的重叠中点，才同时贴得住两边 */
    var acy = (Math.max(A.y, B.y) + Math.min(A.y + A.h, B.y + B.h)) / 2;

    /* 快路 1：同一行相邻列 —— 一条横线 */
    if (A.band === B.band && A.gi === B.gi && A.row === B.row && Math.abs(A.col - B.col) === 1) {
      routes[li] = (A.col < B.col) ? [[A.x + NW, acy], [B.x, acy]]
                                   : [[A.x, acy], [B.x + NW, acy]];
      return;
    }
    /* 快路 2：同一列相邻行 —— 一条竖线 */
    if (A.band === B.band && A.gi === B.gi && A.col === B.col && Math.abs(A.row - B.row) === 1) {
      routes[li] = (A.y < B.y) ? [[acx, A.y + A.h], [bcx, B.y]]
                               : [[acx, A.y], [bcx, B.y + B.h]];
      return;
    }

    var rA = chanR(A.band, A.col), rB = chanR(B.band, B.col);
    var byA = belowY(A), byB = belowY(B);
    var cA = chYof(A.band, l), cB = chYof(B.band, l);
    var pts = [[acx, A.y + A.h], [acx, byA], [rA, byA], [rA, cA]];
    if (A.band === B.band) {
      pts.push([rB, cA]);
    } else {
      var gx = gutXof(l);
      pts.push([gx, cA], [gx, cB]);
    }
    pts.push([rB, cB], [rB, byB], [bcx, byB], [bcx, B.y + B.h]);
    routes[li] = pts;
  });

  var pos = {};
  nodes.forEach(function (n) { pos[n.id] = { x: n.x, y: n.y, h: n.h }; });

  return { nodes: nodes, bands: bands, links: links, routes: routes,
           pos: pos, W: W, H: H, GUTX: GUTX, bandW: maxBW };
}


/* 正交折线：拐角加小圆角，去掉连续重复点 */
function polyPath(pts) {
  var p = [];
  pts.forEach(function (q) {
    var last = p[p.length - 1];
    if (!last || Math.abs(last[0] - q[0]) > 0.5 || Math.abs(last[1] - q[1]) > 0.5) p.push(q);
  });
  if (p.length < 2) return '';
  var d = 'M' + p[0][0] + ',' + p[0][1];
  for (var i = 1; i < p.length - 1; i++) {
    var a = p[i - 1], c = p[i], e = p[i + 1];
    var v1x = c[0] - a[0], v1y = c[1] - a[1];
    var v2x = e[0] - c[0], v2y = e[1] - c[1];
    var l1 = Math.sqrt(v1x * v1x + v1y * v1y), l2 = Math.sqrt(v2x * v2x + v2y * v2y);
    var rr = Math.min(7, l1 / 2, l2 / 2);
    if (rr < 1) { d += ' L' + c[0] + ',' + c[1]; continue; }
    d += ' L' + (c[0] - v1x / l1 * rr) + ',' + (c[1] - v1y / l1 * rr)
       + ' Q' + c[0] + ',' + c[1] + ' ' + (c[0] + v2x / l2 * rr) + ',' + (c[1] + v2y / l2 * rr);
  }
  var z = p[p.length - 1];
  d += ' L' + z[0] + ',' + z[1];
  return d;
}

function edgesSVG(L) {
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'edges');
  svg.setAttribute('width', L.W); svg.setAttribute('height', L.H);
  var defs = document.createElementNS(NS, 'defs');
  REL_ORDER.forEach(function (rel, i) {
    var mk = document.createElementNS(NS, 'marker');
    mk.setAttribute('id', 'ah' + i);
    mk.setAttribute('viewBox', '0 0 8 8');
    mk.setAttribute('refX', '7'); mk.setAttribute('refY', '4');
    mk.setAttribute('markerWidth', '5.5'); mk.setAttribute('markerHeight', '5.5');
    mk.setAttribute('orient', 'auto');
    var pth = document.createElementNS(NS, 'path');
    pth.setAttribute('d', 'M0,0 L8,4 L0,8 z');
    pth.setAttribute('fill', RELCOLOR[rel]);
    mk.appendChild(pth); defs.appendChild(mk);
  });
  svg.appendChild(defs);

  L.links.forEach(function (l, li) {
    var pts = L.routes[li];
    if (!pts) return;
    var path = document.createElementNS(NS, 'path');
    path.setAttribute('d', polyPath(pts));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', RELCOLOR[l.rel] || '#8e8e93');
    path.setAttribute('stroke-width', '1.6');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('opacity', '.9');
    if (l.rel === '缺口') path.setAttribute('stroke-dasharray', '5 4');
    path.setAttribute('marker-end', 'url(#ah' + REL_ORDER.indexOf(l.rel) + ')');
    var t = document.createElementNS(NS, 'title');
    t.textContent = l.from + '  →  ' + l.to + '（' + l.rel + '）' + (l.note ? '：' + l.note : '');
    path.appendChild(t);
    svg.appendChild(path);
  });
  return svg;
}

function renderGraph(box, p) {
  var pid = p.id;
  var cs = contractsOf(pid), gs = gapsOf(pid);
  var badN = 0, chgN = 0;
  /* 两个事实各自独立：一条契约可以既变过又不符，不能写成 else if */
  cs.forEach(function (c) { if (findingsOf(c)) badN++; if (changedOf(c)) chgN++; });
  setCardGlow(projFacts(pid));

  /* 滚动区先进 DOM，量到真实可用宽度再布局 —— 这样永远不会横向溢出 */
  var sa = el('div', { class: 'scrollarea' });
  box.append(sa);
  var avail = sa.clientWidth;
  if (avail < 320) avail = 1016;
  var L = layoutGraph(pid, avail);

  box.insertBefore(headEl({
    title: p.name,
    facts: [
      badN ? el('span', { class: 'chip chip-bad', text: badN + ' 条观测到不符' }) : null,
      chgN ? el('span', { class: 'chip chip-warn', text: chgN + ' 条变过' }) : null,
      (!badN && !chgN) ? el('span', { class: 'chip chip-dim', text: '这两版之间都没事' }) : null
    ].filter(function (x) { return !!x; }),
    desc: p.sum,
    meta: cs.length + ' 条契约 · ' + L.bands.length + ' 个归属 · ' + L.links.length + ' 条关系'
  }), sa);

  sa.append(legendEl(pid));
  var wrap = el('div', { class: 'graphwrap' });
  var g = el('div', { class: 'graph', style: 'width:' + L.W + 'px;height:' + L.H + 'px' });

  var foc = focusBands(L, S.focus);
  var anyFoc = Object.keys(foc).length > 0;

  /* 三层顺序：归属框在最下，连线居中，契约节点在最上 */
  L.bands.forEach(function (b) {
    var cls = 'gband';
    if (b.key === 'ext') cls += ' ext';
    if (b.key === 'gap') cls += ' gaps';
    if (anyFoc) cls += foc[b.key] ? ' foc' : ' dim';
    var bx = el('div', { class: cls,
      style: 'left:' + b.x + 'px;top:' + b.y + 'px;width:' + b.w + 'px;height:' + b.h + 'px' });
    var head = el('div', { class: 'gbandhead' },
      el('span', { class: 'gbandname', text: b.label || b.groups[0].label }));
    if (b.inline && b.label) head.append(el('span', { class: 'gbandfile', text: '/ ' + b.groups[0].label }));
    head.append(el('span', { class: 'gbandnote', text: b.note }));
    head.append(el('span', { class: 'gbandcount', text: b.nodes.length + ' 条' }));
    bx.append(head);
    if (!b.inline && b.key !== 'gap') {
      b.groups.forEach(function (gr) {
        bx.append(el('div', { class: 'gfilehead',
          style: 'top:' + (gr.y - b.y) + 'px', text: gr.label }));
      });
    }
    g.append(bx);
  });
  g.append(edgesSVG(L));
  L.nodes.forEach(function (n) {
    var ne = nodeEl(n, L.pos[n.id]);
    /* 不在焦点归属框里的卡片：糊掉 */
    if (anyFoc && !foc[L.bands[n.band].key]) ne.classList.add('blurcard');
    g.append(ne);
  });

  wrap.append(g);
  sa.append(wrap);

  /* 聚焦 = 把整个归属框框进来，居中放大过去；不在焦点里的卡片直接糊掉 */
  var focEl = g.querySelector('.gband.foc');
  if (focEl) {
    var fbs = L.bands.filter(function (b) { return foc[b.key]; });
    /* 框的是归属框「整块」（含全宽）—— 只框卡片的话，框本身是全宽的，
       放大后整块 card 会被切掉，只剩左边一条标题，得横向滑才看得全 */
    var x0 = Math.min.apply(null, fbs.map(function (b) { return b.x; })) - FOCPAD;
    var x1 = Math.max.apply(null, fbs.map(function (b) { return b.x + b.w; })) + FOCPAD;
    var y0 = Math.min.apply(null, fbs.map(function (b) { return b.y; })) - FOCPAD;
    var y1 = Math.max.apply(null, fbs.map(function (b) { return b.y + b.h; })) + FOCPAD;
    /* 宽高都要装得下 —— 整块 card 一定完整可见，不用横向滑 */
    var k = Math.min(sa.clientWidth / Math.max(1, x1 - x0),
                     sa.clientHeight / Math.max(1, y1 - y0), ZOOM_MAX);
    if (!isFinite(k) || k < 1) k = 1;          /* 只放大，不缩小 */
    /* 先按最终缩放量出「居中」需要滚多少（zoom 是同步改布局的），再退回起点做动画 */
    g.style.zoom = k;
    var gr = g.getBoundingClientRect();
    var wr = wrap.getBoundingClientRect(), sr = sa.getBoundingClientRect();
    var bw = (x1 - x0) * k, bh = (y1 - y0) * k;
    var xRaw = wrap.scrollLeft + ((gr.left + x0 * k - wr.left) - (sa.clientWidth - bw) / 2);
    var yRaw = sa.scrollTop + ((gr.top + y0 * k - sr.top) - (sa.clientHeight - bh) / 2);
    /* 模块贴着图的上/左边缘时，居中需要「负滚动」——滚不动就会贴边。
       用 padding 把那段空间补出来，这样一定能真的居中 */
    wrap.style.paddingLeft = (xRaw < 0 ? -xRaw : 0) + 'px';
    wrap.style.paddingTop = (yRaw < 0 ? -yRaw : 0) + 'px';
    /* 整张图是按视口宽度排的，放大一点点右边就会溢出、冒出横向滚动条。
       聚焦时把这段溢出裁掉：overflow:hidden 的元素照样能用 scrollLeft 定位，
       只是不再有滚动条、也不会被误拖走 */
    wrap.style.overflow = 'hidden';
    var xTo = Math.max(0, xRaw), yTo = Math.max(0, yRaw);
    /* 模块贴着图的下边缘时，居中要往下滚，但图下面没内容可滚。
       在图的下面垫一个和视口一样高的空块，把纵向滚动空间撑出来 */
    wrap.appendChild(el('div', { style: 'width:1px;height:' + sa.clientHeight + 'px' }));
    var xFrom = wrap.scrollLeft, yFrom = sa.scrollTop;

    var token = ++ZANIM, t0 = null, landed = false;
    /* 终态先算好：不管动画跑不跑得起来，结果都必须正确 */
    var land = function () {
      if (landed) return;
      landed = true;
      g.style.zoom = k;
      wrap.scrollLeft = xTo;
      sa.scrollTop = yTo;
    };
    g.style.zoom = 1;
    /* 用 setTimeout 而不是 rAF 驱动：rAF 在后台标签/无头环境下可能完全不触发，
       那样缩放就会永远停在起点。再加一个兜底定时器保证终态一定落地 */
    var step = function () {
      if (token !== ZANIM) return;                  /* 又聚焦了别处，放弃这一轮 */
      if (landed) return;
      if (t0 === null) t0 = Date.now();
      var p = Math.min(1, (Date.now() - t0) / ZOOM_MS);
      var e = 1 - Math.pow(1 - p, 3);
      g.style.zoom = 1 + (k - 1) * e;
      wrap.scrollLeft = xFrom + (xTo - xFrom) * e;
      sa.scrollTop = yFrom + (yTo - yFrom) * e;
      if (p < 1) setTimeout(step, 16); else land();
    };
    setTimeout(step, 16);
    setTimeout(land, ZOOM_MS + 140);
  } else {
    ZANIM++;                                        /* 取消聚焦：停掉还在跑的动画 */
    g.style.zoom = 1;
    wrap.style.paddingLeft = '0px';
    wrap.style.paddingTop = '0px';
    wrap.style.overflow = '';
  }
}

/* 顶部只说右端是什么 —— 「N 条变过 / N 条不符」是图卡头部在报，别重复；

function revSummary(pid, rg) {
  var r = repoOf(pid); if (!r) return '';
  if (rg.to === 'wt') return r.dirty.length
    ? '工作区 ' + r.dirty.length + ' 个文件未提交' : '工作区干净';
  var cm = commitOf(pid, rg.to);

function renderRangeBar() {

    a: '「它是什么 / 变了什么 / 现在对不对 / 几份表示对不对得上」四块各自以一句<code>结论</code>结束。',
    o: '<b>这是这个页面真正的价值</b>：数据谁都会铺开，人要的是「所以呢」。' },
  { q: '⑩ 图改成「目录当骨架」（本轮）',
    a: '一个目录一条横带，带里按文件分组。归属用框套住，通信用跨框的线。带 1 是仓库里的目录，然后是「还没有契约的地方」，最后是「外部 / 不在本仓库」。',
    o: '契约的出处拆成两个字段：<b>file</b>（仓库里的路径，没有就是 null）和 <b>boundary</b>（一句人话）。29 条里只有 10 条有真实文件，13 条平台工具和 2 条运行时文件没有出处，收进「外部」框。' },
  { q: '⑨ 三张卡片，各自只有「标题 + 说明」两行（本轮）',
    a: 'header 一张卡、侧边栏一张卡、中间内容一张卡。<b>两处顶部都只留两行</b>：第一行标题，第二行说明。图和表格直接铺在内容卡上，不再套第二层卡。',
    o: '<b>内容区从 840px 放开到 1086px</b>；节点加宽到 232px，长名字不再截断。主题切换和「讨论锚点」从 header 移到了侧边栏底部。' },
  { q: '⑧ 选中项目 → 右边是一张关系图（新增）',
    a: '打开页面默认就落在这里：方块是契约、线是它们之间的关系。关系有四类——<code>引用</code>、<code>投影</code>、<code>产出</code>、<code>协作</code>，外加虚线表示的<code>缺口</code>。点方块进详情。',
    o: '<b>为什么这解决了"零背景看不懂"</b>：先看见整体形状，再点进去看细节。而且契约真正的价值就在关系上——单独一条只是个 schema，"改了这个谁会受影响"才是人要的。' },
  { q: '⑦ 视觉层换成卡片式液态玻璃',
    a: '沿用 <code>ios-glass-preview</code> 的三层玻璃 token 与 <code>backdrop-filter</code> 配方；背景是会缓慢漂移的色斑，玻璃才有东西可折射。',
    o: '<b>签名元素</b>：每条契约的状态以彩色光晕从玻璃右上角透出来——绿/黄/红。不用读字就能感觉到状态。这是「光穿过材质」，不是贴纸。' },
  { q: '⑥ 这个页面自己的契约也在里面',
    a: '标记「本页」的五条：两个接口、一个 SSE 事件、一个存盘文件，以及<code>契约对象本身</code>。',
    o: '<b>一个管契约的工具，自己的契约却没管，那是说不过去的。</b>而且这五条正好是最容易被漏掉的一类边界——宿主和页面之间的接口，平时没人给它写规格。' },
  { q: '⑤ 还没有契约的地方，在树的最后',
    a: '每个项目底下直接列出"没有契约的地方"，红色标记。目前 5 处。',
    o: '<b>留着的原因</b>：只展示已有的契约，等于奖励已经做对的人、放过没做的地方。' }
];
function renderNotes() {
  var b = $('#ovBody'); clear(b);
  NOTES.forEach(function (n) {
    b.append(el('div', { class: 'an' },
      el('div', { class: 'an-q', text: n.q }),
      el('div', { class: 'an-a', html: n.a }),
      el('div', { class: 'an-o', html: n.o })));
  });
}

$('#q').addEventListener('input', function (e) { S.q = e.target.value; renderTree(); });

/* ---------- 筛选：按钮 + 下拉多选 ---------- */
function renderFiltBtn() {
  var btn = $('#filtBtn'), bd = $('#filtBadge');
  var n = filtKeys().length;
  btn.classList.toggle('on', n > 0);
  bd.textContent = String(n);
  bd.hidden = n === 0;
  btn.setAttribute('aria-expanded', S.filtOpen ? 'true' : 'false');
  btn.title = n ? '筛选中：' + FILTERS.filter(function (f) { return S.filt[f.k]; })
    .map(function (f) { return f.label; }).join(' / ') : '筛选';
}
function renderFiltPop() {
  var pop = $('#filtPop');
  pop.innerHTML = '';
  FILTERS.forEach(function (f) {
    var o = el('button', { class: 'fopt' + (S.filt[f.k] ? ' on' : ''), type: 'button',
      'aria-pressed': S.filt[f.k] ? 'true' : 'false' },
      el('span', { class: 'box' }),
      el('span', { class: 'flabel', text: f.label }),
      el('span', { class: 'fhint', text: f.hint }));
    o.dataset.k = f.k;
    o.addEventListener('click', function (e) {
      e.stopPropagation();                    /* 点选项不关下拉，方便连着选 */
      var byKey = e.detail === 0;             /* 键盘回车/空格触发时 detail 为 0 */
      if (S.filt[f.k]) delete S.filt[f.k]; else S.filt[f.k] = 1;
      renderFiltPop(); renderFiltBtn(); renderTree();
      if (byKey && S.filtOpen) {              /* 重建后焦点不能丢，否则键盘用户掉出下拉 */
        var again = pop.querySelector('.fopt[data-k="' + f.k + '"]');
        if (again) again.focus();
      }
    });
    pop.appendChild(o);
  });
  var anyOn = filtActive();
  var cl = el('button', { class: 'filtclear' + (anyOn ? '' : ' hint'), type: 'button',
    text: anyOn ? '清除筛选' : '不选就是全部显示' });
  if (anyOn) cl.addEventListener('click', function (e) {
    e.stopPropagation();
    S.filt = {}; renderFiltPop(); renderFiltBtn(); renderTree();
  }); else cl.disabled = true;   /* 这时它只是一句说明，不该是个点了没反应的按钮 */
  pop.appendChild(cl);
}
function closeFilt() {
  S.filtOpen = false; $('#filtPop').hidden = true; renderFiltBtn();
}
$('#filtBtn').addEventListener('click', function (e) {
  e.stopPropagation();
  S.filtOpen = !S.filtOpen;
  $('#filtPop').hidden = !S.filtOpen;
  renderFiltBtn();
});
document.addEventListener('click', function (e) {
  if (S.filtOpen && !$('#filtWrap').contains(e.target)) closeFilt();
  if (S.revOpen && !$('#tbRange').contains(e.target)) { S.revOpen = null; renderRangeBar(); }
});
$('#notesBtn').addEventListener('click', function () { $('#ov').classList.add('open'); });
$('#ovClose').addEventListener('click', function () { $('#ov').classList.remove('open'); });
$('#ov').addEventListener('click', function (e) { if (e.target === $('#ov')) $('#ov').classList.remove('open'); });
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  $('#ov').classList.remove('open');
  closeFilt();
  if (S.revOpen) { S.revOpen = null; renderRangeBar(); }
});

/* ---------- 主题 ---------- */
var mq = window.matchMedia('(prefers-color-scheme: dark)');
function setTheme(t) {
  document.body.classList.toggle('dark', t === 'dark');
  var bs = document.querySelectorAll('#themeSeg button');
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].dataset.theme === t);
}
setTheme(mq.matches ? 'dark' : 'light');
var themeBtns = document.querySelectorAll('#themeSeg button');
for (var bi = 0; bi < themeBtns.length; bi++) {
  (function (b) { b.addEventListener('click', function () { setTheme(b.dataset.theme); }); })(themeBtns[bi]);
}

renderFiltPop();
renderFiltBtn();
renderAll();
renderNotes();
</script>
</body>
</html>
