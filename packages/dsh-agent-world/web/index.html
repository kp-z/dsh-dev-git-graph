<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent World · 俯视图</title>
    <link rel="stylesheet" href="./style.css" />

    <!--
      import map：把裸说明符 `three` 指到本目录 vendor 的那份。
      为什么需要它：three 的 addons（OrbitControls 等）里写的是 `from 'three'`，
      而浏览器不认识裸说明符——没有这张表，addon 一加载就 404。
      版本与来源见 src/vendor/README.md（白名单路由在 src/routes/vendor.ts）。
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.min.js",
          "three/addons/": "./vendor/three/examples/jsm/",
          "three/addons/loaders/GLTFLoader.js": "./vendor/three/examples/jsm/loaders/GLTFLoader.js",
          "three/addons/utils/SkeletonUtils.js": "./vendor/three/examples/jsm/utils/SkeletonUtils.js"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <h1>Agent World</h1>
      <div id="status" class="status">连接中…</div>
      <div class="controls">
        <button id="view-top" class="active">俯视</button>
        <button id="view-3d">3D</button>
        <button data-command="pause">暂停</button>
        <button data-command="resume">继续</button>
      </div>
    </header>

    <main>
      <section class="map">
        <canvas id="town"></canvas>
        <!-- 3D 画布与俯视图叠在同一区域，靠 CSS 切换；两者吃同一份数据。 -->
        <canvas id="town3d" hidden></canvas>
        <!-- 头顶气泡（M6-5）：跟着角色走的一层 DOM，位置由 app.js 每帧算。
             pointer-events:none，所以它不会挡住"点角色"这件事；
             aria-hidden：同一段话在侧栏的对话面板里也有，读屏不必听两遍。 -->
        <div id="bubbles" class="bubbles" aria-hidden="true"></div>
        <div id="view-hint" class="view-hint" hidden></div>
        <div class="legend">
          <span><i class="swatch ground"></i>地块</span>
          <span><i class="swatch station"></i>站点</span>
          <span><i class="swatch agent"></i>角色（实心=在站上，空心=在路上）</span>
          <span class="dim" id="view-note">点角色（或点右侧花名册那一行）就能跟他说话</span>
        </div>
      </section>

      <aside>
        <!--
          对话面板（M6-5）。**放在侧栏里**而不是画布上：俯视与 3D 是两个渲染器，
          而"跟谁说话"这件事与渲染器无关——放在侧栏，两个视图下它都在。
        -->
        <section id="dialogue" class="dialogue" hidden>
          <div class="dialogue-head">
            <h2>对话 <span id="dialogue-who" class="dim"></span></h2>
            <button id="dialogue-close" class="ghost" type="button" title="关掉对话面板">×</button>
          </div>
          <ul id="dialogue-log" class="dialogue-log"></ul>
          <div id="dialogue-hint" class="dialogue-hint" hidden></div>
          <form id="dialogue-form" class="dialogue-form">
            <textarea
              id="dialogue-input"
              rows="2"
              placeholder="跟他说点什么（回车发送 · Shift+回车换行）"
            ></textarea>
            <button id="dialogue-send" type="submit">发送</button>
          </form>
        </section>

        <h2>花名册</h2>
        <ul id="roster" class="roster"></ul>
        <h2>工单板</h2>
        <ul id="tasks" class="tasks"></ul>
        <h2>内容</h2>
        <div id="content" class="content"></div>
      </aside>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
