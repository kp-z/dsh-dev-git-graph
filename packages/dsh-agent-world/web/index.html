<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent World</title>

    <!--
      样式分四层（DESIGN.md 第二节）：
      tokens = 唯一的设计 token 来源；base = reset/排版；components = 徽章/按钮/进度条/卡片；
      layout = 顶栏、抽屉、浮层的摆法。**组件层里不许出现十六进制色值**，一律引用 token。
    -->
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <!-- R2：页面内 `<aside>` 侧边栏（与场景**同文档**——点列表要驱动 Phaser 相机）。 -->
    <link rel="stylesheet" href="./styles/sidebar.css" />

    <!--
      import map：把裸说明符 `phaser` 指到本目录 vendor 的那份。
      浏览器不认识裸说明符——没有这张表就加载不了。
      版本与来源见 src/vendor/README.md（白名单路由在 src/routes/vendor.ts）。
      R66：`three` 那一档随 3D 路径一起删了（用户："全部用 Phaser 里现成的工具"）。
    -->
    <script type="importmap">
      {
        "imports": {
          "phaser": "./vendor/phaser/phaser.esm.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="app">
      <!--
        顶栏（48px 玻璃）——R70 起**顶栏与看板合成一行**（用户："上方 title 和看板行应该是一行
        紧凑点，重新设计，简约优雅，图标"）。所以 `#board` 就放在这一行里：
        收起时它是这一行里的**摘要**（图标 · 进度条 · 计数徽章 · 正在跑什么 · 展开图标），
        展开时它变成**浮层**（`position: absolute`，浮在舞台之上，**不占布局、不挤压场景**）。
      -->
      <header class="topbar" id="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <!-- 星座标：四个"居民"节点连成一个菱形网络——多智能体小镇的最小记号。 -->
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 3.5 16.5 10 10 16.5 3.5 10Z" />
              <path d="M3.5 10h13" />
              <circle cx="10" cy="3.5" r="2.1" fill="currentColor" stroke="none" />
              <circle cx="16.5" cy="10" r="2.1" fill="currentColor" stroke="none" />
              <circle cx="10" cy="16.5" r="2.1" fill="currentColor" stroke="none" />
              <circle cx="3.5" cy="10" r="2.1" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <span
            class="brand-name"
            id="brand-name"
            contenteditable="true"
            spellcheck="false"
            role="textbox"
            aria-label="世界名称（可编辑）"
            title="点击重命名">Agent World</span>
        </div>

        <section id="board" class="board" aria-label="执行看板"></section>

        <div class="commands">
          <button id="cmd-pause" class="icon-btn" type="button" title="暂停世界" aria-label="暂停世界">
            <svg viewBox="0 0 16 16" fill="currentColor"><rect x="5" y="3.6" width="2.3" height="8.8" rx="1.15" /><rect x="8.7" y="3.6" width="2.3" height="8.8" rx="1.15" /></svg>
          </button>
          <button id="cmd-resume" class="icon-btn" type="button" title="继续" aria-label="继续">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 3.4v9.2a.6.6 0 0 0 .92.5l7.4-4.6a.6.6 0 0 0 0-1L6.42 2.9a.6.6 0 0 0-.92.5z" /></svg>
          </button>
        </div>
      </header>

      <!-- 场景铺满工作区；面板是**浮在它上面的玻璃**（DESIGN 第三节） -->
      <main class="stage" id="stage">
        <canvas id="town"></canvas>
  
        <!-- R76：头顶气泡进引擎（Phaser Text/Graphics 画在 canvas 里），不再有这层 DOM。 -->

        <div id="view-hint" class="view-hint" hidden></div>

        <!--
          R65：视图控制簇（右下角一组浮动控件）。
          以前「图例」一个人浮在场景左下角、和内容叠着像补丁；现在它和缩放/适配/复位
          归在同一簇里，而且**都在场景之外的那一层**（`position:absolute` 的浮层），
          不参与场景布局。
          缩放/适配/复位调用渲染层的 `scene2d.zoomIn/zoomOut/fitView/resetView`；
          接口还没就位时按钮**自动禁用**（不是静默失效——静默失效最难查）。
        -->
        <div class="view-controls" id="view-controls" role="group" aria-label="视野控制">
          <button id="cmd-zoom-out" class="icon-btn" type="button" title="缩小" aria-label="缩小">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8h8" /></svg>
          </button>
          <button id="cmd-zoom-in" class="icon-btn" type="button" title="放大" aria-label="放大">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 4v8M4 8h8" /></svg>
          </button>
          <button id="cmd-fit" class="icon-btn" type="button" title="适配（整张地图完整显示）" aria-label="适配">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5V4h2.5M9.5 4H12v2.5M12 9.5V12H9.5M6.5 12H4V9.5" /></svg>
          </button>
          <button id="cmd-reset" class="icon-btn" type="button" title="复位（缩放 + 居中）" aria-label="复位">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="4.2" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2" /></svg>
          </button>
          <span class="view-zoom" id="view-zoom" aria-live="off"></span>
          <div id="legend" class="legend is-collapsed" aria-label="图例"></div>
        </div>

        <!--
          agent 超控面板（游戏 HUD 风格，紧凑单行头）：
          · 左：角色名；中：对话 / 移动 互斥模式；右：解锁 / 收起 两个方图标。
          · 去掉「超控」大标题与大段说明——面板是 HUD，不是文档。
        -->
        <section id="dialogue" class="dialogue" hidden>
          <div class="oc-head">
            <span class="oc-name" id="dialogue-who">—</span>
            <div class="dialogue-modes" role="tablist" aria-label="超控模式">
              <button id="dialogue-mode-chat" class="mode-tab is-active" role="tab" aria-selected="true" aria-controls="dialogue-mode-chat-panel" type="button">对话</button>
              <button id="dialogue-mode-move" class="mode-tab" role="tab" aria-selected="false" aria-controls="dialogue-mode-move-panel" type="button">移动</button>
            </div>
            <div class="oc-actions">
              <button id="dialogue-unlock" class="oc-icon oc-icon-text" type="button" title="解锁镜头（Esc）">解锁</button>
              <button id="dialogue-close" class="oc-icon" type="button" title="收起（Esc）" aria-label="收起面板">×</button>
            </div>
          </div>

          <div id="dialogue-mode-chat-panel" class="mode-panel" role="tabpanel" aria-labelledby="dialogue-mode-chat">
            <div class="dialogue-log-head">
              <button id="dialogue-log-toggle" class="ghost" type="button" title="展开对话记录" aria-expanded="false" aria-controls="dialogue-log">记录</button>
            </div>
            <!-- 记录默认收起：回复实时出现在角色头顶气泡里，这里只在想看历史时展开。 -->
            <ul id="dialogue-log" class="dialogue-log is-collapsed"></ul>
            <div id="dialogue-hint" class="dialogue-hint" hidden></div>
            <form id="dialogue-form" class="dialogue-form">
              <textarea id="dialogue-input" rows="1" placeholder="回车发送 · Shift+回车换行"></textarea>
              <button id="dialogue-send" class="btn btn-primary" type="submit">发送</button>
            </form>
          </div>

          <div id="dialogue-mode-move-panel" class="mode-panel" role="tabpanel" aria-labelledby="dialogue-mode-move" hidden>
            <div class="oc-keys">
              <span class="oc-keyset"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><b>走动</b></span>
              <span class="oc-keyset"><kbd>Enter</kbd><b>对话</b></span>
              <span class="oc-keyset"><kbd>Esc</kbd><b>解锁</b></span>
            </div>
          </div>
        </section>

      </main>

      <!-- 状态条（R64 起在 footer）：运行中 / tick / 连接 / 渲染器读数 -->
      <footer class="footer" id="footer">
        <div class="topbar-status" id="status" role="status" aria-live="off">连接中…</div>
      </footer>

      <!--
        R2：侧边栏 = **页面内的 `<aside>`**（用户原话「侧边栏最好是说的页面内的侧边栏」）。
        为什么是 `.app` 的第 4 个 grid 子节点、而不是浮在舞台上的某一层：
        浮层会遮住场景，而侧边栏要当"人与团队"的唯一交互面。作为第二列之后，
        `.stage` 变窄 → `#town` 父容器变窄 → 引擎的 `Scale.RESIZE` 自己跟，
        **不需要（也不允许）手调 `game.scale.resize()`**（那会把真机缩放打回 1×）。
        两档视图（Agent 列表 / 任务流程图）由 `web/ui/sidebar.js` 建，外壳只给容器。
      -->
      <aside id="sidebar" role="complementary" aria-label="团队侧边栏"></aside>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
