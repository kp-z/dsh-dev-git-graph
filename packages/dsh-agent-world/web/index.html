<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent World</title>

    <!--
      样式分四层（DESIGN.md 第二节）：
      tokens = 唯一的设计 token 来源；base = reset/排版；components = 徽章/按钮/进度条/卡片；
      layout = 顶栏、抽屉、浮层的摆法。**组件层里不许出现十六进制色值**，一律引用 token。
    -->
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/layout.css" />

    <!--
      import map：把裸说明符 `phaser` 指到本目录 vendor 的那份。
      浏览器不认识裸说明符——没有这张表就加载不了。
      版本与来源见 src/vendor/README.md（白名单路由在 src/routes/vendor.ts）。
      R66：`three` 那一档随 3D 路径一起删了（用户："全部用 Phaser 里现成的工具"）。
    -->
    <script type="importmap">
      {
        "imports": {
          "phaser": "./vendor/phaser/phaser.esm.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="app">
      <!--
        顶栏（48px 玻璃）——R70 起**顶栏与看板合成一行**（用户："上方 title 和看板行应该是一行
        紧凑点，重新设计，简约优雅，图标"）。所以 `#board` 就放在这一行里：
        收起时它是这一行里的**摘要**（图标 · 进度条 · 计数徽章 · 正在跑什么 · 展开图标），
        展开时它变成**浮层**（`position: absolute`，浮在舞台之上，**不占布局、不挤压场景**）。
      -->
      <header class="topbar" id="topbar">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">Agent World</span>
        </div>

        <section id="board" class="board" aria-label="执行看板"></section>

        <div class="commands">
          <button id="cmd-pause" class="icon-btn" type="button" title="暂停世界">⏸</button>
          <button id="cmd-resume" class="icon-btn" type="button" title="继续">▶</button>
          <button id="drawer-toggle" class="icon-btn active" type="button" title="收起 / 展开右侧抽屉">☰</button>
        </div>
      </header>

      <!-- 场景铺满工作区；面板是**浮在它上面的玻璃**（DESIGN 第三节） -->
      <main class="stage" id="stage">
        <canvas id="town"></canvas>
  
        <!-- 头顶气泡（M6-5）：跟着角色走的一层 DOM，位置由 main.js 每帧算。
             pointer-events:none，所以它不会挡住"点角色"；aria-hidden：同一段话在对话面板里也有。 -->
        <div id="bubbles" class="bubbles" aria-hidden="true"></div>

        <div id="view-hint" class="view-hint" hidden></div>

        <!--
          R65：视图控制簇（右下角一组浮动控件）。
          以前「图例」一个人浮在场景左下角、和内容叠着像补丁；现在它和缩放/适配/复位
          归在同一簇里，而且**都在场景之外的那一层**（`position:absolute` 的浮层），
          不参与场景布局。
          缩放/适配/复位调用渲染层的 `scene2d.zoomIn/zoomOut/fitView/resetView`；
          接口还没就位时按钮**自动禁用**（不是静默失效——静默失效最难查）。
        -->
        <div class="view-controls" id="view-controls" role="group" aria-label="视野控制">
          <button id="cmd-zoom-out" class="icon-btn" type="button" title="缩小">−</button>
          <button id="cmd-zoom-in" class="icon-btn" type="button" title="放大">＋</button>
          <button id="cmd-fit" class="icon-btn" type="button" title="适配（整张地图完整显示）">⤢</button>
          <button id="cmd-reset" class="icon-btn" type="button" title="复位（缩放 + 居中）">⌖</button>
          <span class="view-zoom" id="view-zoom" aria-live="off"></span>
          <div id="legend" class="legend is-collapsed" aria-label="图例"></div>
        </div>

        <!-- 右侧浮动抽屉：花名册 / 工单两页，对话面板是同一抽屉的另一页（滑出覆盖）。 -->
        <aside class="drawer is-closed" id="drawer">
          <nav class="drawer-tabs" role="tablist" aria-label="抽屉页">
            <button class="drawer-tab active" type="button" role="tab" data-page="roster" aria-selected="true">花名册</button>
            <button class="drawer-tab" type="button" role="tab" data-page="tasks" aria-selected="false">工单</button>
          </nav>

          <div class="drawer-pages">
            <section class="drawer-page" data-page="roster">
              <ul id="roster" class="roster"></ul>
            </section>
            <section class="drawer-page" data-page="tasks" hidden>
              <ul id="tasks" class="tasks"></ul>
              <div id="content" class="content"></div>
            </section>
          </div>

          <!--
            对话面板（M6-5）：**同一个抽屉的另一页**，从右侧滑出盖在花名册之上。
            元素 id 与 `ui/dialogue-ui.js` 的约定一致。
          -->
          <section id="dialogue" class="dialogue" hidden>
            <div class="dialogue-head">
              <h2>对话 <span id="dialogue-who" class="dim"></span></h2>
              <button id="dialogue-close" class="icon-btn" type="button" title="收起对话">×</button>
            </div>
            <ul id="dialogue-log" class="dialogue-log"></ul>
            <div id="dialogue-hint" class="dialogue-hint" hidden></div>
            <form id="dialogue-form" class="dialogue-form">
              <textarea id="dialogue-input" rows="2" placeholder="跟他说点什么（回车发送 · Shift+回车换行）"></textarea>
              <button id="dialogue-send" class="btn btn-primary" type="submit">发送</button>
            </form>
          </section>
        </aside>

      </main>

      <!-- 状态条（R64 起在 footer）：运行中 / tick / 连接 / 渲染器读数 -->
      <footer class="footer" id="footer">
        <div class="topbar-status" id="status" role="status" aria-live="off">连接中…</div>
      </footer>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
