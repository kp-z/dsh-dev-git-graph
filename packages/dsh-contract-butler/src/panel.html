<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>协议管家</title>
<style>
  /* ============ 液态玻璃 · 卡片式 ============
     沿用 docs/ios-glass-preview.html 的玻璃语言：
     三层玻璃(regular/thin/clear) + backdrop-filter + 高光内描边 + 分离度降级 */

  :root {
    color-scheme: light;
    --bg: #e9ecf4;
    /* 固定列/冻结列要的**不透明**底色 = 玻璃卡片的等价色（玻璃色按其 alpha 合到页面底色上）。
       直接用 --bg 会比赛在玻璃卡片上的行暗一块，看着像贴了张灰纸——之前那块"平板"就是这么来的。 */
    --surface-solid: color-mix(in srgb, #ffffff 70%, var(--bg));

    /* 玻璃三层 */
    --glass-regular: rgba(255,255,255,.70);
    --glass-thin:    rgba(255,255,255,.50);
    --glass-clear:   rgba(255,255,255,.26);
    --glass-edge:      rgba(255,255,255,.62);
    --glass-edge-soft: rgba(255,255,255,.34);
    --glass-spec:      rgba(255,255,255,.72);

    /* 填充 */
    --fill: rgba(118,118,128,.11);
    --fill-secondary: rgba(118,118,128,.07);
    --fill-selected: rgba(0,122,255,.12);

    /* 兼容旧变量名（JS 内联样式在用） */
    --panel: var(--glass-regular);
    --hover: var(--fill-secondary);
    --sel:   var(--fill-selected);
    --line:  rgba(60,60,67,.13);
    --line2: rgba(60,60,67,.22);

    --ink:  #14141a;
    --ink2: rgba(50,50,60,.72);
    --ink3: rgba(50,50,60,.46);

    --ok: #16a34a; --warn: #c07600; --bad: #dc2b22; --accent: #007aff;

    /* 详情页两侧窗格共用的高度上限：图再长、表再长都不把整页撑高。
       左右共用这一个数，不许各写一份 vh。 */
    --ss-h: 64vh;

    /* 状态光晕：契约的状态从玻璃里透出来 */
    --glow-ok:      rgba(52,199,89,.34);
    --glow-changed: rgba(255,149,0,.34);
    --glow-bad:     rgba(255,59,48,.32);

    --shadow:      0 28px 80px rgba(30,35,60,.20), 0 8px 24px rgba(30,35,60,.10);
    --shadow-soft: 0 10px 30px rgba(30,35,60,.10), 0 2px 8px rgba(30,35,60,.06);

    --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 30px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
  }

  body.dark {
    color-scheme: dark;
    --bg: #06060a;
    --glass-regular: rgba(40,40,48,.70);
    --surface-solid: color-mix(in srgb, #282830 70%, var(--bg));
    --glass-thin:    rgba(40,40,48,.50);
    --glass-clear:   rgba(40,40,48,.24);
    --glass-edge:      rgba(255,255,255,.13);
    --glass-edge-soft: rgba(255,255,255,.08);
    --glass-spec:      rgba(255,255,255,.15);
    --fill: rgba(120,120,130,.22);
    --fill-secondary: rgba(120,120,130,.13);
    --fill-selected: rgba(10,132,255,.24);
    --line:  rgba(235,235,245,.13);
    --line2: rgba(235,235,245,.22);
    --ink:  #f5f5f7;
    --ink2: rgba(235,235,245,.72);
    --ink3: rgba(235,235,245,.46);
    --ok: #34c759; --warn: #ff9f0a; --bad: #ff453a; --accent: #0a84ff;
    --glow-ok:      rgba(52,199,89,.26);
    --glow-changed: rgba(255,159,10,.26);
    --glow-bad:     rgba(255,69,58,.26);
    --shadow:      0 32px 90px rgba(0,0,0,.62), 0 10px 28px rgba(0,0,0,.42);
    --shadow-soft: 0 14px 34px rgba(0,0,0,.36), 0 3px 10px rgba(0,0,0,.26);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--ui); font-size: 13px; line-height: 1.55;
    letter-spacing: -.011em; -webkit-font-smoothing: antialiased;
  }
  button, input, label { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 8px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============ 背景：会动的色斑（玻璃要真的"液"） ============ */
  .liquid { position: fixed; inset: -18%; z-index: 0; pointer-events: none; }
  .liquid span {
    position: absolute; border-radius: 50%; filter: blur(80px); opacity: .52;
    animation: drift 36s ease-in-out infinite alternate;
  }
  .liquid span:nth-child(1) { width: 46vw; height: 46vw; left: -6%; top: -10%;
    background: radial-gradient(circle, rgba(0,122,255,.50), transparent 68%); }
  .liquid span:nth-child(2) { width: 40vw; height: 40vw; right: -6%; top: 0%;
    background: radial-gradient(circle, rgba(175,82,222,.42), transparent 68%);
    animation-duration: 46s; animation-direction: alternate-reverse; }
  .liquid span:nth-child(3) { width: 44vw; height: 44vw; left: 20%; bottom: -16%;
    background: radial-gradient(circle, rgba(52,199,89,.36), transparent 68%);
    animation-duration: 40s; }
  .liquid span:nth-child(4) { width: 32vw; height: 32vw; right: 14%; bottom: -8%;
    background: radial-gradient(circle, rgba(255,149,0,.30), transparent 68%);
    animation-duration: 50s; animation-direction: alternate-reverse; }
  body.dark .liquid span { opacity: .48; }
  @keyframes drift {
    0%   { transform: translate3d(0,0,0) scale(1); }
    50%  { transform: translate3d(4vw,3vh,0) scale(1.14); }
    100% { transform: translate3d(-3vw,4vh,0) scale(.94); }
  }

  /* ============ 三张卡片：header / 侧边栏 / 内容 ============ */
  .stage {
    position: relative; z-index: 1; height: 100vh; padding: 16px;
    display: grid; gap: 14px;
    grid-template-columns: 306px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "head head" "side main";
  }
  /* 玻璃卡片 + 状态光晕从右上透出来 */
  .card {
    position: relative; min-width: 0;
    border-radius: var(--r-lg); border: 1px solid var(--glass-edge);
    background:
      radial-gradient(760px 380px at 90% -16%, var(--glow, transparent), transparent 72%),
      var(--glass-regular);
    box-shadow: var(--shadow-soft), inset 0 1px 0 var(--glass-spec);
    backdrop-filter: blur(24px) saturate(1.75); -webkit-backdrop-filter: blur(24px) saturate(1.75);
  }
  .g-ok      { --glow: var(--glow-ok); }
  .g-changed { --glow: var(--glow-changed); }
  .g-bad     { --glow: var(--glow-bad); }

  /* ============ 顶栏 ============ */
  .topbar {
    grid-area: head; padding: 11px 22px; z-index: 6;   /* 抬起来，否则下拉会被下面两张卡盖住 */
    display: flex; align-items: center; gap: 18px;
  }
  .tb-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

  /* 版本条：这次对比的是哪两版，两端都能点开换 */
  .tb-range { display: flex; align-items: center; gap: 7px; margin-left: auto; flex-wrap: wrap; }
  .revproj { font-size: 12px; font-weight: 600; color: var(--ink2); margin-right: 3px; }
  .revbtn {
    position: relative; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 6px 10px; font-family: var(--mono); font-size: 11.5px; font-weight: 600;
    color: var(--ink); border: 1px solid var(--glass-edge-soft); border-radius: 999px;
    background: var(--glass-thin); box-shadow: inset 0 1px 0 var(--glass-spec);
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  }
  .revbtn:hover { border-color: var(--line2); }
  .revbtn .revtag { font-family: var(--ui); font-size: 10px; font-weight: 600;
    padding: 1px 6px; border-radius: 999px; color: var(--ink2); background: var(--fill); }
  .revbtn .revtag.wt { color: var(--warn);
    background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .revbtn .revcaret { font-size: 9px; color: var(--ink3); }
  .revarrow { font-size: 12px; color: var(--ink3); }
  .revsum { font-size: 11.5px; color: var(--ink3); margin-left: 3px; }
  .revpop { left: 0; right: auto; min-width: 330px; max-height: 46vh; overflow: auto; }
  .revopt .flabel { flex: none; font-family: var(--mono); font-size: 11.5px; }
  .revopt .fsub { flex: 1; min-width: 0; text-align: left; font-size: 11.5px; color: var(--ink2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .revopt .fhint { flex: none; font-size: 10.5px; }
  .htitle { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .hsub { font-size: 12px; color: var(--ink3); }
  .mark {
    width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center;
    color: #fff; font-size: 12px; font-weight: 700;
    background: linear-gradient(145deg, #37a3ff, #0066e0);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.48), 0 5px 14px rgba(0,122,255,.30);
  }
  .title { font-weight: 700; font-size: 13.5px; }
  .subtitle { font-size: 11.5px; color: var(--ink3); }
  .spacer { flex: 1; }

  .ghost {
    padding: 6px 12px; cursor: pointer; font-size: 12px; color: var(--ink2);
    border: 1px solid var(--glass-edge-soft); border-radius: 999px;
    background: var(--glass-thin);
    box-shadow: inset 0 1px 0 var(--glass-spec);
    transition: background .18s ease, color .18s ease;
  }
  .ghost:hover { background: var(--fill); color: var(--ink); }

  .seg { display: flex; gap: 3px; padding: 3px; border-radius: 999px;
    border: 1px solid var(--glass-edge-soft); background: var(--glass-thin);
    box-shadow: inset 0 1px 0 var(--glass-spec); }
  .seg button {
    padding: 4px 11px; border: 0; border-radius: 999px; cursor: pointer; font-size: 12px;
    color: var(--ink2); background: transparent; transition: background .18s ease, color .18s ease;
  }
  .seg button.on { color: var(--accent); background: var(--fill-selected); }

  /* ============ 两栏 ============ */
  .sidebar {
    grid-area: side; display: flex; flex-direction: column;
    min-height: 0; overflow: hidden;
  }
  .side-top { flex: none; padding: 12px; display: grid; gap: 9px; border-bottom: 1px solid var(--glass-edge-soft); }
  .side-foot { flex: none; display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-top: 1px solid var(--glass-edge-soft); }
  /* 底部这一排只剩主题按钮组（分区开关已取消，不再有第二个按钮组）：它贴着状态药丸，靠右。
     原来是"第一个组吃掉空隙"，现在这一个组直接吃掉左边的空隙即可。 */
  .side-foot .seg { margin-left: auto; }
  .side-foot .seg button { padding: 4px 9px; }
  .search {
    width: 100%; padding: 8px 12px; font-size: 12.5px; outline: none;
    border: 1px solid var(--glass-edge-soft); border-radius: 999px;
    background: var(--glass-regular); color: var(--ink);
    box-shadow: inset 0 1px 0 var(--glass-spec);
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  }
  .search::placeholder { color: var(--ink3); }
  .search:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  /* 搜索 + 筛选按钮一行；下拉从这一行下面展开 */
  .filtwrap { position: relative; display: flex; align-items: center; gap: 8px; }
  .filtwrap .search { flex: 1; min-width: 0; }
  .filtbtn {
    flex: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 8px 11px; font-family: var(--ui); font-size: 12.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--glass-edge-soft); border-radius: 999px;
    background: var(--glass-thin); box-shadow: inset 0 1px 0 var(--glass-spec);
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  }
  .filtbtn:hover { color: var(--ink); }
  .filtbtn.on { color: var(--accent); background: var(--fill-selected);
    border-color: color-mix(in srgb, var(--accent) 42%, transparent); }
  .filtbtn .fico { width: 11px; height: 11px; flex: none; display: block; }
  .fbadge { min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px;
    font-size: 10px; font-weight: 700; line-height: 15px; text-align: center;
    color: #fff; background: var(--accent); }
  .filtpop {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 40;
    padding: 6px; display: grid; gap: 1px; border-radius: var(--r-md);
    border: 1px solid var(--glass-edge); background: var(--glass-regular);
    box-shadow: var(--shadow-soft), inset 0 1px 0 var(--glass-spec);
    backdrop-filter: blur(24px) saturate(1.7); -webkit-backdrop-filter: blur(24px) saturate(1.7);
  }
  .filtpop[hidden] { display: none; }
  .fopt { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 7px 9px; border: 0; border-radius: 10px; cursor: pointer;
    font-family: var(--ui); font-size: 12px; color: var(--ink2); background: none; }
  .fopt:hover { background: var(--fill-secondary); }
  .fopt:focus { outline: none; }
  .fopt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .fopt.on { color: var(--ink); }
  .fopt .box { width: 15px; height: 15px; flex: none; position: relative;
    border-radius: 4.5px; border: 1.5px solid var(--line2); }
  .fopt.on .box { border-color: var(--accent); background: var(--accent); }
  .fopt.on .box::after { content: ''; position: absolute; left: 4.5px; top: 1.5px;
    width: 4.5px; height: 8px; border-right: 1.8px solid #fff; border-bottom: 1.8px solid #fff;
    transform: rotate(40deg); }
  .fopt .flabel { flex: none; }
  .fopt .fhint { flex: 1; text-align: right; font-size: 10.5px; color: var(--ink3); }
  .filtclear { margin-top: 3px; padding: 7px 9px; border: 0; border-radius: 10px; cursor: pointer;
    text-align: left; font-family: var(--ui); font-size: 11.5px; color: var(--ink3); background: none; }
  .filtclear:hover { background: var(--fill-secondary); color: var(--ink); }
  .filtclear:disabled, .filtclear.hint { cursor: default; }
  .filtclear.hint:hover { background: none; color: var(--ink3); }

  /* ============ 树 ============ */
  .tree { flex: 1; overflow: auto; padding: 8px 8px 18px; }
  /* 分面栏：每个面带计数，靠数字判断要不要展开 */
  .facets { padding: 8px 10px 6px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
  .faxis { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .faxis .fname { flex: none; width: 30px; font-size: 10.5px; color: var(--ink3); }
  .fval { font: inherit; font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--ink2); cursor: pointer; }
  .fval:hover { background: var(--fill-secondary); color: var(--ink); }
  .fval.on { background: var(--fill-selected); color: var(--ink); border-color: var(--line2); font-weight: 600; }
  /* 事态横幅：默认只有它和"要注意的"那几条是铺开的 */
  .t-fold { cursor: pointer; }
  .t-fold:hover { background-color: var(--fill-secondary); }
  .tcaret { flex: none; width: 10px; font-size: 9px; color: var(--ink3); }
  .hotbar { display: flex; align-items: center; gap: 8px; padding: 8px 14px 6px; font-size: 11.5px; color: var(--ink3); }
  .hotbar.has { color: var(--ink); }
  .hotbar .hotn { font-weight: 600; }
  .facets { display: flex; flex-direction: column; gap: 5px; padding: 2px 0 8px; }
  .hotmore { margin-left: auto; font: inherit; font-size: 11px; color: var(--ink3);
    background: transparent; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .hotmore:hover { color: var(--ink); }
  /* 树的引导线：每 14px 一条竖线 = 各层祖先的线，缩进步进跟着这个 14 走。 */
  /* 箭头绝对定位到自己那一级的列上（--ind），不占流内宽度。
   若让它留在流内，12px 的箭头会吃掉 13px 的一级缩进，叶子就和父目录齐平了。 */
  .tcaret { position: absolute; left: var(--ind, 8px); top: 50%; transform: translateY(-50%);
    width: 13px; text-align: center; cursor: pointer; opacity: .75; }
  .tcaret:hover { opacity: 1; }
  /* 文件树（.tree）里反过来：箭头**占位**在流内，宽度就是那 13px 的一列。
     上面那条绝对定位留给「纳管项目」的目录树（.drow），那里没有图标这一列、也没有叶子让位。 */
  .tree .tcaret { position: static; top: auto; transform: none; width: 13px; opacity: .8;
    transition: transform .14s ease, opacity .14s ease; }
  .tree .tcaret:hover { opacity: 1; }
  /* 展开时转 90°（▸ → ▾ 的样子），开合状态一眼能看出 */
  .tree .tcaret.open { transform: rotate(90deg); }
  .t-dir.on { background-color: var(--fill-selected); }
  /* 形状图：节点卡 + 连线层。连线用 SVG，卡片走正常流式布局。 */
  .gnode { display: flex; align-items: baseline; gap: 8px; padding: 4px 9px; margin: 3px 0;
    border: 1px solid var(--k-line); border-radius: 7px; background: var(--k-bg); }
  .gname { font-size: 12px; color: var(--ink); }
  .gtype { font-size: 10.5px; color: var(--ink3); font-family: var(--mono); }
  .graph svg.edges { color: var(--line2); }

  /* 左树：度量统一到宿主侧栏那一套 —— 行高 26、每层缩进 14、箭头 12、计数 mono 10.5 */
  .trow {
    min-height: 26px;
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 10px; margin-bottom: 1px; cursor: pointer;
    border: 1px solid transparent; border-radius: var(--r-sm); background: transparent;
    transition: background .16s ease, border-color .16s ease;
  }
  .trow:hover { background-color: var(--fill-secondary); }
  .trow.on {
    background: var(--fill-selected);
    border-color: color-mix(in srgb, var(--accent) 34%, transparent);
    box-shadow: inset 0 1px 0 var(--glass-spec);
  }
  .caret { width: 10px; flex: none; font-size: 9px; color: var(--ink3); }
  .tname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cnt { flex: none; font-size: 10.5px; color: var(--ink3); font-family: var(--mono); }
  .cnt.zero { opacity: .4; }
  .selfb {
    flex: none; font-size: 10px; padding: 1px 7px; border-radius: 999px; color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 36%, transparent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }

  .t-proj { font-weight: 700; font-size: 12.5px; margin-top: 4px; }
  .t-proj .tpath { font-weight: 400; font-size: 10px; color: var(--ink3); font-family: var(--mono); }
  .t-proj { display: flex; align-items: center; gap: 6px; }
  .t-proj .caretbtn { width: 16px; flex: none; padding: 2px 0; border: 0; border-radius: 5px;
    background: transparent; color: var(--ink3); font-size: 9px; cursor: pointer; }
  .t-proj .caretbtn:hover { background: var(--fill-secondary); color: var(--ink); }
  .t-proj .namebtn { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px;
    padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer;
    color: inherit; font: inherit; font-weight: inherit; }
  .t-kind { padding-left: 16px; color: var(--ink2); font-size: 12px; }
  .t-con { padding-left: 30px; }
  .t-con .tname { font-family: var(--mono); font-size: 11.5px; }
  .t-gap { padding-left: 30px; }
  .t-gap .tname { font-size: 12px; color: var(--ink2); }
  .t-dir { padding-left: 14px; color: var(--ink2); font-size: 12px; position: relative; }
  .t-con { padding-left: 26px; font-size: 12.5px; }
  .t-con.on { background-color: var(--fill-selected); }
  .tdirname { font-size: 12px; font-weight: 500; }
  .t-dir .tdirname { font-family: var(--mono); font-size: 11px; }
  .t-dir .tfilen { font-family: var(--mono); font-size: 10.5px; color: var(--accent);
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-file { padding-left: 26px; color: var(--ink2); font-size: 11.5px; }
  .t-file .tname { font-family: var(--mono); font-size: 11px; }
  .t-con.inline { padding-left: 28px; }
  .t-gapband .tdirname { color: var(--bad); }
  .t-extband .tdirname { color: var(--ink3); }
  .t-gaphead { padding-left: 16px; cursor: default; color: var(--ink3); font-size: 12px; }
  .caret.hit { cursor: pointer; border-radius: 4px; }
  .caret.hit:hover { background: var(--fill-secondary); color: var(--ink); }
  .tree .trow.foc {
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border-color: color-mix(in srgb, var(--accent) 42%, transparent);
  }
  .gband.foc {
    border-color: color-mix(in srgb, var(--accent) 58%, transparent);
    background: radial-gradient(620px 300px at 90% -16%,
      color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%), var(--glass-thin);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent),
      var(--shadow-soft), inset 0 1px 0 var(--glass-spec);
  }
  .gband.dim { opacity: .38; }
  .gband { transition: opacity .18s ease, border-color .18s ease; }

  /* ---- 目录树：连接线（├ └ │ 用 CSS 画，跨过 padding 才连续）---- */
  .tree .trow { padding: 6px 8px; gap: 3px; margin-bottom: 0; }
  .tree .t-dir, .tree .t-file, .tree .t-con, .tree .t-gap,
  .tree .t-gapband, .tree .t-extband { padding-left: 8px; }
  /* 负 margin 要抵消 padding(6px) + 行 1px 透明边框，行高 31px 时才正好接上，
     否则每行之间会断 2px */
  .t-guides { flex: none; display: flex; align-self: stretch; margin: -7px 0; }
  .t-guides i { width: 13px; display: block; position: relative; }
  .t-guides i::before, .t-guides i::after {
    content: ''; position: absolute; background: var(--line2);
  }
  .t-guides i::before { left: 6px; width: 1px; top: 0; bottom: 0; }
  .t-guides i::after { left: 6px; right: 0; top: 50%; height: 1px; display: none; }
  .t-guides i.elbow::before { bottom: auto; height: 50%; }
  .t-guides i.tee::after, .t-guides i.elbow::after { display: block; }
  .t-guides i.blank::before, .t-guides i.blank::after { display: none; }
  /* 从图上跳到某个契约时，左侧树里闪一下，让人看到跳到哪了 */
  .trow.t-flash { animation: tflash 1.2s ease; }
  @keyframes tflash { 0% { background: color-mix(in srgb, var(--accent) 32%, transparent); }
    100% { background: transparent; } }
  .tree .t-con { font-size: 12px; }
  .tree .t-con .tname { font-size: 11.5px; }
  .t-sub { flex: none; font-size: 10px; color: var(--ink3); }
  .t-gaphead:hover { background: transparent; }

  /* 文件树两类行的图标（目录=文件夹轮廓，契约=文档）：都是 14px 见方、currentColor。
     两类行**必须同宽** —— 叶子行让出的箭头列（.tcol）加上这一列，叶子才和同级目录落在同一列网格上。
     用 SVG 不用字形：字形的宽度随字体变，13px 的网格会被撑歪。 */
  .tico { flex: none; width: 14px; height: 14px; display: inline-flex;
    align-items: center; justify-content: center; color: var(--ink3); }
  .tico svg { width: 14px; height: 14px; display: block; }
  /* 目录图标本身就是按钮（看这个目录的图）：一行里只留一个可点的图标 */
  .tico-btn { padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 5px;
    color: var(--ink2); opacity: .8; }
  .tico-btn:hover { background: var(--fill-secondary); color: var(--ink); opacity: 1; }
  .tico-btn.on { color: var(--accent); opacity: 1; }
  .t-dir .tico { color: var(--ink2); }
  /* ---- 语义族轴：族节点与目录节点共用同一套网格（箭头 13px + 图标 14px）----
     族的名字是人话（可视化 / 任务与运行），所以用界面字体；目录名是路径片段，用等宽。 */
  .t-fam { color: var(--ink2); }
  .t-fam .tdirname { font-family: var(--ui); font-size: 12px; font-weight: 600; }
  .t-fam .tico { color: var(--accent); }
  /* 范围行：左边树顶上"你现在看的是哪个范围"，与右边图第一条带同义。
     它不是分组，只是把"看的是哪儿"写出来，所以不可点、也不带箭头。 */
  .tscope { padding-left: 8px; color: var(--ink3); font-size: 11.5px; cursor: default; }
  .tscope:hover { background: transparent; }
  .tscope .tdirname { font-family: var(--mono); font-size: 11px; }
  .tscope .tpath { font-family: var(--mono); font-size: 10.5px; color: var(--ink3); }
  /* 来源摘要：这一组里的协议放在哪些目录（最多 2 处 + 等 N 处），全量在悬浮提示里 */
  .tsrc { flex: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-family: var(--mono); font-size: 10px; color: var(--ink3); }
  /* 叶子行让出的那一列：与 .tree .tcaret 同宽（13px），只为对齐存在，不画东西 */
  .tcol { flex: none; width: 13px; }
  /* 目录行右端的小按钮：点它才是「看这个目录的图」，点行本身是开合。 */
  .tgraph { flex: none; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 5px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--ink3); cursor: pointer; opacity: .65; }
  .tgraph svg { width: 12px; height: 12px; display: block; }
  .tgraph:hover { background: var(--fill-secondary); color: var(--ink); opacity: 1; }
  .tgraph.on { opacity: 1; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent); }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .d-ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .d-changed { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }
  .d-brk { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 26%, transparent), 0 0 0 4.5px color-mix(in srgb, var(--warn) 13%, transparent); }
  .d-bad { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent); }

  /* ============ 中间：一张卡片装下全部内容 ============ */
  .main {
    grid-area: main; display: flex; flex-direction: column;
    min-height: 0; overflow: hidden;
  }
  .content {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    padding: 22px 30px 0;
  }
  .scrollarea { flex: 1; min-height: 0; overflow: auto; padding-bottom: 30px;
    scrollbar-gutter: stable; }

  /* 内容卡顶部：也只有两行 —— 标题 / 说明 */
  .chead { flex: none; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .cline1 { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ctitle { font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: -.022em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back { flex: none; padding: 2px 8px; border: 0; border-radius: 7px; cursor: pointer;
    background: transparent; color: var(--accent); font-family: var(--mono); font-size: 11.5px; }
  .back:hover { background: var(--fill-secondary); }
  .cline2 { display: flex; align-items: baseline; gap: 14px; margin-top: 5px; }
  .cdesc { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink2); }
  .cmeta2 { flex: none; font-size: 11px; color: var(--ink3); font-family: var(--mono); }

  /* 区段：靠间距分节，不画线——块之间那条横线是「多余的分割线」的典型 */
  .block { margin-top: 26px; padding-top: 22px; }
  .scrollarea > .block:first-child { margin-top: 0; padding-top: 0; }

  /* 两个标记互相独立，都没有就什么都不画：
     变过 = 相对基线版本有改动；不符 = 观测到与契约不合 */
  .facts { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; flex: none; white-space: nowrap;
    font-family: var(--ui); font-size: 11px; font-weight: 500; line-height: 1.6;
    padding: 1px 8px; border-radius: 999px; }
  .chip-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 45%, transparent); }
  .chip-warn.brk { font-weight: 700; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--warn) 80%, transparent); }
  .chip-bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bad) 45%, transparent); }
  .chip-gap { color: var(--bad); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bad) 45%, transparent); }
  .chip-dim { color: var(--ink3); box-shadow: inset 0 0 0 1px var(--line2); }

  .bh { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .bh h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; }
  .bh .sub { font-size: 11px; color: var(--ink3); font-family: var(--mono); }

  /* 结论：每张卡片底部那句人话，做成玻璃内嵌条 */
  .verdict {
    margin-top: 18px; padding: 2px 0 2px 14px; font-size: 13px; color: var(--ink);
    border-left: 2px solid var(--line2);
  }
  .verdict.bad  { border-left-color: var(--bad); }
  .verdict.warn { border-left-color: var(--warn); }

  /* 表 */
  table.f { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.f th { text-align: left; font-weight: 600; font-size: 10.5px; letter-spacing: .06em;
    color: var(--ink3); padding: 0 12px 7px 0; border-bottom: 1px solid var(--line); }
  table.f td { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.f tr:last-child td { border-bottom: none; }
  .mono { font-family: var(--mono); }
  .dir { font-size: 10.5px; letter-spacing: .06em; color: var(--ink3); margin: 14px 0 7px; }
  .req { color: var(--bad); font-weight: 600; }
  .opt { color: var(--ink3); font-size: 11px; }
  .ttype { color: var(--accent); }

  /* ---------- schema 页下半部分：左图（小）/ 右表（大），中间一根可拖的分隔条 ----------
     比例由 JS 写到 --ss-left 上（默认 38%），并记进 localStorage —— 一个人把图拉宽过一次，
     下次打开就该还是宽的：这个面板没有"设置"页，控件自己记住自己的样子。 */
  .ssplit {
    display: grid; align-items: stretch;
    grid-template-columns: var(--ss-left, 38%) 9px minmax(0, 1fr);
    margin: 0 0 18px;
  }
  .sspane {
    display: flex; flex-direction: column; min-width: 0; overflow: hidden;
    border: 1px solid var(--line); border-radius: var(--r-md); background: var(--glass-thin);
  }
  /* 这里原先有 `.sshead`（卡片标头：`h3` + 右侧计数小字）。标头已整块删掉——它只是把下面
     的内容再说一遍。计数没有丢，改由内容自己承担：左边是「进来什么 · N 条 / 出去什么 · M 条」
     两行小节标题，右边是每张表上方的「输入/输出 · N 条 · X 条有中文」。 */
  /* 两侧各自滚动：图再长也不会把表推到屏幕外，表再长也不会顶走图。 */
  .ssbody { flex: 1; min-height: 0; overflow: auto; padding: 12px 13px 14px; max-height: var(--ss-h); }
  .ssbody > .block:first-child { margin-top: 0; }
  /* 字段区（右）：不要外层滚动。一列 flex，输入/输出各是一个可伸缩小节，
     小节里那张表是它自己唯一的滚动容器——里外两层滚动条打架是之前最大的设计错。 */
  .ssbody.ssflex { display: flex; flex-direction: column; gap: 12px; overflow: hidden;
    max-height: var(--ss-h); }
  .ssbody.ssflex > .fsec { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .ssbody.ssflex > .fsec > .fscroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .ssbody.ssflex > .fsec > .fhost { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .ssbody.ssflex > .note, .ssbody.ssflex > .empty { flex: none; }
  /* 分隔条：平时一根发丝线，hover / 拖动 / 键盘聚焦时亮成强调色。9px 的整条都能抓。 */
  .ssbar { position: relative; cursor: col-resize; }
  .ssbar::before { content: ''; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px;
    background: var(--line2); transition: background .13s ease; }
  .ssbar:hover::before, .ssbar.on::before { left: 3px; width: 3px; border-radius: 2px; background: var(--accent); }
  .ssbar:focus-visible { outline: none; }
  .ssbar:focus-visible::before { left: 3px; width: 3px; border-radius: 2px; background: var(--accent); }

  /* ---------- 字段表：吸顶表头 + 极淡斑马 + hover，字段名等宽、类型做成彩色 chip ----------
     颜色全部由现有 token 做 color-mix（和 .tone-* 那套同一手法），不新造色板。

     两条渲染路径共用这一套皮：默认走组件版（`advFieldTable` → Tabulator，见下面「组件版」一节，
     容器是 `.fadv`），组件没加载出来时退化成静态 `table.ft`。所以下面凡是画"格子里的东西"的
     选择器（.fname / .fchip / .freq / .fstat / .fzh）都同时认这两个作用域。 */
  /* 静态表：定宽列 + 横向滚动 + 首列固定。
     min-width 取列宽之和（260+340+100+360+120 = 1340，与 JS 里那份 FT_COLS 同一份规格），
     窗格更窄时就会出横向滚动条；table-layout:fixed 让各列按 colgroup 的宽度分配，
     首列不再被长类型/长解释挤成一条缝。
     首列必须给不透明底色，否则横向滚动时后面的单元格会从它底下透过来。 */
  /* 表格：列宽由 JS 实测后**内联**写死（`ftStaticTable` 给 width/min-width），
     所以这里不能再钉一个固定宽度——否则 CSS 会跟内联值打架，又变成"显示宽度≠真实宽度"。
     table-layout:fixed 让各列严格按 colgroup 的宽度分配；窗格装不下就横向滚动。 */
  table.ft { width: 100%; table-layout: fixed;
    border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
  table.ft thead th:first-child, table.ft td:first-child {
    position: sticky; left: 0; z-index: 3;
    /* 与组件版同一手法：不透明底 + 一层霜（见 `.fadv` 上的 --frost），否则横滚时下面的字会透上来。 */
    background-color: var(--surface-solid);
    box-shadow: 1px 0 0 var(--line); }
  /* 固定列跟着行底色走，否则整列会在斑马/悬停行上跳出来。 */
  table.ft tbody tr:nth-child(even) td:first-child {
    background-color: color-mix(in srgb, var(--ink) 3%, var(--surface-solid)); }
  table.ft tbody tr:hover td:first-child {
    background-color: color-mix(in srgb, var(--accent) 7%, var(--surface-solid)); }
  table.ft thead th:first-child { z-index: 4; }
  table.ft thead th { position: sticky; top: 0; z-index: 2; text-align: left; white-space: nowrap;
    padding: 7px 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; color: var(--ink3);
    background: color-mix(in srgb, var(--glass-thin) 76%, var(--bg));
    border-bottom: 1px solid var(--line2); }
  table.ft td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.ft tbody tr:nth-child(even) { background: color-mix(in srgb, var(--ink) 3%, transparent); }
  table.ft tbody tr:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  table.ft tbody tr:last-child td { border-bottom: none; }
  /* 字段名：贴合内容——短名字一行，长名字折行显示完，**绝不裁剪、不用省略号**。
     列宽有上限（460），所以长名字宁可折行，也不把整张表顶出横向滚动条。 */
  table.ft .fname, .fadv .fname { display: block; font-family: var(--mono); font-size: 12px;
    white-space: normal; overflow-wrap: anywhere; width: auto; }
  table.ft .fnote, .fadv .fnote { display: block; margin-top: 2px; font-size: 10.5px; color: var(--ink3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.ft .fzh, .fadv .fzh { color: var(--ink3); font-size: 11.5px; line-height: 1.52; overflow-wrap: anywhere; }
  /* 数字列右对齐（长度/字节/数量这类）。等宽数字，位数对齐了才好扫。 */
  table.ft td.fnum { text-align: right; font-variant-numeric: tabular-nums; }
  /* 长文本一律截断 + 原生 title（机器文本：字段名 / 类型 / 备注）；中文解释要能读完，所以换行不截。 */
  .ftrunc { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 类型 chip：一族一色相，色相由 --fc-hue 给，边框/底色/文字都从它 mix 出来。 */
  .fchip { display: inline-block; max-width: 100%; font-family: var(--mono); font-size: 10.5px;
    line-height: 1.6; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    color: color-mix(in srgb, var(--fc-hue) 58%, var(--ink));
    background: color-mix(in srgb, var(--fc-hue) 13%, transparent);
    border: 1px solid color-mix(in srgb, var(--fc-hue) 36%, transparent); }
  .fchip-string  { --fc-hue: var(--accent); }
  .fchip-number  { --fc-hue: var(--ok); }
  .fchip-boolean { --fc-hue: color-mix(in srgb, var(--accent) 42%, var(--bad)); }
  .fchip-array   { --fc-hue: color-mix(in srgb, var(--ok) 46%, var(--accent)); }
  .fchip-object  { --fc-hue: color-mix(in srgb, var(--accent) 62%, var(--ink3)); }
  .fchip-enum    { --fc-hue: var(--warn); }
  .fchip-null    { --fc-hue: color-mix(in srgb, var(--ink3) 70%, var(--ink)); }
  .fchip-unknown { --fc-hue: var(--ink3); }
  /* 必填 / 可选：必填一根实心强调色竖条，可选一根更淡的——不靠颜色深浅猜，形状就不一样。 */
  .freq { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink2); white-space: nowrap; }
  .freq::before { content: ''; flex: none; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); }
  .freq.is-opt { color: var(--ink3); }
  .freq.is-opt::before { height: 7px; background: color-mix(in srgb, var(--ink3) 50%, transparent); }
  /* 状态列：点复用既有的 d-bad / d-changed（同一套状态色，不另起一套）。 */
  .fstat { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; white-space: nowrap; color: var(--ink2); }
  .fstat .dot { align-self: center; }

  /* ---------- 组件版字段表（Tabulator）：把组件默认外观压回面板这套 token ----------
     组件自带一套"灰蓝默认主题"（`.tabulator` 底 #888、行 #f3f3f3 还带 !important），
     不清掉它这块表就不像这个面板里的东西。这里只做**覆盖**，不动结构：颜色一律从现有 token
     mix 出来，所以明暗两套主题只换 token、不换选择器（`body.dark` 那份变量一改，这里自动跟着走，
     不必重画表格——这是当初没有写死色值的回报）。作用域锁在 `.fadv` 里，不影响别处。 */
  .fadv { min-width: 0; }
  /* 组件没加载出来时的说明行。不静默失败：表还在，但得让人知道它是次一档的静态表。 */
  .fadv-note { margin: 0 0 6px; font-size: 10.5px; color: var(--ink3); }
  /* 外框与底色：卡片自己已经有边框和玻璃底，组件那层 #888 底 + 灰框必须去掉。 */
  .fadv .tabulator { border: none; background: transparent; border-radius: 0;
    font-size: 12.5px; color: var(--ink); }
  .fadv .tabulator .tabulator-tableholder .tabulator-table { background: transparent; color: inherit; }
  /* 表头：和静态表那行吸顶 th 同一套色——两条渲染路径画出来应当看不出区别。 */
  .fadv .tabulator .tabulator-header { background: transparent; border-bottom: 1px solid var(--line2);
    color: var(--ink3); font-weight: 600; }
  .fadv .tabulator .tabulator-header .tabulator-col { background: transparent; border-right: none;
    font-size: 10.5px; font-weight: 600; letter-spacing: .06em; }
  .fadv .tabulator .tabulator-header .tabulator-col .tabulator-col-content { padding: 7px 10px; }
  .fadv .tabulator .tabulator-header .tabulator-col.tabulator-sortable.tabulator-col-sorter-element:hover {
    background: color-mix(in srgb, var(--accent) 8%, transparent); }
  /* 排序箭头：组件按 aria-sort 三态写死了三种灰（#bbb/#555/#666），暗色主题下几乎看不见。
     要盖住那些带 `[aria-sort=…]` 的规则，只能对等地用 !important——只限颜色这一项。
     升序只有 border-bottom 有样式、降序只有 border-top，所以两条写在一起也不会互相碍事。 */
  .fadv .tabulator .tabulator-header .tabulator-col .tabulator-col-sorter .tabulator-arrow {
    border-bottom-color: var(--line2) !important; border-top-color: var(--line2) !important; }
  .fadv .tabulator .tabulator-header .tabulator-col[aria-sort="ascending"] .tabulator-col-sorter .tabulator-arrow,
  .fadv .tabulator .tabulator-header .tabulator-col[aria-sort="descending"] .tabulator-col-sorter .tabulator-arrow {
    border-bottom-color: var(--accent) !important; border-top-color: var(--accent) !important; }
  /* 拖列宽的手柄：平时看不见，hover 时亮成强调色（和分隔条 `.ssbar` 一个语言：能拖的东西要抓得住）。 */
  .fadv .tabulator .tabulator-col-resize-handle:hover { background: var(--accent); opacity: .35; border-radius: 2px; }
  /* 行：组件给行底色时用了 !important（#f3f3f3 / 偶数行 #efefef），压掉它也得 !important；
     斑马与 hover 的 mix 比例和静态表完全一致。 */
  .fadv .tabulator .tabulator-row { background: transparent !important; color: var(--ink);
    border-bottom: 1px solid var(--line); }
  .fadv .tabulator .tabulator-row.tabulator-row-even {
    background: color-mix(in srgb, var(--ink) 3%, transparent) !important; }
  .fadv .tabulator .tabulator-row:hover {
    background: color-mix(in srgb, var(--accent) 7%, transparent) !important; }
  .fadv .tabulator .tabulator-row:last-child { border-bottom: none; }
  /* 单元格：和静态表的 td 同内距。只有中文解释那列换行读完（`cellwrap`），其余一律单行截断，
     长的机器文本靠原生 title 悬浮——和静态表那套 `.ftrunc` 的分工一样。 */
  .fadv .tabulator .tabulator-row .tabulator-cell { padding: 7px 10px; border-right: none;
    vertical-align: top; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fadv .tabulator .tabulator-row .tabulator-cell.cellwrap {
    white-space: normal; overflow: visible; text-overflow: clip; }
  /* 字段名：折行显示完（组件默认格子是 nowrap+ellipsis，会把长名字切成省略号）。 */
  .fadv .tabulator .tabulator-row .tabulator-cell.cellname { white-space: normal; overflow-wrap: anywhere; }
  /* 首列固定：组件给 `.tabulator-frozen` 的只是 `background-color:inherit`，而行底色是半透明的，
     横滚时后面的格子会从它底下透过来。所以这里给**不透明**底色（底色 + 霜，见上面的 --frost），
     并补一根右侧发丝线；偶数行 / hover 行各换一层霜，不透明那层不动。 */
  .fadv .tabulator .tabulator-header .tabulator-frozen,
  .fadv .tabulator .tabulator-row .tabulator-cell.tabulator-frozen {
    background-color: var(--surface-solid);
    border-right: none; box-shadow: 1px 0 0 var(--line); }
  .fadv .tabulator .tabulator-row.tabulator-row-even .tabulator-cell.tabulator-frozen {
    background-color: color-mix(in srgb, var(--ink) 3%, var(--surface-solid)); }
  .fadv .tabulator .tabulator-row:hover .tabulator-cell.tabulator-frozen {
    background-color: color-mix(in srgb, var(--accent) 7%, var(--surface-solid)); }
  /* 空表占位（正常不会走到：没字段时外面就先说了"没有记录到字段"）。 */
  .fadv .tabulator .tabulator-placeholder .tabulator-placeholder-contents {
    color: var(--ink3); font-size: 12.5px; font-weight: 400; }

  /* 改动行 */
  .row { display: grid; grid-template-columns: 116px minmax(0,1fr) auto; gap: 12px;
    align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .when { display: flex; align-items: baseline; gap: 7px; white-space: nowrap;
    font-family: var(--mono); font-size: 11px; color: var(--ink3); }
  .when .sha { font-family: var(--mono); font-size: 10.5px; color: var(--ink2); }
  .when .at { font-size: 10.5px; color: var(--ink3); }
  .row.old .when, .row.old .what { opacity: .55; }
  .oldnote { margin: 10px 0 2px; font-size: 11px; color: var(--ink3); }
  /* 对比条：左边是什么，右边是什么 */
  .cmp { display: inline-flex; align-items: baseline; gap: 7px; font-size: 11.5px; }
  .cmp .k { font-size: 10.5px; color: var(--ink3); }
  .cmp .arrow { color: var(--ink3); }
  .cmp code { font-family: var(--mono); font-size: 11px; color: var(--ink2); }
  .what { font-size: 12.5px; }
  .what code { font-family: var(--mono); font-size: 11.5px; }
  .tag { font-size: 10.5px; padding: 2px 9px; border-radius: 999px; white-space: nowrap;
    border: 1px solid var(--glass-edge-soft); color: var(--ink3); background: var(--glass-thin); }
  .tag.bad  { color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 40%, transparent);
    background: color-mix(in srgb, var(--bad) 12%, transparent); }
  .tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent);
    background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .tag.ok   { color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 40%, transparent);
    background: color-mix(in srgb, var(--ok) 12%, transparent); }

  /* 调用 */
  .call { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .call:last-child { border-bottom: none; }
  .call-h { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .call-who { font-family: var(--mono); font-size: 12px; }
  .finding { margin: 8px 0 0 14px; padding: 8px 0 8px 12px; font-size: 12px; color: var(--ink2);
    border-left: 3px solid var(--bad); border-radius: 0 var(--r-sm) var(--r-sm) 0;
    background: color-mix(in srgb, var(--bad) 8%, transparent); }
  .finding.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); }
  .finding b { color: var(--ink); font-weight: 600; }
  .finding code { font-family: var(--mono); font-size: 11.5px; }

  .empty { padding: 44px 0; color: var(--ink3); }
  .note { font-size: 12px; color: var(--ink2); margin-bottom: 12px; }

/* ---------- 纳管向导：左选项目 / 右选目录 ----------
     纳管的粒度是目录：人说得出口的是"src/pages 那一坨先别管"，不是在 1400 条候选里点 300 次。
     所以这一屏只有两栏、两种行——左栏项目、右栏目录；单条候选只在「看候选」里露一眼，不参与勾选。 */
  .sheet.wide { width: min(1060px, 100%); }
  .two { display: grid; grid-template-columns: minmax(188px, 248px) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 780px) { .two { grid-template-columns: minmax(0, 1fr); } }
  .wcol, .dcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .dcol > .dbox { flex: 1; }

  /* 左栏 · 项目：一行 = 标题 + 根路径 + 这个项目有多少候选（没扫过就照实写"待扫描"） */
  .wlist { max-height: 54vh; overflow: auto; border: 1px solid var(--line2); border-radius: var(--r-sm); }
  .wlist .empty { padding: 14px; }
  .wrow { display: block; width: 100%; text-align: left; padding: 8px 10px; font: inherit;
    background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--ink);
    cursor: pointer; }
  .wrow:last-child { border-bottom: 0; }
  .wrow:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .wrow.on { background: var(--fill-selected); box-shadow: inset 2px 0 0 var(--accent); }
  .wrow .wt { display: flex; align-items: baseline; gap: 7px; }
  .wrow .wn { flex: 1; min-width: 0; font-weight: 600; font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrow .wc { flex: none; font-size: 10.5px; color: var(--ink3); font-family: var(--mono); }
  .wrow.on .wc { color: var(--ink2); }
  .wrow .wp { display: block; margin-top: 2px; font-size: 10.5px; color: var(--ink3);
    font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 右栏 · 目录：一棵从候选文件路径推出来的目录树，行只有目录，没有单条 schema */
  .dbox { display: flex; flex-direction: column; min-width: 0; min-height: 260px;
    border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--glass-thin);
    overflow: hidden; }
  .dprefix { display: flex; align-items: baseline; gap: 8px; padding: 9px 10px 0;
    font-size: 10.5px; color: var(--ink3); font-family: var(--mono); }
  .dprefix .dp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dbar { flex: none; padding: 8px 10px 9px; border-bottom: 1px solid var(--line2);
    background: color-mix(in srgb, var(--glass-regular) 88%, transparent);
    box-shadow: inset 0 1px 0 var(--glass-edge-soft); }
  .drows { max-height: 46vh; overflow: auto; padding: 4px 5px 6px; }
  /* 目录行的缩进交给 t-guides 的竖线（每级 13px），箭头绝对定位在自己那一列（--ind）、不占流内宽度；
     padding-left 留出箭头这一列，否则 0 层的箭头会和复选框叠在一起。 */
  .drow { padding-left: 22px; }
  .drow .dname { flex: 0 1 auto; min-width: 0; font-family: var(--mono); font-size: 11.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drow .dpath { flex: 1 1 auto; min-width: 0; font-size: 10px; color: var(--ink3);
    font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drow.on { background: var(--fill-selected); }
  .drow .pkbtn { flex: none; font-size: 10.5px; padding: 1px 8px; opacity: .75; }
  .drow:hover .pkbtn { opacity: 1; }
  .dpeek { margin: 2px 0 6px 22px; border-left: 2px solid var(--line2); }
  .dpeek .pk { display: flex; align-items: baseline; gap: 8px; padding: 2px 0 2px 9px;
    font-size: 11.5px; color: var(--ink2); }
  .dpeek .pk .k { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dpeek .pk .f { flex: none; font-family: var(--mono); font-size: 10px; color: var(--ink3); }
  .dfoot { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px;
    border-top: 1px solid var(--line2);
    background: color-mix(in srgb, var(--glass-regular) 88%, transparent); }
  .dfoot .dsum { margin-right: auto; font-size: 11.5px; color: var(--ink2); }
  .dfoot .dsum b { font-family: var(--mono); font-weight: 600; color: var(--ink); }
  .dnote { flex: none; padding: 8px 10px 0; font-size: 11px; color: var(--ink3); }
  .dhint { padding: 0 2px; font-size: 11px; color: var(--ink3); }
  .dmore { padding: 6px 11px 8px; }

  /* 操作条 / 批量按钮 / 就地报错：两栏共用这一套，别再造第二种长相 */
  .pkrow1 { display: flex; align-items: center; gap: 8px; }
  .pkrow1 .search { flex: 1; min-width: 0; }
  .pkrow2 { display: flex; align-items: center; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .pkbtn { font: inherit; font-size: 11.5px; color: var(--ink2); cursor: pointer;
    padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line2);
    background: transparent; }
  .pkbtn:hover { color: var(--ink); background: var(--fill); }
  .pkhint { font-size: 11px; color: var(--ink3); margin-left: auto; }
  .pkerr { font-size: 11.5px; color: var(--bad); }


  /* ============ 项目关系图 ============ */
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
    margin-bottom: 14px; font-size: 11.5px; color: var(--ink2); }
  .legend .li { display: inline-flex; align-items: center; gap: 6px; }
  .legend .ls { width: 20px; height: 0; border-top: 2px solid currentColor; flex: none; }
  .legend .ls.dash { border-top-style: dashed; }
  .legend .lsep { width: 1px; height: 14px; background: var(--line2); }
  .legend .lgl { font-size: 11px; color: var(--ink3); }

  /* 图直接落在内容卡上，不再套一层 */
  .graphwrap { width: fit-content; max-width: 100%; overflow: auto; margin: 0 auto; }
  /* .graph 是定位基准：归属带与卡片都是 absolute，坐标由布局引擎算好后写进 style。
     目录图与形状图共用这一层，不再有"流式"的旁路。 */
  .graph { position: relative; }

  /* 聚焦时：不在焦点里的卡片直接糊掉（不加任何遮罩层） */
  .gnode.blurcard { filter: blur(2.6px); opacity: .3; }

  /* 归属框：目录 / 外部 / 缺契约 */
  .gband { position: absolute; border-radius: var(--r-lg);
    border: 1px solid var(--k-line); background: var(--fill-secondary); }
  .gband.ext { border-style: dashed; }
  .gband.gaps { border-color: color-mix(in srgb, var(--bad) 34%, transparent);
    background: color-mix(in srgb, var(--bad) 6%, var(--fill-secondary)); }
  .gbandhead { position: absolute; left: 16px; top: 9px; right: 16px;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .gbandhead > * { flex: none; }
  .gbandicon { font-size: 10px; line-height: 1; color: var(--k-icon); }
  .gbandname { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--ink); }
  .gbandnote { font-size: 10.5px; color: var(--ink3); }
  /* 带里的协议放在哪些目录：与左树族节点上那句同源，一眼对上"这一族 = 哪几处文件" */
  .gbandsrc { font-family: var(--mono); font-size: 10px; color: var(--ink3); }
  .gbandcount { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink3); }
  .gfilehead { position: absolute; left: 16px; right: 16px; font-family: var(--mono);
    font-size: 10.5px; color: var(--ink3); overflow-wrap: anywhere; }
  .gnode.planned { border-style: dashed; }
  .graph svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  /* 节点类型色：tone 名由 JS 里那张唯一的 kind 登记表（KIND_REGISTRY）给出，
     这里只把 tone 翻成四个主题变量（卡面底色 / 边框 / 名称色 / 副标题色 + 图标色）。
     带也走同一套变量（目录图里的带就是目录），只染边框和图标，不铺满色块。
     全部用现有 token 做 color-mix，浅色深色共用同一套规则，不写第二份深色色值。 */
  .gnode, .gband {
    --k-hue: var(--ink3);
    --k-bg: color-mix(in srgb, var(--k-hue) 22%, var(--glass-thin));
    --k-line: color-mix(in srgb, var(--k-hue) 58%, var(--glass-edge-soft));
    --k-name: color-mix(in srgb, var(--k-hue) 60%, var(--ink));
    --k-sub: color-mix(in srgb, var(--k-hue) 54%, var(--ink3));
    --k-icon: color-mix(in srgb, var(--k-hue) 82%, transparent);
  }
  /* 协议词汇：项目（蓝）/ 协议族（绿）/ 协议（紫）/ 字段（青）/ 缺口（红）/ 未登记（灰）。
     五个概念的色相彼此分开，浅色深色共用同一套 color-mix 规则。 */
  .tone-project { --k-hue: var(--accent); }
  .tone-domain { --k-hue: var(--ok); }
  .tone-protocol { --k-hue: color-mix(in srgb, var(--accent) 42%, var(--bad)); }
  .tone-part { --k-hue: color-mix(in srgb, var(--ok) 46%, var(--accent)); }
  .tone-gap { --k-hue: var(--bad); }
  .tone-neutral { --k-hue: var(--ink3); }
  .gnode {
    position: absolute; margin: 0; display: flex; align-items: center; gap: 8px; text-align: left;
    padding: 7px 10px; cursor: pointer; overflow: hidden;
    border-radius: var(--r-md); border: 1px solid var(--k-line);
    background: var(--k-bg); box-shadow: inset 0 1px 0 var(--glass-spec);
    transition: transform .16s ease, background .16s ease, border-color .16s ease;
  }
  .gnode:hover { transform: translateY(-1px);
    background: color-mix(in srgb, var(--k-hue) 20%, var(--k-bg));
    border-color: var(--k-name); }
  .gnode.on { border-color: color-mix(in srgb, var(--k-hue) 62%, transparent);
    background: color-mix(in srgb, var(--k-hue) 24%, var(--k-bg)); }
  .gnode .gtext { flex: 1; min-width: 0; }
  .gnode .gicon { flex: none; font-size: 10px; line-height: 1; color: var(--k-icon); }
  .gnode .gname { font-family: var(--mono); font-size: 11px; line-height: 1.32;
    overflow-wrap: anywhere; color: var(--k-name); }
  .gnode .gkind { display: block; margin-top: 2px; font-size: 9.5px; color: var(--k-sub); }
  /* 缺口：虚线 + 红边。虚不虚线由登记表的 dashed 决定，颜色跟着 tone-bad 走 */
  .gnode.gapnode { border-style: dashed; }

  /* ============ 讨论锚点 ============ */
  .ov { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 24px;
    background: rgba(20,22,32,.34); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .ov.open { display: grid; }
  .sheet { width: min(720px,100%); max-height: 84vh; overflow: auto;
    border-radius: var(--r-lg); border: 1px solid var(--glass-edge);
    background: var(--glass-regular); box-shadow: var(--shadow);
    backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8); }
  .sheet-h { display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 18px; }
  .sheet-t { font-weight: 700; font-size: 14px; }
  .sheet-b { padding: 4px 20px 20px; }
  .an { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 5px; }
  .an:last-child { border-bottom: none; }
  .an-q { font-weight: 600; font-size: 13px; }
  .an-a { font-size: 12.5px; color: var(--ink2); }
  .an-a code { font-family: var(--mono); font-size: 11.5px; color: var(--ink); }
  .an-o { font-size: 12px; color: var(--ink3); }
  .an-o b { color: var(--ink2); font-weight: 500; }

  /* ============ 降级与自适应 ============ */
  @media (prefers-reduced-transparency: reduce) {
    .card, .search, .ghost, .seg, .sheet, .ov {
      background: var(--glass-regular); backdrop-filter: none; -webkit-backdrop-filter: none; }
    .liquid { display: none; }
    .chead, .block { background: transparent; }
  }
  @media (prefers-contrast: more) {
    :root { --line: rgba(60,60,67,.3); --ink2: rgba(50,50,60,.88); }
    body.dark { --line: rgba(235,235,245,.3); --ink2: rgba(235,235,245,.9); }
    .chead, .block { box-shadow: var(--shadow-soft), inset 0 0 0 1px var(--line2); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    .liquid span { animation: none; }
  }
  @media (max-width: 860px) {
    body { overflow: auto; }
    .stage {
      height: auto; min-height: 100vh; padding: 10px; gap: 10px;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr);
      grid-template-areas: "head" "side" "main";
    }
    .tree { max-height: 38vh; }
    .main { min-height: 62vh; }
    .content { padding: 18px 16px 56px; }
    .subtitle { display: none; }
  }

  /* ---------- 生成：侧边栏那一个入口 + 它的选择弹窗 ----------
     用户的原话是"重新扫描 / 重新生成 / AI 理解完全是重复的"，所以侧边栏只有一个按钮，
     点开是一个弹窗：这次要重新生成什么，勾完再点"开始生成"。样式沿用面板既有的玻璃语言
     （--glass-* / --accent / --bad），浅色深色共用一套，不再写第二份深色色值。 */
  .genbtn {
    display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%;
    padding: 8px 12px; cursor: pointer; font-family: var(--ui); font-size: 12.5px; font-weight: 600;
    color: var(--accent); border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    box-shadow: inset 0 1px 0 var(--glass-spec);
    transition: background .18s ease, color .18s ease;
  }
  .genbtn:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
