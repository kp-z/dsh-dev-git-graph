        if (n.name.toLowerCase().indexOf(s) !== -1) { out.push(n); return; }
        walk(n);
      });
    })(tree);
    return out;
  }

  function pickCount(items, picked) {
    var n = 0;
    items.forEach(function (c) { if (picked[c.id]) n += 1; });
    return n;
  }

  /* 三态一次算完：每个目录的 sel = 子树里勾上了多少条候选。
     界面上所有"全选 / 部分 / 未选"都读它，不在渲染里各算一遍。 */
  function markSel(node, pk) {
    var sel = pickCount(node.items, pk.picked);
    kidNames(node).forEach(function (k) { sel += markSel(k.node, pk); });
    node.sel = sel;
    return sel;
  }

  /* 勾一个目录 = 连它下面的子目录一起勾 / 一起取消。 */
  function setDir(node, on) {
    var pk = S.pick;
    node.items.forEach(function (c) { pk.picked[c.id] = on; });
    kidNames(node).forEach(function (k) { setDir(k.node, on); });
  }

  /* 只重画清单本体与底部计数，顶栏（有搜索框）不重画，否则每敲一个字就丢一次焦点。 */
  function renderDirRows() {
    var box = $('#dRows'), pv = S.init, pk = S.pick;
    if (!box || !pv || !pk) return;
    var tree = buildPickTree(pv.candidates || []);
    markSel(tree, pk);
    var tops = listed(tree, pk);
    var budget = pk.all ? Infinity : DIR_CAP;
    var st = { shown: 0, hidden: 0 };
    clear(box);
    tops.forEach(function (n) { dirRow(box, n, 0, pk, st, budget, !!String(pk.q || '').trim()); });
    if (st.hidden > 0) box.appendChild(moreRow(st.hidden));
    if (!box.firstChild) {
      box.appendChild(el('div', { class: 'empty', style: 'padding:16px', text: '没有匹配的目录。' }));
    }
    syncDirFoot(tree, pk);
  }

  /* 一行目录：三态复选框 + 目录名 + （过滤时）它住在哪 + 计数 + 「看候选」。
     行只到目录这一层——单条 schema 不进这个列表。 */
  function dirRow(box, node, depth, pk, st, budget, filtering) {
    var key = 'd:' + node.path + '/' + node.name;
    var opened = pk.open[key] !== false;      // 默认展开，折起来是人的动作
    // 封顶之后不再画，但**继续往下数**：只数到一半，"还有 N 行没展开"就是句谎话。
    if (st.shown >= budget) {
      st.hidden += 1;
      if (!opened) return;
      kidNames(node).forEach(function (k) {
        dirRow(box, k.node, depth + 1, pk, st, budget, filtering);
      });
      return;
    }
    st.shown += 1;
    var deep = Object.keys(node.kids).length > 0;
    var caret = el('span', { class: 'tcaret', text: deep ? (opened ? '▾' : '▸') : '' });
    caret.addEventListener('click', function (e) {
      e.stopPropagation();
      pk.open[key] = !opened;
      renderDirRows();
    });
    var boxel = el('input', { type: 'checkbox', title: '勾上 = 连这个目录下面的子目录一起纳管' });
    boxel.checked = node.n > 0 && node.sel === node.n;
    boxel.indeterminate = node.sel > 0 && node.sel < node.n;
    boxel.addEventListener('click', function (e) { e.stopPropagation(); });
    boxel.addEventListener('change', function () { setDir(node, boxel.checked); renderDirRows(); });

    var row = el('div', { class: 'trow drow t-dir', title: (node.path ? node.path + '/' : '') + node.name },
      guidesOf(depth),
      caret,
      boxel,
      el('span', { class: 'dname', text: node.name }),
      el('span', { class: 'dpath', text: filtering ? (node.path || '（项目根）') : '' }),
      el('span', { class: 'cnt dcount' + (node.sel === 0 ? ' zero' : ''),
        text: node.sel > 0 ? node.sel + ' / ' + node.n : String(node.n) }),
      peekChip(node, pk));
    row.style.setProperty('--ind', (depth === 0 ? 8 : 23 + 13 * (depth - 1)) + 'px');
    row.addEventListener('click', function () {
      boxel.checked = !boxel.checked;
      setDir(node, boxel.checked);
      renderDirRows();
    });
    box.appendChild(row);
    if (!opened) return;
    if (pk.peek[key]) peekRows(box, node, pk);
    kidNames(node).forEach(function (k) {
      dirRow(box, k.node, depth + 1, pk, st, budget, filtering);
    });
  }

  /* 「看候选」是次要入口：默认不展开，展开也不参与勾选——勾选只认目录。 */
  function peekChip(node, pk) {
    var key = 'd:' + node.path + '/' + node.name;
    var b = el('button', { class: 'pkbtn', type: 'button',
      text: pk.peek[key] ? '收起' : '看候选' });
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      pk.peek[key] = !pk.peek[key];
      renderDirRows();
    });
    return b;
  }

  function peekRows(box, node, pk) {
    node.items.slice(0, PEEK_MAX).forEach(function (c) {
      box.appendChild(el('div', { class: 'dpeek' },
        el('div', { class: 'pk' },
          el('span', { class: 'k', text: c.title }),
          el('span', { class: 'f', text: c.boundaryKind }),
          el('span', { class: 'f',
            text: (c.file || '') + (c.evidence && c.evidence.line ? ' : ' + c.evidence.line : '') }))));
    });
    if (node.items.length > PEEK_MAX) {
      box.appendChild(el('div', { class: 'dpeek' },
        el('div', { class: 'pk',
          text: '只列了前 ' + PEEK_MAX + ' 条，这一层还有 ' + (node.items.length - PEEK_MAX) + ' 条。' })));
    }
    if (!node.items.length) {
      box.appendChild(el('div', { class: 'dpeek' },
        el('div', { class: 'pk', text: '这一层没有直接的候选，都在它下面的子目录里。' })));
    }
  }

  /* 封顶：一屏最多铺 80 行，其余一次展开——和上一版候选清单同一个口径。
     "还有 N 行"说的是**行**，不是目录个数：目录个数取决于此刻展开了几层，写死在文案里就会说谎。 */
  function moreRow(hidden) {
    var more = el('button', { class: 'hotmore', type: 'button', text: '展开其余 ' + hidden + ' 行' });
    more.addEventListener('click', function () { S.pick.all = true; renderDirRows(); });
    return el('div', { class: 'dmore' },
      el('div', { style: 'font-size:11px;color:var(--ink3);padding-bottom:6px',
        text: '先铺前 ' + DIR_CAP + ' 行，还有 ' + hidden + ' 行没展开；'
          + '用上面的搜索框，或把目录折起来，更快找到目标。' }),
      more);
  }

  /* 计数与按钮文案：目录只数"选中的根"（整棵全勾算 1 个），契约数是被覆盖的候选条数。
     根节点自己不是一行（它只是树的入口），所以从它的子目录开始数——否则整棵树全勾会被算成 1 个目录。 */
  function syncDirFoot(tree, pk) {
    var s = { dirs: 0, partial: 0 };
    function walk(node, parentFull) {
      var full = node.n > 0 && node.sel === node.n;
      if (full && !parentFull) s.dirs += 1;
      if (node.sel > 0 && node.sel < node.n) s.partial += 1;
      kidNames(node).forEach(function (k) { walk(k.node, full); });
    }
    kidNames(tree).forEach(function (k) { walk(k.node, false); });
    var sum = $('#dSum');
    if (sum) {
      clear(sum);
      sum.appendChild(el('span', {}, '已选 ', el('b', { text: String(s.dirs) }), ' 个目录 · 覆盖 ',
        el('b', { text: String(tree.sel) }), ' 条契约'));
    }
    var cnt = $('#dCount');
    if (cnt) cnt.textContent = '共 ' + tree.n + ' 条候选';
    var hint = $('#dHint');
    if (hint) {
      hint.textContent = (s.partial ? '有 ' + s.partial + ' 个目录只选了一部分；' : '')
        + '全选 / 全不选只作用于当前列出的目录（含子目录）';
    }
    var go = $('#dGo');
    if (go && !pk.busy) {
      go.textContent = pk.ro
        ? '已纳管的项目不能重复纳管'
        : (s.dirs || tree.sel ? '纳管选中的目录' : '一个目录都没勾');
    }
  }

  /* 落库：把选中的目录翻译成候选 id 送过去——界面的单位是目录，接口的单位仍然是候选。
     失败要落在面板上：这个弹窗可能已经滚了很远，光 alert 不够。 */
  function commitDirs(btn) {
    var pv = S.init, pk = S.pick;
    if (!pv || !pk) return;
    var include = Object.keys(pk.picked).filter(function (k) { return pk.picked[k]; });
    var err = $('#dErr');
    if (err) { err.hidden = true; err.textContent = ''; }
    if (!include.length) {
      if (err) { err.hidden = false; err.textContent = '一个目录都没勾：先在右边勾上要纳管的目录。'; }
      return;
    }
    pk.busy = true;
    btn.disabled = true;
    btn.textContent = '正在写入…';
    api('/init', { method: 'POST', body: {
      root: pv.root, include: include, confirm: true,
      ...(pv.title ? { title: pv.title } : {})
    } }).then(function (data) {
      pk.busy = false;
      closeOverlay();
      S.sel = null;
      S.note = '已纳管 ' + data.result.contracts + ' 条契约'
        + (data.result.skipped.length
          ? '，另有 ' + data.result.skipped.length + ' 个候选没有形状、未纳管。'
          : '。');
      /* 纳管 = 已经把代码扫出来并落库了 → 接着走生成链的第二段（补 AI 中文说明）与第三段
         （重画界面）。这里不再单独调"理解"接口：理解不是独立的一步，它就是生成的一部分。 */
      return loadProjects().then(function () {
        return runGenerate({ mode: 'none', ai: true, force: false, scope: { kind: 'project' } });
      });
    }).catch(function (e) {
      pk.busy = false;
      btn.disabled = false;
      btn.textContent = '纳管选中的目录';
      if (err) { err.hidden = false; err.textContent = '纳管失败：' + e.message; }
    });
  }
  /* ---------- 扫描与实时 ----------
     重扫（增量）与重生成（清掉重来）都没有各自的功能函数了：它们各自是 `runGenerate()` 里的
     一段，入口只有侧边栏那一个「生成」按钮 + 它弹出来的选择窗。这里只剩下事件流的接线。 */

  function connect() {
    var chip = $('#liveChip');
    try {
      var es = new EventSource(API + '/events');
      es.addEventListener('ready', function () { chip.textContent = '实时'; chip.className = 'chip chip-dim'; });
      es.addEventListener('changed', function () { refresh(); });
      es.addEventListener('finding', function () { refresh(); });
      es.addEventListener('project', function () { loadProjects(); });
      es.onerror = function () { chip.textContent = '离线'; chip.className = 'chip chip-warn'; };
    } catch (e) {
      chip.textContent = '离线';
    }
  }

  /* ---------- 决策 ----------
     人只有两个写入口：纳管，以及这里。所以这一行必须把"做过什么"和"能做什么"同时说清。 */
  var ACTION_LABEL = {
    ack: '标记为已知',
    'accept-baseline': '接受为新基线',
    silence: '不再提醒',
    scope: '调整纳管范围'
  };

  function decisionRow(item, targets, kind) {
    var box = el('div', { class: 'bh', style: 'margin-top:14px;gap:8px;flex-wrap:wrap' });
    var mine = (item.decisions || []);
    var ids = {};
    targets.forEach(function (t) { ids[t.id] = true; });

    // 已经对这批目标做过的决策。
    var done = mine.filter(function (d) {
      return (kind === 'change' && d.targetKind === 'change' && ids[d.targetId]) ||
        (kind === 'observation' && d.targetKind === 'observation' && ids[d.targetId]);
    });
    if (done.length) {
      box.appendChild(el('span', { class: 'chip chip-dim',
        text: '已决策：' + done.map(function (d) {
          return ACTION_LABEL[d.action] || d.action;
        }).join(' · ') + '（' + timeAgo(done[0].at) + '）' }));
    }

    if (!targets.length) return box;

    /* 同一个动作不重复提供：已经标记过"已知"就只留痕迹，不再摆一个按了也没新信息的按钮。
       「接受为新基线」照旧保留——它在新提交之后重新有意义。 */
    var acked = done.some(function (d) { return d.action === 'ack'; });
    if (!acked) {
      var ack = el('button', { class: 'ghost', type: 'button',
        text: kind === 'change' ? '这些变化是预期的' : '这些不符是预期的',
        title: '记一条决策，表示已经看过并且接受。契约本身不会被改动。' });
      ack.addEventListener('click', function () { sendDecision(item, targets, kind, 'ack', ack); });
      box.appendChild(ack);
    }

    // 「接受为新基线」只在契约层有意义：它把基线推到当前版本，之后这些变化就不算"这次"的了。
    if (kind === 'change' && S.p && S.p.vcs === 'git') {
      var accept = el('button', { class: 'ghost', type: 'button', text: '接受为新基线',
        title: '把基线推到当前 HEAD。变化记录仍在，但不再算作"从基线到现在变过"。' });
      accept.addEventListener('click', function () {
        sendDecision(item, [{ id: item.contract.id }], 'contract', 'accept-baseline', accept);
      });
      box.appendChild(accept);
    }

    // 全局的决策痕迹（范围/静默这类，不属于上面两组目标）。
    var others = mine.filter(function (d) { return done.indexOf(d) === -1; });
    if (others.length) {
      box.appendChild(el('span', { style: 'font-size:11.5px;color:var(--ink3)',
        text: '另有 ' + others.length + ' 条决策：' + others.map(function (d) {
          return (ACTION_LABEL[d.action] || d.action);
        }).join(' · ') }));
    }
    return box;
  }

  function sendDecision(item, targets, kind, action, button) {
    button.disabled = true;
    var label = button.textContent;
    button.textContent = '记录中…';
    var body = {
      project: item.contract.projectId,
      targetKind: kind,
      targetId: targets[0].id,
      action: action
    };
    api('/decisions', { method: 'POST', body: body }).then(function () {
      /* 决策会经 SSE 的 decision 事件回来，届时整屏刷新；这里先给个即时反馈。 */
      S.note = '已记录：' + (ACTION_LABEL[action] || action) + '。';
      if (action === 'accept-baseline') return loadProjects();
      return loadProject(item.contract.projectId);
    }).catch(function (e) {
      button.disabled = false;
      button.textContent = label;
      S.note = '记录决策失败：' + e.message;
      renderAll();
    });
  }


  /* ---------- 主题 ---------- */
  function setTheme(name) {
    if (name === 'dark') document.body.classList.add('dark');
    else document.body.classList.remove('dark');
    try { localStorage.setItem('dsh-contract-butler.theme', name); } catch (e) {}
    Array.prototype.forEach.call($('#themeSeg').children, function (b) {
      b.classList.toggle('on', b.getAttribute('data-theme') === name);
    });
  }

  /* ---------- 启动 ---------- */
  function boot() {
    var saved = 'light';
    try { saved = localStorage.getItem('dsh-contract-butler.theme') || 'light'; } catch (e) {}
    /* 被嵌进宿主页签时，主题由宿主通过 ?theme= 或 postMessage 告知（iframe 里取不到宿主的变量）。 */
    try {
      var q = new URLSearchParams(location.search).get('theme');
      if (q === 'dark' || q === 'light') saved = q;
    } catch (e) {}
    setTheme(saved);
    window.addEventListener('message', function (ev) {
      var d = ev && ev.data;
      if (d && d.type === 'dsh-contract-butler:theme') setTheme(d.dark ? 'dark' : 'light');
    });
    $('#themeSeg').addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-theme]');
      if (b) setTheme(b.getAttribute('data-theme'));
    });

    /* 分区**没有开关**：永远是目录那一套（S.axis = 'dir'，见上面的状态注释）。
       本地存过的旧值（dsh-contract-butler.axis，可能是 'family'）在此清掉：
       留着它只会让"上次选的"和"现在其实只有一套"对不上。 */
    try { localStorage.removeItem('dsh-contract-butler.axis'); } catch (e) {}

    $('#projSel').addEventListener('change', function (ev) {
      try { localStorage.setItem('dsh-contract-butler.project', ev.target.value); } catch (e) {} S.sel = null; loadProject(ev.target.value); });
    /* 搜索会改可见条目 → 分区跟着变，所以左树和主区图要一起重画（走 renderAll） */
    $('#q').addEventListener('input', function (ev) { S.q = ev.target.value; S.caps = {}; renderAll(); });
    /* 唯一的动作入口：同一个弹窗，未纳管时是"选目录纳管"，纳管之后是"选这次重生成什么"。
       原先顶栏那个「纳管项目」并进了它；"重新扫描 / 重新生成 / AI 理解"三个按钮也早已并进来。 */
    $('#btnGenerate').addEventListener('click', function () { openFlow(); });
    $('#ovClose').addEventListener('click', closeOverlay);
    $('#ov').addEventListener('click', function (ev) { if (ev.target === $('#ov')) closeOverlay(); });

    var FB = [
      { k: 'changed', label: '变过' },
      { k: 'finding', label: '不符' }
    ];
    var pop = $('#filtPop');
    FB.forEach(function (f) {
      var opt = el('div', { class: 'fopt', text: f.label });
      opt.addEventListener('click', function () {
        S.filt[f.k] = !S.filt[f.k];
        opt.classList.toggle('on', S.filt[f.k]);
        renderAll();
      });
      pop.appendChild(opt);
    });
    pop.appendChild(el('div', { class: 'filtclear', text: '清除筛选' })).addEventListener('click', function () {
      S.filt.changed = false; S.filt.finding = false;
      Array.prototype.forEach.call(pop.querySelectorAll('.fopt'), function (o) { o.classList.remove('on'); });
      renderAll();
    });
    $('#filtBtn').addEventListener('click', function () {
      var hidden = pop.hidden;
      pop.hidden = !hidden;
      $('#filtBtn').setAttribute('aria-expanded', String(hidden));
      $('#filtBtn').classList.toggle('on', !hidden);
    });
    document.addEventListener('click', function (ev) {
      if (!pop.hidden && !$('#filtWrap').contains(ev.target)) {
        pop.hidden = true;
        $('#filtBtn').setAttribute('aria-expanded', 'false');
        $('#filtBtn').classList.remove('on');
      }
    });

    api('/status').then(function (st) { S.status = st; return loadProjects(); })
      .then(function () { renderAll(); connect(); firstRun(); })
      .catch(function (e) {
        // 面板全部数据都来自宿主路由：宿主没加载本插件、或存储打不开，都会走到这里。
        // 一定要说出来——否则右侧栏只剩一片空白，分不清是坏了还是本来就空。
        var msg = '连不上宿主接口：' + (e && e.message ? e.message : String(e));
        var hsub = $('#hsub');
        if (hsub) hsub.textContent = msg;
        var tree = $('#tree');
        if (tree) {
          clear(tree);
          tree.appendChild(el('div', { class: 'empty', text: msg }));
          tree.appendChild(el('div', { class: 'empty', style: 'margin-top:6px;opacity:.8',
            text: '面板的数据全部来自宿主路由 /dsh-contract-butler/*。宿主没加载本插件、或存储打不开时就会这样。' }));
        }
      });
  }

  /* ---------- 第一次打开 ----------
     没有可定位的当前项目时，直接把"初始化"摆出来：认得出当前 workspace 就自动预览那个项目
     （只读，不写任何东西），认不出就列 DSH 的项目让你挑。已经纳管过的当前项目不再打扰——
     那是"以后打开"，直接显示即可。 */
  function firstRun() {
    var cwd = normPath(cwdHint());
    if (cwd && projectForCwd()) return;
    if (!cwd && S.projects.length) return;
    /* 当前 workspace 没纳管过 → 摆"未纳管"那个形态（哪怕别的项目已经纳管了）。 */
    openFlow(cwd, { onboard: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
