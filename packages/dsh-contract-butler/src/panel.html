<!-- 组件脚本放在面板自己的脚本**之前**：面板是普通同步脚本，`advFieldTable` 建表时要
     `window.Tabulator` 已经在。取不到（文件缺失 / 请求被挡）也不报错，只是那块表退回静态版
     并显示一行说明——降级路径写在 advFieldTable 里，这里不兜。 -->
<script src="./vendor/tabulator.min.js?v=6.5.3"></script>
<script>
/* ============================================================
   协议管家 · 面板

   这一层只做两件事：把接口给的记录翻译成"人一眼能判断"的东西，以及把人的决定发回去。
   所有判定（谁变了、谁不符）都在宿主侧算好，面板不重新推一遍——两边各算一次必然会分叉。
   ============================================================ */
(function () {
  'use strict';

  var API = '/dsh-contract-butler';
  var S = {
    projects: [], p: null, items: [], sel: null, status: null,
    q: '', filt: { changed: false, finding: false },
    init: null, busy: false, note: '', pick: null,
    /* 分面：axes 与 labels 由宿主下发。判定在宿主算，面板只做集合运算——
       两边各算一次必然会分叉，而用户只信其中一边。 */
    axes: [], labels: {}, facets: {}, attention: true, caps: {},
    /* 分区轴固定为目录：面板**只有一套分区**（目录），没有"切轴"这个东西 ——
       左边就是那棵目录树，右边的带就是同一层的目录名，块上写明「对应左边：<目录路径>」。
       语义族的分组代码（familyGroupsOf / groupNodeRow / renderFamilyTree）还留着，
       但**没有任何渲染路径会调用它们**：UI 上再也没有"语义族"这个开关。 */
    axis: 'dir', ctx: null
  };

  /* ---------- 基础工具 ---------- */
  function $(s) { return document.querySelector(s); }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function el(tag, attrs) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'text') n.textContent = String(v);
      else if (k === 'html') n.innerHTML = String(v);
      else if (k === 'style') n.setAttribute('style', String(v));
      /* onXxx 给的是函数就真挂监听。当属性写进去会变成 onclick="function () {...}"：
         那是"造了个函数却没人调"，按键点下去毫无反应（返回清单就死在这儿）。 */
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : String(v));
    }
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid === null || kid === undefined || kid === false) continue;
      if (Array.isArray(kid)) { kid.forEach(function (x) { if (x) n.appendChild(x); }); }
      else if (typeof kid === 'string' || typeof kid === 'number') n.appendChild(document.createTextNode(String(kid)));
      else n.appendChild(kid);
    }
    return n;
  }

  var JSONH = { 'Content-Type': 'application/json' };
  /* ---------- 在途请求的进度反馈：**只有**右下角那一个加载器 ----------
     所有宿主动作都走 api()：在途计数 > 0 就把右下角那一个统一加载器亮起来（胶囊那一档）。
     这里没有第二套 UI 了——原先顶部 2px 进度条（`#busybar`）与右上角「加载中…」小药丸
     （`#busypill`）连同它们的 DOM 与 CSS 一起删掉了：用户重扫时同时看到「加载中」和「扫描中」
     两个加载态，原话是"应该合并成一个，并且放到右下角"。
     生成那条链自带三段进度（它跑的时候这里直接让位，`undAmbient` 会自己判断），所以同一时刻
     右下角永远只有一个指示器。延迟 120ms 才出现，避免快请求闪一下反而显得卡。 */
  var inflight = 0, busyTimer = null;
  function markBusy(on) {
    if (on) {
      inflight++;
      if (inflight > 1) return;
      clearTimeout(busyTimer);
      busyTimer = setTimeout(function () { undAmbient(true); }, 120);
      return;
    }
    inflight--;
    if (inflight > 0) return;
    inflight = 0;
    clearTimeout(busyTimer);
    undAmbient(false);
  }

  function api(path, options) {
    options = options || {};
    if (options.body !== undefined) { options.body = JSON.stringify(options.body); options.headers = JSONH; }
    markBusy(true);
    return fetch(API + path, options).then(function (r) {
      return r.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
        if (!r.ok) {
          /* 失败也要把结构化细节带出来：AI 理解被拒的批次（原始返回 + 原因）就在 `detail` 里，
             只留一句话的话，人就只能看到"失败了"，看不到为什么。加载态是右下角那一个，逻辑不变。 */
          var err = new Error((data && data.error) || ('HTTP ' + r.status));
          err.status = r.status;
          err.body = data;
          throw err;
        }
        return data;
      });
    }).finally(function () { markBusy(false); });
  }


  /* ---------- 生成：三段加载 + 中文渲染 ----------
     三段是**一条链**，不再是三个按钮：先按当前代码扫一遍，再让模型写中文说明，最后重画界面。
     呈现顺序（代码也照着这个顺序写）：
       1) 右下角先弹一个卡片，标题就是当前阶段（"扫描中…" → "理解中 第 2 / 7 批" → "渲染中…"）；
       2) 约 2 秒后自动最小化成右下角一个小胶囊（点胶囊头部展开 / 收起，不遮主内容）；
       3) 胶囊里是加载动画（进度条 + 阶段 + 批次），结束变结果态：成功写清这次做了什么，
          失败写原因并且能展开看被拒绝批次的原始返回。
     "理解"不是独立入口、也不是独立的一步——它就是这条链的第二段（用户的原话是
     "AI 理解完全不是一个单独的步骤，是要和整个东西的生成结合在一起的"）。
     批次进度是**真的**：宿主在每批开始时经 SSE 广播 `understand` 事件，这里只负责显示；
     事件没到就显示"正在分批…"，绝不编一个数字出来。
     中文只有一个来源——模型的返回。这里没有任何"按名字猜一个中文"的兜底：没有 aiTitle 就
     不显示，诚实比好看重要。 */
  var UND = {
    host: null, box: null, head: null, title: null, mini: null, pct: null, stages: [], bar: null,
    fill: null, batch: null, expr: null, fails: null, act: null,
    stage: 0, minimized: false, timer: null, running: false, lastTotal: 0, lastDone: 0, lastBatch: 0,
    /* 这一块 UI 现在有三档，`ambient` / `result` 是另两档的占用标记：
       - `ambient`：普通在途请求（不是生成那条链）借它显示"加载中…"，请求一完就收掉；
       - `result`：上一次生成的结果还停在这儿等人看（"知道了"才清）。
       有占用标记在，`undAmbient` 就不会去抢生成链或结果态的显示——同一时刻右下角只有一个。 */
    ambient: false, result: false,
    /* 这次真的跳过没走的阶段（例如没勾「补 AI 说明」时的"理解"）。跳过就是跳过：
       不给它打勾，也不在标题里假装做过。 */
    skipped: []
  };

  /** 三个阶段的名字，顺序就是真实顺序：先把当前契约清单拉一遍，再问模型，最后重画。 */
  var UND_STAGES = ['扫描', '理解', '渲染'];

  /** 建（或复用）右下角那块 UI。 */
  function undBuild() {
    if (UND.host) return UND;
    var title = el('div', { class: 'undtitle', text: '正在生成…' });
    var pct = el('span', { class: 'undpct' });
    var mini = el('span', { class: 'undmini', text: '收起' });
    var head = el('div', { class: 'undhead', title: '点这里展开 / 收起' },
      el('span', { class: 'spinner' }), title, pct, mini);
    var stages = UND_STAGES.map(function (name) {
      return el('span', { class: 'undstage', text: name });
    });
    var fill = el('i');
    var bar = el('div', { class: 'undbar' }, fill);
    var batch = el('div', { class: 'undbatch', text: '正在分批…' });
    var expr = el('div', { class: 'undexpr' });
    var fails = el('div', { class: 'undfails', hidden: true });
    var act = el('div', { class: 'undact', hidden: true });
    var box = el('div', { class: 'undbox' }, head, el('div', { class: 'undstages' }, stages), bar,
      batch, expr, fails, act);
    var host = el('div', { id: 'und', role: 'status', 'aria-live': 'polite' }, box);
    /* 最小化/展开只有这一个入口：点头部。收起后胶囊仍然显示动画与阶段文字。
       但"普通在途请求"那一档（ambient）没有细节可展开——它就一个"加载中…"，
       点开了只会露出三个没意义的阶段牌，所以那一档不做展开。 */
    head.addEventListener('click', function () {
      if (UND.ambient) return;
      undMinimize(!UND.minimized);
    });
    document.body.appendChild(host);
    UND.host = host; UND.box = box; UND.head = head; UND.title = title; UND.mini = mini;
    UND.pct = pct;
    UND.stages = stages; UND.bar = bar; UND.fill = fill; UND.batch = batch; UND.expr = expr;
    UND.fails = fails; UND.act = act;
    return UND;
  }

  /**
   * 普通在途请求借这一块 UI 的**胶囊那一档**（"加载中…"）——这是全页唯一的加载指示器。
   * 生成那条链在跑（`UND.running`）或者上一次的结果还停着（`UND.result`）时直接让位：
   * 同一时刻右下角只允许有一个指示器，绝不再叠第二个出来。弹窗开着的时候也不显示——
   * 弹窗里那句"正在按当前状态算…"就是那一次的反馈，右下角再冒一个纯属打扰。
   */
  function undAmbient(on) {
    if (on) {
      if (UND.running || UND.result) return;
      var ov = $('#ov');
      if (ov && ov.classList.contains('open')) return;
      var u = undBuild();
      UND.ambient = true;
      u.title.textContent = '加载中…';
      u.pct.textContent = '';
      u.batch.textContent = '';
      u.expr.textContent = '';
      u.expr.className = 'undexpr';
      u.bar.classList.remove('det');
      u.fill.style.width = '';
      u.host.classList.add('on');
      u.host.classList.add('mini');
      UND.minimized = true;
      u.mini.textContent = '展开';
      return;
    }
    /* 收工：只收自己那一档。生成链或结果态在场时什么都不动（它们自己会收）。 */
    if (!UND.ambient) return;
    UND.ambient = false;
    if (UND.running || UND.result) return;
    var ui = undBuild();
    ui.host.classList.remove('on');
    ui.host.classList.remove('mini');
    UND.minimized = false;
  }

  /** 展开 / 收起。收起 = 只留一个小胶囊（头部一行）。 */
  function undMinimize(on) {
    var u = undBuild();
    UND.minimized = !!on;
    u.host.classList.toggle('mini', UND.minimized);
    u.mini.textContent = UND.minimized ? '展开' : '收起';
  }

  /** 当前阶段的标题文字。阶段本身必须看得出来："在扫描"和"在问模型"是两件事。 */
  function undStageTitle(index) {
    if (index <= 0) return '扫描中…';
    if (index === 1) {
      /* 批次号是真的才写：一次都没报过就只写"理解中…"，绝不编一个"第 1 / 1 批"出来。 */
      return UND.lastTotal > 0 && UND.lastBatch > 0
        ? '理解中 第 ' + UND.lastBatch + ' / ' + UND.lastTotal + ' 批'
        : '理解中…';
    }
    return '渲染中…';
  }

  /** 切阶段（0 扫描 / 1 理解 / 2 渲染）：已经走过的打勾，当前的高亮，跳过的不打勾。 */
  function undStage(index) {
    var u = undBuild();
    UND.stage = index;
    u.stages.forEach(function (node, i) {
      if (UND.skipped[i]) {
        node.className = 'undstage';
        node.textContent = UND_STAGES[i] + '（跳过）';
        return;
      }
      node.className = 'undstage' + (i < index ? ' done' : i === index ? ' on' : '');
      if (i < index) node.textContent = UND_STAGES[i] + ' ✓';
      else node.textContent = UND_STAGES[i];
    });
    /* 阶段文字跟着走：正在扫描 → 正在理解（第 N / M 批）→ 正在渲染。
       只有还在跑的这次才改标题；结果态的标题由 undResult 负责。 */
    if (UND.running) u.title.textContent = undStageTitle(index);
  }

  /** 批次进度。`total` 还不知道时只写"正在分批…"，不猜数字。 */
  function undProgress(batch, total, done) {
    var u = undBuild();
    if (typeof total === 'number' && total > 0) UND.lastTotal = total;
    if (typeof done === 'number') UND.lastDone = done;
    if (typeof batch === 'number' && batch > 0) UND.lastBatch = batch;
    if (typeof batch === 'number' && batch > 0 && UND.lastTotal > 0) {
      u.batch.textContent = '第 ' + batch + ' / ' + UND.lastTotal + ' 批'
        + (UND.lastDone > 0 ? '（已完成 ' + UND.lastDone + ' 批）' : '');
      /* 有总数就画确定进度：让人看得出"快完了"还是"刚开始"。
         百分比同时写进头部——收成胶囊以后主内容都藏了，就靠这个数字 + 底下那条进度条
         说明"还剩多少"（用户要求胶囊里"进度可见"）。 */
      var pct = Math.max(2, Math.round((UND.lastDone / UND.lastTotal) * 100));
      u.bar.classList.add('det');
      u.fill.style.width = pct + '%';
      u.pct.textContent = pct + '%';
    } else if (UND.lastTotal > 0) {
      u.batch.textContent = '共 ' + UND.lastTotal + ' 批';
    }
    /* 标题里的批次号也要实时跟着：用户看的就是这一行。 */
    if (UND.running && UND.stage === 1) u.title.textContent = undStageTitle(1);
  }

  /** 开始一次生成：弹卡片 → 2 秒后自动最小化 → 阶段与批次随真实进度走。 */
  function undOpen(label) {
    var u = undBuild();
    clearTimeout(UND.timer);
    /* 生成链接管这一块 UI：把别人占的档（ambient 在途 / 上一次的结果）清掉。
       同一时刻右下角只有一个指示器，所以这里不做叠加，直接换成"这次生成"。 */
    UND.ambient = false;
    UND.result = false;
    u.host.classList.add('on');
    u.fails.hidden = true;
    u.act.hidden = true;
    clear(u.fails);
    clear(u.act);
    u.expr.className = 'undexpr';
    u.expr.textContent = '';
    u.batch.textContent = '正在分批…';
    u.pct.textContent = '';
    u.bar.classList.remove('det');
    u.fill.style.width = '';
    UND.lastTotal = 0;
    UND.lastDone = 0;
    UND.lastBatch = 0;
    UND.skipped = [];
    UND.running = true;
    UND.stage = 0;
    /* 标题交给阶段文字（"扫描中…"），不在外面另起一套说法。
       `label` 只在调用方确实有话要说时才覆盖它。 */
    u.title.textContent = label || undStageTitle(0);
    undStage(0);
    undMinimize(false);
    /* 第 2 段：约 2 秒后自己收成胶囊。给"正在生成"这几个字留出被看见的时间，
       然后让位给主内容——它只是个进度提示，不该一直占着右下角一大块。 */
    UND.timer = setTimeout(function () { undMinimize(true); }, 2000);
    return u;
  }

  /** 标记某个阶段这次没走（例如没勾"补 AI 说明"）。跳过就是跳过，不打勾。 */
  function undSkipStage(index) {
    var u = undBuild();
    UND.skipped[index] = true;
    var node = u.stages[index];
    if (node) {
      node.className = 'undstage';
      node.textContent = UND_STAGES[index] + '（跳过）';
    }
  }

  /** 结果态：成功 / 失败都停在这儿；失败可以把被拒绝的批次展开看原始返回。 */
  function undResult(result) {
    var u = undBuild();
    clearTimeout(UND.timer);
    UND.running = false;
    UND.ambient = false;
    /* 结果态要占住这一块 UI：在它被"知道了"收掉之前，普通的在途请求不许来抢
       （抢了就变成"看着结果突然跳成加载中"，而且刚生成的数字全没了）。 */
    UND.result = true;
    /* 先清空上一轮留下的失败行与按钮：`result()` 可能被连着调（重新理解、再来一次），
       不清的话按钮会越堆越多——实测过，第一次就堆出了两个"知道了"。 */
    clear(u.fails);
    clear(u.act);
    u.fails.hidden = true;
    u.act.hidden = true;
    u.stages.forEach(function (node, i) {
      if (UND.skipped[i]) {
        node.className = 'undstage';
        node.textContent = UND_STAGES[i] + '（跳过）';
        return;
      }
      /* 失败时也别乱标：失败前**真的走完**的阶段（i < 当前阶段）照样打勾。 */
      var done = result.ok || i < UND.stage;
      node.className = 'undstage' + (done ? ' done' : i === UND.stage ? ' on' : '');
      node.textContent = done ? UND_STAGES[i] + ' ✓' : UND_STAGES[i];
    });
    u.bar.classList.add('det');
    u.fill.style.width = result.ok ? '100%' : '0%';
    u.pct.textContent = result.ok ? '100%' : '';
    u.title.textContent = result.ok ? (result.title || '生成完成') : '生成失败';
    u.expr.className = 'undexpr' + (result.ok ? ' ok' : ' bad');
    u.expr.textContent = result.text || '';
    if (result.channels && result.channels.length) {
      u.batch.textContent = '通道：' + result.channels.join('、');
    }
    var failures = result.failures || [];
    if (failures.length) {
      /* 失败要有细节可看：每一批的原因 + 模型原始返回（原样，截断由宿主做） */
      failures.forEach(function (f) {
        u.fails.appendChild(el('div', { class: 'undfail' },
          el('div', { text: '第 ' + f.index + ' 批（' + (f.ids ? f.ids.length : 0) + ' 条）：' + (f.why || '') }),
          f.raw ? el('code', { text: f.raw }) : null));
      });
      var toggle = el('button', { class: 'ghost', type: 'button', text: '展开看失败批次（' + failures.length + '）' });
      toggle.addEventListener('click', function () {
        var open = u.fails.hidden;
        u.fails.hidden = !open;
        toggle.textContent = (open ? '收起失败批次' : '展开看失败批次（' + failures.length + '）');
      });
      u.act.appendChild(toggle);
      /* 默认就把失败摆出来：失败态里最关键的信息，不该再点一次才看得到 */
      u.fails.hidden = false;
      toggle.textContent = '收起失败批次';
    }
    var close = el('button', { class: 'ghost', type: 'button', text: '知道了' });
    close.addEventListener('click', function () {
      u.host.classList.remove('on');
      /* 收掉结果后这一档就空出来了，普通的在途请求可以再用它显示"加载中…"。 */
      UND.result = false;
    });
    u.act.appendChild(close);
    u.act.hidden = false;
    /* 结果要看得见：自动展开一次（成功也展开——上面那句"已生成 N 条"就是要给人看的）。 */
    undMinimize(false);
  }

  /** 订阅宿主的理解进度事件。SSE 掉线不影响这次请求：动画继续转，结果照旧回来。 */
  function undSubscribe(projectId) {
    try {
      var es = new EventSource(API + '/events');
      es.addEventListener('understand', function (ev) {
        var data = null;
        try { data = JSON.parse(ev.data); } catch (e) { return; }
        if (!data || data.projectId !== projectId) return;
        if (data.stage === 'ai' || data.stage === 'start') undProgress(data.batch, data.total, data.done);
        else if (data.stage === 'done') undProgress(data.total, data.total, data.done);
      });
      es.onerror = function () {};
      return es;
    } catch (e) {
      return null;
    }
  }

  /** AI 那一段的汇总人话（成功、部分被拒都用它；数字全部来自宿主返回）。 */
  function aiSummaryText(s) {
    return 'AI 中文说明：' + (s.understood || 0) + ' 条'
      + (s.cached ? '（其中 ' + s.cached + ' 条命中缓存、没再问模型）' : '')
      + (s.failures && s.failures.length ? '，' + s.failures.length + ' 批被拒绝' : '')
      + (s.missing && s.missing.length ? '，' + s.missing.length + ' 条模型没覆盖（不写、不猜）' : '')
      + '；耗时 ' + Math.round((s.ms || 0) / 1000) + ' 秒';
  }

  /* ============================================================
     生成：唯一入口 → 一条链（扫描 → 理解 → 渲染）

     用户的原话：
       "页面的重新扫描/重新生成/AI 理解完全是重复的，要放在左侧的侧边栏里。这三个按钮要
        合并成一个，点击后弹出弹窗，选择需要重新生成的内容。"
       "AI 理解完全不是一个单独的步骤，是要和整个东西的生成结合在一起的。"

     所以这一层只有两件事：flowGenerate() 弹窗选这次要什么，runGenerate(choice) 真的去跑。
     链子严格按三段走，任何一段失败都**如实**停下来说原因，并且把"已经做成的部分"一起说清
     ——尤其是 rebuild：它清掉的东西回不来，哪怕后面那句中文没补上，底下的契约也已经重生成
     过了，这件事必须写在结果里，不能因为整体失败就连带说成"什么都没发生"。
     ============================================================ */

  /**
   * 跑一次生成。
   * @param choice.mode - `'none'`（不动代码）/ `'rescan'`（增量重扫）/ `'rebuild'`（清掉重生成）
   * @param choice.ai - 要不要补 AI 中文说明（false 时"理解"那一段明确标成跳过）
   * @param choice.force - 忽略 AI 缓存强制重问
   * @param choice.scope - `{ kind, dir, contractIds }`；只作用于 AI 那一段（见弹窗里的说明）
   */
  function runGenerate(choice) {
    if (!S.p) { openFlow(); return Promise.resolve(null); }
    choice = choice || {};
    var projectId = S.p.id;
    var mode = choice.mode === 'rebuild' ? 'rebuild' : choice.mode === 'rescan' ? 'rescan' : 'none';
    var wantAi = choice.ai === true;
    var scope = choice.scope || { kind: 'project' };
    var body = { projectId: projectId };
    /* 范围**只**经 `contractIds` 下传：预告问的是这一批 id，真跑的也是这一批 id。
       两者用同一个机制，就不会出现"预告说 12 条、实际问了整个项目"这种假话。 */
    if (scope.ids && scope.ids.length) body.contractIds = scope.ids;
    if (choice.force === true) body.force = true;

    var done = [];        // 每一步**真正做成**的事（失败时也要把这些说出来）
    var es = null;
    var stage = 0;
    var summary = null;

    undOpen();
    var btn = $('#btnGenerate');
    var label = $('#genLabel');
    if (btn) btn.disabled = true;
    if (label) label.textContent = '生成中…';

    var chain = Promise.resolve();

    /* 第 1 段：代码。选了重建就是破坏性的那一条（先清后抽），选重扫就只往前推。 */
    if (mode === 'rebuild') {
      stage = 0;
      chain = chain.then(function () {
        return api('/rebuild', { method: 'POST', body: { projectId: projectId } });
      }).then(function (data) {
        var n = typeof data.regenerated === 'number' ? data.regenerated : (data.contracts || []).length;
        var c = data.cleared || {};
        done.push('已重生成 ' + n + ' 条契约（清掉 ' + (c.contracts || 0) + ' 条契约、'
          + (c.snapshots || 0) + ' 条快照、' + (c.changes || 0) + ' 条演化、'
          + (c.observations || 0) + ' 条观测、' + (c.decisions || 0) + ' 条决策、'
          + (c.ai || 0) + ' 条 AI 缓存）');
        S.sel = null;
      });
    } else if (mode === 'rescan') {
      stage = 0;
      chain = chain.then(function () {
        return api('/rescan', { method: 'POST', body: { project: projectId } });
      }).then(function (data) {
        var r = data.result || {};
        done.push('增量重扫 ' + (r.filesSeen || 0) + ' 个文件，记下 ' + ((r.changes || []).length) + ' 条演化'
          + ((r.newCandidates || []).length ? '，新出现 ' + r.newCandidates.length + ' 个未纳管候选' : ''));
      });
    } else {
      /* 不动代码，也要把当前契约清单**重新拉一遍**：理解的对象必须是现在的记录，
         否则刚改过的契约会被旧哈希判成"没变"，那是最难查的一类错。 */
      stage = 0;
      chain = chain.then(function () { return refresh(); });
    }

    /* 第 2 段：理解。没勾就明确跳过——跳过也要看得出来是跳过。 */
    if (wantAi) {
      chain = chain.then(function () {
        stage = 1;
        undStage(1);
        es = undSubscribe(projectId);
        return api('/understand', { method: 'POST', body: body });
      }).then(function (data) {
        if (es) { try { es.close(); } catch (e) {} es = null; }
        summary = (data && data.summary) || {};
        done.push(aiSummaryText(summary));
      });
    } else {
      chain = chain.then(function () {
        undSkipStage(1);
        done.push('没有补 AI 说明（这一步这次是跳过的，中文说明保持原样）');
      });
    }

    /* 第 3 段：渲染。 */
    chain = chain.then(function () {
      stage = 2;
      undStage(2);
      return refresh();
    }).then(function () {
      if (es) { try { es.close(); } catch (e) {} es = null; }
      var text = done.join('；') + '。';
      S.note = '生成完成：' + text;
      var partial = summary !== null && summary.ok === false;
      undResult({
        ok: !partial,
        text: text,
        failures: (summary && summary.failures) || [],
        channels: (summary && summary.channels) || []
      });
      return summary;
    }).catch(function (e) {
      if (es) { try { es.close(); } catch (e2) {} es = null; }
      var detail = e && e.body && e.body.detail;
      var why = (e && e.message) || String(e);
      /* 哪一段失败的就说哪一段。已经做成的那几步照样写出来——尤其重建：记录已经变了。 */
      var what = stage === 0 ? '扫描失败' : stage === 1 ? '补 AI 说明失败' : '界面重画失败';
      var text = (done.length ? '已经做成：' + done.join('；') + '。然后 ' : '') + what + '：' + why
        + (stage === 2 ? '（数据已经生成，刷新页面就能看到）' : '');
      /* 失败就退回"只有原始记录"的基线视图：这里没有任何本地补写中文的路径，也不需要。 */
      S.note = '生成未完成：' + text;
      renderAll();
      undResult({
        ok: false,
        text: text,
        failures: (detail && detail.failures) || [],
        channels: (detail && detail.channels) || []
      });
      return null;
    }).then(function (result) {
      if (btn) btn.disabled = false;
      if (label) label.textContent = '生成';
      return result;
    });
    return chain;
  }

  /** 列在弹窗里的三个范围。做不到的就不列（宿主只认这三种）。
     每一个范围都**解析成一组契约 id**：宿主那侧只有"给哪几条"这一个机制，与 /understand
     完全同构——否则"范围内多少条"与"实际会问多少条"就是两套算法，迟早分叉成一句假预告。 */
  function genScopes() {
    var out = [];
    out.push({ kind: 'project', label: '整个项目', ids: null,
      hint: S.p ? S.p.title + ' 下全部 ' + S.items.length + ' 条契约' : '' });
    var dir = genDir();
    if (dir) {
      var inDir = scopeItemsOf(S.items, dir);
      out.push({ kind: 'dir', label: '当前目录', dir: dir, ids: inDir.map(function (it) { return it.contract.id; }),
        hint: dir + ' 下 ' + inDir.length + ' 条契约' });
    }
    var item = S.sel ? itemById(S.sel) : null;
    if (item) {
      out.push({ kind: 'contracts', label: '当前选中的契约', dir: item.contract.file, ids: [item.contract.id],
        hint: (item.contract.aiTitle ? item.contract.aiTitle + '（' + item.contract.symbol + '）' : item.contract.symbol) });
    }
    return out;
  }

  /** 当前"在看哪个目录"：目录视图用它，契约详情页用它所在的目录。都没有就是整个项目。 */
  function genDir() {
    if (S.dirView) return S.dirView;
    var item = S.sel ? itemById(S.sel) : null;
    var file = item ? (item.contract.file || '') : '';
    var cut = file.lastIndexOf('/');
    return cut === -1 ? '' : file.slice(0, cut);
  }

  function itemById(id) {
    var found = null;
    S.items.forEach(function (it) { if (it.contract && it.contract.id === id) found = it; });
    return found;
  }

  /** 预告：把宿主算出来的真实数字翻成人话。每一句都能追到一个真数字，没有一句是猜的。 */
  function genPlanLines(plan, G) {
    var lines = [];
    var code = plan.code;
    if (code) {
      if (code.mode === 'rebuild') {
        var g = plan.generated || {};
        lines.push({ text: '清掉重生成：先清掉 ' + (g.contracts || 0) + ' 条契约、' + (g.snapshots || 0)
          + ' 条快照、' + (g.changes || 0) + ' 条演化、' + (g.observations || 0) + ' 条观测、'
          + (g.decisions || 0) + ' 条决策、' + (g.ai || 0) + ' 条 AI 缓存，再按当前代码抽一遍',
          warn: true });
        lines.push({ text: '这一步不可撤销：清掉的记录不会回来。' + (g.contracts || 0) + ' 条契约会被重新抽一遍'
          + (code.files ? '（读 ' + code.files + ' 个文件' : '（读文件数还没算出来')
          + (code.truncated ? '，已达上限 ' + code.maxFiles + '、只会读前 ' + code.maxFiles + ' 个）' : '）'),
          dim: true });
      } else {
        lines.push({ text: '增量重扫 ' + code.files + ' 个文件'
          + (code.truncated ? '（已达上限 ' + code.maxFiles + '，只会扫前 ' + code.maxFiles + ' 个）' : '')
          + '：比形状、记演化，不清任何东西。' });
      }
    } else {
      lines.push({ text: '不动代码：只把当前契约清单拉一遍。' });
    }
    if (G.ai) {
      if (!plan.ai.available) {
        /* 宿主没有可用模型这件事现在就知道，当场说清——别等人点完再看一个失败。 */
        lines.push({ text: '⚠ 补 AI 说明这一步会失败：宿主现在没有可用的 AI。' + (plan.ai.reason || ''), warn: true });
      } else if (plan.scope.pending === 0) {
        lines.push({ text: '范围内 ' + plan.scope.contracts + ' 条契约全部命中缓存，不会问模型。' });
      } else {
        lines.push({ text: '补 AI 说明：范围内 ' + plan.scope.contracts + ' 条契约里有 ' + plan.scope.pending
          + ' 条缺说明或内容变过，会问 ' + plan.ai.batches + ' 批模型（每批 ' + plan.ai.batchSize + ' 条）'
          + (plan.ai.force
            ? '；已勾选忽略缓存，全部重问。'
            : '；其余 ' + plan.scope.cached + ' 条命中缓存、不问。') });
      }
    } else {
      lines.push({ text: '不补 AI 说明：中文说明保持原样（不会问模型）。' });
    }
    lines.push({ text: '最后重画界面。', dim: true });
    return lines;
  }

  /**
   * 生成弹窗：这一次要重新生成什么，在这里选。
   *
   * 每一组都以"真的会这样"为准：范围只作用于 AI 那一段，所以标题里直接写明；重扫与重生成
   * 是项目级动作（宿主的接口就是这样），说明里也直接写明——做不到的范围维度不假装有。
   * @param preset - 预置范围（详情页的「重新生成这一条」用它把范围钉在那一条上）。
   */
  /* ---------- 一个入口，一条路径 ----------
     动作入口只有侧栏那一个（#btnGenerate）。它背后只有这一个分流点：
       没有项目 → 未纳管的形态：选目录（先只读预览）→ 决定纳管哪些；
       已有项目 → 已纳管的形态：决定这次要重生成什么。
     两个形态是同一个弹窗（同一个 #ov 壳）的两副面孔，彼此之间不再互相跳转。 */
  function openFlow(preset, opts) {
    /* opts.onboard：调用方明确知道"这次是要纳管"（例如启动时发现当前 workspace 还没纳管）。
       它不是第二个入口——入口仍然只有那一个按钮，这里只是把状态说清楚。 */
    var wantOnboard = (opts && opts.onboard === true) || !S.p;
    if (wantOnboard) return flowOnboard(typeof preset === 'string' ? preset : undefined);
    return flowGenerate(preset);
  }

  /* 入口按钮自己的文案跟着状态走：没纳管时它是"纳管项目"，纳管之后才是"生成"。
     同一个按钮两种说法——不为第二种状态新增第二个入口。
     正在跑（按钮被禁用）时不动它，免得盖掉 runGenerate 写的"生成中…"。 */
  function syncFlowEntry() {
    var btn = $('#btnGenerate');
    var label = $('#genLabel');
    if (!btn || !label || btn.disabled) return;
    var onboard = !S.p;
    var text = onboard ? '纳管项目' : '生成';
    if (label.textContent !== text) label.textContent = text;
    btn.title = onboard
      ? '还没有纳管项目：点它选一个目录纳管（先只读预览，勾了才写）'
      : '扫描代码 → 补 AI 中文说明 → 重画界面，一条链走完；点它选这次要重新生成什么';
    btn.classList.toggle('onboard', onboard);
  }

  function flowGenerate(preset) {
    preset = preset || {};
    var scopes = genScopes();
    var wantKind = preset.contractId ? 'contracts' : (S.dirView ? 'dir' : 'project');
    var G = {
      mode: 'rescan', ai: true, force: false,
      kind: scopes.some(function (s) { return s.kind === wantKind; }) ? wantKind : 'project',
      /* 预案序号：请求回来时对不上就丢掉，免得旧的一次预告覆盖掉新的。 */
      seq: 0, plan: null, error: '',
    };
    var chosen = function () {
      var found = scopes.filter(function (s) { return s.kind === G.kind; })[0];
      return found || scopes[0];
    };

    var planBox = el('div', { class: 'genplan' },
      el('div', { class: 'gpt', text: '这次会做什么' }),
      el('div', { class: 'gpl dim', text: '正在按当前状态算…' }));
    var planBody = planBox.lastChild;
    var go = el('button', { class: 'ghost', type: 'button', text: '开始生成' });
    go.style.color = 'var(--accent)';
    go.style.boxShadow = 'inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent)';

    /* 破坏性动作的第二道闸：选中「清掉重生成」之后再点「开始生成」不算确认，要再点一次
       写清代价的按钮。选项一变（replan）就把这道闸撤掉——旧的确认不能盖住新的选择。 */
    var confirmNote = el('div', { class: 'gpl warn', text: '清掉这个项目已生成的契约、快照、演化、观测、决策与 AI 缓存，'
      + '再按当前代码重新抽一遍。不可撤销。' });
    confirmNote.style.display = 'none';
    var resetRebuildGate = function () {
      G.confirmRebuild = false;
      go.textContent = '开始生成';
      go.classList.remove('danger');
      confirmNote.style.display = 'none';
    };

    /* 每次选项一变就重新问一遍宿主："这次会做什么"必须跟着选项走，不能是打开弹窗那一刻的快照。 */
    function replan() {
      /* 每次选项一变就撤掉"确认清掉"那道闸。 */
      resetRebuildGate();
      G.seq += 1;
      var mine = G.seq;
      clear(planBody);
      planBody.className = 'gpl dim';
      planBody.textContent = '正在按当前状态算…';
      var scope = chosen();
      var payload = { projectId: S.p.id, mode: G.mode === 'none' ? 'none' : G.mode, force: G.ai && G.force };
      if (scope.ids) payload.contractIds = scope.ids;
      return api('/generate/plan', { method: 'POST', body: payload }).then(function (plan) {
        if (mine !== G.seq) return;
        G.plan = plan;
        G.error = '';
        clear(planBody);
        planBody.className = 'gpl';
        genPlanLines(plan, G).forEach(function (line) {
          planBody.appendChild(el('div', { class: line.warn ? 'gpl warn' : line.dim ? 'gpl dim' : 'gpl',
            style: 'margin-top:4px', text: line.text }));
        });
      }).catch(function (e) {
        if (mine !== G.seq) return;
        G.plan = null;
        G.error = (e && e.message) || String(e);
        clear(planBody);
        planBody.className = 'gpl warn';
        /* 算不出来就说算不出来：预告是给人做决定用的，宁可说"我算不出来"，也不编一个数字。 */
        planBody.textContent = '算不出这次的预告：' + G.error + '（仍然可以点「开始生成」）';
      });
    }

    /* 单选组：同一组里永远只有一个选中。 */
    /* `get` / `set` 必须分开给：同一个回调既当读又当写的话，"同步整张表"那次读取
       会顺手把值改掉——三个单选行按顺序各读一次，最后一个就赢了，默认选项于是悄悄变成
       "清掉重生成"（真的会清库），而三行又全都不处于选中态。 */
    function radioRow(name, value, label, hint, get, set, disabledReason) {
      var input = el('input', { type: 'radio', name: name });
      input.checked = value === get();
      input.disabled = disabledReason !== undefined;
      var row = el('label', { class: 'genopt' + (disabledReason !== undefined ? ' off' : '') },
        input,
        el('div', { class: 'gt' },
          el('div', { class: 'gn', text: label }),
          hint ? el('div', { class: 'gd', text: hint }) : null,
          disabledReason !== undefined ? el('div', { class: 'gd', text: disabledReason }) : null));
      var sync = function () { input.checked = value === get(); row.classList.toggle('on', input.checked); };
      if (disabledReason === undefined) {
        input.addEventListener('change', function () { if (input.checked) { set(value); replan(); } });
      }
      return { row: row, sync: sync };
    }

    /* 复选行。`get` 是"现在勾没勾"，`enabled` 决定这一行能不能动。 */
    function checkRow(label, hint, get, set, enabled) {
      var input = el('input', { type: 'checkbox' });
      input.checked = get();
      input.disabled = !enabled();
      var row = el('label', { class: 'genopt' + (enabled() ? '' : ' off') }, input,
        el('div', { class: 'gt' }, el('div', { class: 'gn', text: label }),
          hint ? el('div', { class: 'gd', text: hint }) : null));
      var sync = function () {
        input.checked = get();
        input.disabled = !enabled();
        row.classList.toggle('on', input.checked);
        row.classList.toggle('off', !enabled());
      };
      return { row: row, sync: sync, set: set };
    }

    /* 代码这一步：三个选项就是原来那三个按钮里"扫描"相关的全部能力。 */
    var modeRows = [
      radioRow('genmode', 'none', '不动代码',
        '只补 AI 说明 / 重画界面。契约还是现在这一份。',
        function () { return G.mode; }, function () { G.mode = 'none'; }, undefined),
      radioRow('genmode', 'rescan', '增量重扫（默认）',
        '按当前代码扫一遍，比形状、记演化；不清任何东西，没变的契约一条都不动。',
        function () { return G.mode; }, function () { G.mode = 'rescan'; }, undefined),
      radioRow('genmode', 'rebuild', '清掉重生成',
        '清掉这个项目已生成的契约、快照、演化、观测、决策与 AI 缓存，再按当前代码重新抽一遍。不可撤销。',
        function () { return G.mode; }, function () { G.mode = 'rebuild'; }, undefined),
    ];

    var aiRow = checkRow('补 AI 中文说明',
      '只给缺说明、或内容变过（哈希对不上）的契约问模型；内容没变的直接读缓存，不重复问。',
      function () { return G.ai; },
      function (v) { G.ai = v; }, function () { return true; });
    var forceRow = checkRow('忽略缓存，强制重问',
      '连内容没变的契约也重新问一遍模型。只在换了模型、或想推翻上一轮中文时才需要。',
      function () { return G.force; },
      function (v) { G.force = v; }, function () { return G.ai; });

    var scopeRows = scopes.map(function (s) {
      return radioRow('genscope', s.kind, s.label, s.hint, function () { return G.kind; }, function () { G.kind = s.kind; }, undefined);
    });

    /* 选项互相关联，改一处要同步整张表（例如不勾 AI 时"强制重问"就该变灰）。 */
    function syncAll() {
      modeRows.forEach(function (r) { r.sync(); });
      aiRow.sync();
      forceRow.sync();
      scopeRows.forEach(function (r) { r.sync(); });
      /* 范围只管 AI：没勾 AI 就整块不出现。 */
      scopeSec.style.display = G.ai ? '' : 'none';
    }
    /* 勾选框自己不带 replan，这里统一挂上；再统一做一次同步。 */
    [aiRow, forceRow].forEach(function (r) {
      var input = r.row.querySelector('input');
      r.row.classList.toggle('on', input.checked);
      input.addEventListener('change', function () {
        r.set(input.checked);
        syncAll();
        replan();
      });
    });

    go.addEventListener('click', function () {
      /* 破坏性动作要两道闸：第一下只是把代价说清（不可撤销），第二下才真的跑。
         非破坏性的档位一下就走，默认（增量重扫）不受影响。 */
      if (G.mode === 'rebuild' && !G.confirmRebuild) {
        G.confirmRebuild = true;
        go.textContent = '确认清掉并重新生成（不可撤销）';
        go.classList.add('danger');
        confirmNote.style.display = '';
        return;
      }
      var scope = chosen();
      closeOverlay();
      runGenerate({ mode: G.mode, ai: G.ai, force: G.ai && G.force,
        scope: { kind: scope.kind, label: scope.label, ids: scope.ids } });
    });
    var cancel = el('button', { class: 'ghost', type: 'button', text: '取消' });
    cancel.addEventListener('click', closeOverlay);

    /* 作用范围只管 AI 那一段：不勾「补 AI 中文说明」时整块不出现，少一个要读的东西。 */
    var scopeSec = el('div', { class: 'gensec' },
      el('div', { class: 'gsh' }, el('span', { text: '作用范围' }), el('span', { class: 'gsn', text: '只管 AI 这一段' })),
      el('div', { class: 'gsnote', text: '重扫与重生成是项目级动作，永远覆盖整个项目——它们不受这个范围影响。'
        + '这个范围决定的是"给哪些契约补中文说明"。' }),
      scopeRows.map(function (r) { return r.row; }));

    openOverlay('生成', el('div', {},
      el('div', { class: 'note', text: '扫描、补 AI 中文说明、重画界面本来是一条链——这里选的是这次要重新生成的内容，'
        + '点一次就跑完整条链。' }),
      el('div', { class: 'gensec' }, el('div', { class: 'gsh' }, el('span', { text: '代码' })),
        modeRows.map(function (r) { return r.row; })),
      el('div', { class: 'gensec' }, el('div', { class: 'gsh' }, el('span', { text: 'AI 中文说明' })),
        aiRow.row, forceRow.row),
      scopeSec,
      planBox,
      confirmNote,
      el('div', { class: 'genfoot' },
        el('span', { class: 'gsum', text: S.p.title }),
        cancel, go)));

    syncAll();
    replan();
  }

  /** 左树行上的那一小截灰字：简短形式（全文在悬浮提示里）。 */
  function shortAi(text, max) {
    var s = String(text || '');
    var limit = max || 20;
    return s.length > limit ? s.slice(0, limit - 1) + '…' : s;
  }

  /** 契约记录 → 左树行尾的 AI 灰字节点（没有就不给节点，不编）。 */
  function aiTagOf(c) {
    if (!c || !c.aiTitle) return null;
    return el('span', { class: 'tai', title: 'AI：' + c.aiTitle + (c.aiFamily ? '（' + c.aiFamily + '）' : ''),
      text: shortAi(c.aiTitle) });
  }

  /** 契约详情页最上面那块：AI 中文职责 + 族名 + 关系 + "可重新生成"的入口。 */
  function aiBlockOf(c) {
    var box = el('div', { class: 'aiblock' });
    var head = el('div', { class: 'aihead' }, el('span', { class: 'aitag', text: 'AI' }));
    if (c.aiTitle) {
      head.appendChild(el('span', { class: 'aititle', text: c.aiTitle }));
      if (c.aiFamily) head.appendChild(el('span', { class: 'aifam', text: c.aiFamily }));
    } else {
      /* 没有就说没有：不说"未生成"也不编一个——用户明确否决了本地生成中文这条路。 */
      head.appendChild(el('span', { class: 'ainone', text: '这条还没有 AI 中文说明（没问过模型，或模型返回没通过校验）。' }));
    }
    box.appendChild(head);
    if (c.aiTitle) {
      var rel = c.aiRelations || [];
      if (rel.length) {
        rel.forEach(function (r) {
          var target = null;
          S.items.forEach(function (it) { if (it.contract && it.contract.id === r.to) target = it.contract; });
          box.appendChild(el('div', { class: 'airel' },
            el('code', { text: r.rel }),
            ' → ',
            el('code', { text: target ? target.title : r.to }),
            r.why ? '：' + r.why : ''));
        });
      }
      box.appendChild(el('div', { class: 'ainote',
        text: '这是 AI 生成的，不是抽取出来的事实：' + (c.aiAt ? timeAgo(c.aiAt) + '生成' : '')
          + (c.aiHash ? '，内容哈希 ' + c.aiHash.slice(0, 8) : '')
          + '。契约内容变了哈希就变，下次会重新问；内容没变则直接读缓存。' }));
    }
    /* 这一条的重生成入口不是第二个入口：它打开的是**同一个**生成弹窗，只是范围预先钉在
       这一条上。原来这里直接调理解接口，于是"重问这一条"与"重生成整个项目"是两套流程、
       两套说法——那正是用户说的"重复"。 */
    var btn = el('button', { class: 'ghost', type: 'button', text: '重新生成这一条…' });
    btn.addEventListener('click', function () { openFlow({ contractId: c.id }); });
    box.appendChild(el('div', { class: 'aiact' }, btn));
    return box;
  }

  /* 探针出口：加载动画的三段状态要能在真页面上量得动（和 window.__butlerGraph 一个道理）。
     只读 + 直调，不改变任何默认行为。 */
  window.__butlerUnderstand = {
    open: undOpen,
    stage: undStage,
    progress: undProgress,
    result: undResult,
    minimize: undMinimize,
    skip: undSkipStage,
    /* 直接跑一次生成链（弹窗里点"开始生成"走的就是它），供手动验证与截图用。 */
    start: runGenerate,
    generate: flowGenerate,
    state: function () {
      var host = document.getElementById('und');
      if (!host) return null;
      var box = host.querySelector('.undbox');

        stages: Array.prototype.map.call(host.querySelectorAll('.undstage'), function (n) {

  /* 类型族：chip 的颜色按族分（string / number / boolean / array / object / enum / null / unknown）。

  /* 字段级中文：`aiFields` 是 [{name, zh}]，按字段名对上。**一个字段名对不上就不显示**，

  /* 字段级状态点：数据来源是宿主算好的变更原因（`evolve.ts` 里那条固定格式），不是面板猜的。

     路径是点分路径：`$.items[].id` 取第一段 `items` —— 这个字段这一行动过就标它。

      reasons.forEach(function (raw) {

  /* `$` 是根（不是某个字段）→ null；`$.phone` → `phone`；`$.items[].id` → `items`。 */

  /* ---------- 字段表：一份列规格 + 两条渲染路径 ----------

     `table.ft{min-width}` 取同一份合计（260+340+100+360+120 = 1340）。三处一旦分叉，

  var FT_COLS = [
    /* 字段：定宽 + 固定（横滚时钉在最左）+ 等宽字，`title` 悬浮看全名。minWidth 是底线：
       拖到底也不会窄到看不见名字。 */
    { key: 'n', title: '字段', width: 320, minWidth: 200, maxWidth: 460, frozen: true },
    { key: 't', title: '类型', width: 340, minWidth: 240 },
    { key: 'r', title: '是否必填', width: 100, minWidth: 90 },
    /* 中文解释：换行读完（组件版走 variableHeight），没有就留白，绝不编。 */
    { key: 'zh', title: '中文解释', width: 360, minWidth: 220, wrap: true },
    { key: 'st', title: '状态', width: 120, minWidth: 100 }
  ];

  /* 格子里画什么，两条路径共用（静态版塞进 `td`，组件版由 formatter 塞进单元格）。
     一律返回 DOM 节点：Tabulator 的 formatter 允许返回 Node，于是字段名 / 类型 / 中文这些
     机器文本全程没进过 innerHTML——不为省几个字给自己留一个注入口子。 */
  function fStatOf(f) {
    return f.st === 'bad' ? { cls: 'd-bad', text: '破坏性变更' }

  }
  /* 名字不再套 .ftrunc：那一类的 ellipsis 会盖过 .fname 的换行（同权重、后者靠后）。

  function fCellName(f) { return el('span', { class: 'fname', title: f.n, text: f.n }); }
  function fCellType(f) {
    return el('div', {},
      el('span', { class: 'fchip fchip-' + f.fam, title: f.t }, el('span', { class: 'ftrunc', text: f.t })),
      f.d ? el('span', { class: 'fnote ftrunc', title: f.d, text: f.d }) : null);
  }
  function fCellReq(f) { return el('span', { class: 'freq' + (f.r ? '' : ' is-opt'), text: f.r ? '必填' : '可选' }); }
  function fCellZh(f) { return el('div', { class: 'fzh', text: f.zh || '' }); }
  function fCellStat(f) {

  var FT_CELLS = { n: fCellName, t: fCellType, r: fCellReq, zh: fCellZh, st: fCellStat };

    return el('div', { class: 'dir', text: dir + ' · ' + rows.length + ' 条 · ' + zhN + ' 条有中文' });

  /* 静态字段表：定宽列（colgroup）+ 横向滚动 + 首列固定（CSS 里那条 sticky）。

  /* 字段名列到底该多宽：**按最长字段名实测**，不是拍一个数。
     写死宽度正是"显示列宽跟真实需要的宽度不一致、字被截断"的根源：窗格宽了列被拉开、
     窄了列被压到下限，两头都不是名字真正需要的宽度。这里用 canvas 按面板的等宽字体量一遍。 */

  /* 用户拖过的列宽（字段名 → 像素）。两张表**共用一份**：同一个字段在"输入/输出"里宽度一致，

     宽度（名字一行读完、不多占）；窗格窄下去时它跟着缩，缩到 minWidth（200）就让名字折行，

     widthGrow 瓜分剩余。首列也给 widthGrow（参与分配，但份额是按它自己的实测需要推的），
     其余列按规格比例分——宽窗格里首列拿到"刚好够名字用"的宽度，窄窗格里它先让位。
     用户拖过的列宽一律当定宽用（拖拽的意图优先于自动分配，且要刷新后还在）。 */
  function ftColumn(c, saved) {

      headerSort: true,
      /* 中文解释那列要能换行；其余列单行截断（长的机器文本靠 `title` 悬浮看全）。 */

     各列最小宽才出横向滚动条。每张表自带滚动区，表头在组件自己的滚动区里吸顶。 */

    var box = el('div', { class: 'fadv fsec' });
    box.appendChild(dirLine(rows, dir));
    if (!window.Tabulator) {
      box.appendChild(el('div', { class: 'fadv-note',
        text: '高级表格组件未加载，已退化为静态表（首列固定与横向滚动仍在，但没有列宽拖动与表头排序）。' }));

    table.on('columnResized', function (col) { ftColsSave(col.getField(), col.getWidth()); });

  }

  /* ---------- 事实判定：面板只读宿主算好的结论 ---------- */
  /* 变没变、符不符都由宿主判定并随记录下发（changes[].fresh / findings[].ok）。

  function breakingIn(item) {
    return changedIn(item).some(function (ch) { return ch.kind === 'breaking'; });
  }
  function findingsOf(item) {
    return item.findings.filter(function (f) { return !f.ok; });
  }

  /* ---------- 卡片上说给用户看的那点信息 ----------
     状态、副标题、提示全部由现有判定推出：有发现 > 破坏性变更 > 只是变过（优先级和 demo 一致），
     计数就是宿主已经下发的那几个数，不另算一套、也不编。 */
  function statusOf(item) {

  }
  function worstStatusOf(items) {

  }
  /* 相对的是哪个版本：有 git 就是基线那一条，没有 git 就按内容比对 */
  function baselineName() {
    var p = S.p;
    if (!p) return '基线';
    if (p.vcs === 'none') return '上次扫到的版本';
    return shortSha(p.baselineSha) || '基线';
  }
  /* 悬浮提示：把"相对谁、变了几次、看过几次调用、有几处对不上"说全 */
  function contractTip(item) {
    var t = [], chg = changedIn(item).length, bad = findingsOf(item).length;
    var obs = typeof item.observedTotal === 'number' ? item.observedTotal : (item.observations || []).length;
    if (chg) {
      t.push('相对基线 ' + baselineName() + ' 变过 ' + chg + ' 次' + (breakingIn(item) ? '（含破坏性变更）' : ''));
    }
    if (obs) t.push('看过 ' + obs + ' 次调用，其中 ' + bad + ' 次与声明不符');
    else if (bad) t.push('观测到 ' + bad + ' 处与契约不合');
    else t.push('还没有观测到调用');

  }
  function chipsOf(item, extra) {
    var out = [];
    var chg = changedIn(item), bad = findingsOf(item);
    if (extra !== 'nochanged' && chg.length) {
      out.push(el('span', { class: 'chip chip-warn' + (breakingIn(item) ? ' brk' : ''), text: '变过' }));
    }
    if (bad.length) out.push(el('span', { class: 'chip chip-bad', text: '不符' }));
    return out;
  }

  /* ---------- 顶栏 ---------- */
  function renderTop() {
    var p = S.p;
    /* 入口的文案跟着状态走（未纳管=纳管项目 / 已纳管=生成）——同一个按钮，不是第二个入口。 */
    syncFlowEntry();
    $('#projSel').value = p ? p.id : '';
    var range = $('#tbRange');
    clear(range);
    var hsub = $('#hsub');
    if (!p) {
      hsub.textContent = S.status
        ? '还没有纳管任何项目。点左边侧栏最上面那个「纳管项目」，选一个目录开始。'
        : '正在连接宿主…';
      return;
    }
    hsub.textContent = p.root;
    range.appendChild(el('span', { class: 'revproj', text: p.title }));
    if (p.vcs === 'none') {
      range.appendChild(el('span', { class: 'chip chip-dim', text: '无 git：按内容比对' }));
    } else {
      range.appendChild(el('span', { class: 'revbtn', title: '基线：纳管时定下的那一版',
        text: shortSha(p.baselineSha) }));
      range.appendChild(el('span', { class: 'arrow', text: '→' }));
      var chgN = 0, badN = 0;
      S.items.forEach(function (it) {
        if (changedIn(it).length) chgN++;
        if (findingsOf(it).length) badN++;
      });
      range.appendChild(el('span', { class: 'revbtn', text: '工作区' }));
      range.appendChild(el('span', { class: 'chip chip-dim',
        text: '扫描于 ' + timeAgo(p.scannedAt) }));
    }
  }

  /* ---------- 分面 ----------
     宿主给每条契约挂好 tag（形如 source:ts-pattern），这里只做过滤与计数。
     几百条的时候，靠的是"先收窄再展开"，而不是把几百行堆在一列里让人翻。 */
  /* ============================================================
     分区：左边树的分组节点、右边图的带 —— 全文件唯一一处算分区的地方

     之前是两套：左树按目录（文件名拆出来的），右图按语义族（协议标题归纳出来的）。
     两套并存的结果是"左边分成了 search / panels，右边一个都没分"，人就会在两个视图
     之间来回对不上号。现在只有一套：planOf() 返回 [{ key, label, items, sources, note }]，
     左树照着画分组节点，右图照着画带 —— 同名、同序、同一个数，想分叉都没有地方分叉。

     轴只有两个值（面板底部那个开关，与主题开关同一排）：
       dir    = 这一层的直接子目录（与左树里那一层同名同序）
       family = 语义族（协议标题归纳出来的"这一堆在干什么"）
     ============================================================ */
  var AXIS_NAMES = { dir: '目录', family: '语义族' };

  /* 当前范围：S.dirView 是"在看哪个目录"，null = 整个项目。
     范围行（左树顶上）与范围带（右图第一条带）用的是**同一个字符串**，
     所以"右边有几条带"和"左边有几个分组节点"说的是同一个主语。 */
  function scopeLabelOf(scope) { return scope ? String(scope) : '项目'; }

  function scopeItemsOf(items, scope) {
    if (!scope) return items.slice();
    var pre = scope + '/';
    return items.filter(function (it) {
      var f = (it.contract && it.contract.file) || '';
      return f.indexOf(pre) === 0 || f === scope;
    });
  }

  /* 目录名的排序（有事的多 → 条数多的 → 名字）：目录树与分区共用这一个比较器 */
  function dirNamesOf(node) {
    return Object.keys(node.kids).sort(function (a, b) {
      var ka = node.kids[a], kb = node.kids[b];
      if (ka.hot !== kb.hot) return kb.hot - ka.hot;
      if (ka.n !== kb.n) return kb.n - ka.n;
      return a < b ? -1 : 1;
    });
  }

  /* 一层节点下的全部协议（含更深层）—— 左树目录行右侧那个计数就是这个数，
     图的带用同一个数，两边不可能一个是 12 一个是 3。 */
  function dirSubtreeItems(node) {
    var out = node.items.slice();
    Object.keys(node.kids).forEach(function (k) { out = out.concat(dirSubtreeItems(node.kids[k])); });
    return out;
  }

  function dirNodeAt(root, scope) {
    if (!scope) return root;
    var node = root;
    String(scope).split('/').forEach(function (seg) {
      if (!seg || !node) return;
      node = node.kids[seg] || null;
    });
    return node || emptyDirNode();
  }

  /* 这一组里的协议分别放在哪些目录（按条数排）。族名再准也回答不了"东西在哪儿"，
     所以要有一条看得见的路：带头上和族节点上都印一句来源摘要，全量在悬浮提示里。 */
  function groupSources(items) {
    var idx = {}, order = [];
    items.forEach(function (it) {
      var file = (it.contract && it.contract.file) || '';
      var cut = file.lastIndexOf('/');
      var dir = cut < 0 ? '(根)' : file.slice(0, cut);
      if (!idx[dir]) { idx[dir] = { name: dir, n: 0 }; order.push(idx[dir]); }
      idx[dir].n++;
    });
    order.sort(function (a, b) { return b.n - a.n || (a.name < b.name ? -1 : 1); });
    return order;
  }

  /* 来源摘要：最多 max 处，其余折成「等 N 处」。默认只印 2 处 —— 带头上那点宽度
     要留给族名和说明，印不下就该收住，全量在提示里。 */
  function sourceText(sources, max) {
    var list = sources || [];
    if (!list.length) return '';
    var keep = list.slice(0, max === undefined ? 2 : max);
    var txt = keep.map(function (s) { return s.name; }).join(' / ');
    if (list.length > keep.length) txt += ' 等 ' + list.length + ' 处';
    return txt;
  }

  function sourceTip(g) {
    var list = (g && g.sources) || [];
    if (!list.length) return '';
    return '这一组里的协议放在：' + list.map(function (s) { return s.name + '（' + s.n + ' 条）'; }).join('；');
  }

  /* 这一组**自己**的统计，就是带上那句"这一族在干什么"。
     不能拿整个范围的主导边界来写：这个项目里 1012 条协议的 boundaryKind 全是 schema，
     那样每条带都会印"数据校验"，看着像说了什么，其实一个字都没说（实测就是这个症状）。
     所以按组自己数：字段规模 + 组内最主要的角色词 + 缺口 + 变更 / 不符。 */
  function groupNoteOf(g) {
    var fields = 0, gaps = 0, chg = 0, bad = 0, roles = {};
    g.items.forEach(function (it) {
      fields += protocolFields(it).length;
      if (protocolKindOf(it) === 'gap') gaps++;
      if (changedIn(it).length) chg++;
      if (findingsOf(it).length) bad++;
      var r = roleWordOf(titleOf(it));
      if (r) roles[r] = (roles[r] || 0) + 1;
    });
    var best = null;
    Object.keys(roles).forEach(function (k) { if (!best || roles[k] > roles[best]) best = k; });
    var parts = [fields + ' 个字段'];
    if (best) parts.push('多为' + best + ' ' + roles[best] + '/' + g.items.length);
    if (gaps) parts.push(gaps + ' 个缺口');
    if (g.merged) parts.push('另并进 ' + g.merged + ' 个更小的族');
    if (chg) parts.push(chg + ' 个有变更');
    if (bad) parts.push(bad + ' 个对不上');
    return parts.join(' · ');
  }

  /* 语义族：一条协议一个族。族数封顶 G_MAXB - 1 —— 范围带还要占一条带上限，
     超出的并进「其它类型」并如实计数，不悄悄丢掉几个族。 */
  function familyGroupsOf(items, facetAxis) {
    var idx = {}, order = [];
    items.forEach(function (it) {
      var f = familyOf(it, facetAxis);
      if (!idx[f.key]) { idx[f.key] = { key: f.key, label: f.name, items: [] }; order.push(idx[f.key]); }
      idx[f.key].items.push(it);
    });
    order.sort(function (a, b) {
      if (a.items.length !== b.items.length) return b.items.length - a.items.length;
      return a.label < b.label ? -1 : 1;
    });
    var other = null;
    order.forEach(function (d) { if (d.key === '__other') other = d; });
    var room = G_MAXB - 1;
    if (order.length > room) {
      var keep = order.slice(0, room - 1);
      var tail = order.slice(room - 1);
      if (!other) { other = { key: '__other', label: '其它类型', items: [] }; keep.push(other); }
      var merged = 0;
      tail.forEach(function (d) {
        if (d === other) return;
        other.items = other.items.concat(d.items);
        merged++;
      });
      /* 并进来几个族要说出来："这些我没归类"和"还有 50 个小族被并进来了"不是一回事 */
      other.merged = merged;
      order = keep;
    }
    order = order.filter(function (d) { return d !== other; });
    if (other) order.push(other);   /* 兜底永远排最后：它是兜底，不是这个项目的主体 */
    order.forEach(function (d) { d.unit = '协议'; });
    return order;
  }

  /* 目录：分组 = 这一层的直接子目录。**直接放在这一层的协议**单独成一个「本层」分组
     （右图里它是一条同名的带，左树里它是一个同名的分组节点）——不许把没有目录名的
     协议悄悄塞进别人的组里。 */
  function dirGroupsOf(items, scope) {
    var node = dirNodeAt(buildDirTree(items), scope);
    var out = [];
    dirNamesOf(node).forEach(function (name) {
      /* path 是**完整的目录路径**（带层级，如 src/pages/MvizLite/search）：图上那条带写的
         「对应左边：<path>」用的就是它，左树那一行的 data-dir 也是同一个串 —— 点带标题
         才能按这个串定位回左边那一行。key 与以前一致，分区本身没有任何变化。 */
      var full = scope ? scope + '/' + name : name;
      out.push({ key: 'dr:' + full, label: name, path: full,
                 items: dirSubtreeItems(node.kids[name]) });
    });
    if (node.items.length) out.push({ key: '__here', label: '（本层）', path: scope || '(根)',
                                      items: node.items.slice(), here: true });
    out.forEach(function (g) { g.unit = '协议'; });
    return out;
  }

  /* 分组：返回 { axis, axisName, scope, scopeLabel, groups, why, items }。
     groups[i] = { key, label, items, n, sources, note, unit }。 */
  function planOf(items, axis, scope) {
    var why, groups;
    if (axis === 'dir') {
      groups = dirGroupsOf(items, scope);
      why = '这一层的直接子目录，与左边树里那一层同名、同序';
    } else {
      var facetAxis = domainAxis(items);
      groups = familyGroupsOf(items, facetAxis);
      why = '按' + facetAxis.name + '分：' + facetAxis.why;
    }
    groups.forEach(function (g) {
      g.n = g.items.length;
      g.sources = groupSources(g.items);
      g.note = groupNoteOf(g);
    });
    return { axis: axis, axisName: AXIS_NAMES[axis] || String(axis), scope: scope || null,
             scopeLabel: scopeLabelOf(scope), groups: groups, why: why, items: items };
  }

  function tagsOf(it) { return (it && it.facets) || []; }

  function axisValues(it, axis) {
    var want = axis + ':';
    var out = [];
    var tags = tagsOf(it);
    for (var i = 0; i < tags.length; i++) {
      if (tags[i].indexOf(want) === 0) out.push(tags[i].slice(want.length));
    }
    return out;
  }

  function tagValue(it, axis) {
    var vals = axisValues(it, axis);
    return vals.length ? vals[0] : '';
  }

  function facetLabel(axis, value) {
    var m = S.labels && S.labels[axis];
    return (m && m[value]) || value;
  }

  function hayOf(it) {
    var c = (it && it.contract) || {};
    return ((c.title || '') + ' ' + (c.boundary || '') + ' ' + (c.file || '') + ' ' + (c.symbol || '')).toLowerCase();
  }

  /* 事态：变过或不对，才算"现在需要你看的"。没有分面数据时退回旧的两个开关。 */
  function isHot(it) {
    if (!S.axes.length) return changedIn(it).length > 0 || findingsOf(it).length > 0;
    return axisValues(it, 'state').length > 0;
  }

  function matchFacets(it, skipAxis) {
    for (var axis in S.facets) {
      if (!Object.prototype.hasOwnProperty.call(S.facets, axis)) continue;
      if (axis === skipAxis) continue;
      var picked = Object.keys(S.facets[axis]);
      if (!picked.length) continue;
      var vals = axisValues(it, axis);
      var hit = false;
      for (var i = 0; i < vals.length; i++) {
        if (picked.indexOf(vals[i]) !== -1) { hit = true; break; }
      }
      if (!hit) return false;
    }
    return true;
  }

  function facetCount() {
    var n = 0;
    for (var axis in S.facets) {
      if (!Object.prototype.hasOwnProperty.call(S.facets, axis)) continue;
      n += Object.keys(S.facets[axis]).length;
    }
    return n;
  }

  function clearConditions() {
    S.facets = {}; S.q = ''; S.filt = { changed: false, finding: false }; S.caps = {};
  }

  /* ---------- 左树 ---------- */
  function visibleItems() {
    var q = S.q.trim().toLowerCase();
    return S.items.filter(function (it) {
      if (!S.axes.length) {
        if (S.filt.changed && !changedIn(it).length) return false;
        if (S.filt.finding && !findingsOf(it).length) return false;
      }
      if (!matchFacets(it)) return false;
      return !q || hayOf(it).indexOf(q) !== -1;
    });
  }

  /* 分面栏：每个面带计数。计数按"其它面已选中"来算，所以数字就是"再点一下还剩几条"。
     这里只有**筛选**，没有分组：分组永远只有目录那一套（planOf 的 'dir'），
     任何"第二处分组"都是"左边一套、右边一套"的来源，都不要再加回来。 */
  function renderFacetBar() {
    /* 分面归「筛选」管：点按钮才展开的那层浮层里。左栏常驻一条会同时占掉树的高度，
       也把"收窄条件"这件事拆到两个地方。 */
    var pop = $('#filtPop');
    if (!pop) return;
    var bar = $('#facets');
    if (!bar) {
      bar = el('div', { class: 'facets', id: 'facets' });
      pop.appendChild(bar);
    }
    if (!S.axes.length || !S.items.length) { bar.hidden = true; return; }
    bar.hidden = false;
    clear(bar);

    /* 这一行只是如实报出"现在按什么分区"：分区只有目录一套，没有开关可切。
       左树的目录与右图的带取的是同一份 planOf(items, 'dir', scope)，两边同名同序。 */
    bar.appendChild(el('div', { class: 'faxis' },
      el('span', { class: 'fname', text: '分区' }),
      el('span', { class: 'fval', title: '左右两边永远是同一套目录分区；块上写着「对应左边：<目录路径>」',
        text: AXIS_NAMES[S.axis] || S.axis })));

    var q = S.q.trim().toLowerCase();
    S.axes.forEach(function (axis) {
      /* 事态在树的顶部单独说，不在这儿再占一行。 */
      if (axis.id === 'state') return;
      var counts = {};
      S.items.forEach(function (it) {
        if (!matchFacets(it, axis.id)) return;
        if (q && hayOf(it).indexOf(q) === -1) return;
        axisValues(it, axis.id).forEach(function (v) { counts[v] = (counts[v] || 0) + 1; });
      });
      var values = Object.keys(counts);
      if (values.length <= 1) return;
      values.sort(function (a, b) { return counts[b] - counts[a]; });

      var row = el('div', { class: 'faxis' },
        el('span', { class: 'fname', title: axis.hint, text: axis.label }));
      values.forEach(function (v) {
        var picked = S.facets[axis.id] && S.facets[axis.id][v];
        var b = el('button', { class: 'fval' + (picked ? ' on' : ''), type: 'button',
          text: facetLabel(axis.id, v) + ' ' + counts[v] });
        b.addEventListener('click', function () {
          S.facets[axis.id] = S.facets[axis.id] || {};
          if (S.facets[axis.id][v]) delete S.facets[axis.id][v];
          else S.facets[axis.id][v] = true;
          S.caps = {};
          renderAll();
        });
        row.appendChild(b);
      });
      bar.appendChild(row);
    });
  }

  /* 左树。ctx 由 renderAll() 算好一份（见 currentCtx）：里面的 plan 就是右图用来画带的那一份，
     两边**不可能**分叉 —— 分组节点和带是同一组对象的两个画法。 */
  function renderTree(ctx) {
    var tree = $('#tree');
    clear(tree);
    if (!S.p) {
      // 空状态要给出下一步，否则右侧栏看起来就像坏了。
      tree.appendChild(el('div', { class: 'empty', text: '还没有纳管任何项目。' }));
      tree.appendChild(el('div', { class: 'empty', style: 'margin-top:6px;opacity:.8',
        text: '点右上角「纳管项目」，先看一遍它能抽出什么，再由你决定纳管哪些。这一步只读。' }));
      return;
    }
    var items = ctx.items;
    if (!items.length) {
      tree.appendChild(el('div', { class: 'empty',
        text: S.items.length ? '当前条件没有匹配的契约。' : '这个项目里还没纳管契约。' }));
      if (S.items.length && (facetCount() || S.q.trim())) {
        var clr = el('button', { class: 'ghost', type: 'button', text: '清除全部条件' });
        clr.style.margin = '8px 0 0';
        clr.addEventListener('click', function () { clearConditions(); renderAll(); });
        tree.appendChild(clr);
      }
      return;
    }

    /* 事态优先：默认只铺"有事的"。几百条里通常只有个位数需要现在处理，剩下的收成一行。
       收窄的是**条目**，不是分组：分组节点永远按可见全集铺，
       否则"左边一个族、右边十条带"这种事又会回来。 */
    if (ctx.focus) {
      var more = null;
      if (ctx.cold.length) {
        more = el('button', { class: 'hotmore', type: 'button', text: '展开其余 ' + ctx.cold.length + ' 条' });
        more.addEventListener('click', function () { S.attention = false; S.caps = {}; renderAll(); });
      }
      tree.appendChild(el('div', { class: 'hotbar has' },
        el('span', { class: 'hotn', text: '要注意 ' + ctx.hot.length + ' 条' }), more));
    } else {
      var bar = el('div', { class: 'hotbar' },
        el('span', { class: 'hotn', text: '没有要注意的' }),
        el('span', { text: '· 下面是全部 ' + items.length + ' 条' }));
      if (ctx.hot.length) {
        var back = el('button', { class: 'hotmore', type: 'button', text: '只看要注意的' });
        back.addEventListener('click', function () { S.attention = true; S.caps = {}; renderAll(); });
        bar.appendChild(back);
      }
      tree.appendChild(bar);
    }

    /* 范围行：与右图第一条带同一个名字。目录轴、语义族轴都先把它画出来 ——
       "现在看的是哪儿"写在两边最上面，人才不用猜左右是不是同一个范围。 */
    tree.appendChild(scopeRow(ctx.plan));

    /* 只有这一条路：**就是那棵目录树**（逐层展开、每层可折叠、每层带计数、每层 40 行上限），
       右图的带取这一层的子目录名，同名同序（同一个 dirNamesOf）。
       顶层再也不会出现按"语义族"分组的节点 —— renderFamilyTree 还留着，但没人调用它。 */
    renderDirTree(tree, ctx.shown);
  }

  /* 范围行：左树顶上那一行，对应右图第一条带。有范围时可一键回到全项目。 */
  function scopeRow(plan) {
    var back = null;
    if (plan.scope) {
      back = el('button', { class: 'hotmore', type: 'button', text: '看全项目' });
      back.addEventListener('click', function (e) {
        e.stopPropagation();
        S.dirView = null; S.caps = {}; renderAll();
      });
    }
    return el('div', { class: 'trow tscope',
      title: '左右两边看的是同一个范围：' + plan.scopeLabel + '；图上的第一条带就是它' },
      el('span', { class: 'tpath', text: '范围' }),
      el('span', { class: 'tdirname', text: plan.scopeLabel }),
      back);
  }

  /* 族节点一行：箭头 + 族图标 + 族名 + 有事条数 + 来源摘要 + 协议数。
     和目录行共用同一套网格（箭头 13px + 图标 14px），所以族下面的协议行
     正好比族名深 13px，不会一行一个缩进。 */
  function groupNodeRow(g, rows, depth, anc, key) {
    var open = S.caps[key];
    if (open === undefined) open = true;   /* 族默认展开：协议名才是要看的东西 */
    var hotN = rows.filter(isHot).length;
    var caret = el('span', { class: 'tcaret' + (open ? ' open' : ''), text: '▸' });
    caret.addEventListener('click', function (e) {
      e.stopPropagation();
      S.caps[key] = !open;
      renderAll();
    });
    var src = sourceText(g.sources, 2);
    var head = el('div', { class: 'trow t-fam t-fold',
      title: g.label + '：' + rows.length + ' 条协议；' + (g.note || '') + (src ? '；' + sourceTip(g) : '') },
      guidesOf(depth, anc),
      caret,
      ticoOf(ICON_FAM),
      el('span', { class: 'tdirname', text: g.label }),
      hotN ? el('span', { class: 'chip chip-warn', text: hotN + ' 条要注意' }) : null,
      src ? el('span', { class: 'tsrc', text: src }) : null,
      el('span', { class: 'cnt', text: String(rows.length) }));
    head.addEventListener('click', function () { S.caps[key] = !open; renderAll(); });
    return head;
  }

  /* 「本层」这一组：直接放在这一层的协议（右图里它是一条同名的带） */
  function hereRow(rows, depth, anc, key) {
    var open = S.caps[key];
    if (open === undefined) open = true;
    var caret = el('span', { class: 'tcaret' + (open ? ' open' : ''), text: '▸' });
    caret.addEventListener('click', function (e) {
      e.stopPropagation();
      S.caps[key] = !open;
      renderAll();
    });
    /* 「本层」也是分组节点（图上有同名带），所以同样给来源摘要 —— 它说的就是"本层"到底是哪个目录 */
    var hereSrc = sourceText(groupSources(rows), 2);
    var head = el('div', { class: 'trow t-fam t-fold',
      /* 这一行代表的是"哪个目录里的本层协议"：key 就是 'here:<目录路径>'，取出来给定位用 */
      'data-here': key.indexOf('here:') === 0 ? key.slice(5) : null,
      title: '这些协议直接放在这一层（' + rows.length + ' 条）；图上它们是范围带旁边那条同名带'
             + (hereSrc ? '；这一组里的协议放在：' + sourceTip({ sources: groupSources(rows) }) : '') },
      guidesOf(depth, anc),
      caret,
      ticoOf(ICON_LEAF),
      el('span', { class: 'tdirname', text: '（本层）' }),
      hereSrc ? el('span', { class: 'tsrc', text: hereSrc }) : null,
      el('span', { class: 'cnt', text: String(rows.length) }));
    head.addEventListener('click', function () { S.caps[key] = !open; renderAll(); });
    return head;
  }

  /* 语义族轴的树：分组节点就是 plan.groups（与右图的带同一份对象） */
  function renderFamilyTree(tree, ctx) {
    ctx.plan.groups.forEach(function (g) {
      var key = 'fam:' + g.key;
      tree.appendChild(groupNodeRow(g, g.items, 0, [], key));
      if (S.caps[key] === false) return;
      renderRows(tree, g.items, key, 1, []);
    });
  }

  /* 一次只铺可见行：1400 条不该变成 1400 个节点。 */
  /* 缩进与引导线：每层一个 13px 的 <i>，末层用 elbow —— 竖线只到中间，再加一条横线接到内容。
     这套 .t-guides 的样式（含 elbow/tee）面板里早就写好了，是"带线"的正解；
     自己画渐变既重复又会被行悬停的 background 简写冲掉。 */
  /* anc[k] = 深度 k 的那个祖先后面还有没有兄弟。没有的话，它那一列的竖线到此为止，
     否则最后一个孩子的左边会拖着一条下面什么都没有的线。最内层永远是 elbow（只往上的拐角）。 */
  function guidesOf(depth, anc) {
    var g = el('span', { class: 't-guides' });
    for (var i = 0; i < depth; i++) {
      if (i === depth - 1) { g.appendChild(el('i', { class: 'elbow' })); continue; }
      if (anc && anc[i + 1] === false) { g.appendChild(el('i', { class: 'blank' })); continue; }
      g.appendChild(el('i', {}));
    }
    return g;
  }

  /* 两类行的图标都是内联 SVG、走 currentColor，尺寸定在 CSS 的 .tico 上（两类同宽 14px）。
     目录 = 文件夹轮廓，契约（叶子）= 文档；不用 emoji，也不用字形（字形宽度随字体变，会撑歪网格）。 */
  var ICON_DIR = '<svg viewBox="0 0 14 14" fill="none" aria-hidden="true">'
    + '<path d="M1.7 3.4c0-.4.3-.7.7-.7h2.5c.2 0 .4.1.6.3l.6.9h5.5c.4 0 .7.3.7.7v6.3c0 .4-.3.7-.7.7H2.4a.7.7 0 0 1-.7-.7V3.4z"'
    + ' stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>';
  var ICON_LEAF = '<svg viewBox="0 0 14 14" fill="none" aria-hidden="true">'
    + '<path d="M3.3 1.7h4.8L11 4.6v7.7H3.3V1.7z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>'
    + '<path d="M8.1 1.7v2.9H11" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>';
  /* 目录行右端的「看这个目录的图」：三个节点连成一张图。 */
  var ICON_GRAPH = '<svg viewBox="0 0 14 14" fill="none" aria-hidden="true">'
    + '<path d="M7 4.6 3.7 9.6M7 4.6l3.3 5M4.8 11.1h4.4" stroke="currentColor" stroke-width="1.1"/>'
    + '<circle cx="7" cy="3" r="1.6" stroke="currentColor" stroke-width="1.1"/>'
    + '<circle cx="3.1" cy="11" r="1.5" stroke="currentColor" stroke-width="1.1"/>'
    + '<circle cx="10.9" cy="11" r="1.5" stroke="currentColor" stroke-width="1.1"/></svg>';
  /* 协议族的图标：两层叠起来的"一堆"（族 = 一堆同类的协议），与目录的文件夹轮廓分得开。
     同样是 14px 见方、走 currentColor —— 三类行固定同宽，13px 的缩进网格才不会被撑歪。 */
  var ICON_FAM = '<svg viewBox="0 0 14 14" fill="none" aria-hidden="true">'
    + '<rect x="1.9" y="2.2" width="10.2" height="4.1" rx="1.3" stroke="currentColor" stroke-width="1.1"/>'
    + '<rect x="1.9" y="7.7" width="10.2" height="4.1" rx="1.3" stroke="currentColor" stroke-width="1.1"/></svg>';

  function ticoOf(markup) { return el('span', { class: 'tico', html: markup }); }

  function renderRows(tree, rows, key, depth, anc) {
    var cap = S.caps['rows:' + key] || 40;
    var pad = 10 + (depth === undefined ? 2 : depth) * 14;
    rows.slice(0, cap).forEach(function (it) {
      var c = it.contract;
      var row = el('div', { 'data-id': c.id, class: 'trow t-con' + (c.id === S.sel ? ' on' : ''),
        /* 文件名只出现在悬浮提示里（图上与行上都不放）：它回答的是"东西在哪儿"，
           而行的名字回答的是"这是什么协议"。 */
        title: (c.file ? c.file + (c.evidence && c.evidence.line ? ':' + c.evidence.line : '') + ' · ' : '') + (c.boundary || '') },
        guidesOf(depth === undefined ? 2 : depth, anc),
        /* 让出目录行箭头那一列（13px）：叶子的名字 x 才正好是它父目录名字 x + 13px */
        el('span', { class: 'tcol' }),
        ticoOf(ICON_LEAF),
        el('span', { class: 'tname', text: c.title }),
        /* AI 中文职责跟在名字后面（灰字、截短，全文在悬浮提示里）。它是个 flex:none 的尾巴，
           不占伸缩位，所以既有的 13px 缩进网格、省略号与点击/折叠行为一个字都没改。 */
        aiTagOf(c));
      chipsOf(it).forEach(function (x) { row.appendChild(x); });
      row.addEventListener('click', function () { S.sel = c.id; S.dirView = null; renderAll(); });
      tree.appendChild(row);
    });
    if (rows.length > cap) {
      var rest = el('button', { class: 'hotmore', type: 'button',
        text: '这一组还有 ' + (rows.length - cap) + ' 条' });
      rest.style.margin = '2px 0 6px 14px';
      rest.addEventListener('click', function () { S.caps['rows:' + key] = cap + 200; renderAll(); });
      tree.appendChild(rest);
    }
  }

  /* 目录树：这个项目 1400 条按顶层目录只有 4 组、最大一组 1329 条——那不是分组，是把问题挪了个地方。
     这里逐层展开、每层可折叠、每层带计数，人不必读到底就知道哪一枝有事。 */
  function emptyDirNode() { return { n: 0, hot: 0, kids: {}, items: [] }; }

  function buildDirTree(items) {
    var root = emptyDirNode();
    items.forEach(function (it) {
      var file = (it.contract && it.contract.file) || '';
      var parts = file.split('/').filter(function (x) { return x.length > 0; });
      var dirs = parts.slice(0, parts.length - 1);
      var node = root;
      node.n++; if (isHot(it)) node.hot++;
      dirs.forEach(function (d) {
        if (!node.kids[d]) node.kids[d] = emptyDirNode();
        node = node.kids[d];
        node.n++; if (isHot(it)) node.hot++;
      });
      node.items.push(it);
    });
    return root;
  }

  function renderDirTree(tree, items) {
    walkDir(tree, buildDirTree(items), '', 0, []);
  }

  function walkDir(tree, node, path, depth, anc) {
    /* 顺序只此一处：分区（右图的带）用的是同一个 dirNamesOf，两边同名同序 */
    var names = dirNamesOf(node);
    names.forEach(function (name, ni) {
      /* 这一层后面还有没有内容（同级目录，或「本层」那一组）：没有就不再往下画线 */
      var hasNext = ni < names.length - 1 || node.items.length > 0;
      var childAnc = (anc || []).slice();
      childAnc[depth] = hasNext;
      var child = node.kids[name];
      var full = path ? path + '/' + name : name;
      var open = S.caps['dir:' + full];
      if (open === undefined) open = depth < 2;
      /* 点目录行的任何地方（除两个图标按钮）= 开合；「看这个目录的图」归右端那个小图按钮。
         箭头自己也仍然可点（stopPropagation，免得行再翻一次），展开时转 90°，开合一眼看得出。 */
      var caret = el('span', { class: 'tcaret' + (open ? ' open' : ''), text: '▸' });
      caret.addEventListener('click', function (e) {
        e.stopPropagation();
        S.caps['dir:' + full] = !open;
        renderAll();
      });
      var graphBtn = el('button', { class: 'tico tico-btn' + (S.dirView === full ? ' on' : ''),
        type: 'button', title: '看这个目录的图', 'aria-label': '看这个目录的图', html: ICON_GRAPH });
      graphBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        /* 看这个目录的图：顺手把它和它的祖先都展开。图上的带就是这一层的子目录，
           树里那一层要是收着的，"左边这几个分组、右边这几条带"就没法对着看。 */
        var segs = full.split('/'), acc2 = '';
        for (var si = 0; si < segs.length; si++) {
          acc2 = acc2 ? acc2 + '/' + segs[si] : segs[si];
          S.caps['dir:' + acc2] = true;
        }
        S.sel = null; S.dirView = full; renderAll();
      });
      var head = el('div', { class: 'trow t-dir t-fold' + (S.dirView === full ? ' on' : ''), title: full,
        /* data-dir = 完整目录路径。点右图那条带的标题时，就是按这个串回到这一行（revealDirInTree） */
        'data-dir': full },
        guidesOf(depth, anc),
        caret,
        graphBtn,
        el('span', { class: 'tdirname', text: name }),
        child.hot ? el('span', { class: 'chip chip-warn', text: child.hot + ' 条要注意' }) : null,
        el('span', { class: 'cnt', text: String(child.n) }));
      head.addEventListener('click', function () {
        S.caps['dir:' + full] = !open;
        renderAll();
      });
      tree.appendChild(head);
      if (!open) return;
      walkDir(tree, child, full, depth + 1, childAnc);
      /* 直接放在这个目录里的协议：收进一个「本层」分组节点。
         右图里它就是同名的一条带，所以"这一层左边有几个分组节点、右边就有几条带"永远成立。 */
      if (child.items.length) {
        var hkey = 'here:' + full;
        tree.appendChild(hereRow(child.items, depth + 1, childAnc, hkey));
        if (S.caps[hkey] !== false) renderRows(tree, child.items, hkey, depth + 2, childAnc.concat([false]));
      }
    });
    if (depth === 0 && node.items.length) {
      var rkey = 'here:(根)';
      tree.appendChild(hereRow(node.items, 0, anc, rkey));
      if (S.caps[rkey] !== false) renderRows(tree, node.items, rkey, 1, anc);
    }
  }

  /* ---------- 主区 ---------- */
  function verdict(text, bad) { return el('div', { class: 'verdict' + (bad ? ' bad' : '') }, text); }

  /* 提示条（S.note）：一次动作的结果属于"这个面板"，不属于某一个视图——重扫、重新生成、
     记录决策都会写它。所以三个视图都要把它画出来，否则人在契约详情页点完按钮什么也看不到，
     那正是"静默失败"。 */
  function noteRow() {
    return S.note ? el('div', { class: 'note', text: S.note }) : null;
  }

  function renderOverview(ctx) {
    // 还没有项目时没有总览可言：侧栏已经在说明下一步（纳管），这里不该再去读 p.title。
    if (!S.p) { var emptyBox = document.getElementById("detail"); if (emptyBox) clear(emptyBox); return; }
    var box = $('#detail');
    clear(box);
    var p = S.p;
    var plan = ctx.plan;
    var chgN = 0, badN = 0, brkN = 0;
    S.items.forEach(function (it) {
      if (changedIn(it).length) { chgN++; if (breakingIn(it)) brkN++; }
      if (findingsOf(it).length) badN++;
    });
    box.appendChild(el('div', { class: 'chead' },
      el('div', { class: 'ctitle', text: p.title }),
      el('div', { class: 'cline2' },
        el('span', { class: 'chip chip-dim', text: S.items.length + ' 条契约' }),
        chgN ? el('span', { class: 'chip chip-warn', text: chgN + ' 条变过' }) : null,
        brkN ? el('span', { class: 'chip chip-bad', text: brkN + ' 条有破坏性变化' }) : null,
        badN ? el('span', { class: 'chip chip-bad', text: badN + ' 条检查到不符' }) : null,
        (!chgN && !badN) ? el('span', { class: 'chip chip-dim', text: '一切照旧' }) : null)));

    var sa = el('div', { class: 'scrollarea' });
    if (S.note) sa.appendChild(noteRow());
    if (!S.items.length) {
      sa.appendChild(el('div', { class: 'empty', text: '这个项目里还没有纳管契约。点左边侧边栏的「生成」选一次重扫，看看有没有新东西长出来。' }));
    } else {
      /* 分区图放最上面：这一屏是"一眼看清这个项目是怎么分的"，
         图上的带与左边树的分组节点是同一份分区（plan 由 renderAll 算一次，两边共用）。
         清单一类的明细仍在下面，条数与渐进展开不变。 */
      var gb = el('div', { class: 'block' });
      gb.appendChild(el('div', { class: 'bh' }, el('h2', { text: plan.axisName + '分区图' }),
        el('span', { class: 'sub', text: '与左边树同一份分区：' + plan.groups.length + ' 个' + plan.axisName +
          (ctx.focus ? '（只看要注意的 ' + ctx.shown.length + ' 条）' : '') })));
      gb.appendChild(renderGraph(dirGraphIR(null, plan), {
        avail: gAvail(box),
        emptyText: '这个范围里没有可以画成节点的协议。',
        /* 点带的标题 = 在左树里定位到这个块对应的目录（展开 + 滚动 + 闪一下） */
        pickDir: function (dirPath, here) { revealDirInTree(dirPath, here); },
        pick: function (n) {
          var id = n.contractId;
          if (!id) return;
          S.dirView = null;
          S.sel = id;
          revealInTree(id);
        }
      }));
      sa.appendChild(gb);

      var b = el('div', { class: 'block' });
      b.appendChild(el('div', { class: 'bh' }, el('h2', { text: '契约清单' }),
        el('span', { class: 'sub', text: '点一条看它的输入输出与演化' })));
      /* 一次铺一千多条会把主区撑到八千多个节点，打开面板就是一次大重排。
         先给一屏看得完的量，其余按需展开——这是看板，不是导出清单。 */
      /* 渐进展开：每次只多铺 200 条，避免「展开其余」一点就铺满一千多行、把页面拖住。
         清单条数一变（换项目/搜索/筛选）就回到初始值。 */
      var ALL_CAP = 60, STEP = 200;
      if (S.listFor !== S.items.length) { S.listFor = S.items.length; S.listCap = ALL_CAP; }
      if (!S.listCap) S.listCap = ALL_CAP;
      S.listCap = Math.min(S.listCap, S.items.length);
      var showAll = S.listCap >= S.items.length;
      if (!showAll && S.items.length > ALL_CAP) {
        b.appendChild(el('div', { class: 'sub', style: 'padding:0 2px 8px',
          text: '先列出前 ' + ALL_CAP + ' 条（共 ' + S.items.length + ' 条）；用左边搜索或筛选缩小范围更快' }));
      }
      S.items.slice(0, S.listCap).forEach(function (it) {
        var c = it.contract;
        var chg = changedIn(it).length, bad = findingsOf(it).length;

        var row = el('div', { class: 'call', style: 'cursor:pointer' },
          el('div', { class: 'call-h' },
            el('span', { class: 'dot ' + (bad ? 'd-bad' : chg ? 'd-changed' : 'd-ok') }),
            el('span', { class: 'call-who', text: c.title }),
            el('span', { class: 'tag', text: c.boundaryKind }),
            chg ? el('span', { class: 'chip chip-warn', text: '变过' }) : null,
            bad ? el('span', { class: 'chip chip-bad', text: '不符' }) : null,
            el('span', { style: 'font-size:11.5px;color:var(--ink3)', text: c.boundary })));
        row.addEventListener('click', function () { S.sel = c.id; revealInTree(c.id); });
        b.appendChild(row);
      });
      if (!showAll) {
        var moreBtn = el('button', { class: 'hotmore',
          text: '继续展开 200 条（还有 ' + (S.items.length - S.listCap) + ' 条）' });
        moreBtn.addEventListener('click', function () { S.listCap += STEP; renderAll(); });
        b.appendChild(moreBtn);
      }
      sa.appendChild(b);
    }
    box.appendChild(sa);
  }

  /* ---------- 形状结构图 ----------
     字段树画成一张图：每层一个节点卡，父子之间在 svg.edges 上连一条折线。
     没有形状时如实说没有，不画一个空框骗人——那正是这个工具最不该做的事。 */
  var SVG_NS = 'http://www.w3.org/2000/svg';

  /* ============================================================
     图引擎：Mermaid 子集 → IR → 布局 → DOM（唯一一条渲染路径）

     上游（AI，或面板自己）只允许产出下面这个子集，解析成 IR 之后由移植自
     docs/contract-butler-preview.html 的布局引擎算成显式坐标再落 DOM。
     目录图和契约形状图都走 renderGraph()，两边的画法不可能再分叉。
     ============================================================ */

  /* ---------- 1. 子集解析 ----------
     首行 flowchart LR|TB；节点 id["显示名"]:::kind；边 A -->|rel| B；一层 subgraph。
     子集之外一律拒收：返回 {ok:false,line,why}，line 是出错行的原文，绝不猜、不抛异常。 */
  /* ---------- 0. 类型登记表（全文件唯一一份） ----------
     kind → 名称 / 颜色（tone，对应 CSS 里的 .gnode.tone-*）/ 形状（dashed）/ 图标 /
     角标规则（dot：这种类型画不画状态点）。渲染器只从这里查，任何地方都不许
     再按 kind 写死颜色或文案：想加一种类型，只改这张表 + 一条 tone 变量。

     这五个词是**协议**的词汇，不是文件系统的词汇：图上出现的是项目 / 协议族 /
     协议 / 字段，文件名只在悬浮提示里出现（用来定位）。 */
  var KIND_REGISTRY = {
    project:  { label: '项目',   tone: 'project',  dot: false, dashed: false, icon: '◆' },
    domain:   { label: '协议族', tone: 'domain',   dot: true,  dashed: false, icon: '▣' },
    protocol: { label: '协议',   tone: 'protocol', dot: true,  dashed: false, icon: '✦' },
    part:     { label: '字段',   tone: 'part',     dot: false, dashed: false, icon: '▤' },
    gap:      { label: '缺口',   tone: 'gap',      dot: true,  dashed: true,  icon: '△' }
  };
  /* 登记表以外的 kind：渲染成中性灰，不崩、也不猜成别的类型 */
  var KIND_UNKNOWN = { label: '未登记', tone: 'neutral', dot: true, dashed: false, icon: '·' };

  /* 旧词汇（hub / dir / file / contract）仍然接受：解析时归一化到新词汇，
     一个概念只有一种颜色、一份文案。旧输入不会报错，也不会画出两套配色。 */
  var KIND_ALIASES = { hub: 'project', dir: 'domain', file: 'part', contract: 'protocol' };

  function kindReg(kind) {
    return Object.prototype.hasOwnProperty.call(KIND_REGISTRY, kind) ? KIND_REGISTRY[kind] : KIND_UNKNOWN;
  }

  var M_KINDS = Object.keys(KIND_REGISTRY).concat(Object.keys(KIND_ALIASES));
  var M_RELS = ['contains', 'imports', 'emits', 'missing', 'defines'];
  var M_SUB = M_KINDS.join('|');

  function normalizeKind(kind) {
    if (Object.prototype.hasOwnProperty.call(KIND_REGISTRY, kind)) return kind;
    if (Object.prototype.hasOwnProperty.call(KIND_ALIASES, kind)) return KIND_ALIASES[kind];
    return kind;
  }

  /* 卡片上的状态点：优先级 有发现 > 破坏性变更 > 变过（和 demo 的 nodeMark 一致），
     都没有就不画点。这一份是状态 → 角标样式的唯一出处。 */
  var STATUS_DOT = { bad: 'd-bad', brk: 'd-brk', changed: 'd-changed' };
  var STATUS_RANK = { bad: 3, brk: 2, changed: 1 };
  var M_STATUS = Object.keys(STATUS_DOT);

  function statusDot(status) {
    return Object.prototype.hasOwnProperty.call(STATUS_DOT, status) ? STATUS_DOT[status] : '';
  }

  function mUnescape(s) { return String(s).replace(/\\(.)/g, '$1'); }

  function parseMermaidGraph(text) {
    var lines = String(text === null || text === undefined ? '' : text).split(/\r?\n/);
    var dir = null, bands = [], nodes = [], edges = [], open = null;
    var byNode = {}, byBand = {}, marks = {}, curNo = 0, i, raw, s, m;
    function bad(line, why) { return { ok: false, line: line, why: why, no: curNo }; }
    /* %% status / %% tip 可以写在节点前面，先记下来，最后统一挂到节点上 */
    function mark(id, key, val, line) {
      if (!marks[id]) marks[id] = { line: line };
      marks[id][key] = val;
    }

    for (i = 0; i < lines.length; i++) {
      raw = lines[i];
      curNo = i + 1;
      s = raw.trim();
      if (!s) continue;
      if (dir === null) {
        m = /^flowchart[ \t]+(LR|TB)$/.exec(s);
        if (!m) return bad(raw, '首行只认 flowchart LR 或 flowchart TB（只允许这两种方向）');
        dir = m[1];
        continue;
      }
      if (s === 'end') {
        if (!open) return bad(raw, '这个 end 没有对应的 subgraph 开头');
        open = null;
        continue;
      }
      if (/^subgraph\b/.test(s)) {
        m = /^subgraph[ \t]+([A-Za-z_]\w*)[ \t]*\[[ \t]*"((?:[^"\\]|\\.)*)"[ \t]*\]$/.exec(s);
        if (!m) return bad(raw, 'subgraph 只允许 subgraph id["显示名"] 这一种写法');
        if (open) return bad(raw, 'subgraph 不能嵌套 —— 归属带只允许一层');
        if (byBand[m[1]] || byNode[m[1]]) return bad(raw, 'id "' + m[1] + '" 已经被别的节点或带用了');
        byBand[m[1]] = { id: m[1], label: mUnescape(m[2]), n: null };
        bands.push(byBand[m[1]]);
        open = byBand[m[1]];
        continue;
      }
      /* 状态 / 提示用 Mermaid 注释行写：%% 开头的注释是所有渲染器都会忽略的合法语法。
         %% status: user=bad, order=changed
         %% tip: user=相对基线 v0.3 变过 2 次；观测到 1 处与契约不合 */
      m = /^%%[ \t]*status[ \t]*:(.*)$/.exec(s);
      if (m) {
        var stItems = m[1].split(',');
        for (var si = 0; si < stItems.length; si++) {
          var sp = stItems[si].trim();
          if (!sp) continue;
          var seq = sp.indexOf('=');
          if (seq < 1) return bad(raw, '%% status 只认 id=状态 这种写法，状态只能是 ' + M_STATUS.join('/'));
          var sv = sp.slice(seq + 1).trim();
          if (M_STATUS.indexOf(sv) < 0) {
            return bad(raw, '状态 "' + sv + '" 不在允许的 ' + M_STATUS.join('/') + ' 里 —— 不猜它是什么意思');
          }
          mark(sp.slice(0, seq).trim(), 'status', sv, raw);
        }
        continue;
      }
      m = /^%%[ \t]*tip[ \t]*:(.*)$/.exec(s);
      if (m) {
        var tseq = m[1].indexOf('=');
        if (tseq < 1) return bad(raw, '%% tip 只认 id=提示文案 这种写法');
        mark(m[1].slice(0, tseq).trim(), 'tip', m[1].slice(tseq + 1).trim(), raw);
        continue;
      }
      m = /^([A-Za-z_]\w*)[ \t]*\[[ \t]*"((?:[^"\\]|\\.)*)"[ \t]*\][ \t]*:::[ \t]*([A-Za-z_]\w*)$/.exec(s);
      if (m) {
        if (byNode[m[1]] || byBand[m[1]]) return bad(raw, 'id "' + m[1] + '" 已经被别的节点或带用了');
        if (M_KINDS.indexOf(m[3]) < 0) return bad(raw, 'kind "' + m[3] + '" 不在允许的 ' + M_SUB + ' 里');
        /* 名字下面那行副标题用 <br/> 写：id["名字<br/>12 条 · 注意 2"]:::protocol */
        var bits = mUnescape(m[2]).split(/<br[ \t]*\/?>/i).map(function (x) { return x.trim(); });
        var label = bits.shift() || '';
        var sub = bits.filter(function (x) { return x.length > 0; }).join(' · ') || null;
        byNode[m[1]] = { id: m[1], label: label, kind: normalizeKind(m[3]), band: open ? open.id : null,
                         sub: sub, status: null, tip: null };
        nodes.push(byNode[m[1]]);
        continue;
      }
      m = /^([A-Za-z_]\w*)[ \t]*-->[ \t]*\|[ \t]*([A-Za-z_]\w*)[ \t]*\|[ \t]*([A-Za-z_]\w*)$/.exec(s);
      if (m) {
        if (M_RELS.indexOf(m[2]) < 0) return bad(raw, 'rel "' + m[2] + '" 不在允许的 ' + M_RELS.join('/') + ' 里');
        if (!byNode[m[1]] && !byBand[m[1]]) return bad(raw, '边引用了没声明过的 "' + m[1] + '" —— 不猜它是什么');
        if (!byNode[m[3]] && !byBand[m[3]]) return bad(raw, '边引用了没声明过的 "' + m[3] + '" —— 不猜它是什么');
        edges.push({ from: m[1], to: m[3], rel: m[2] });
        continue;
      }
      if (/^(classDef|class|style|linkStyle|click|direction|accTitle|accDescr|%%)/.test(s)) {
        return bad(raw, '样式 / 指令 / 注释不在允许的子集里（只允许 flowchart 头、节点、边、一层 subgraph，以及 %% status / %% tip 两行）');
      }
      if (/-->|--x|--o|==>|-\.->|---|--/.test(s)) {
        return bad(raw, '边只允许 A -->|rel| B 这一种写法（没有 --x / ==> / -.-> / ---，也不允许不带 rel 的边）');
      }
      return bad(raw, '这不是子集里的语法（只认 节点 id["名字"]:::kind、边 A -->|rel| B、一层 subgraph end）');
    }
    if (dir === null) return bad('', '图是空的：连 flowchart 头都没有');
    if (open) return bad('', 'subgraph "' + open.id + '" 没有 end 关闭');
    curNo = 0;
    for (var mid in marks) {
      if (!Object.prototype.hasOwnProperty.call(marks, mid)) continue;
      if (!byNode[mid]) {
        curNo = marks[mid].line ? lines.indexOf(marks[mid].line) + 1 : 0;
        return bad(marks[mid].line, '%% 注释里的 "' + mid + '" 没有对应的节点 —— 状态 / 提示只能挂在声明过的节点上');
      }
      if (marks[mid].status !== undefined) byNode[mid].status = marks[mid].status;
      if (marks[mid].tip !== undefined) byNode[mid].tip = marks[mid].tip;
    }
    return { ok: true, ir: { direction: dir, bands: bands, nodes: nodes, edges: edges } };
  }

  /* ---------- 2. 规模上限（一律在 IR 层过一遍） ---------- */
  var G_MAXN = 80, G_MAXD = 6, G_MAXB = 12;

  /* demo rankOf()/depth()：按边的方向分层，rank 0 = 源头；有环时回边不参与，不会爆栈。
     defines（协议定义字段）不算一层：字段是协议自己的内容，不是它下面的下一个协议。
     不排它，字段才能和协议并排站成一列（见 layoutGraphIR 的「组」）。 */
  function graphRanks(ir) {
    var ins = {}, rank = {}, memo = {};
    ir.bands.forEach(function (b) { ins[b.id] = []; });
    ir.nodes.forEach(function (n) { ins[n.id] = []; });
    ir.edges.forEach(function (e) {
      if (e.rel === 'defines') return;
      if (e.from === e.to) return;
      if (!ins[e.to] || !ins[e.from]) return;
      if (ins[e.to].indexOf(e.from) >= 0) return;
      ins[e.to].push(e.from);
    });
    function depth(id, stack) {
      if (memo[id] !== undefined) return memo[id];
      if (stack[id]) return 0;
      stack[id] = 1;
      var r = 0;
      ins[id].forEach(function (f) { var v = depth(f, stack) + 1; if (v > r) r = v; });
      delete stack[id];
      memo[id] = r;
      return r;
    }
    ir.bands.concat(ir.nodes).forEach(function (e) { rank[e.id] = depth(e.id, {}); });
    /* 带里的节点不能排在自己的带前面（带自己也可能是边的端点，比如 root -->|contains| proto） */
    ir.nodes.forEach(function (n) {
      if (n.band && rank[n.band] !== undefined && rank[n.id] < rank[n.band]) rank[n.id] = rank[n.band];
    });
    return rank;
  }
