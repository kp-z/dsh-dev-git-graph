  function capGraphIR(ir) {
    var rank = graphRanks(ir);
    var keep = {}, bands = [], hiddenBand = 0, hiddenNode = 0, hiddenDepth = 0, hiddenKind = {};
    /* 带排在前面，超上限的带整条不画（成员跟着不画，并如实计数） */
    ir.bands.slice().sort(function (a, b) { return (rank[a.id] || 0) - (rank[b.id] || 0); })
      .forEach(function (b, i) {
        if (i < G_MAXB) { bands.push(b); keep[b.id] = 1; } else { hiddenBand++; }
      });
    /* 没画的节点按 kind 分类计数：说"还有 993 个协议、2104 个字段没画"比
       说"还有 3100 个节点没画"有用得多，而且都是真数出来的。 */
    function drop(n) {
      hiddenNode++;
      var k = normalizeKind(n.kind);
      hiddenKind[k] = (hiddenKind[k] || 0) + 1;
    }
    var nodes = [];
    ir.nodes.forEach(function (n) {
      if (n.band && !keep[n.band]) { drop(n); return; }
      if ((rank[n.id] || 0) >= G_MAXD) { hiddenDepth++; drop(n); return; }
      if (nodes.length >= G_MAXN) { drop(n); return; }
      nodes.push(n);
    });
    var ids = {};
    bands.forEach(function (b) { ids[b.id] = 1; });
    nodes.forEach(function (n) { ids[n.id] = 1; });
    var edges = [];
    ir.edges.forEach(function (e) { if (ids[e.from] && ids[e.to]) edges.push(e); });
    return {
      ir: { direction: ir.direction, bands: bands, nodes: nodes, edges: edges, note: ir.note || null },
      hidden: { nodes: hiddenNode, bands: hiddenBand, depth: hiddenDepth, kinds: hiddenKind }
    };
  }

  /* 上限说明必须如实：少了多少就说多少，并且说清是哪个上限。 */
  function capNote(hidden) {
    if (!hidden || (!hidden.nodes && !hidden.bands)) return null;
    var parts = [], kinds = hidden.kinds || {};
    Object.keys(KIND_REGISTRY).forEach(function (k) {
      if (kinds[k]) parts.push('还有 ' + kinds[k] + ' 个' + KIND_REGISTRY[k].label + '没画');
    });
    if (!parts.length && hidden.nodes) parts.push('还有 ' + hidden.nodes + ' 个节点没画');
    if (hidden.bands) parts.push('还有 ' + hidden.bands + ' 个协议族没画');
    return parts.join('，') + '（规模上限：节点 ' + G_MAXN + ' / 深度 ' + G_MAXD + ' / 协议族 ' + G_MAXB +
      (hidden.depth ? '；超过 ' + G_MAXD + ' 层的那部分整块没画' : '') + '）。';
  }

  function shapeTypeLabel(node) {
    if (!node || typeof node !== 'object') return '';
    var parts = [];
    if (node.kind) parts.push(String(node.kind));
    if (node.kind === 'array' || node.of || node.items) parts.push('数组');
    if (node.optional) parts.push('可空');
    return parts.join(' · ');
  }

  /* 形状的孩子：对象字段（fields 是 name → 节点 的映射）与数组元素（of）。
     数组元素也必须算一个孩子，否则嵌套形状在图上就是断的——那正是这条协议
     最该被看见的部分。`items` 是更早的读法，留着兼容老记录。 */
  function shapeChildFields(node) {
    if (!node || typeof node !== 'object') return [];
    var out = [];
    var fields = node.fields;
    if (fields && typeof fields === 'object') {
      Object.keys(fields).forEach(function (k) { out.push({ name: k, node: fields[k] }); });
    }
    var elem = node.of && typeof node.of === 'object' ? node.of : node.items;
    if (elem && typeof elem === 'object') {
      out.push({ name: '[每一项]', node: elem });
    }
    return out;
  }

  /* ---------- 3. 布局（移植 demo 的 layoutGraph） ----------
     带的几何、层的计算、边的正交路由与箭头 marker 都照 demo 的思路来，
     区别只有一处：demo 的节点属于"契约"，这里的节点属于 IR。 */
  var G_NW = 200, G_NH = 44, G_ROWGAP = 14, G_PAD = 24, G_COLGAP = 38, G_GUT = 38;
  var G_BANDGAP = 26, G_BANDHEAD = 26, G_BANDPAD = 20, G_MAXCOL = 4, G_LANE = 30;
  var G_RELORDER = ['contains', 'imports', 'emits', 'missing', 'defines'];
  /* defines = 协议定义字段：换成紫色，和其他四种关系分得开，浅色深色都读得清 */
  var G_RELCOLOR = { contains: '#8a8f98', imports: '#007aff', emits: '#16a34a', missing: '#dc2b22',
                     defines: '#7c4dff' };
  var G_UID = 0;

  /* 量文字：屏幕外造一张真卡片量它需要多高（canvas 的 measureText 拿不到 CSS 里的
     --mono，会退回默认字体算窄，不能用）。用真 class 才不会量错换行行数。 */
  var _gprobe = null;
  function gProbe() {
    if (!_gprobe) {
      _gprobe = document.createElement('div');
      _gprobe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
      document.body.appendChild(_gprobe);
    }
    return _gprobe;
  }

  /* 卡片里那两行字：第一行名字，第二行副标题 —— 类型名（登记表）+ 具体信息 */
  function gKindText(n, reg) {
    return reg.label + (n.sub ? ' · ' + n.sub : '');
  }

  /* 卡片的内部结构：状态点（登记表说这种类型要画才画）/ 类型图标 / 名字 + 副标题。
     量高度和真卡片必须是同一段代码搭出来的，否则量出来的高度不作数。 */
  function gCardInner(n) {
    var reg = kindReg(n.kind), dot = reg.dot ? statusDot(n.status) : '';
    return [
      dot ? el('span', { class: 'dot ' + dot }) : null,
      reg.icon ? el('span', { class: 'gicon', text: reg.icon }) : null,
      el('span', { class: 'gtext' },
        el('span', { class: 'gname', text: n.label === undefined || n.label === null ? '' : n.label }),
        el('span', { class: 'gkind', text: gKindText(n, reg) }),
        /* AI 中文职责当第三行（最多两行，多了截断）。有就画、没有就不画——
           卡片高度是拿这一段真量出来的（gNodeH 用同一个函数建卡片），所以多一行也不会压到别的。 */
        n.aiTitle ? el('span', { class: 'gai', text: n.aiTitle }) : null)
    ];
  }

  var _gcard = null;
  function gNodeH(n) {
    if (!_gcard) {
      _gcard = el('div', { class: 'gnode',
        style: 'position:absolute;left:-9999px;top:0;visibility:hidden;height:auto;margin:0;width:' + G_NW + 'px' });
      gProbe().appendChild(_gcard);
    }
    /* 有没有状态点、有没有副标题都会改变文字的可用宽度 —— 每次都按真卡片重建 */
    clear(_gcard);
    gCardInner(n).forEach(function (kid) { if (kid) _gcard.appendChild(kid); });
    _gcard.className = 'gnode tone-' + kindReg(n.kind).tone;
    /* +1 吸收亚像素舍入：宁可多半像素也不切字 */
    return Math.max(G_NH, Math.ceil(_gcard.getBoundingClientRect().height) + 1);
  }

  /* 带标题右边的条数：这条带里有几个"它自己那种东西"（协议族的头是几个协议，形状图的
     层带是几个字段），画下的和真实有的都写出来："图上只画了 2 个、其实有 76 个"这件事
     不许含糊过去。数哪几种 kind、用什么量词，都由 IR 给（band.kinds / band.unit）。 */
  function gBandCountText(b) {
    var list = (b && b.nodes) || [];
    var kinds = (b && b.kinds && b.kinds.length) ? b.kinds : ['protocol', 'gap'];
    var n = 0;
    list.forEach(function (x) {
      if (kinds.indexOf(normalizeKind(x.kind)) >= 0) n++;
    });
    var unit = (b && b.unit) ? b.unit : '协议';
    var total = (b && typeof b.n === 'number') ? b.n : n;
    if (total > n) return n + ' / ' + total + ' 个' + unit;
    return (total || n) + ' 个' + unit;
  }

  var _ghead = null;

  /* 带头上那一行：状态点（这一组里最要紧的那件事）+ 类型图标（查登记表）+ 名字 + 说明 +
     来源摘要 + 条数。量高度和真渲染共用这一段，别写两份。
     说明句用的是**这一组自己**的统计（字段规模 / 主要角色 / 缺口 / 变更）——按整个范围的主导边界
     写的话，这种"1012 条全是 schema"的项目里每条带都会印同一句"数据校验"，等于没说。 */
  function gBandHeadInner(b) {
    var reg = b.kind ? kindReg(b.kind) : null, dot = b.status ? statusDot(b.status) : '';
    var src = sourceText(b.sources, 2);
    return [
      dot ? el('span', { class: 'dot ' + dot }) : null,
      (reg && reg.icon) ? el('span', { class: 'gbandicon', text: reg.icon }) : null,
      el('span', { class: 'gbandname', text: b.label || '' }),
      /* 这条带对应左边哪个目录 —— 原样印出完整路径（带层级），点标题就定位到那一行。
         左右是同一套分区，所以这里写的串就是左树那一行的 data-dir / 范围串。 */
      b.note ? el('span', { class: 'gbandnote', text: b.note }) : null,
      src ? el('span', { class: 'gbandsrc', text: src }) : null,
      el('span', { class: 'gbandcount', text: gBandCountText(b) })
    ];
  }

  /* 带的悬浮提示：全量来源（带头上只印 2 处）+ 这条带是什么。
     左树那个分组节点的提示写的是同一件事，两边悬浮起来看到的是同一份。 */
  function gBandTip(b) {
    var t = [];
    if (b.kind === 'project') t.push('范围：' + (b.label || ''));
    else t.push('这一条带 = 左树里的分组节点「' + (b.label || '') + '」');
    if (b.note) t.push(b.note);
    var full = sourceTip({ sources: b.sources });
    if (full) t.push(full);
    return t.join('；');
  }

  function gBandHeadH(b) {
    if (!_ghead) {
      _ghead = el('div', { class: 'gbandhead',
        style: 'position:absolute;left:-9999px;top:0;visibility:hidden;height:auto' });
      gProbe().appendChild(_ghead);
    }
    /* 标题在框内按段换行，占多高就给它留多高 —— 绝不让它压到卡片。
       量的宽度必须和真框里一模一样：带的 border-box 宽 b.w 扣掉左右各 1px 边框，
       再扣掉标题自己的 left:16px / right:16px，就是 b.w - 34。
       差 2px 就可能让"说明 + 条数"挤到下一行，量出来 44px、真画出来 70px，压住卡片。 */
    _ghead.style.width = Math.max(80, b.w - 34) + 'px';
    clear(_ghead);
    gBandHeadInner(b).forEach(function (kid) { if (kid) _ghead.appendChild(kid); });
    return Math.ceil(_ghead.getBoundingClientRect().height);
  }

  /* 「组」：一个协议和它的字段竖着摞成一列（协议在上、字段在下），组与组左右并排。
     IR 给节点标 grp（第几组，从 0 起）和 grow（组内第几行，从 0 起）就能走这条路；
     没标 grp 的带还是原来的 rank 网格 —— 形状图和手工 Mermaid 输入都不受影响。
     组数超过能放下的列数就折成下一个区块（每个区块 blockRows 行）。 */
  function bandGrid(b, byWidth) {
    var maxGrp = -1, maxRow = 0, grouped = false;
    b.nodes.forEach(function (n) {
      if (typeof n.grp !== 'number') return;
      grouped = true;
      if (n.grp > maxGrp) maxGrp = n.grp;
      if (typeof n.grow === 'number' && n.grow + 1 > maxRow) maxRow = n.grow + 1;
    });
    if (!grouped) return null;
    var groups = maxGrp + 1;
    var cols = Math.min(groups, byWidth > 0 ? byWidth : 1);
    var blockRows = Math.max(1, maxRow);
    return {
      cols: cols,
      rows: blockRows * Math.max(1, Math.ceil(groups / cols)),
      place: function (n) {
        var g = n.grp, r = typeof n.grow === 'number' ? n.grow : 0;
        n.col = g % cols;
        n.row = Math.floor(g / cols) * blockRows + r;
      }
    };
  }

  function layoutGraphIR(ir, avail) {
    var availW = Math.max(380, avail || 720);
    var dir = ir.direction === 'TB' ? 'TB' : 'LR';
    var rank = graphRanks(ir);

    /* 带端点（root -->|contains| proto 这种）走左侧专线，所以先看有没有，再决定留不留那条道 */
    var bandIds = {};
    ir.bands.forEach(function (b) { bandIds[b.id] = 1; });
    var needLane = ir.edges.some(function (e) { return !!(bandIds[e.from] || bandIds[e.to]); });

    var PAD = G_PAD + (needLane ? G_LANE : 0);      /* 带统一从这条线开始 */
    var maxBWavail = availW - PAD - G_PAD - G_GUT;
    var byWidth = Math.floor((maxBWavail - G_BANDPAD * 2 - G_NW) / (G_NW + G_COLGAP)) + 1;
    if (byWidth > G_MAXCOL) byWidth = G_MAXCOL;
    if (byWidth < 1) byWidth = 1;

    /* 每个节点都必须属于一条带：带外的节点落进一条「顶层」带 */
    var bands = ir.bands.map(function (b, bi) {
      /* note 一路带到带头上：写 IR 的人说的那句话（第几层 / 这个目录有多少条）不能被布局吃掉。
         sources 同理：带头上那句"这一组里的协议放在哪几处"是从这儿来的。
         dirPath / here 也一样要一路带到头上：带头上那句「对应左边：<路径>」和"点标题定位到
         左树哪一行"都靠它们 —— 布局这一层只认自己列出来的字段，漏一个就被吃掉了。 */
      return { key: b.id, label: b.label, note: b.note || '', kind: b.kind || null,
               unit: b.unit || null, status: b.status || null,
               kinds: b.kinds || null, sources: b.sources || null,
               dirPath: b.dirPath || null, here: !!b.here,
               n: (typeof b.n === 'number' ? b.n : null), nodes: [], bi: bi };
    });
    var byKey = {};
    bands.forEach(function (b) { byKey[b.key] = b; });
    var loose = null;
    function bandFor(n) {
      var b = n.band ? byKey[n.band] : null;
      if (b) return b;
      if (!loose) {
        loose = { key: '__top', label: '顶层', note: '', n: null, nodes: [], bi: bands.length };
        bands.push(loose);
      }
      return loose;
    }
    ir.nodes.forEach(function (n, ord) {
      n.ord = ord;
      n.rank = rank[n.id] || 0;
      bandFor(n).nodes.push(n);
    });
    /* 带的下界取「自己接到的边」与「成员最小的 rank」里更靠后的那个：
       目录图里 root -->|contains| 带 会让带排到自己那一层。 */
    bands.forEach(function (b) {
      var self = rank[b.key] || 0, m = b.nodes.length ? Infinity : 0;
      b.nodes.forEach(function (n) { if (n.rank < m) m = n.rank; });
      b.rank = Math.max(self, m === Infinity ? 0 : m);
    });
    bands.sort(function (a, b) { return (a.rank - b.rank) || (a.bi - b.bi); });
    bands.forEach(function (b, i) { b.bi = i; });
    ir.nodes.forEach(function (n) { n.bi = bandFor(n).bi; });

    bands.forEach(function (b) {
      var grid = bandGrid(b, byWidth);
      var nc = grid ? grid.cols : Math.min(b.nodes.length, byWidth);
      if (nc < 1) nc = 1;
      b.nCol = nc;
      b.grid = grid;
      b.w = G_BANDPAD * 2 + nc * G_NW + (nc - 1) * G_COLGAP;
      b.pitch = nc > 1 ? (G_NW + G_COLGAP) : 0;
      b.headH = Math.max(G_BANDHEAD, 9 + gBandHeadH(b) + 8);
      b.nodes.forEach(function (n) { n.rk = Math.min(n.rank, nc - 1); });
    });
    ir.nodes.forEach(function (n) { n.h = gNodeH(n); });

    var maxBW = 0;
    bands.forEach(function (b) { if (b.w > maxBW) maxBW = b.w; });
    if (!bands.length) maxBW = maxBWavail > 0 ? maxBWavail : 380;
    var W = PAD + maxBW + G_GUT + G_PAD;
    /* 走线区放在「最宽那个带」的右边：所有带都比它窄，竖线不会穿带 */
    var GUTX = PAD + maxBW + G_GUT / 2;
    var LANEX = G_PAD + G_LANE / 2;
    function colX(bi, c) { return PAD + G_BANDPAD + c * bands[bi].pitch; }
    function chanR(bi, c) {
      var b = bands[bi];
      if (c >= b.nCol - 1) return PAD + b.w - G_BANDPAD / 2;
      return colX(bi, c) + G_NW + G_COLGAP / 2;
    }

    var y = G_PAD;
    bands.forEach(function (b) {
      b.x = PAD; b.y = y;
      var iy = y + b.headH;
      /* 按 rank 排序后铺网格：LR 先竖后横（demo 原样），TB 先横后竖。
         rank 顺序在阅读方向上保持，列数不超过 nCol，行数 = ceil(n/nCol)。
         带里带了「组」的（协议 + 它的字段）走组列：见 bandGrid()。 */
      var arr = b.nodes.slice();
      if (b.grid) {
        arr.sort(function (p, q) {
          return (p.grp - q.grp) || ((p.grow || 0) - (q.grow || 0)) || (p.ord - q.ord);
        });
      } else {
        arr.sort(function (p, q) { return (p.rk - q.rk) || (p.ord - q.ord); });
      }
      var rows = b.grid ? b.grid.rows : Math.max(1, Math.ceil(arr.length / b.nCol));
      var rowMax = [];
      arr.forEach(function (n, i) {
        if (b.grid) b.grid.place(n);
        else if (dir === 'TB') { n.col = i % b.nCol; n.row = Math.floor(i / b.nCol); }
        else { n.col = Math.floor(i / rows); n.row = i % rows; }
        n.x = colX(b.bi, n.col);
        if (!rowMax[n.row] || n.h > rowMax[n.row]) rowMax[n.row] = n.h;
      });
      var rowTop = [], ry = iy;
      for (var ri = 0; ri < rows; ri++) { rowTop[ri] = ry; ry += (rowMax[ri] || G_NH) + G_ROWGAP; }
      arr.forEach(function (n) {
        n.y = rowTop[n.row];
        n.rowBot = rowTop[n.row] + (rowMax[n.row] || G_NH);   /* 本行真正的底 */
      });
      b.rows = rows;
      b.cbot = ry - G_ROWGAP;
      b.h = (b.cbot - y) + G_BANDPAD;
      y += b.h + G_BANDGAP;
    });
    var H = y - G_BANDGAP + G_PAD;

    function belowY(n) {
      var b = bands[n.bi];
      return Math.min((n.rowBot || (n.y + n.h)) + G_ROWGAP / 2, b.cbot + G_BANDPAD / 2);
    }

    var nmap = {}, anmap = {};
    ir.nodes.forEach(function (n) { nmap[n.id] = n; });
    bands.forEach(function (b) {
      /* 带端点当一张「伪卡片」参与路由：位置是带的左边界中点，
         出入一律走左侧专线，箭头正好落在带上，不穿任何卡片。 */
      anmap[b.key] = { id: b.key, bandAnch: true, bi: b.bi, row: -1, col: -1,
                       x: b.x, y: b.y, h: b.h, rowBot: b.cbot };
    });
    function geom(id) { return nmap[id] || anmap[id]; }
    function isBand(g) { return !!(g && g.bandAnch); }

    var links = ir.edges.filter(function (l) { return geom(l.from) && geom(l.to); });

    /* 通道分配：同一条通道里的多条边占不同的道，杜绝共线重叠 */
    var bandUse = {}, gutUse = [], laneUse = [];
    links.forEach(function (l) {
      var A = geom(l.from), B = geom(l.to);
      if (isBand(A) || isBand(B)) { laneUse.push(l); return; }
      [A.bi, B.bi].forEach(function (bi) {
        if (!bandUse[bi]) bandUse[bi] = [];
        if (bandUse[bi].indexOf(l) < 0) bandUse[bi].push(l);
      });
      if (A.bi !== B.bi) gutUse.push(l);
    });
    function chYof(bi, l) {
      var arr = bandUse[bi] || [], n = arr.length, b = bands[bi];
      var i = arr.indexOf(l);
      var span = Math.min(G_BANDPAD - 6, Math.max(0, (n - 1) * 5));
      return b.cbot + G_BANDPAD / 2 + (n > 1 ? (-span / 2 + i * (span / (n - 1))) : 0);
    }
    function gutXof(l) {
      var n = gutUse.length, i = gutUse.indexOf(l);
      var span = Math.min(G_GUT - 10, Math.max(0, (n - 1) * 6));
      return GUTX + (n > 1 ? (-span / 2 + i * (span / (n - 1))) : 0);
    }
    function laneXof(l) {
      var n = laneUse.length, i = laneUse.indexOf(l);
      var span = Math.min(G_LANE - 10, Math.max(0, (n - 1) * 5));
      return LANEX + (n > 1 ? (-span / 2 + i * (span / (n - 1))) : 0);
    }

    /* 正交路由：走线只经过「节点下方空条 / 列通道 / 带底通道 / 右侧走线区 / 左侧专线」
       这几类无节点区域，永远不压卡片 */
    var routes = {};
    links.forEach(function (l, li) {
      var A = geom(l.from), B = geom(l.to);

      /* 带端点的边：左专线 → 目标（带从左边界进，节点从下边进） */
      if (isBand(A) || isBand(B)) {
        var lx = laneXof(l), pts = [];
        if (isBand(A)) { pts.push([A.x, A.y + A.h / 2], [lx, A.y + A.h / 2]); }
        else {
          pts.push([A.x + G_NW / 2, A.y + A.h], [A.x + G_NW / 2, belowY(A)], [lx, belowY(A)]);
        }
        if (isBand(B)) { pts.push([lx, B.y + B.h / 2], [B.x, B.y + B.h / 2]); }
        else {
          pts.push([lx, belowY(B)], [B.x + G_NW / 2, belowY(B)], [B.x + G_NW / 2, B.y + B.h]);
        }
        routes[li] = pts;
        return;
      }

      var acx = A.x + G_NW / 2, bcx = B.x + G_NW / 2;
      /* 卡片高度不一：横向快路的 y 取两个卡片竖直方向的重叠中点，才同时贴得住两边 */
      var acy = (Math.max(A.y, B.y) + Math.min(A.y + A.h, B.y + B.h)) / 2;

      /* 快路 1：同一行相邻列 —— 一条横线 */
      if (A.bi === B.bi && A.row === B.row && Math.abs(A.col - B.col) === 1) {
        routes[li] = (A.col < B.col) ? [[A.x + G_NW, acy], [B.x, acy]]
                                     : [[A.x, acy], [B.x + G_NW, acy]];
        return;
      }
      /* 快路 2：同一列相邻行 —— 一条竖线 */
      if (A.bi === B.bi && A.col === B.col && Math.abs(A.row - B.row) === 1) {
        routes[li] = (A.y < B.y) ? [[acx, A.y + A.h], [bcx, B.y]]
                                 : [[acx, A.y], [bcx, B.y + B.h]];
        return;
      }

      var rA = chanR(A.bi, A.col), rB = chanR(B.bi, B.col);
      var byA = belowY(A), byB = belowY(B);
      var cA = chYof(A.bi, l), cB = chYof(B.bi, l);
      var mid = [[acx, A.y + A.h], [acx, byA], [rA, byA], [rA, cA]];
      if (A.bi === B.bi) {
        mid.push([rB, cA]);
      } else {
        var gx = gutXof(l);
        mid.push([gx, cA], [gx, cB]);
      }
      mid.push([rB, cB], [rB, byB], [bcx, byB], [bcx, B.y + B.h]);
      routes[li] = mid;
    });

    /* 层级护栏（demo walk 的 v / blank / elbow / tee）：同一列里下面还有节点的，
       线接着走（tee）；最后一项收成肘形（elbow），不留悬空线。 */
    var rails = [];
    bands.forEach(function (b) {
      var byCol = {}, cols = [];
      b.nodes.forEach(function (n) {
        if (!byCol[n.col]) { byCol[n.col] = []; cols.push(n.col); }
        byCol[n.col].push(n);
      });
      cols.forEach(function (c) {
        var arr = byCol[c].sort(function (p, q) { return p.y - q.y; });
        for (var i = 0; i < arr.length - 1; i++) {
          if (arr[i].rail !== true) break;          /* 收成肘形了，线到此为止 */
          rails.push([arr[i].x + G_NW / 2, arr[i].rowBot, arr[i + 1].y]);
        }
      });
    });

    return { nodes: ir.nodes, bands: bands, links: links, routes: routes, rails: rails,
             W: W, H: H, GUTX: GUTX, dir: dir };
  }

  /* 正交折线：拐角加小圆角，去掉连续重复点（demo 原样） */
  function polyPath(pts) {
    var p = [];
    pts.forEach(function (q) {
      var last = p[p.length - 1];
      if (!last || Math.abs(last[0] - q[0]) > 0.5 || Math.abs(last[1] - q[1]) > 0.5) p.push(q);
    });
    if (p.length < 2) return '';
    var d = 'M' + p[0][0] + ',' + p[0][1];
    for (var i = 1; i < p.length - 1; i++) {
      var a = p[i - 1], c = p[i], e = p[i + 1];
      var v1x = c[0] - a[0], v1y = c[1] - a[1];
      var v2x = e[0] - c[0], v2y = e[1] - c[1];
      var l1 = Math.sqrt(v1x * v1x + v1y * v1y), l2 = Math.sqrt(v2x * v2x + v2y * v2y);
      var rr = Math.min(7, l1 / 2, l2 / 2);
      if (rr < 1) { d += ' L' + c[0] + ',' + c[1]; continue; }
      d += ' L' + (c[0] - v1x / l1 * rr) + ',' + (c[1] - v1y / l1 * rr)
         + ' Q' + c[0] + ',' + c[1] + ' ' + (c[0] + v2x / l2 * rr) + ',' + (c[1] + v2y / l2 * rr);
    }
    var z = p[p.length - 1];
    d += ' L' + z[0] + ',' + z[1];
    return d;
  }

  /* ---------- 4. 落 DOM：布局结果已经是显式坐标，这里只摆放 ---------- */
  function gEdgesSVG(L) {
    var uid = ++G_UID;                     /* 一张面板上可能同时有两张图，marker id 不能撞 */
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'edges');
    svg.setAttribute('width', L.W);
    svg.setAttribute('height', L.H);
    var defs = document.createElementNS(SVG_NS, 'defs');
    G_RELORDER.forEach(function (rel, i) {
      var mk = document.createElementNS(SVG_NS, 'marker');
      mk.setAttribute('id', 'gah' + i + '_' + uid);
      mk.setAttribute('viewBox', '0 0 8 8');
      mk.setAttribute('refX', '7');
      mk.setAttribute('refY', '4');
      mk.setAttribute('markerWidth', '5.5');
      mk.setAttribute('markerHeight', '5.5');
      mk.setAttribute('orient', 'auto');
      var pth = document.createElementNS(SVG_NS, 'path');
      pth.setAttribute('d', 'M0,0 L8,4 L0,8 z');
      pth.setAttribute('fill', G_RELCOLOR[rel]);
      mk.appendChild(pth);
      defs.appendChild(mk);
    });
    svg.appendChild(defs);

    L.rails.forEach(function (r) {
      var rp = document.createElementNS(SVG_NS, 'path');
      rp.setAttribute('d', 'M' + r[0] + ',' + r[1] + ' V' + r[2]);
      rp.setAttribute('fill', 'none');
      rp.setAttribute('stroke', '#8a8f98');
      rp.setAttribute('stroke-width', '1');
      rp.setAttribute('opacity', '.5');
      svg.appendChild(rp);
    });

    L.links.forEach(function (l, li) {
      var pts = L.routes[li];
      if (!pts) return;
      var path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', polyPath(pts));
      if (!path.getAttribute('d')) return;
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', G_RELCOLOR[l.rel] || '#8a8f98');
      path.setAttribute('stroke-width', '1.6');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('opacity', '.9');
      if (l.rel === 'missing') path.setAttribute('stroke-dasharray', '5 4');
      path.setAttribute('marker-end', 'url(#gah' + G_RELORDER.indexOf(l.rel) + '_' + uid + ')');
      var t = document.createElementNS(SVG_NS, 'title');
      t.textContent = l.from + ' → ' + l.to + '（' + l.rel + '）';
      path.appendChild(t);
      svg.appendChild(path);
    });
    return svg;
  }

  function gBandEl(b, opts) {
    var reg = b.kind ? kindReg(b.kind) : null;
    var head = el('div', { class: 'gbandhead' }, gBandHeadInner(b));
    var box = el('div', { class: 'gband' + (b.key === '__top' ? ' ext' : '') + (reg ? ' tone-' + reg.tone : ''),
      title: gBandTip(b),
      style: 'left:' + b.x + 'px;top:' + b.y + 'px;width:' + b.w + 'px;height:' + b.h + 'px' }, head);
    /* 点带标题 = 在左树里定位到它对应的那个目录（带上那句「对应左边：<路径>」就是路径）。
       只挂给有 dirPath 的带（目录分区图的组带）；形状图 / 枚举图 / 手工输入的图没有 dirPath，
       它们的带保持原样、点了不做事，不会有"点了一下却跳到别处"的错觉。 */
    if (b.dirPath && opts && typeof opts.pickDir === 'function') {
      box.style.cursor = 'pointer';
      box.addEventListener('click', function () { opts.pickDir(b.dirPath, !!b.here); });
    }
    return box;
  }

  /* 卡片：类型色 + 类型图标 + 名字 + 副标题 + 状态点 + 悬浮提示。
     颜色、图标、名称、要不要画点、要不要虚线全部查登记表，这里不出现任何按 kind 写的颜色或文案。 */
  function gNodeEl(n, opts) {
    var reg = kindReg(n.kind), dot = reg.dot ? statusDot(n.status) : '';
    var cls = 'gnode tone-' + reg.tone + (reg.dashed ? ' gapnode' : '');
    var tip = String(n.label === undefined || n.label === null ? '' : n.label) + '（' + reg.label + '）'
      + (n.tip ? ' · ' + n.tip : '')
      /* 悬浮提示里给 AI 中文的全文（卡片上那两行是截断的） */
      + (n.aiTitle ? ' · AI：' + n.aiTitle : '');
    var card = el('div', { class: cls, title: tip,
      style: 'left:' + n.x + 'px;top:' + n.y + 'px;width:' + G_NW + 'px;height:' + n.h + 'px' +
        (opts.pick ? '' : ';cursor:default') },
      gCardInner(n));
    if (dot) card.setAttribute('data-dot', dot);
    card.setAttribute('data-kind', String(n.kind === undefined || n.kind === null ? '' : n.kind));
    if (opts.pick) card.addEventListener('click', function () { opts.pick(n); });
    return card;
  }

  /* 可画宽度：宿主元素已经在文档里，用一个临时块量它，别去猜 */
  function gAvail(host) {
    if (!host || !host.appendChild) return 720;
    var p = el('div', { style: 'width:100%;height:0;visibility:hidden' });
    host.appendChild(p);
    var w = p.clientWidth || 0;
    host.removeChild(p);
    return w > 240 ? w : 720;
  }

  /* 唯一入口：IR → 一段可以 append 的 DOM（含如实说明的行） */
  function renderGraph(ir, opts) {
    opts = opts || {};
    var frag = document.createDocumentFragment();
    var capped = capGraphIR(ir);
    /* IR 自己说的话（这张图画了多少、挑的是什么）排在上限说明前面，两条都如实写出来 */
    var note = capped.ir.note || null;
    var cap = capNote(capped.hidden);
    if (cap) note = note ? note + cap : cap;
    if (!capped.ir.nodes.length) {
      frag.appendChild(el('div', { class: 'note', text: opts.emptyText || '这张图里没有可画的节点。' }));
      if (note) frag.appendChild(el('div', { class: 'note', text: note }));
      return frag;
    }
    if (note) frag.appendChild(el('div', { class: 'note', text: note }));
    var L = layoutGraphIR(capped.ir, opts.avail || gAvail(opts.host));
    var wrap = el('div', { class: 'graphwrap' });
    var g = el('div', { class: 'graph', style: 'width:' + L.W + 'px;height:' + L.H + 'px' });
    /* 三层顺序：归属带在最下，连线居中，节点在最上（opts 传给带：点带标题要定位回左树） */
    L.bands.forEach(function (b) { g.appendChild(gBandEl(b, opts)); });
    g.appendChild(gEdgesSVG(L));
    L.nodes.forEach(function (n) { g.appendChild(gNodeEl(n, opts)); });
    wrap.appendChild(g);
    frag.appendChild(wrap);
    return frag;
  }

  /* 引擎的探针出口：解析器和布局都是纯函数，留一个口子才能在真页面里量它们
     （"在真宿主页面上跑一遍"比任何离屏构造都可靠）。只读，不改变任何行为。 */
  window.__butlerGraph = {
    parse: parseMermaidGraph,
    ranks: graphRanks,
    cap: capGraphIR,
    layout: layoutGraphIR,
    dirIR: dirGraphIR,
    shapeIR: shapeGraphIR,
    render: renderGraph,
    kinds: M_KINDS,
    rels: M_RELS,
    statuses: M_STATUS,
    registry: KIND_REGISTRY,
    kindReg: kindReg,
    kindAliases: KIND_ALIASES,
    statusDot: statusDot,
    bandCount: gBandCountText,
    /* 协议词汇与分族：实测时能直接核对"域是怎么归出来的、字段是从哪儿读的" */
    domainPlan: domainPlan,
    domainAxis: domainAxis,
    familyOf: familyOf,
    /* 分区（左树分组节点与右图带的唯一来源）：实测时直接量"两边是不是同一份" */
    planOf: planOf,
    scopeItemsOf: scopeItemsOf,
    sourceText: sourceText,
    axis: function () { return S.axis; },
    protocolFields: protocolFields,
    protocolSub: protocolSub,
    partTypeText: partTypeText
  };

  function shapeSection(title, shape, avail, zh) {
    var block = el('div', { class: 'block' },
      el('div', { class: 'bh' }, el('h2', { text: title })));
    var kids = shapeChildFields(shape);
    if (!shape) {
      block.appendChild(el('div', { class: 'note', text: '这条契约没有记录形状。' }));
      return block;
    }
    /* 枚举/字面量类型的形状里没有字段，只有 enumValues。
       这种别落进"没有字段可画"——把它的取值画出来，图就出来了。 */
    var evals = (shape && Array.isArray(shape.enumValues)) ? shape.enumValues : [];
    if (!kids.length && evals.length) {
      block.appendChild(renderGraph(enumGraphIR(shape, evals), { avail: avail }));
      block.appendChild(el('div', { class: 'note',
        text: '这是枚举/字面量类型，没有字段，取值共 ' + evals.length + ' 个（图上没画全的按上面那行计数）。' }));
      return block;
    }
    if (!kids.length) {
      var isUnknown = shape && shape.kind === 'unknown';
      block.appendChild(el('div', { class: 'note',
        text: isUnknown
          ? '这条契约的形状记的是 unknown——类型没解析出来，所以没有结构可画。'
          : '形状是空的（' + shapeTypeLabel(shape) + '），没有字段可画。' }));
      return block;
    }
    block.appendChild(renderGraph(shapeGraphIR(shape, zh), { avail: avail }));
    return block;
  }

  /* ---------- schema 页下半部分：左图右表，中间可拖 ---------- */

  /* 比例记在这儿：一个人把图拉宽过一次，下次打开还该是宽的。
     存的是**比例**（0..1）而不是像素——窗口变宽时"图占多少"才保持不变。 */
  var SS_KEY = 'dsh-contract-butler.schemaSplit';
  var SS_DEF = 0.38;   /* 默认：图 38% / 表 62% */
  var SS_MIN_L = 260;  /* 图这一侧最小 260px */
  var SS_MIN_R = 380;  /* 表这一侧最小 380px */
  var SS_BAR = 9;      /* 分隔条宽度（和 CSS 里那 9px 一致） */
  var SS_PAD = 13;     /* .ssbody 的左右内边距，算图的可用宽度时要减掉 */

  function ssLoad() {
    var v = null;
    try { v = localStorage.getItem(SS_KEY); } catch (e) { v = null; }
    var n = v === null ? NaN : Number(v);
    if (!isFinite(n) || n <= 0 || n >= 1) return SS_DEF;
    return n;
  }
  function ssSave(v) { try { localStorage.setItem(SS_KEY, String(v)); } catch (e) {} }

  /* 把左侧像素宽夹在"两个最小值都放得下"的范围里。容器真的窄到放不下时按比例退让，
     而不是让某一侧塌成 0——塌了的话"拖回来"这个动作本身就没地方可拖了。 */
  function ssClamp(px, w) {
    var minL = SS_MIN_L, maxL = w - SS_BAR - SS_MIN_R;
    if (maxL < minL) {
      minL = Math.max(140, Math.round(w * 0.30));
      maxL = Math.max(minL, w - SS_BAR - Math.max(160, Math.round(w * 0.35)));
    }
    return Math.min(Math.max(px, minL), maxL);
  }

  /**
   * 左图右表 + 可拖分隔条。
   *
   * 图是**同步算坐标**的（布局不能等插入文档之后再量），所以这里先按比例算出左栏宽度，
   * 再把宽度给渲染器；拖动结束后按新宽度重画一次图，节点才不会停在旧位置。
   * @param c - 契约记录。
   * @param item - 列表项（变更/观测都在里面，字段状态点从它来）。
   * @param host - 量宽用的宿主元素（详情页的容器）。
   * @returns 可以直接 append 的 DOM。
   */
  function schemaSplit(c, item, host) {
    var full = gAvail(host);
    var ratio = ssLoad();
    var cur = ssClamp(Math.round((full - SS_BAR) * ratio), full);
    var zh = aiFieldZh(item);
    var marks = fieldMarks(item);
    var inRows = fieldRowsOf(c.input, zh, marks, 'in');
    var outRows = fieldRowsOf(c.output, zh, marks, 'out');

    var split = el('div', { class: 'ssplit' });
    split.style.setProperty('--ss-left', cur + 'px');

    /* ---- 左：形状图 ---- */
    var lbody = el('div', { class: 'ssbody' });
    /* 卡片标头去掉（它只是重复下面的内容）；计数下沉到「进来什么 / 出去什么」两行标题。 */
    var origin = el('div', { class: 'sspane' }, lbody);
    function fillLeft(avail) {
      clear(lbody);
      lbody.appendChild(shapeSection('进来什么 · ' + inRows.length + ' 条', c.input, avail, zh));
      lbody.appendChild(shapeSection('出去什么 · ' + outRows.length + ' 条', c.output, avail, zh));
    }
    fillLeft(Math.max(160, cur - SS_PAD * 2));

    /* ---- 右：字段表 ---- */
    var rbody = el('div', { class: 'ssbody ssflex' });
    /* 同上：标头去掉，计数由每张表上方的「输入/输出 · N 条 · X 条有中文」承担。
       表走组件版（advFieldTable）：首列固定 + 列宽可拖 + 表头可排序；组件没加载出来时它自己
       会退回静态表并说明原因——这里不做判断，也不静默降级。 */
    var table = el('div', { class: 'sspane' }, rbody);
    if (inRows.length) rbody.appendChild(advFieldTable(inRows, '输入'));
    if (outRows.length) rbody.appendChild(advFieldTable(outRows, '输出'));
    if (!inRows.length && !outRows.length) rbody.appendChild(el('div', { class: 'empty', text: '没有记录到字段。' }));
    /* 抽取时能分清方向的（rpc / 工具 / HTTP）会各自填进输入输出两个槽；分不清方向的裸类型
       声明（proto 消息、JSON Schema 组件）只填输出槽。这里如实说明，免得"输出"被读成
       "这个接口返回什么"。 */
    if ((inRows.length === 0) !== (outRows.length === 0)) {
      rbody.appendChild(el('div', { class: 'note', style: 'color:var(--ink3)',
        text: '只有一侧有形状：这是一条类型声明，本身不区分请求与响应，所以「输出」在这里读作「它声明的形状」。' }));
    }

    /* ---- 中间：分隔条 ---- */
    var bar = el('div', { class: 'ssbar', tabindex: '0', role: 'separator',
      'aria-label': '拖动调整形状图的宽度',
      title: '拖动调整形状图的宽度（左：形状图 / 右：字段表）' });
    bar.addEventListener('pointerdown', function (ev) {
      var rect = split.getBoundingClientRect();
      bar.classList.add('on');
      try { bar.setPointerCapture(ev.pointerId); } catch (e) {}
      ev.preventDefault();
      function move(e2) {
        cur = ssClamp(e2.clientX - rect.left, rect.width);
        split.style.setProperty('--ss-left', Math.round(cur) + 'px');
      }
      function up() {
        bar.classList.remove('on');
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        var w = rect.width;
        cur = ssClamp(cur, w);
        split.style.setProperty('--ss-left', Math.round(cur) + 'px');
        ssSave(Math.round((cur / w) * 1000) / 1000);
        /* 坐标是同步算的：宽度变了就得按新宽度重画，否则节点还停在旧位置。 */
        fillLeft(Math.max(160, Math.round(cur) - SS_PAD * 2));
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
    /* 键盘也能调（拖动不是唯一路径）：左右各 16px，结果一样会被记住。 */
    bar.addEventListener('keydown', function (ev) {
      var step = ev.key === 'ArrowLeft' ? -16 : ev.key === 'ArrowRight' ? 16 : 0;
      if (step === 0) return;
      ev.preventDefault();
      var rect = split.getBoundingClientRect();
      cur = ssClamp(cur + step, rect.width);
      split.style.setProperty('--ss-left', Math.round(cur) + 'px');
      ssSave(Math.round((cur / rect.width) * 1000) / 1000);
      fillLeft(Math.max(160, Math.round(cur) - SS_PAD * 2));
    });

    split.appendChild(origin);
    split.appendChild(bar);
    split.appendChild(table);
    return el('div', { class: 'block' }, split);
  }

  /* 契约形状 → IR：协议是根，字段=part 节点，嵌套=带（每层一条带），未知类型=缺口。
     走的还是那一条渲染路径，和协议图（目录视图）共用一个布局、一套词汇。 */
  function shapeGraphIR(shape, zh) {
    var ir = { direction: 'TB', bands: [], nodes: [], edges: [] };
    var seq = 0, depthBands = {};
    /* sub = 名字下面那行副标题；形状图里的节点没有变更/观测数据，所以 status 一律 null（不编） */
    function node(label, sub, kind, bandId, tip) {
      var n = { id: 'sn' + (seq++), label: label, sub: sub || null, kind: kind, band: bandId,
                status: null, tip: tip || null };
      n.ord = ir.nodes.length;
      ir.nodes.push(n);
      return n;
    }
    /* 每一层一条带：同层的字段落在同一条带里，带的先后就是这个形状的层序 */
    function bandAt(depth) {
      if (depthBands[depth]) return depthBands[depth];
      var b = depth === 0
        ? { id: 'lv0', label: '整条形状', note: shapeTypeLabel(shape), n: 1, unit: '协议', kind: 'project',
            kinds: ['protocol', 'gap'] }
        : { id: 'lv' + depth, label: '第 ' + depth + ' 层字段',
            note: depth === 1 ? '直接挂在这条形状上' : '嵌套出来的字段', n: null, unit: '字段',
            kind: 'domain', kinds: ['part', 'gap'] };
      depthBands[depth] = b;
      ir.bands.push(b);
      return b;
    }
    var root = node(shapeTypeLabel(shape) || '形状', shapeChildFields(shape).length + ' 个字段',
      'protocol', bandAt(0).id, '这条协议的形状根：' + (shapeTypeLabel(shape) || '形状'));

    /* 和面板的其它视图一样只展开到 6 层：再深就不是"看一眼"能读的了。
       参数别叫 node —— 它会把上面那个造节点的 node() 遮住，一进这条支就报
       "node is not a function"，形状图整块画不出来（原来的老毛病）。 */
    (function walk(sn, depth, parent) {
      if (depth >= G_MAXD) return;
      var fields = shapeChildFields(sn);
      fields.forEach(function (f, i) {
        var unknown = !f.node || f.node.kind === 'unknown';
        var n = node(f.name, partTypeText(f.node, null),
          unknown ? 'gap' : 'part', bandAt(depth + 1).id,
          unknown ? '这个字段的类型没解析出来（unknown）：这一支到这里就断了' : partTip(f, zh));
        /* demo walk 的肘形规则：后面还有兄弟节点，这一支的线就得继续走 */
        n.rail = i < fields.length - 1;
        ir.edges.push({ from: parent.id, to: n.id, rel: unknown ? 'missing' : 'defines' });
        walk(f.node, depth + 1, n);
      });
    })(shape, 0, root);

    /* 带内条数：IR 报给渲染器，带标题右侧显示的就是这个数 */
    bandCounts(ir);
    return ir;
  }

  /* 每条带里有几个节点 —— IR 层的计数，渲染器不再自己数。
     IR 已经说清条数的带（协议族报的是"这一族有几个协议"）不被覆盖：
     那句话比"带里有几个节点"有用，覆盖了就成了假数。 */
  function bandCounts(ir) {
    var byBand = {};
    ir.nodes.forEach(function (n) { if (n.band) byBand[n.band] = (byBand[n.band] || 0) + 1; });
    ir.bands.forEach(function (b) { if (typeof b.n !== 'number') b.n = byBand[b.id] || 0; });
    return ir;
  }

  function enumGraphIR(shape, evals) {
    var ir = { direction: 'TB', bands: [], nodes: [], edges: [] };
    ir.bands.push({ id: 'ev', label: '枚举取值', note: '这个协议只有取值，没有字段',
                    n: evals.length, unit: '取值', kind: 'domain', kinds: ['part'] });
    var root = { id: 'evroot', label: shapeTypeLabel(shape) || '枚举', kind: 'protocol', band: null,
                 sub: evals.length + ' 个取值', status: null,
                 tip: '枚举协议：没有字段，只有 ' + evals.length + ' 个取值' };
    ir.nodes.push(root);
    evals.forEach(function (v, i) {
      var n = { id: 'ev' + i, label: String(v), kind: 'part', band: 'ev',
                sub: '枚举取值', status: null, tip: '这个协议的第 ' + (i + 1) + ' 个取值' };
      n.rail = i < evals.length - 1;
      n.ord = i + 1;
      ir.nodes.push(n);
      ir.edges.push({ from: 'evroot', to: 'ev' + i, rel: 'defines' });
    });
    return ir;
  }

  /* ---------- 协议图（原目录视图） ----------
     点左树里 src / MvizLite 这种目录时主区该出的图。图上画的是**协议**，不是文件：

         项目（根） → 协议族（带） → 协议（卡片） → 字段（卡片下面的子名字）

     文件名一个都不上节点，只用 `contract.file` 出现在悬浮提示里，用来定位。
     换掉文件名的理由：文件名只回答"这东西放在哪个文件"，而协议名 + 字段名回答的是
     "这个项目里有哪些协议、每个协议是怎么配置的"。 */

  /* ---------- 协议词汇表：分族与命名（全文件唯一一份） ----------
     域名必须是"人能读懂的中文短语"，所以这里是一张**语义**词表 + 一张角色词表，
     不是文件名字典：先认功能词（这一族在做什么），认不出再认角色词（协议名自己最后
     那个名词，`...Params` 就是入参），都认不出就老实进「其它类型」——
     不拿文件名兜底，也不硬猜一个漂亮的分类。 */

  /* 通道（facets.ts 的 channelOf）取值 → 中文。取值有词条，才敢按通道分族。 */
  var CHANNEL_CN = {
    tool: '工具调用', http: 'HTTP 接口', proto: '消息结构', schema: '数据校验',
    event: '事件', db: '持久化', rpc: '远程调用', ws: '长连接', graphql: 'GraphQL',
    type: '类型声明', other: ''
  };

  /* 边界种类（boundaryKind）→ 中文。带头上那句"这一族在干什么"用它起头。 */
  var BOUNDARY_CN = {
    tool: '工具调用', http: 'HTTP 接口', event: '事件', proto: '消息结构',
    schema: '数据校验', db: '持久化', unknown: '边界不明'
  };

  /* 功能词：[正则, 域名]。按顺序匹配协议标题拆出来的词，先命中先算。
     表里是通用软件词汇（哪个项目里都可能有），不是某个项目的专有名词。 */
  var FAMILY_WORDS = [
    [/visual|viz|chart|graph|plot|canvas|legend|axis/, '可视化'],
    [/compare|contrast|diff|baseline/, '对比'],
    [/check|valid|verif|inspect|lint|audit|assert/, '检查与校验'],
    [/task|job|run|schedul|batch|queue|worker|pipeline|exec/, '任务与运行'],
    [/scenario|case|suite|fixture|plan/, '场景与用例'],
    [/portal|dashboard|console|admin|desk/, '门户与看板'],
    [/metric|kpi|evaluat|score|perform|benchmark|quota|stat|report/, '指标与评测'],
    [/event|notify|subscribe|emit|trigger|watch/, '事件与通知'],
    [/user|auth|login|session|permission|role|account|tenant/, '用户与会话'],
    [/packag|version|release|publish|deploy|install|registry|npm|artifact/, '发布与版本'],
    [/fetch|query|request|response|api|http|rpc|client|server|sdk|service|endpoint/, '接口与请求'],
    [/store|state|reducer|hook|context|dispatch|subscription|effect/, '状态与交互'],
    [/config|setting|prefs|option|theme|toolbar|dialog|modal|drawer|menu|tab|form|panel/, '配置与界面'],
    [/time|history|replay|snapshot|frame|trace|timeline|clock|duration/, '时间与记录'],
    [/file|image|media|upload|download|asset|photo|video|audio/, '文件与媒体'],
    [/log|debug|diagnos|error|warn|severity|issue|incident|alert/, '日志与诊断'],
    [/schema|struct|model|entity|dto|payload|message|descriptor/, '结构与模型'],
    [/sort|filter|search|pag|group|aggregat|rank|order/, '排序与聚合'],
    [/cache|memor|storage|persist|buffer|pool/, '缓存与存储'],
    [/layer|scene|camera|mesh|marker|anchor|geo|coord|spatial/, '图形与坐标'],
    [/path|route|navigat|location|url|link/, '路由与导航']
  ];

  /* 角色词：协议标题里最后那个认得出来的名词 → 这一族的名字。
     它由标题自己机械推出来（`...Params` 就是入参），不是猜业务、也不看文件。 */
  var ROLE_WORDS = {
    params: '入参', args: '入参', arg: '入参', arguments: '入参', input: '入参', inputs: '入参',
    response: '响应', reply: '响应', output: '输出', outputs: '输出', result: '结果', results: '结果',
    request: '请求', body: '载荷', payload: '载荷', data: '数据', dataset: '数据',
    item: '条目', items: '条目', entry: '条目', entries: '条目', row: '条目', rows: '条目',
    record: '记录', records: '记录', log: '记录', history: '记录',
    props: '组件属性', prop: '组件属性', attributes: '组件属性',
    options: '选项', option: '选项', choice: '选项', choices: '选项',
    config: '配置', conf: '配置', settings: '配置', setting: '配置', prefs: '配置', preference: '配置',
    state: '状态', status: '状态', mode: '模式', phase: '阶段', stage: '阶段', step: '步骤',
    info: '信息', meta: '元信息', metadata: '元信息', summary: '摘要', detail: '详情', details: '详情',
    list: '列表', set: '集合', map: '映射', group: '分组', pair: '配对', tuple: '组合',
    key: '键', id: '标识', name: '名称', label: '标签', tag: '标记', title: '标题',
    type: '类型', value: '取值', values: '取值', enum: '枚举', schema: '结构', shape: '结构',
    node: '节点', tree: '树', table: '表格', cell: '单元格', column: '列', field: '字段', section: '区块',
    context: '上下文', scope: '作用域', env: '环境', handler: '处理器', callback: '回调',
    spec: '规格', descriptor: '描述', definition: '定义', declaration: '声明', signature: '签名',
    policy: '策略', rule: '规则', constraint: '约束', filter: '过滤', query: '查询', sort: '排序',
    version: '版本', revision: '版本', source: '来源', target: '目标', ref: '引用', reference: '引用',
    feature: '特性', capability: '能力', flag: '开关', switch: '开关', toggle: '开关',
    form: '表单', dialog: '对话框', panel: '面板', menu: '菜单', toolbar: '工具栏', shortcut: '快捷键',
    cache: '缓存', queue: '队列', stream: '流', event: '事件', task: '任务', job: '作业',
    size: '尺寸', count: '计数', index: '索引', offset: '偏移', limit: '上限', range: '范围',
    timestamp: '时间戳', date: '日期', interval: '间隔',
    url: '地址', path: '路径', host: '主机', port: '端口', address: '地址',
    error: '错误', warning: '告警', level: '级别', category: '分类', kind: '种类'
  };

  /* "这个取值像不像人话"：含中文就是人话；纯 ASCII 一律当标识符（src / type / quick-viz）。
     分族时宁可不分，也不把 src 这种目录名端上来当域名。 */
  function humanValue(v) {
    return typeof v === 'string' && /[\u3400-\u9fff]/.test(v);
  }

  /* 标题拆词：驼峰 / 下划线 / 短横都拆开，中文原样留着。 */
  function titleTokens(title) {
    return String(title === undefined || title === null ? '' : title)
      .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
      .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
      .split(/[^A-Za-z0-9\u3400-\u9fff]+/)
      .filter(function (x) { return x.length > 0; })
      .map(function (x) { return x.toLowerCase(); });
  }

  function titleOf(item) {
    var t = item && item.contract ? item.contract.title : '';
    return t || '（没名字的协议）';
  }

  /* 功能词 → 域名；认不出返回 null（不硬猜） */
  function familyWordOf(title) {
    var s = titleTokens(title).join(' ');
    if (!s) return null;
    for (var i = 0; i < FAMILY_WORDS.length; i++) {
      if (FAMILY_WORDS[i][0].test(s)) return FAMILY_WORDS[i][1];
    }
    return null;
  }

  /* 角色词 → 域名：从标题最后往前找第一个认得出来的名词 */
  function roleWordOf(title) {
    var ts = titleTokens(title);
    for (var i = ts.length - 1; i >= 0; i--) {
      if (ROLE_WORDS[ts[i]]) return ROLE_WORDS[ts[i]];
    }
    return null;
  }

  /* 分族轴：优先用面板已有的 facet ——
     1. 通道轴能分出两族以上、且取值都有中文词条（谁和谁在说话，最适合当协议族）；
     2. 否则模块轴能分出两族以上、且取值本身就是人话（含中文）；
     3. 都不行（取值就是 src / type 这种标识符）→ 按协议标题归族。
     返回值里带上"为什么这么分"，好让人在提示里看到依据，而不是只能猜。 */
  function domainAxis(items) {
    var chans = {}, mods = {};
    items.forEach(function (it) {
      axisValues(it, 'channel').forEach(function (v) { chans[v] = (chans[v] || 0) + 1; });
      axisValues(it, 'module').forEach(function (v) { mods[v] = (mods[v] || 0) + 1; });
    });
    var ck = Object.keys(chans), mk = Object.keys(mods);
    if (ck.length >= 2 && ck.every(function (v) { return !!CHANNEL_CN[v]; })) {
      return { id: 'channel', name: '通道 facet', why: '同一族是"谁和谁在说话"相同' };
    }
    if (mk.length >= 2 && mk.every(humanValue)) {
      return { id: 'module', name: '模块 facet', why: '同一族属于同一块功能' };
    }
    return { id: 'title', name: '协议标题', why: '标题里的功能词，认不出再按角色词（入参 / 响应 / 配置…）' };
  }

  /* 一条协议归到哪一族 */
  function familyOf(item, axis) {
    if (axis.id === 'channel') {
      var v = axisValues(item, 'channel')[0];
      return { key: 'ch:' + v, name: CHANNEL_CN[v] };
    }
    if (axis.id === 'module') {
      var m = axisValues(item, 'module')[0];
      return { key: 'md:' + m, name: m };
    }
    var title = titleOf(item);
    var w = familyWordOf(title);
    if (w) return { key: 'fw:' + w, name: w };
    var r = roleWordOf(title);
    if (r) return { key: 'rl:' + r, name: r };
    return { key: '__other', name: '其它类型' };
  }

  /* ---------- 协议 / 字段：卡片上那点信息，全部由现有数据推出来 ---------- */

  /* 通道：先用面板已有的 facet，没有分面数据时退回边界字符串的第一个词。 */
  function channelOfItem(item) {
    var v = axisValues(item, 'channel');
    if (v.length) return CHANNEL_CN[v[0]] !== undefined && CHANNEL_CN[v[0]] !== '' ? CHANNEL_CN[v[0]] : v[0];
    var b = ((item && item.contract && item.contract.boundary) || '');
    var cut = b.search(/[:\s]/);
    var head = (cut < 0 ? b : b.slice(0, cut)).toLowerCase();
    if (!head) return '';
    return CHANNEL_CN[head] ? CHANNEL_CN[head] : head;
  }

  /* 一条协议的字段（就是它的"子名字"）：进来什么 + 出去什么。
     两侧都有字段时，副标题里说清是哪一侧 —— 不写清楚，哪个是请求哪个是响应只能靠猜。 */
  function protocolFields(item) {
    var c = (item && item.contract) || {};
    var ins = shapeChildFields(c.input).map(function (f) { return { name: f.name, node: f.node, side: '进来' }; });
    var outs = shapeChildFields(c.output).map(function (f) { return { name: f.name, node: f.node, side: '出去' }; });
    var both = ins.length > 0 && outs.length > 0;
    return ins.concat(outs).map(function (f) {
      return { name: f.name, node: f.node, side: both ? f.side : null };
    });
  }

  /* 要注意的事：不符 > 破坏性变更 > 只是变过（和卡片上状态点的优先级一致）。都没有就是照旧。 */
  function attentionText(item) {
    var bad = findingsOf(item).length, chg = changedIn(item).length;
    if (bad) return '不符 ' + bad + ' 处';
    if (chg) return (breakingIn(item) ? '破坏性变更 ' : '变过 ') + chg + ' 次';
    return '照旧';
  }

  /* 协议卡片那行副标题：类型（schema / tool）+ 通道 + 字段数 + 注意数 —— 全是真数据。 */
  function protocolSub(item) {
    var c = (item && item.contract) || {};
    var bits = [];
    if (c.boundaryKind) bits.push(String(c.boundaryKind));
    var ch = channelOfItem(item);
    if (ch) bits.push(ch);
    var n = protocolFields(item).length;
    bits.push(n ? n + ' 字段' : '没有字段');
    bits.push(attentionText(item));
    return bits.join(' · ');
  }

  /* 协议卡片的悬浮提示：文件名只出现在这里（图上不画），外加边界与"变没变、对不对得上"。 */
  function protocolTip(item) {
    var c = (item && item.contract) || {};
    var t = [];
    if (c.file) t.push(c.file + (c.evidence && c.evidence.line ? ':' + c.evidence.line : ''));
    if (c.boundary) t.push('边界 ' + c.boundary);
    t.push(contractTip(item));
    if (c.source) t.push('来自 ' + c.source);
    return t.join('；');
  }

  /* 字段（子名字）那行副标题：哪一侧 + 类型摘要 + 必填 / 可选 / 可为 null。
     类型摘要长了自己截断 —— 卡片只有 200px 宽，宁可少说两个字也不挤成一条。 */
  function partTypeText(node, side) {
    var t = typeText(node) || '—';
    if (t.length > 26) t = t.slice(0, 25) + '…';
    var bits = [];
    if (side) bits.push(side);
    bits.push(t);
    if (node && node.kind !== 'unknown') bits.push(node.optional ? '可选' : '必填');
    if (node && node.nullable) bits.push('可为 null');
    return bits.join(' · ');
  }

  function partTip(f, zh) {
    var n = f.node || {};
    /* AI 给过这个字段的中文就补在最后一句：悬停时先看到类型与必填，再看到"它是干什么的"。
       没给就不补——本地不翻译（这条中文只有模型能给）。 */
    var ai = zh && typeof zh[f.name] === 'string' && zh[f.name] !== '' ? '；中文：' + zh[f.name] : '';
    return '字段 ' + f.name + (f.side ? '（' + f.side + '）' : '') +
      '：' + (typeText(n) || '—') + '；' + (n.optional ? '可以缺省' : '必填') +
      (n.nullable ? '；出现过 null' : '') + ai;
  }

  /* 这条协议的字段是不是"看不见"：形状压根没有，或者类型没解析出来（unknown）。
     这种是缺口（虚线红边 + △），不是普通协议 —— 看不见内容的协议最该被人看见。 */
  function protocolKindOf(item) {
    var c = (item && item.contract) || {};
    var sides = [c.input, c.output].filter(function (s) { return !!s; });
    if (!sides.length) return 'gap';
    var unknown = sides.every(function (s) { return s.kind === 'unknown'; });
    return unknown ? 'gap' : 'protocol';
  }

  /* 语义族的分区：**别名**，不是第二套实现。族怎么归、顺序怎么排、封顶怎么并，
     全在 planOf()（本文件唯一算分区的地方）；这里只保留旧名字与旧形状，
     好让探针（window.__butlerGraph.domainPlan）继续量得动。
     带头那句"这一族在干什么"由 planOf → groupNoteOf 按**组自己**的统计算：
     这个项目 1012 条协议的 boundaryKind 全是 schema，按边界写就会每条带都印"数据校验"。 */
  function domainPlan(items) {
    var facetAxis = domainAxis(items);
    return { list: familyGroupsOf(items, facetAxis), axis: facetAxis };
  }


  /* 每条协议最多挂几个子卡片（字段；字段更多时最后一张是"还有 N 个字段没画"）。
     和"节点上限 80"一起算：宁可少画几个协议，也不要画一堆没法读的卡片。 */
  var G_PARTS_MAX = 6;

  /* 每条协议画几个字段：视图越大画得越浅，让"有哪些协议"这件事还看得见。
     这是"画多少"的取舍，不是判定 —— 没画的那部分一定如实写在卡片上。 */
  function partQuota(n) {
    if (n <= 12) return G_PARTS_MAX - 1;
    if (n <= 24) return 3;
    if (n <= 60) return 2;
    return 1;
  }

  /* 谁先上墙：有要注意的事的先来（这就是这个工具存在的理由），其次字段多的（信息量大），
     最后按标题排 —— 顺序稳定、可复现，不因为字段的遍历顺序而变。 */
  function protocolOrder(a, b) {
    var ha = isHot(a) ? 0 : 1, hb = isHot(b) ? 0 : 1;
    if (ha !== hb) return ha - hb;
    var fa = protocolFields(a).length, fb = protocolFields(b).length;
    if (fa !== fb) return fb - fa;
    return String(titleOf(a)).localeCompare(String(titleOf(b)));
  }

  /* 名额分配：按域轮转 —— 先让每个族都露一条协议，再回头加深。
     这样一张图里"有哪些族"和"族里有什么协议"同时看得见，
     而不是第一族吃掉全部名额、别的族只剩一个空框。 */
  function pickProtocols(domains, quota, budget) {
    var groups = domains.map(function (d) {
      return { dom: d, items: d.items.slice().sort(protocolOrder), at: 0 };
    });
    var out = [], used = 0;
    var stop = false;
    while (!stop) {
      var progressed = false;
      for (var i = 0; i < groups.length && !stop; i++) {
        var g = groups[i];
        if (g.at >= g.items.length) continue;
        var it = g.items[g.at];
        var fields = protocolFields(it);
        var drawn = Math.min(fields.length, quota);
        var cost = 1 + drawn + (fields.length > drawn ? 1 : 0);
        if (used + cost > budget) { stop = true; break; }
        used += cost;
        out.push({ dom: g.dom, item: it, fields: fields, drawn: drawn });
        g.at++;
        progressed = true;
      }
      if (!progressed) break;
    }
    return out;
  }

  /* 根节点的名字 = 项目标题（绝不是目录名）。标题拿不到就老实说"这个项目"。 */
  function projectTitle() {
    return (S.p && S.p.title) ? S.p.title : '这个项目';
  }

  /* 根节点的悬浮提示：这一眼看到的是哪个范围、分组是按什么分出来的。
     目录路径属于"定位信息"，放在提示里 —— 图上不放。 */
  function rootTip(path, all, plan, hot) {
    var t = ['项目 ' + projectTitle()];
    if (path) t.push('这张图的范围是 ' + path + '（路径只出现在提示里，图上是协议名）');
    t.push('共 ' + all.length + ' 个协议、' + plan.groups.length + ' 个' + plan.axisName +
      (hot ? '，其中 ' + hot + ' 个要注意' : ''));
    t.push('按' + plan.axisName + '分：' + plan.why);
    t.push('左边树上的分组节点与这些带是同一份分区，同名同序');
    return t.join('；');
  }

  function dirItemsOf(path) {
    if (!path) return S.items.slice();
    var pre = path + '/';
    return S.items.filter(function (it) {
      var f = (it.contract && it.contract.file) || '';
      return f.indexOf(pre) === 0 || f === path;
    });
  }

  /* 目录图的 IR。带**不在这里算**：plan 由 planOf() 给出（左树画分组节点用的就是同一份），
     这里只负责把每一组画成一条带。没传 plan 时（探针直接调用）就地按当前轴算一份。 */
  function dirGraphIR(path, plan) {
    if (!plan) plan = planOf(scopeItemsOf(visibleItems(), path), S.axis, path);
    var all = plan.items;
    var quota = partQuota(all.length);
    var ir = { direction: 'LR', bands: [], nodes: [], edges: [] };

    /* 第一条带 = 范围自己：带名与左树顶上那行"范围"**同一个字符串**（plan.scopeLabel）。
       根节点仍然挂在它里面 —— 图上画的是协议，范围只是"你在看哪儿"。 */
    var rootBand = { id: 'rootband', label: plan.scopeLabel, kind: 'project',
                     note: plan.scope ? '这一层的协议分在下面几条带里' : '协议挂在族里，字段挂在协议下面',
                     n: 1, unit: '项目', kinds: ['project'] };
    ir.bands.push(rootBand);
    var changed = 0, hot = 0;
    all.forEach(function (it) {
      if (changedIn(it).length) changed++;
      if (isHot(it)) hot++;
    });
    var root = { id: 'root', label: projectTitle(), kind: 'project', band: rootBand.id,
                 sub: all.length + ' 个协议 · ' + plan.groups.length + ' 个' + plan.axisName + ' · 变更 ' + changed,
                 status: null, tip: rootTip(path, all, plan, hot) };
    root.ord = 0;
    ir.nodes.push(root);

    /* 每一组一条带：带名就是目录名（与左树那一层的目录行同名、同序），
       说明与来源摘要也都是**这一组自己**的数；dirPath 让带头上能写「对应左边：<路径>」，
       也让点标题能定位回左树那一行。 */
    var bandOf = {};
    plan.groups.forEach(function (d, di) {
      bandOf[d.key] = 'dom' + di;
      /* 带上也挂一个状态点：这一组里最要紧的那件事（有不对 > 破坏性变更 > 变过），
         和卡片上用的是同一份判定、同一套优先级。 */
      ir.bands.push({ id: 'dom' + di, label: d.label, kind: 'domain', note: d.note,
                      dirPath: d.path || null, here: !!d.here,
                      n: d.n, unit: d.unit || '协议', kinds: ['protocol', 'gap'],
                      status: worstStatusOf(d.items), sources: d.sources });
      ir.edges.push({ from: 'root', to: 'dom' + di, rel: 'contains' });
    });

    /* 画谁：按组轮转分名额（每组先露一条，再回头加深），每条协议最多画 quota 个字段。
       画不下的不在这里偷偷砍掉 —— 全部照实交给 IR，由 capGraphIR 按上限截断并如实报出
       "还有几个协议、几个字段没画"。 */
    var picks = pickProtocols(plan.groups, quota, G_MAXN - 1);
    var drawnFields = 0;
    picks.forEach(function (p) { drawnFields += Math.min(p.fields.length, quota); });
    /* 组号必须在「带内」从 0 数起：组是"这条带里的第几列"。
       用全局序号的话，每条带都以为自己有二十多个组，一条带就被撑成二十多行。 */
    var grpSeq = {};
    picks.forEach(function (p, pi) {
      var c = (p.item && p.item.contract) || {};
      var bid = bandOf[p.dom.key];
      var grp = grpSeq[bid] || 0;
      grpSeq[bid] = grp + 1;
      var pn = { id: 'p' + pi, label: titleOf(p.item), kind: protocolKindOf(p.item), band: bid,
                 grp: grp, grow: 0,
                 sub: protocolSub(p.item), status: statusOf(p.item), tip: protocolTip(p.item),
                 contractId: c.id || null };
      /* AI 中文职责随节点一起带过去：图上的副标题与悬浮提示都读它。
         没有这个字段就不画（`gCardInner` / `gNodeEl` 都只看"有没有"）。 */
      if (c.aiTitle) pn.aiTitle = c.aiTitle;
      pn.ord = ir.nodes.length;
      ir.nodes.push(pn);

      /* 协议的字段竖着摞在它下面（同一组、同一列）：子名字的名字就是字段名本身 */
      var row = 1;
      p.fields.slice(0, p.drawn).forEach(function (f) {
        var part = { id: 'p' + pi + 'f' + row, label: f.name, kind: 'part', band: bid,
                     grp: grp, grow: row, sub: partTypeText(f.node, f.side),
                     status: null, tip: partTip(f) };
        part.ord = ir.nodes.length;
        ir.nodes.push(part);
        ir.edges.push({ from: pn.id, to: part.id, rel: 'defines' });
        row++;
      });
      /* 字段没画全就说清还有几个 —— 这一行也是真数出来的 */
      if (p.fields.length > p.drawn) {
        var restN = p.fields.length - p.drawn;
        var more = { id: 'p' + pi + 'more', label: '还有 ' + restN + ' 个字段没画', kind: 'part',
                     band: bid, grp: grp, grow: row,
                     sub: '这条一共 ' + p.fields.length + ' 个字段，图上画了 ' + p.drawn + ' 个',
                     status: null,
                     tip: '这条协议一共 ' + p.fields.length + ' 个字段，图上画了 ' + p.drawn + ' 个' };
        more.ord = ir.nodes.length;
        ir.nodes.push(more);
        ir.edges.push({ from: pn.id, to: more.id, rel: 'defines' });
      }
    });
    bandCounts(ir);
    /* 图上到底画了多少、没画多少，一律说清楚：这张图是"按分组轮着挑"挑出来的样本，
       不写清楚就会被读成"这个范围里只有这几个协议"。 */
    var note = '图上画了 ' + picks.length + ' 个协议、它们的 ' + drawnFields + ' 个字段（每个' + plan.axisName +
      '轮着挑，每条协议最多画 ' + quota + ' 个字段）；这个范围里还有 ' + (all.length - picks.length) + ' 个协议没画。';
    if (all.length > picks.length) note += '点左树里更细的目录，能看得更小、更全。';
    ir.note = note;
    return ir;
  }

  function renderDirView(ctx) {
    var box = $('#detail');
    clear(box);
    var path = S.dirView || '(根)';
    var plan = ctx.plan;
    var all = plan.items;
    var hotN = all.filter(isHot).length;
    /* 有重复：看的是这个分面的取值是不是 yes，不是"有没有挂 dup 这个标签" ——
       按标签算的话 'dup:no' 也会被算进来，于是 1012 条全被说成有重复。 */
    var dupN = all.filter(function (it) { return axisValues(it, 'dup').indexOf('yes') >= 0; }).length;
    var avail = gAvail(box);
    /* 标题留着目录路径：它是"你在看哪儿"的定位信息，不是图上节点的名字。 */
    box.appendChild(el('div', { class: 'chead' },
      el('div', { class: 'ctitle', text: path }),
      el('div', { class: 'cline2' },
        el('span', { class: 'chip chip-dim', text: all.length + ' 个协议' }),
        el('span', { class: 'chip chip-dim', title: '右图上的带就是这些，与左边树同一份分区',
          text: plan.groups.length + ' 个' + plan.axisName }),
        el('span', { class: 'chip chip-dim', text: '要注意 ' + hotN }),
        el('span', { class: 'chip chip-dim', text: '有重复 ' + dupN }),
        el('button', { class: 'ghost', type: 'button', text: '返回清单',
          onclick: function () { S.dirView = null; renderAll(); } }))));

    var block = el('div', { class: 'block' });
    if (!all.length) {
      block.appendChild(el('div', { class: 'note', text: '这个目录底下没有纳管的协议。' }));
      box.appendChild(el('div', { class: 'scrollarea' }, noteRow(), block));
      return;
    }
    /* 图上少画了谁、少了多少，由 IR 层如实报出来（capNote），这里不再自己截断 */
    block.appendChild(renderGraph(dirGraphIR(path, plan), {
      avail: avail,
      emptyText: '这个范围里没有可以画成节点的协议。',
      /* 点带的标题 = 在左树里定位到这个块对应的子目录（与清单页同一个入口） */
      pickDir: function (dirPath, here) { revealDirInTree(dirPath, here); },
      pick: function (n) {
        /* 点协议卡片直接进详情；点分组带 / 字段卡片不跳走，图上点到哪都是"看结构" */
        var id = n.contractId;
        if (!id) return;
        S.dirView = null;
        S.sel = id;
        revealInTree(id);
      }
    }));
    box.appendChild(el('div', { class: 'scrollarea' }, noteRow(), block));
  }

  function renderContract() {
    var box = $('#detail');
    clear(box);
    var item = null;
    S.items.forEach(function (it) { if (it.contract.id === S.sel) item = it; });
    if (!item) { S.sel = null; renderAll(); return; }
    var c = item.contract;
    var sa = el('div', { class: 'scrollarea' });
    if (S.note) sa.appendChild(noteRow());
    /* AI 那块放最上面：它是"这条契约在干什么"的答案，比形状细节更该第一眼看到。
       没有 AI 结果时也画（写清"还没有"）——「重新理解这条」的入口必须一直在。 */
    sa.appendChild(aiBlockOf(c));
    /* 下半部分：左边形状图（小）、右边字段表（大），中间一根可拖的分隔条。
       图与表本来是上下两块、各画各的，看一条契约时眼睛要在图与表之间来回跳。 */
    sa.appendChild(schemaSplit(c, item, box));

    box.appendChild(el('div', { class: 'chead' },
      el('div', { class: 'ctitle', text: c.title }),
      el('div', { class: 'cline1' }, el('span', { class: 'mono', text: c.boundary })),
      el('div', { class: 'cline2' },
        el('span', { class: 'chip chip-dim', text: c.boundaryKind }),
        el('span', { class: 'chip chip-dim', text: '置信度 ' + c.confidence.toFixed(2) }),
        chipsOf(item),
        el('button', { class: 'ghost', type: 'button', text: '返回清单',
          onclick: function () { S.sel = null; renderAll(); } }))));

    /* 它是什么 */
    var what = el('div', { class: 'block' });
    what.appendChild(el('div', { class: 'bh' }, el('h2', { text: '它是什么' }),
      el('span', { class: 'sub', text: c.file + (c.evidence && c.evidence.line ? ' : ' + c.evidence.line : '') })));
    if (c.file === '(工具注册表)') {
      what.appendChild(el('div', { class: 'note', text: '这条契约没有源码位置：声明活在运行时工具注册表里，所以行号为空。' }));
    }
    /* 字段表已经在上面的右栏里（左图右表那一段），这里只留"它是什么"的出处与判定。 */
    what.appendChild(verdict('来自 ' + c.source, false));
    sa.appendChild(what);

    /* 变了什么 */
    var chgBlock = el('div', { class: 'block' });
    var chg = changedIn(item);
    chgBlock.appendChild(el('div', { class: 'bh' }, el('h2', { text: '变了什么' }),
      el('span', { class: 'cmp' },
        el('code', { text: shortSha(S.p.baselineSha) }),
        el('span', { class: 'arrow', text: '→' }),
        el('code', { text: '工作区' }))));
    if (!chg.length) {
      chgBlock.appendChild(el('div', { class: 'note', style: 'color:var(--ink3)',
        text: '从基线到现在，这条契约没有改过形状。' }));
    } else {
      chg.forEach(function (ch) {
        var wrap = el('div', { class: 'row' + (ch.sha === 'wt' ? '' : '') },
          el('span', { class: 'when' },
            el('span', { class: 'sha', text: shortSha(ch.sha) }),
            el('span', { class: 'at', text: timeAgo(ch.at) })),
          el('span', { class: 'what', text: ch.subject || '' }),
          el('span', { class: 'tag ' + (ch.kind === 'breaking' ? 'bad' : 'warn'),
            text: ch.kind === 'breaking' ? '破坏' : '放宽' }));
        chgBlock.appendChild(wrap);
        ch.reasons.forEach(function (reason) {
          chgBlock.appendChild(el('div', { class: 'finding' + (ch.kind === 'breaking' ? '' : ' warn') },
            el('div', { text: reason })));
        });
      });
    }
    chgBlock.appendChild(verdict(chg.length
      ? (breakingIn(item) ? '有破坏性变化：老的产出方或消费方可能已经跟不上。' : '只是放宽，老的参与方仍然能对上。')
      : '没有变化。', breakingIn(item)));
    /* 决策：人对这个契约仅有的写入口。做过的事必须在界面上留痕，否则等于没做。 */
    chgBlock.appendChild(decisionRow(item, chg, 'change'));
    sa.appendChild(chgBlock);

    /* 现在对不对。三种情况必须说成三句不同的话：从没调用过 / 调用过且都对 / 调用过但对不上。
       把"没观测到"和"观测到且都对"混成一句，是这个工具最不该犯的错。 */
    var calls = el('div', { class: 'block' });
    var bad = findingsOf(item);
    var total = typeof item.observedTotal === 'number' ? item.observedTotal : (item.observations || []).length;
    calls.appendChild(el('div', { class: 'bh' }, el('h2', { text: '现在对不对' }),
      el('span', { class: 'sub', text: '契约声明 ↔ 运行时的真实载荷' })));
    if (total === 0) {
      calls.appendChild(el('div', { class: 'note', style: 'color:var(--ink3)',
        text: '还没有观测到这个边界的调用。等它被调用过，这里会出现真实载荷与声明的比对结果。' }));
      calls.appendChild(verdict('还没有运行数据。', false));
    } else {
      var recent = item.observations || [];
      recent.slice(0, 20).forEach(function (ob) {
        var wrap = el('div', { class: 'call' });
        wrap.appendChild(el('div', { class: 'call-h' },
          el('span', { class: 'dot ' + (ob.ok ? 'd-ok' : 'd-bad') }),
          el('span', { class: 'when', text: timeAgo(ob.at) }),
          el('span', { class: 'call-who', text: ob.subject }),
          el('span', { class: 'tag ' + (ob.ok ? '' : 'bad'), text: ob.ok ? '对得上' : '不符' })));
        ob.reasons.forEach(function (reason) {
          wrap.appendChild(el('div', { class: 'finding' }, el('div', { text: reason })));
        });
        calls.appendChild(wrap);
      });
      if (total > recent.length) {
        calls.appendChild(el('div', { class: 'note',
          text: '另有 ' + (total - recent.length) + ' 次更早的观测未显示。' }));
      }
      calls.appendChild(verdict(bad.length
        ? '看过 ' + total + ' 次调用，其中 ' + bad.length + ' 次与声明不符。'
        : '看过 ' + total + ' 次调用，都与声明一致。', bad.length > 0));
      calls.appendChild(decisionRow(item, bad, 'observation'));
    }
    sa.appendChild(calls);

    box.appendChild(sa);
  }

  /* 树里的定位收口在这里：滚进可视区 + 闪一下。展开与抬上限归调用方（目录链、每 40 行
     上限各不相同），但"滚到它、闪一下"只有这一份 —— 以后再加一个跳转入口，也别抄第二遍。 */
  function flashTreeRow(row) {
    if (!row) return;
    if (row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
    row.classList.add('t-flash');
    setTimeout(function () { row.classList.remove('t-flash'); }, 1300);
  }

  /* 按属性在左树里找一行。不用属性选择器拼字符串：目录路径里万一有引号，
     拼出来的选择器会直接抛错，点击就成了"没反应"。 */
  function treeRowBy(attr, val) {
    var rows = document.querySelectorAll('.tree .trow');
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].getAttribute(attr) === val) return rows[i];
    }
    return null;
  }

  /* 图与左侧树同步：图上点某个契约后，把树里对应的那一行展开、抬到上限内、滚动到可视区并闪一下。
     树的行只有在"祖先展开 + 没被每 40 行上限截掉"时才存在，所以这两件事必须先做。
     分区只有目录一套，所以祖先就是它所在的那条目录链。 */
  function revealInTree(cid) {
    if (!cid) { renderAll(); return; }
    var it = S.items.filter(function (x) { return x.contract && x.contract.id === cid; })[0];
    /* 图上的节点 id 可能与契约 id 不完全相同（带前缀/被截断），退一步按包含关系找，避免同步失效 */
    if (!it) it = S.items.filter(function (x) { var id = x.contract && x.contract.id ? String(x.contract.id) : ''; var c = String(cid); return id && (id === c || id.indexOf(c) >= 0 || c.indexOf(id) >= 0); })[0];
    if (it) {
      var f = (it.contract.file || '');
      var parts = f.split('/').filter(function (x) { return x.length > 0; });
      var acc = '';
      for (var i = 0; i < parts.length - 1; i++) {
        acc = acc ? acc + '/' + parts[i] : parts[i];
        S.caps['dir:' + acc] = true;
      }
      /* 直接放在这一层的协议归「本层」那一组，行上限按那一组的键抬 */
      var hereKey = 'here:' + (acc || '(根)');
      S.caps[hereKey] = true;
      var key2 = acc || '(\u6839)';
      var list = dirItemsOf(acc);
      var idx2 = -1;
      for (var j2 = 0; j2 < list.length; j2++) if (list[j2].contract && list[j2].contract.id === cid) { idx2 = j2; break; }
      if (idx2 >= 0) {
        var need = idx2 + 1;
        if ((S.caps['rows:' + key2] || 40) < need) S.caps['rows:' + key2] = need;
        if ((S.caps['rows:' + hereKey] || 40) < need) S.caps['rows:' + hereKey] = need;
      }
    }
    renderAll();
    flashTreeRow(treeRowBy('data-id', cid));
  }

  /* 点右图上那条带的标题 → 在左树里定位到它对应的那个目录：展开到该目录、滚进可视区、闪一下。
     带上印的「对应左边：<路径>」和这里收到的 path 是同一个串（都来自 plan.groups[].path）。
     isHere = 这条带是「（本层）」：它对应的是左树里那个目录下的「本层」分组节点。 */
  function revealDirInTree(path, isHere) {
    if (!path) { renderAll(); return; }
    /* 展开到该目录：'a/b/c' 得先把 a、a/b 都开着，那一行才在树里存在。
       '(根)' 不是一层目录，它对应的「本层」行就在树顶，没有祖先要开。 */
    if (path !== '(根)') {
      var segs = String(path).split('/'), acc = '';
      for (var i = 0; i < segs.length; i++) {
        acc = acc ? acc + '/' + segs[i] : segs[i];
        S.caps['dir:' + acc] = true;
      }
    }
    if (isHere) S.caps['here:' + path] = true;
    renderAll();
    var row = isHere ? treeRowBy('data-here', path) : treeRowBy('data-dir', path);
    /* 「本层」那条带写的是目录路径，但它对应的是该目录下的「本层」行；
       万一这个目录里没有直接放的协议（没有本层行），退回落在这个目录那一行上，
       不让"点一下"变成没反应。 */
    if (!row && isHere) row = treeRowBy('data-dir', path);
    flashTreeRow(row);
  }

  /* 一次渲染的全部上下文：**分区只在这里算一次**，左树与主区图共用同一个 plan。
     两条链路各自算一遍分区，正是"左边一套、右边一套"的病根，所以这里把它掐死：
     renderTree(ctx) 照 ctx.plan 画分组节点，renderOverview/renderDirView 照同一个 ctx.plan 画带。
     边界情形也一并定下：分面/搜索筛掉谁、事态收窄到哪几条、范围是哪一层，两边永远是同一批条目。 */
  function currentCtx() {
    var items = visibleItems();
    var hot = [], cold = [];
    items.forEach(function (it) { (isHot(it) ? hot : cold).push(it); });
    /* 事态优先只在"确实有事"时才收窄：一条都没有的时候把全部铺开 */
    var focus = S.attention && hot.length > 0;
    var shown = focus ? hot : items;
    var scoped = scopeItemsOf(shown, S.dirView);
    return { items: items, hot: hot, cold: cold, focus: focus, shown: shown,
             plan: planOf(scoped, S.axis, S.dirView) };
  }

  function renderAll() {
    var ctx = currentCtx();
    S.ctx = ctx;
    renderTop();
    renderFacetBar();
    renderTree(ctx);
    if (S.sel) renderContract();
    else if (S.dirView) renderDirView(ctx);
    else renderOverview(ctx);
    var badge = $('#filtBadge');
    var n = facetCount() + (S.filt.changed ? 1 : 0) + (S.filt.finding ? 1 : 0);
    badge.hidden = n === 0;
    badge.textContent = String(n);
  }

  /* ---------- 当前项目 ----------
     宿主右侧栏知道自己在服务哪个会话，客户端把那个会话的工作目录带进 URL（`?cwd=`）。
     面板一打开就落在你正在干的项目上，而不是列表里的第一个。 */
  function cwdHint() {
    try {
      var v = new URLSearchParams(location.search).get('cwd');
      return v ? String(v) : '';
    } catch (e) { return ''; }
  }

  /* 只做尾斜杠归一，不做 realpath——这是提示，不是身份。 */
  function normPath(p) {
    return String(p || '').replace(/\/+$/, '');
  }

  function projectForCwd() {
    var cwd = normPath(cwdHint());
    if (!cwd) return null;
    return S.projects.filter(function (p) { return normPath(p.root) === cwd; })[0] || null;
  }

  /* 优先级：URL 指明的当前项目 → 上次选中的 → 列表第一个。 */
  function wantedProjectId() {
    var here = projectForCwd();
    if (here) return here.id;
    if (S.p && S.projects.some(function (p) { return p.id === S.p.id; })) return S.p.id;
    /* 上次选过的项目存在浏览器里，刷新后接着用它 */
    var saved = null;
    try { saved = localStorage.getItem('dsh-contract-butler.project'); } catch (e) { saved = null; }
    if (saved && S.projects.some(function (p) { return p.id === saved; })) return saved;
    return S.projects[0].id;
  }

  /* ---------- 数据加载 ---------- */
  function loadProjects() {
    return api('/projects').then(function (data) {
      S.projects = data.projects || [];
      var sel = $('#projSel');
      clear(sel);
      if (!S.projects.length) {
        sel.appendChild(el('option', { value: '', text: '（没有项目）' }));
        S.p = null; S.items = [];
        return null;
      }
      S.projects.forEach(function (p) {
        sel.appendChild(el('option', { value: p.id, text: p.title + '（' + p.contractCount + ' 条契约）' }));
      });
      // 当前项目还没纳管时要说出来，否则你会以为面板认错了项目。
      var cwd = cwdHint();
      if (cwd && !projectForCwd() && !S.note) {
        S.note = '当前项目 ' + cwd + ' 还没有纳管，下面显示的是已纳管项目。';
      }
      var wanted = wantedProjectId();
      return loadProject(wanted);
    });
  }

  function loadProject(id) {
    return api('/contracts?project=' + encodeURIComponent(id)).then(function (data) {
      S.p = S.projects.filter(function (p) { return p.id === id; })[0] || null;
      S.items = data.contracts || [];
      S.axes = data.axes || [];
      S.labels = data.labels || {};
      if (S.sel && !S.items.some(function (it) { return it.contract.id === S.sel; })) S.sel = null;
      renderAll();
    });
  }

  function refresh() {
    if (!S.p) return loadProjects().then(renderAll);
    var id = S.p.id;
    var keepSel = S.sel;
    return api('/projects').then(function (data) {
      S.projects = data.projects || [];
      return loadProject(id);
    }).then(function () {
      S.sel = keepSel;
      renderAll();
    });
  }

/* ---------- 纳管向导 · 左选项目 / 右选目录 ----------
     纳管的粒度是目录，不是一条条 schema：人说得出口的是"src/pages 那一坨先别管"，
     没人愿意在 1400 条候选里点 300 次。所以这一屏只有两栏、两种行：左边项目、右边目录。
     目录行带三态复选框——勾父目录 = 连整棵子树一起勾，子目录勾满则父呈"全选"、勾一半呈"部分"。
     勾选状态按候选 id 存（切项目、搜索、重画都不动它），但界面只给目录级的勾：
     单条候选只在「看候选」里露一眼，那一步是只读的，不参与勾选。 */
  var DIR_CAP = 80;
  var PEEK_MAX = 12;

  function openOverlay(title, body, wide) {
    $('#ovTitle').textContent = title;
    var box = $('#ovBody');
    clear(box);
    box.appendChild(body);
    var sheet = $('#ov .sheet');
    if (sheet) sheet.classList.toggle('wide', wide === true);
    $('#ov').classList.add('open');
  }
  function closeOverlay() { $('#ov').classList.remove('open'); }

  /* 未纳管的形态：选项目 → 选目录（先只读预览）→ 决定纳管哪些。入口是 openFlow()，
     不是第二个按钮；纳管落库之后接着走同一条链的 AI 段（见 commitDirs）。 */
  function flowOnboard(preselect) {
    S.init = null; S.pick = null;
    S.ws = []; S.wsSel = ''; S.wsSrc = ''; S.scanning = '';
    S.previews = {}; S.picks = {}; S.wsCounts = {};
    var q = el('input', { class: 'search', id: 'wsQ', type: 'text',
      placeholder: '找项目…', autocomplete: 'off' });
    q.addEventListener('input', function () { renderWsList(); });
    var body = el('div', {},
      el('div', { class: 'note',
        text: '左边选项目，右边选这个项目里要纳管的目录。勾一个目录 = 连它下面的子目录一起纳管；'
          + '在点「纳管选中的目录」之前都是只读的，不会写任何东西。' }),
      el('div', { class: 'two' },
        el('div', { class: 'wcol' },
          el('div', { class: 'dhint', text: 'DSH 里的项目' }),
          q,
          el('div', { class: 'wlist', id: 'wsList' },
            el('div', { class: 'empty', text: '正在读 DSH 的项目列表…' }))),
        el('div', { class: 'dcol' },
          el('div', { class: 'dbox', id: 'initOut' },
            el('div', { class: 'empty', style: 'padding:22px',
              text: '从左边点一个项目，这里就是它的目录。' })))));
    openOverlay('纳管项目', body, true);
    loadWorkspaces(preselect);
  }

  /* 项目清单来自宿主，路径由 DSH 自己维护——不让人记、不让人抄。
     `preselect` 是当前 workspace 的路径：认得出就直接选上它（顺手只读扫一遍），人只需挑目录。
     认不出就只把清单摆出来：扫一个陌生仓库要有人的意思表示，不替他扫。 */
  function loadWorkspaces(preselect) {
    api('/workspaces').then(function (data) {
      S.ws = data.workspaces || [];
      S.wsSrc = data.source || '';
      renderWsList();
      if (!S.ws.length) { renderRight(); return; }
      var want = normPath(preselect);
      var hit = want
        ? S.ws.filter(function (w) { return normPath(w.path) === want; })[0]
        : null;
      if (hit) { selectWs(hit.id, true); return; }
      renderRight();
    }).catch(function (e) {
      var list = $('#wsList');
      if (!list) return;
      clear(list);
      list.appendChild(el('div', { class: 'empty', text: '读项目列表失败：' + e.message }));
    });
  }

  function wsFiltered() {
    var q = $('#wsQ');
    var s = q ? String(q.value).trim().toLowerCase() : '';
    if (!s) return S.ws.slice();
    return S.ws.filter(function (w) {
      return (String(w.title) + '\u0000' + String(w.path)).toLowerCase().indexOf(s) !== -1;
    });
  }

  /* 左栏那个数是"扫过才知道"的数：没扫过就照实写「待扫描」，不编一个 0 出来。
     已纳管的项目不重复扫，直接写「已纳管」——再纳管一次没有意义。 */
  function wsCountText(w) {
    if (w.managed) return '已纳管';
    if (S.scanning === w.path) return '扫描中…';
    var n = S.wsCounts[w.path];
    return n === undefined ? '待扫描' : n + ' 条候选';
  }

  function currentWs() {
    return S.ws.filter(function (w) { return w.id === S.wsSel; })[0] || null;
  }

  function renderWsList() {
    var list = $('#wsList');
    if (!list) return;
    clear(list);
    if (!S.ws.length) {
      list.appendChild(el('div', { class: 'empty', text: S.wsSrc === 'unavailable'
        ? '读不到 DSH 的项目列表（宿主的 workspaceRegistry 没挂上）。'
        : 'DSH 里还没有项目。' }));
      return;
    }
    var items = wsFiltered();
    if (!items.length) {
      list.appendChild(el('div', { class: 'empty', text: '没有匹配的项目。' }));
      return;
    }
    items.forEach(function (w) {
      var row = el('button', { class: 'wrow' + (w.id === S.wsSel ? ' on' : ''), type: 'button',
        title: w.path },
        el('span', { class: 'wt' },
          el('span', { class: 'wn', text: w.title }),
          el('span', { class: 'wc', text: wsCountText(w) })),
        el('span', { class: 'wp', text: w.path }));
      row.addEventListener('click', function () { selectWs(w.id, true); });
      list.appendChild(row);
    });
  }

  /* 切项目：右栏整体换。扫过的项目直接用缓存——扫描是只读的，但也不便宜。
     已纳管的项目不扫：纳管过的再扫一遍只会让人以为要重复纳管，右栏只给一张卡片和一个
     "只读预览"的次要入口（那一步也仍然不写任何东西）。
     `scan` 为假时只高亮这一行、不扫——只有"当前项目认出来了"才自动扫。 */
  function selectWs(id, scan) {
    var w = S.ws.filter(function (x) { return x.id === id; })[0];
    if (!w) return;
    S.wsSel = id;
    var cached = S.previews[w.path];
    if (cached) {
      S.init = cached;
      S.pick = pickOf(w);
      renderWsList();
      renderRight();
      return;
    }
    S.init = null;
    S.pick = null;
    renderWsList();
    renderRight();
    if (!w.managed && scan) scanWs(w);
  }

  /* 勾选状态按项目分别记着：切走再切回来，勾好的东西还在。 */
  function pickOf(w) {
    var pk = S.picks[w.path];
    if (!pk) {
      pk = S.picks[w.path] = { picked: {}, q: '', open: {}, peek: {}, all: false, filled: false };
    }
    pk.ro = w.managed === true;
    return pk;
  }

  /* 只读预览：POST /init 不带 confirm，宿主只扫不写。 */
  function scanWs(w) {
    S.scanning = w.path;
    renderWsList();
    renderRight();
    api('/init', { method: 'POST', body: { root: w.path } }).then(function (data) {
      if (S.scanning === w.path) S.scanning = '';
      if (S.wsSel !== w.id) return;          // 人已经切走了，别把结果画到别人头上
      var pv = data.preview;
      S.previews[w.path] = pv;
      S.wsCounts[w.path] = (pv.candidates || []).length;
      var pk = pickOf(w);
      // 第一次打开这个项目默认全勾（沿用原来"先全选再减"的口径）；此后按候选 id 记着。
      if (!pk.filled) {
        (pv.candidates || []).forEach(function (c) { pk.picked[c.id] = true; });
        pk.filled = true;
      }
      S.init = pv;
      S.pick = pk;
      renderWsList();
      renderRight();
    }).catch(function (e) {
      if (S.scanning === w.path) S.scanning = '';
      if (S.wsSel !== w.id) return;
      renderWsList();
      var out = $('#initOut');
      if (!out) return;
      clear(out);
      out.appendChild(el('div', { class: 'empty', style: 'padding:22px',
        text: '扫这个项目失败：' + e.message }));
    });
  }

  /* ---------- 右栏：这个项目的目录 ---------- */
  function renderRight() {
    var out = $('#initOut');
    if (!out) return;
    clear(out);
    var w = currentWs();
    if (!w) {
      out.appendChild(el('div', { class: 'empty', style: 'padding:22px',
        text: '从左边点一个项目，这里就是它的目录。' }));
      return;
    }
    var pv = S.init;
    if (!pv) {
      if (S.scanning === w.path) {
        out.appendChild(el('div', { class: 'empty', style: 'padding:22px',
          text: '正在扫 ' + w.path + ' …' }));
        return;
      }
      if (w.managed) {
        var go = el('button', { class: 'ghost', type: 'button', text: '只读预览它的目录' });
        go.style.marginTop = '12px';
        go.addEventListener('click', function () { scanWs(w); });
        out.appendChild(el('div', { class: 'empty', style: 'padding:20px' },
          el('div', { text: '「' + w.title + '」已经纳管了。' }),
          el('div', { class: 'note', style: 'margin:6px 0 0',
            text: '重复纳管没有意义：想看看它的目录结构，可以先只读预览一眼——那一步不写任何东西。' }),
          go));
        return;
      }
      out.appendChild(el('div', { class: 'empty', style: 'padding:22px',
        text: '从左边点一个项目，这里就是它的目录。' }));
      return;
    }

    var pk = S.pick;
    var tree = buildPickTree(pv.candidates || []);
    out.appendChild(dirBar(pv, pk, tree));
    if (!pv.candidates.length) {
      // 0 个候选就照实说，不给一个空框让人猜。
      out.appendChild(el('div', { class: 'empty', style: 'padding:18px' },
        el('div', { text: '这个项目里没扫到可纳管的边界。' }),
        el('div', { class: 'note', style: 'margin:8px 0 0',
          text: '当前会看 OpenAPI / JSON Schema / .proto / 导出类型 / 运行时工具注册表。' }),
        (pv.scan.errors && pv.scan.errors.length)
          ? el('div', { class: 'note', style: 'margin:0',
            text: '另有 ' + pv.scan.errors.length + ' 个文件读不动。' })
          : null));
      return;
    }
    out.appendChild(el('div', { class: 'drows', id: 'dRows' }));
    out.appendChild(dirFoot(pk));
    renderDirRows();
  }

  /* 右栏顶栏：目录前缀 + 过滤 + 全选 / 全不选。批量只作用于**当前列出来的**目录。 */
  function dirBar(pv, pk, tree) {
    var q = el('input', { class: 'search', id: 'dQ', type: 'text', value: pk.q,
      placeholder: '按目录名过滤…', autocomplete: 'off' });
    q.addEventListener('input', function () { pk.q = q.value; renderDirRows(); });
    function bulk(label, on) {
      var b = el('button', { class: 'pkbtn', type: 'button', text: label,
        title: label + '只作用于当前列出来的目录（连子目录）' });
      b.addEventListener('click', function () {
        listed(tree, pk).forEach(function (n) { setDir(n, on); });
        renderDirRows();
      });
      return b;
    }
    return el('div', { class: 'dbar' },
      el('div', { class: 'dprefix' },
        el('span', { text: '目录' }),
        el('span', { class: 'dp', text: pv.root, title: pv.root })),
      el('div', { class: 'pkrow1' }, q, el('span', { class: 'chip chip-dim', id: 'dCount', text: '' })),
      // 没候选就没有可勾的目录：批量按钮在这里是死控件，不如不给。
      pv.candidates.length
        ? el('div', { class: 'pkrow2' },
          bulk('全选', true), bulk('全不选', false),
          el('span', { class: 'pkhint', id: 'dHint', text: '' }))
        : null,
      el('div', { class: 'pkrow2' },
        el('span', { class: 'chip chip-dim',
          text: pv.vcs === 'git' ? 'git 仓库' : '没有 git' }),
        el('span', { class: 'chip chip-dim', text: '读了 ' + pv.scan.filesSeen + ' 个文件' }),
        pv.scan.truncated ? el('span', { class: 'chip chip-warn', text: '文件太多，只扫了一部分' }) : null),
      pv.head
        ? el('div', { class: 'dnote', text: '基线会定在 ' + shortSha(pv.head.sha) + '（' + pv.head.subject + '）' })
        : null,
      pv.vcs === 'none'
        ? el('div', { class: 'dnote', text: '这个项目没有 git：基线退化成内容哈希，之后只能比内容变没变。' })
        : null);
  }

  /* 底部：已选 N 个目录 · 覆盖 M 条契约。目录数只数"选中的根"——整棵 src 全勾算 1 个目录，
     不把子树里每一个都算一遍；只选了一部分的目录单独在旁边说一句。 */
  function dirFoot(pk) {
    var sum = el('div', { class: 'dsum', id: 'dSum', text: '' });
    var go = el('button', { class: 'ghost', id: 'dGo', type: 'button', text: '纳管选中的目录' });
    if (pk.ro) { go.disabled = true; go.style.opacity = '.55'; go.style.cursor = 'default'; }
    else go.addEventListener('click', function () { commitDirs(go); });
    var err = el('div', { class: 'pkerr', id: 'dErr', hidden: true, text: '' });
    err.style.padding = '8px 10px 0';
    return el('div', {},
      pk.ro
        ? el('div', { class: 'dnote',
          text: '这个项目已经纳管了，这里只是只读预览——不能重复纳管。' })
        : null,
      el('div', { class: 'dfoot' }, sum, go),
      err);
  }

  /* ---------- 目录树：从候选的文件路径推出来 ----------
     文件名那一段不参与——纳管的单位是目录。运行时候选（`(工具注册表)` 这种伪路径）
     没有目录可言，单独归一行「（运行时）」。 */
  function emptyPickNode(name, path) {
    return { name: name, path: path, n: 0, sel: 0, kids: {}, items: [] };
  }

  function buildPickTree(cands) {
    var root = emptyPickNode('（项目根）', '');
    (cands || []).forEach(function (c) {
      var f = String(c.file || '');
      var dirs;
      if (!f || f.charAt(0) === '(') dirs = ['（运行时）'];
      else {
        var parts = f.split('/').filter(function (x) { return x.length > 0; });
        dirs = parts.slice(0, parts.length - 1);
      }
      var node = root;
      node.n += 1;
      dirs.forEach(function (d) {
        if (!node.kids[d]) {
          node.kids[d] = emptyPickNode(d, node.path === '' ? d : node.path + '/' + d);
        }
        node = node.kids[d];
        node.n += 1;
      });
      node.items.push(c);
    });
    // 根目录下的文件（openapi.yaml 这种）也得有落脚的一行，不然它们无处可勾。
    if (root.items.length) {
      var own = emptyPickNode('（根目录）', '');
      own.n = root.items.length;
      own.items = root.items;
      root.kids['（根目录）'] = own;
      root.items = [];
    }
    return root;
  }

  /* 子目录排序：候选多的在前，同样多按名字——先看"东西多的那一枝"。 */
  function kidNames(node) {
    return Object.keys(node.kids)
      .map(function (name) { return { name: name, node: node.kids[name] }; })
      .sort(function (a, b) {
        if (a.node.n !== b.node.n) return b.node.n - a.node.n;
        return a.name < b.name ? -1 : 1;
      });
  }

  /* 过滤：按**目录名**命中（人说的是"找那个 extension 目录"，不是背全路径）。
     命中就停在那一行——它代表整棵子树，计数与三态都算整棵；要看里面就在这一行上展开。 */
  function listed(tree, pk) {
    var s = String(pk.q || '').trim().toLowerCase();
    if (!s) return kidNames(tree).map(function (k) { return k.node; });
    var out = [];
    (function walk(node) {
      kidNames(node).forEach(function (k) {
        var n = k.node;
