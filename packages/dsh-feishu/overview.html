<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>飞书任务总览 · DSH</title>
<style>
  /* ---------- 主题变量（宿主令牌优先，自有变量兜底；口径沿用 panel.html） ---------- */
  :root {
    color-scheme: light;
    --p-page: #f6f7f9;
    --p-card: #ffffff;
    --p-sub: #f1f3f6;
    --p-text: #14141a;
    --p-text-2: #5f6470;
    --p-text-3: #8a8f99;
    --p-line: #e8e9ee;
    --p-line-strong: #d7dae1;
    --p-accent: #3b5bdb;
    --p-accent-text: #2f4bc8;
    --p-accent-weak: rgba(59, 91, 219, 0.10);
    --p-accent-line: rgba(59, 91, 219, 0.28);
    --p-select: #ea6a12;
    --p-select-weak: rgba(234, 106, 18, 0.12);
    --p-select-line: rgba(234, 106, 18, 0.55);
    --p-ok: #0f7b55;
    --p-ok-weak: rgba(15, 123, 85, 0.10);
    --p-warn: #a45d09;
    --p-warn-weak: rgba(164, 93, 9, 0.10);
    --p-danger: #c0261b;
    --p-danger-weak: rgba(192, 38, 27, 0.09);
    --p-shadow: 0 1px 2px rgba(17, 24, 39, 0.04);
    /* 关系图画布：极淡的方格纸，给「工程图」一点材质，但绝不抢内容 */
    --p-grid: rgba(20, 20, 26, 0.055);
    --p-ghost: rgba(20, 20, 26, 0.035);
    /* 项目配色：同一个目录下的项目共用一张图，靠这组颜色分辨项目 */
    --ov-c0: #3b5bdb;
    --ov-c1: #0f7b55;
    --ov-c2: #a45d09;
    --ov-c3: #b5179e;
    --ov-c4: #0e7490;
    --ov-c5: #c0261b;
    --ov-c6: #6d28d9;
    --ov-c7: #4d7c0f;
    --ov-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  body.dark {
    color-scheme: dark;
    --p-page: #131418;
    --p-card: #1b1d22;
    --p-sub: #222429;
    --p-text: #e9eaee;
    --p-text-2: #a7abb4;
    --p-text-3: #7b808a;
    --p-line: #2a2d34;
    --p-line-strong: #3a3e47;
    --p-accent: #4a63e0;
    --p-accent-text: #9db0ff;
    --p-accent-weak: rgba(120, 145, 255, 0.14);
    --p-accent-line: rgba(120, 145, 255, 0.34);
    --p-select: #ff9f45;
    --p-select-weak: rgba(255, 159, 69, 0.16);
    --p-select-line: rgba(255, 159, 69, 0.60);
    --p-ok: #4dc38d;
    --p-ok-weak: rgba(77, 195, 141, 0.12);
    --p-warn: #e0a458;
    --p-warn-weak: rgba(224, 164, 88, 0.12);
    --p-danger: #ff7a70;
    --p-danger-weak: rgba(255, 122, 112, 0.12);
    --p-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    --p-grid: rgba(233, 234, 238, 0.05);
    --p-ghost: rgba(233, 234, 238, 0.03);
    --ov-c0: #7f96ff;
    --ov-c1: #4dc38d;
    --ov-c2: #e0a458;
    --ov-c3: #f38bd8;
    --ov-c4: #4bc6e0;
    --ov-c5: #ff8a80;
    --ov-c6: #b79cff;
    --ov-c7: #b6d95c;
  }

  /* ---------- 基础 ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: stretch;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.5;
    color: var(--dsw-alias-label-primary, var(--p-text));
    background: var(--dsw-alias-bg-base, var(--p-page));
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible { outline: 2px solid var(--p-accent); outline-offset: 2px; border-radius: 6px; }

  button { font: inherit; color: inherit; }

  /* ---------- 左侧 rail ---------- */
  .ov-rail {
    flex: 0 0 226px;
    width: 226px;
    align-self: stretch;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    padding: 20px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: var(--dsw-alias-bg-layer-1, var(--p-card));
    border-right: 1px solid var(--dsw-alias-line-base, var(--p-line));
  }

  .ov-brand { display: flex; align-items: center; gap: 10px; }
  .ov-brand-mark {
    width: 28px; height: 28px; flex: 0 0 28px;
    border-radius: 9px;
    display: grid; place-items: center;
    background: var(--dsw-alias-brand-primary, var(--p-accent));
    color: var(--dsw-alias-label-onbrand, #fff);
    font-size: 13px; font-weight: 600;
    font-family: var(--ov-mono);
  }
  .ov-brand-text { display: flex; flex-direction: column; min-width: 0; }
  .ov-brand-title { font-size: 13.5px; font-weight: 600; letter-spacing: .01em; }
  .ov-brand-sub { font-size: 11px; color: var(--dsw-alias-label-secondary, var(--p-text-3)); }

  /* ---------- 左栏：VSCode 式列表树（整个左栏就这一棵树） ---------- */
  .ov-tree {
    display: flex; flex-direction: column; gap: 1px;
    margin: 0 -6px; padding: 2px 0;
    overflow-x: hidden;
  }
  .ov-tree-row {
    display: flex; align-items: center; gap: 4px;
    min-height: 24px; padding: 0 4px;
    border: 0; border-radius: 5px;
    background: transparent; color: var(--dsw-alias-label-primary, var(--p-text));
    cursor: pointer; text-align: left; font-size: 12.5px;
    outline-offset: -2px;
  }
  .ov-tree-row:hover { background: var(--p-sub); }
  .ov-tree-row[aria-selected="true"] { background: var(--p-select-weak); color: var(--p-select); font-weight: 600; }
  .ov-tree-row.is-drop-target { background: var(--p-accent-weak); box-shadow: inset 0 0 0 1px var(--p-accent-line); }
  .ov-tree-row.is-dragging { opacity: .5; }
  .ov-tree-row[data-depth="1"] { padding-left: 20px; }
  .ov-tree-twist {
    flex: 0 0 12px; width: 12px; text-align: center;
    color: var(--dsw-alias-label-secondary, var(--p-text-3)); font-size: 9px;
  }
  .ov-tree-dot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--p-accent); }
  .ov-tree-dot[data-state="done"] { background: var(--p-ok); }
  .ov-tree-dot[data-state="blocked"] { background: var(--p-danger); }
  .ov-tree-row .ov-tree-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ov-tree-row .ov-tree-count {
    flex: 0 0 auto; font-family: var(--ov-mono); font-size: 10.5px;
    color: var(--dsw-alias-label-secondary, var(--p-text-3)); font-variant-numeric: tabular-nums;
  }
  .ov-tree-row[aria-selected="true"] .ov-tree-count { color: var(--p-select); }
  /* ✎ / 🗑 只在 hover 或键盘聚焦时出现，不常驻一排按钮 */
  .ov-tree-actions { flex: 0 0 auto; display: flex; gap: 2px; opacity: 0; }
  .ov-tree-row:hover .ov-tree-actions,
  .ov-tree-row:focus-within .ov-tree-actions,
  .ov-tree-row.is-editing .ov-tree-actions { opacity: 1; }
  .ov-tree-actions button {
    width: 18px; height: 18px; padding: 0;
    border: 0; border-radius: 4px; background: transparent; cursor: pointer;
    color: var(--dsw-alias-label-secondary, var(--p-text-3)); font-size: 11px; line-height: 1;
  }
  .ov-tree-actions button:hover { background: var(--p-accent-weak); color: var(--p-accent-text); }
  .ov-tree-actions button[data-danger="true"]:hover { background: var(--p-danger-weak); color: var(--p-danger); }
  .ov-tree-input { flex: 1 1 auto; min-width: 0; padding: 2px 5px; font-size: 12px; border-radius: 5px;
    border: 1px solid var(--p-accent-line); background: var(--dsw-alias-bg-layer-1, var(--p-card)); color: inherit; }
  .ov-tree-note { padding: 1px 4px 1px 20px; font-size: 11px; color: var(--dsw-alias-label-secondary, var(--p-text-3)); }
  .ov-alert {
    margin: 2px 0 2px 20px; padding: 5px 8px; border-radius: 7px;
    border: 1px solid var(--p-danger); background: var(--p-danger-weak);
    color: var(--p-danger); font-size: 11px;
  }
  .ov-tree-foot { padding-top: 2px; }
  .ov-tree-new {
    display: block; width: 100%; padding: 5px 6px;
    border: 1px dashed var(--dsw-alias-line-base, var(--p-line)); border-radius: 6px;
    background: transparent; color: var(--dsw-alias-label-secondary, var(--p-text-2));
    cursor: pointer; text-align: left; font-size: 12px;
  }
  .ov-tree-new:hover { border-color: var(--p-accent-line); color: var(--p-accent-text); }

  .ov-inline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ov-keyword {
    width: 100%; padding: 7px 10px;
    border: 1px solid var(--dsw-alias-line-base, var(--p-line));
    border-radius: 9px;
    background: var(--dsw-alias-bg-base, var(--p-page));
    color: inherit;
  }
  .ov-keyword::placeholder { color: var(--p-text-3); }
  .ov-head-actions .ov-keyword { width: 200px; }

  .ov-rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
  .ov-legend { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--dsw-alias-label-secondary, var(--p-text-2)); }
  .ov-legend-row { display: flex; align-items: center; gap: 8px; }
  .ov-legend-swatch { flex: 0 0 26px; }

  /* ---------- 主区 ---------- */
  .ov-main { flex: 1 1 auto; min-width: 0; padding: 22px 24px 48px; display: flex; flex-direction: column; gap: 16px; }

  .ov-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
  .ov-head-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 260px; }
  .ov-title { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  .ov-subtitle { font-size: 12px; color: var(--dsw-alias-label-secondary, var(--p-text-2)); }
  .ov-head-actions { display: flex; align-items: center; gap: 8px; }

  .ov-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--dsw-alias-line-base, var(--p-line));
    border-radius: 9px;
    background: var(--dsw-alias-bg-layer-1, var(--p-card));
    cursor: pointer;
    font-size: 12px;
  }
  .ov-btn:hover { border-color: var(--p-line-strong); }
  .ov-btn[disabled] { opacity: .55; cursor: progress; }

  .ov-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  .ov-body.has-detail { grid-template-columns: minmax(0, 1fr) 292px; }

  .ov-lanes { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .ov-lane {
    border: 1px solid var(--dsw-alias-line-base, var(--p-line));
    border-radius: 16px;
    background: var(--dsw-alias-bg-layer-1, var(--p-card));
    box-shadow: var(--p-shadow);
    overflow: hidden;
  }
  .ov-lane-head {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--dsw-alias-line-base, var(--p-line));
  }
  .ov-lane-name { font-size: 13.5px; font-weight: 600; }
  .ov-lane-path { font-family: var(--ov-mono); font-size: 10.5px; color: var(--dsw-alias-label-secondary, var(--p-text-3)); }
  .ov-lane-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; align-items: center; }
  .ov-tag {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--dsw-alias-line-base, var(--p-line));
    font-size: 11px; font-family: var(--ov-mono); font-variant-numeric: tabular-nums;
    color: var(--dsw-alias-label-secondary, var(--p-text-2));
  }
  .ov-tag[data-tone="danger"] { color: var(--p-danger); border-color: var(--p-danger); background: var(--p-danger-weak); }
  .ov-tag[data-tone="ok"] { color: var(--p-ok); border-color: var(--p-ok); background: var(--p-ok-weak); }
  .ov-tag[data-tone="accent"] { color: var(--p-accent-text); border-color: var(--p-accent-line); background: var(--p-accent-weak); }

  .ov-canvas {
    overflow: auto;
    max-height: 62vh;
    background-image:
      linear-gradient(var(--p-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--p-grid) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .ov-canvas svg { display: block; }

  .ov-edge { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ov-edge[data-kind="depends_on"] { stroke: var(--p-accent-line); stroke-width: 1.6; }
  .ov-edge[data-kind="derived_from"] { stroke: var(--p-line-strong); stroke-width: 1.4; stroke-dasharray: 5 4; }
  .ov-edge.is-active { stroke: var(--p-select); stroke-width: 2.2; stroke-dasharray: none; }

  .ov-node { cursor: pointer; }
  .ov-node .ov-node-bg {
    fill: var(--dsw-alias-bg-layer-1, var(--p-card));
    stroke: var(--dsw-alias-line-base, var(--p-line));
    stroke-width: 1.2;
    transition: stroke-color .12s ease, transform .12s ease;
  }
  .ov-node:hover .ov-node-bg { stroke: var(--p-line-strong); }
  .ov-node.is-selected .ov-node-bg { stroke: var(--p-select); stroke-width: 2; }
  .ov-node .ov-node-spine { fill: var(--p-accent); }
  .ov-node[data-state="done"] .ov-node-spine { fill: var(--p-ok); }
  .ov-node[data-state="blocked"] .ov-node-spine { fill: var(--p-danger); }
  .ov-node[data-state="suspended"] .ov-node-spine { fill: var(--p-warn); }
  .ov-node.is-ghost .ov-node-spine { fill: transparent; }
  .ov-node.is-ghost .ov-node-bg {
    fill: var(--p-ghost);
    stroke: var(--dsw-alias-line-strong, var(--p-line-strong));
    stroke-dasharray: 4 4;
  }
  .ov-node-title { fill: var(--dsw-alias-label-primary, var(--p-text)); font-size: 12px; font-weight: 600; }
  .ov-node-meta { fill: var(--dsw-alias-label-secondary, var(--p-text-3)); font-size: 10.5px; }
  .ov-node-no { fill: var(--dsw-alias-label-secondary, var(--p-text-2)); font-size: 10.5px; font-family: var(--ov-mono); }
  .ov-node.is-ghost .ov-node-title { fill: var(--dsw-alias-label-secondary, var(--p-text-2)); font-style: italic; }
  .ov-node .ov-dot { stroke: var(--dsw-alias-bg-layer-1, var(--p-card)); stroke-width: 1.5; }
  .ov-node[data-state="done"] .ov-dot { fill: var(--p-ok); }
  .ov-node[data-state="blocked"] .ov-dot { fill: var(--p-danger); }
  .ov-node[data-state="suspended"] .ov-dot { fill: var(--p-warn); }
  .ov-node[data-state="open"] .ov-dot { fill: var(--p-accent); }
  .ov-node.is-ghost .ov-dot { fill: var(--dsw-alias-label-secondary, var(--p-text-3)); }
  .ov-node.is-related .ov-node-bg { stroke: var(--p-select-line); }

  /* ---------- 按目录分组：一个项目一条泳道，共用一个坐标系 ---------- */
  .ov-band { stroke-width: 1; }
  .ov-band-label { font-size: 11px; font-weight: 600; font-family: var(--ov-mono); }
  .ov-canvas[data-mode="custom"] .ov-node[data-state="blocked"] .ov-node-bg { stroke: var(--p-danger); }
  .ov-canvas[data-mode="custom"] .ov-node[data-state="done"] .ov-node-bg { stroke: var(--p-ok); }

  .ov-lane.is-collapsed .ov-lane-head { border-bottom-color: transparent; }

  .ov-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 10px; padding: 14px; }
  .ov-task-card {
    display: flex; flex-direction: column; gap: 6px;
    padding: 11px 12px 12px 14px;
    border: 1px solid var(--dsw-alias-line-base, var(--p-line));
    border-radius: 12px;
    background: var(--dsw-alias-bg-layer-1, var(--p-card));
    cursor: pointer;
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .ov-task-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--p-accent);
  }
  .ov-task-card[data-state="done"]::before { background: var(--p-ok); }
  .ov-task-card[data-state="blocked"]::before { background: var(--p-danger); }
  .ov-task-card[data-state="suspended"]::before { background: var(--p-warn); }
  .ov-task-card:hover { border-color: var(--p-line-strong); }
  .ov-task-card.is-selected { border-color: var(--p-select); box-shadow: 0 0 0 1px var(--p-select-line); }
  .ov-task-card-top { display: flex; align-items: center; gap: 8px; }
  .ov-task-no { font-family: var(--ov-mono); font-size: 10.5px; color: var(--dsw-alias-label-secondary, var(--p-text-3)); }
  .ov-task-title { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
  .ov-task-foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .ov-dot-mark { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; background: var(--p-accent); }
  .ov-dot-mark[data-state="done"] { background: var(--p-ok); }
  .ov-dot-mark[data-state="blocked"] { background: var(--p-danger); }
  .ov-dot-mark[data-state="suspended"] { background: var(--p-warn); }
  .ov-dot-mark[data-state="open"] { background: var(--p-accent); }

  /* ---------- 详情 ---------- */
  .ov-detail {
    position: sticky; top: 22px;
    display: flex; flex-direction: column; gap: 12px;
    padding: 16px;
    border: 1px solid var(--dsw-alias-line-base, var(--p-line));
    border-radius: 16px;
    background: var(--dsw-alias-bg-layer-1, var(--p-card));
    box-shadow: var(--p-shadow);
    max-height: calc(100vh - 44px);
    overflow-y: auto;
  }
  .ov-detail-eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--ov-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--dsw-alias-label-secondary, var(--p-text-3));
  }
  .ov-detail-title { margin: 0; font-size: 15px; font-weight: 650; line-height: 1.4; }
  .ov-detail-sec { display: flex; flex-direction: column; gap: 6px; }
  .ov-detail-sec-label {
    font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--dsw-alias-label-secondary, var(--p-text-3));
  }
  .ov-ref {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 6px 8px;
    border: 1px solid var(--dsw-alias-line-base, var(--p-line));
    border-radius: 9px;
    background: transparent; cursor: pointer; text-align: left;
    font-size: 12px;
  }
  .ov-ref:hover { border-color: var(--p-select-line); background: var(--p-select-weak); }
  .ov-ref span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ov-ref[data-missing="true"] { border-style: dashed; color: var(--dsw-alias-label-secondary, var(--p-text-2)); cursor: default; }
  .ov-ref[data-missing="true"]:hover { border-color: var(--dsw-alias-line-strong, var(--p-line-strong)); background: transparent; }
  .ov-muted { font-size: 11.5px; color: var(--dsw-alias-label-secondary, var(--p-text-3)); }
  .ov-kv { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 4px 8px; font-size: 12px; }
  .ov-kv dt { color: var(--dsw-alias-label-secondary, var(--p-text-3)); }
  .ov-kv dd { margin: 0; overflow-wrap: anywhere; }
  .ov-mono { font-family: var(--ov-mono); font-size: 11.5px; }

  /* ---------- 状态块 ---------- */
  .ov-notice {
    display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
    padding: 20px;
    border: 1px solid var(--dsw-alias-line-base, var(--p-line));
    border-radius: 16px;
    background: var(--dsw-alias-bg-layer-1, var(--p-card));
    max-width: 560px;
  }
  .ov-notice[data-tone="error"] { border-color: var(--p-danger); background: var(--p-danger-weak); }
  .ov-notice-title { margin: 0; font-size: 14px; font-weight: 650; }
  .ov-notice-body { margin: 0; font-size: 12.5px; color: var(--dsw-alias-label-secondary, var(--p-text-2)); overflow-wrap: anywhere; }
  .ov-notice-actions { display: flex; gap: 8px; }

  .ov-skeleton { display: flex; flex-direction: column; gap: 10px; }
  .ov-skeleton-row {
    height: 74px; border-radius: 14px;
    border: 1px solid var(--dsw-alias-line-base, var(--p-line));
    background: linear-gradient(90deg, var(--p-sub) 0%, var(--dsw-alias-bg-layer-1, var(--p-card)) 45%, var(--p-sub) 100%);
    background-size: 260% 100%;
    animation: ov-sheen 1.5s ease-in-out infinite;
  }

<script>
  /* URL ?theme=dark|light → body 类；postMessage 切换见主脚本。口径同 panel.html。
     宿主（client.js）只在深色时带 ?theme=dark，浅色时给裸 URL，所以默认是浅色；
     只有「脱离宿主、单独打开」时才跟随系统，避免宿主浅色 + 系统深色先闪一下。 */
  (function () {
    var explicit = null;
    try {
      var m = /[?&]theme=([^&#]*)/.exec(location.search || '');
      if (m) explicit = decodeURIComponent(m[1]).toLowerCase();
    } catch (e) { /* 忽略 */ }
    var framed = true;
    try { framed = !!(window.parent && window.parent !== window); } catch (e) { framed = true; }
    var dark = explicit === 'dark';
    if (!explicit && !framed) {
      try { dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { dark = false; }
    }
    if (dark) document.body.classList.add('dark');
    document.documentElement.setAttribute('data-theme-source', explicit ? 'query' : (framed ? 'host' : 'system'));
  })();
</script>

<script>
/* OVERVIEW_LAYOUT:START
   纯函数布局层：不碰 DOM、不发请求、不看时间，便于 test/overviewPage.mjs 用 vm 抽出来单跑。
   以后加时间线 / 里程碑视图时，复用这里的分组、node 构造、分层与筛选，只换渲染。 */
var OVERVIEW_LAYOUT = (function () {
  'use strict';

  var VERSION = 1;
  var UNGROUPED_KEY = '__ungrouped__';
  var UNGROUPED_LABEL = '未归属项目';
  /* 自定义目录口径下的「未分组」桶：没被拖进任何目录的 workspace 都落在这里。 */
  var UNGROUPED_BUCKET_LABEL = '未分组';
  /* 「组外」桶：不在本组、但和本组任务有关系的端点（别的目录里的任务 / 缺失任务）。 */
  var EXTERNAL_KEY = '__external__';
  var EXTERNAL_LABEL = '组外 / 缺失端点';
  var GROUP_BY = { custom: true, project: true };
  var GROUP_PREFIX = 'group:';
  var NODE_W = 188;
  var NODE_H = 72;
  var GAP_X = 56;
  var GAP_Y = 18;
  var PAD = 18;
  var LANE_HEAD = 10;
  /* 自定义目录：一个项目一条泳道，泳道头留出项目名 + 色条的位置 */
  var PROJECT_HEAD = 24;
  var PROJECT_COLORS = 8;
  var BAND_GAP = 4;
  /* 标题预算用「视觉宽度」而不是字符数：中日韩算 1，其余算 0.56，
     这样中英混排的节点文字宽度都收在卡片内。 */
  var TITLE_WIDTH = 12.5;
  var ELLIPSIS = '…';
  var KINDS = { depends_on: true, derived_from: true };

  function isObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function str(v) {
    if (typeof v === 'string') return v;
    if (typeof v === 'number' && isFinite(v)) return String(v);
    return '';
  }
  function num(v, fallback) {
    var n = typeof v === 'number' ? v : Number(v);
    return isFinite(n) ? n : fallback;
  }
  function collapse(v) { return str(v).replace(/\s+/g, ' ').trim(); }

  function measure(value) {
    var s = str(value);
    var w = 0;
    for (var i = 0; i < s.length; i += 1) {
      var code = s.charCodeAt(i);
      w += code > 0x2e80 ? 1 : 0.56;
    }
    return w;
  }

  /** 长标题截断：返回 {text, full, truncated}；full 永远是去除多余空白后的全文。 */
  function truncateTitle(value, budget) {
    var full = collapse(value);
    var max = num(budget, TITLE_WIDTH);
    if (!(max > 1.5)) max = TITLE_WIDTH;
    if (measure(full) <= max) return { text: full, full: full, truncated: false };
    var out = '';
    var used = 0;
    for (var i = 0; i < full.length; i += 1) {
      var ch = full.charAt(i);
      var cost = measure(ch);
      if (used + cost > max - measure(ELLIPSIS)) break;
      out += ch;
      used += cost;
    }
    out = out.replace(/\s+$/, '');
    return { text: (out || full.slice(0, 1)) + ELLIPSIS, full: full, truncated: true };
  }

  function taskNo(task) {
    var n = Math.floor(num(isObj(task) ? task.no : 0, 0));
    return n > 0 ? n : 0;
  }

  function taskLabel(task) {
    var no = taskNo(task);
    if (no > 0) return 'T' + no;
    return str(isObj(task) ? task.id : '').slice(0, 8) || '任务';
  }

  function rank(task) {
    var no = taskNo(task);
    return no > 0 ? no : 1e9;
  }

  /** 项目归属：id > path > 名字；都没有就是「未归属项目」。 */
  function workspaceOf(task) {
    var t = isObj(task) ? task : {};
    var id = str(t.workspaceId);
    var path = str(t.workspacePath);
    var label = collapse(t.workspaceTitle) || collapse(t.workspaceName) || collapse(isObj(t.meta) ? t.meta.workspace : '');
    if (!label && path) label = path.replace(/\/+$/, '').split('/').pop() || path;
    if (!label && id) label = id;
    if (!label) return { key: UNGROUPED_KEY, label: UNGROUPED_LABEL, id: '', path: '', ungrouped: true };
    return { key: id || path || ('name:' + label), label: label, id: id, path: path, ungrouped: false };
  }

  /**
   * 路径 → 上一级目录（/Users/kp/DEV/dsh-plugins → /Users/kp/DEV）。
   * 只用于显示（芯片 tooltip / 缺失成员的兜底），**不再作为分组依据**：
   * 分组是用户自己拖出来的自定义目录（见 groupByCustom）。
   */
  function dirOf(path) {
    var p = str(path).replace(/\\/g, '/').trim().replace(/\/+$/, '');
    if (!p) return '';
    var at = p.lastIndexOf('/');
    if (at < 0) return '';
    if (at === 0) return '/';
    return p.slice(0, at);
  }

  /** 目录缩写：/Users/<user>/… 与 /home/<user>/… 缩成 ~/…，其余原样。 */
  function shortenPath(value) {
    var raw = str(value).trim();
    if (!raw) return '';
    var hit = /^\/(?:Users|home)\/([^/]+)(\/.*)?$/.exec(raw);
    if (!hit) return raw;
    return '~' + (hit[2] || '');
  }

  function blockedOf(task) {
    var t = isObj(task) ? task : {};
    if (t.done === true) return false;
    var rel = isObj(t.relations) ? t.relations : null;
    if (!rel) return false;
    if (rel.ready === true) return false;
    if (arr(rel.blockedBy).length > 0) return true;
    return rel.ready === false;
  }

  function stateOf(task) {
    var t = isObj(task) ? task : {};
    if (t.done === true) return 'done';
    if (isObj(t.suspension) && t.suspension.active === true) return 'suspended';
    if (blockedOf(t)) return 'blocked';
    return 'open';
  }

  function normalizeEdges(relations) {
    var seen = Object.create(null);
    var out = [];
    arr(relations).forEach(function (edge) {
      if (!isObj(edge)) return;
      var from = str(edge.from);
      var to = str(edge.to);
      var kind = KINDS[str(edge.kind)] ? str(edge.kind) : '';
      if (!from || !to || !kind || from === to) return;
      var key = kind + '|' + from + '|' + to;
      if (seen[key]) return;
      seen[key] = true;
      out.push({ from: from, to: to, kind: kind, source: str(edge.source) });
    });
    return out;
  }

  /** 按项目分组：组内按编号排序；组间「有未完成任务的在前」，未归属沉底。 */
  function groupTasks(tasks) {
    var list = arr(tasks).filter(function (t) { return isObj(t) && str(t.id); });
    var map = new Map();
    var order = [];
    list.forEach(function (task) {
      var ws = workspaceOf(task);
      var group = map.get(ws.key);
      if (!group) {
        group = { key: ws.key, label: ws.label, id: ws.id, path: ws.path, ungrouped: ws.ungrouped, tasks: [] };
        map.set(ws.key, group);
        order.push(group);
      }
      group.tasks.push(task);
    });
    order.forEach(function (group) {
      group.tasks.sort(function (a, b) {
        return rank(a) - rank(b) || collapse(a.title).localeCompare(collapse(b.title)) || str(a.id).localeCompare(str(b.id));
      });
      /* 同一项目的任务未必每行都带 workspacePath：整组取第一个非空路径。
         否则按目录分组时，同一个项目会被拆到「它自己的目录」和「未归属」两处。 */
      if (!group.path) {
        for (var i = 0; i < group.tasks.length; i += 1) {
          var p = str(group.tasks[i].workspacePath);
          if (p) { group.path = p; break; }
        }
      }
      group.total = group.tasks.length;
      group.done = group.tasks.filter(function (t) { return t.done === true; }).length;
      group.open = group.total - group.done;
      group.blocked = group.tasks.filter(blockedOf).length;
    });
    order.sort(function (a, b) {
      if (a.ungrouped !== b.ungrouped) return a.ungrouped ? 1 : -1;
      return b.blocked - a.blocked || b.open - a.open || a.label.localeCompare(b.label);
    });
    return order;
  }

  /**
   * 自定义目录（工作区分组）的规整：宿主快照 → 纯数据。
   * 坏行丢掉、成员去重保序，任何输入都不抛。
   */
  function normalizeCustomGroups(raw) {
    var seen = Object.create(null);
    var out = [];
    arr(raw).forEach(function (row) {
      if (!isObj(row)) return;
      var id = str(row.id).trim();
      var name = collapse(row.name);
      if (!id || !name || seen[id]) return;
      seen[id] = true;
      var members = [];
      var memberSeen = Object.create(null);
      arr(row.members).forEach(function (value) {
        var key = str(value).trim();
        if (!key || memberSeen[key]) return;
        memberSeen[key] = true;
        members.push(key);
      });
      out.push({
        id: id,
        name: name,
        members: members,
        labels: isObj(row.labels) ? row.labels : {},
        presentMembers: num(row.presentMembers, NaN),
        createdAt: num(row.createdAt, 0),
        updatedAt: num(row.updatedAt, 0),
      });
    });
    return out;
  }

  /**
   * 按自定义目录分组：用户自己把若干个 workspace 拖在一起、起个名字（比如「QV」），
   * 这一组就是「一个项目」——它的全部任务画在**同一张图**（一个画布、一个坐标系）里。
   *
   * groups 来自宿主快照 data.state.workspaceGroups；members 就是 workspaceOf(task).key。
   * 一个 workspace 只属于一个目录（先到先得，重复的不重复画）；没进任何目录的落到「未分组」桶。
   * 组内 projects[i] 是一条泳道，配 colorIndex 用于分色。
   */
  function groupByCustom(groups, tasks) {
    var projects = groupTasks(tasks);
    var byKey = Object.create(null);
    projects.forEach(function (project) { byKey[project.key] = project; });
    var claimed = Object.create(null);
    var order = [];

    normalizeCustomGroups(groups).forEach(function (def) {
      var lane = {
        key: GROUP_PREFIX + def.id, id: def.id, name: def.name, label: def.name,
        custom: true, ungrouped: false,
        members: def.members.slice(), labels: def.labels, missingMembers: [],
        projects: [], tasks: [], total: 0, open: 0, done: 0, blocked: 0,
      };
      def.members.forEach(function (key) {
        var project = byKey[key];
        if (!project) {
          /* 工作区被删/改名了：成员还在，但当前任务集里没有它 —— 只提示，不画。 */
          lane.missingMembers.push({ key: key, label: collapse(def.labels[key]) || key });
          return;
        }
        if (claimed[key]) return;
        claimed[key] = true;
        lane.projects.push(project);
      });
      fillLane(lane, def.id);
      order.push(lane);
    });

    var rest = projects.filter(function (project) { return !claimed[project.key]; });
    if (rest.length) {
      var bucket = {
        key: UNGROUPED_KEY, id: '', name: UNGROUPED_BUCKET_LABEL, label: UNGROUPED_BUCKET_LABEL,
        custom: true, ungrouped: true, members: [], labels: {}, missingMembers: [],
        projects: rest, tasks: [], total: 0, open: 0, done: 0, blocked: 0,
      };
      fillLane(bucket, '');
      order.push(bucket);
    }
    return order;
  }

  /** 把一条泳道（组）的统计与配色算齐：项目顺序＝用户拖进来的顺序。 */
  function fillLane(lane, groupId) {
    lane.projects.forEach(function (project, index) {
      project.colorIndex = index % PROJECT_COLORS;
      project.customGroupId = groupId;
      lane.tasks = lane.tasks.concat(project.tasks);
      lane.total += project.total;
      lane.open += project.open;
      lane.done += project.done;
      lane.blocked += project.blocked;
    });
    lane.taskCount = lane.total;
    lane.projectCount = lane.projects.length;
    lane.colorOf = Object.create(null);
    lane.projects.forEach(function (project) { lane.colorOf[project.key] = project.colorIndex; });
    return lane;
  }

  /** 单个任务 → 结构化 node。x/y/w/h/depth 先置 0，由 layoutGroup 填。 */
  function nodeOf(task, options) {
    var o = isObj(options) ? options : {};
    var t = isObj(task) ? task : {};
    var id = str(t.id);
    var title = truncateTitle(t.title || id, o.titleWidth);
    var ws = workspaceOf(t);
    var rel = isObj(t.relations) ? t.relations : {};
    var state = stateOf(t);
    return {
      key: 'task:' + id,
      id: id,
      kind: 'task',
      ghost: false,
      missing: false,
      label: title.text,
      fullTitle: title.full,
      truncated: title.truncated,
      no: taskNo(t),
      done: t.done === true,
      blocked: state === 'blocked',
      ready: state === 'open',
      state: state,
      started: t.started === true,
      suspended: state === 'suspended',
      sessionId: str(t.sessionId),
      workspace: ws.key,
      workspaceLabel: ws.label,
      workspacePath: ws.path,
      w: NODE_W, h: NODE_H, x: 0, y: 0, depth: 0, order: 0,
      refs: {
        task: t,
        predecessors: arr(rel.predecessors),
        successors: arr(rel.successors),
        sourceTasks: arr(rel.sourceTasks),
        derivedTasks: arr(rel.derivedTasks),
        blockedBy: arr(rel.blockedBy),
      },
    };
  }

  /**
   * 画布外的端点 → ghost 节点。
   * missing=true 表示这个 id 在任务表里根本不存在（真正的缺失前驱）；
   * missing=false 表示任务存在，只是属于别的项目分组（跨项目依赖的锚点）。
   */
  function ghostNode(id, laneKey, known, role, hints) {
    var hit = known.get(id) || null;
    /* 缺失任务在任务表里查不到，但关系摘要里通常还留着标题：先用手上的信息，别只显示一串 id。 */
    var hintTitle = (hints && hints.get && hints.get(id)) || '';
    var title = truncateTitle(hit ? (hit.title || id) : (hintTitle || id));
    var ws = hit ? workspaceOf(hit) : { key: '', label: '' };
    var dir = hit ? dirOf(ws.path) : '';
    return {
      key: 'ghost:' + laneKey + ':' + id,
      id: id,
      kind: 'ghost',
      ghost: true,
      missing: !hit,
      role: role,
      label: title.text,
      fullTitle: title.full,
      truncated: title.truncated,
      no: taskNo(hit),
      done: !!hit && hit.done === true,
      blocked: false,
      ready: false,
      state: 'ghost',
      started: false,
      suspended: false,
      sessionId: hit ? str(hit.sessionId) : '',
      workspace: ws.key,
      workspaceLabel: ws.label,
      workspacePath: hit ? str(hit.workspacePath) : '',
      /* 跨目录端点的落脚点：画在这里，但标注它其实属于哪个目录，不拉长线跨组。 */
      dir: dir,
      dirLabel: shortenPath(dir),
      dirKey: dir ? ('dir:' + dir) : '',
      w: NODE_W, h: NODE_H, x: 0, y: 0, depth: 0, order: 0,
      refs: { task: hit, predecessors: [], successors: [], sourceTasks: [], derivedTasks: [], blockedBy: [] },
    };
  }

  /** 组内分层：只用 depends_on 决定层级；环不抛错，把环上的节点沉到底部一列。 */
  function depthOf(ids, edges) {
    var inLane = new Set(ids);
    var depth = new Map();
    var indeg = new Map();
    var out = new Map();
    ids.forEach(function (id) { depth.set(id, 0); indeg.set(id, 0); out.set(id, []); });
    edges.forEach(function (edge) {
      if (edge.kind !== 'depends_on') return;
      if (!inLane.has(edge.from) || !inLane.has(edge.to)) return;
      out.get(edge.from).push(edge.to);
      indeg.set(edge.to, indeg.get(edge.to) + 1);
    });
    var queue = ids.filter(function (id) { return indeg.get(id) === 0; });
    var settled = 0;
    for (var i = 0; i < queue.length; i += 1) {
      settled += 1;
      var cur = queue[i];
      out.get(cur).forEach(function (next) {
        if (depth.get(next) < depth.get(cur) + 1) depth.set(next, depth.get(cur) + 1);
        indeg.set(next, indeg.get(next) - 1);
        if (indeg.get(next) === 0) queue.push(next);
      });
    }
    if (settled < ids.length) {
      var max = 0;
      depth.forEach(function (v) { if (v > max) max = v; });
      ids.forEach(function (id) { if (indeg.get(id) > 0) depth.set(id, max + 1); });
    }
    return depth;
  }

  function makeEdge(a, b, raw) {
    var x1 = Math.round(a.x + a.w);
    var y1 = Math.round(a.y + a.h / 2);
    var x2 = Math.round(b.x);
    var y2 = Math.round(b.y + b.h / 2);
    var path;
    if (x2 - x1 < 24) {
      /* 同列（或回折）：绕右侧再折回，从目标右缘进线。 */
      var endX = Math.round(b.x + b.w);
      var bend = Math.max(x1, endX) + 22;
      path = 'M' + x1 + ' ' + y1 + ' H' + bend + ' V' + y2 + ' H' + endX;
      x2 = endX;
    } else {
      var mid = Math.round(x1 + Math.max(20, (x2 - x1) / 2));
      path = 'M' + x1 + ' ' + y1 + ' H' + mid + ' V' + y2 + ' H' + x2;
    }
    return {
      key: raw.kind + ':' + a.key + '>' + b.key,
      from: a.id,
      to: b.id,
      fromKey: a.key,
      toKey: b.key,
      kind: raw.kind,
      source: raw.source,
      path: path,
      x1: x1, y1: y1, x2: x2, y2: y2,
      fromGhost: a.ghost === true,
      toGhost: b.ghost === true,
      viaGhost: a.ghost === true || b.ghost === true,
      crossProject: a.workspace !== b.workspace,
    };
  }

  /**
   * 目录组的摆位：整组共用一套 x 坐标（列＝全组统一的依赖深度），y 上按项目切成泳道。
   * 于是「同一个目录下的项目」画在**同一张图**里：项目簇之间可以直接连边，
   * 泳道背景带负责把项目分开，而不是把每个项目拆成一张独立的图。
   * 泳道内按「同一行列号必须递增」贪心打包，尽量少占行高。
   */
  function placeProjectLanes(group, all, columnOf, width) {
    var byProject = Object.create(null);
    var lanes = [];
    arr(group.projects).forEach(function (project) {
      var lane = {
        key: project.key, label: project.label, path: project.path,
        colorIndex: num(project.colorIndex, 0), total: project.total, nodes: [],
      };
      byProject[lane.key] = lane;
      lanes.push(lane);
    });
    var external = null;
    all.forEach(function (node) {
      var lane = byProject[node.laneKey];
      if (!lane) {
        if (!external) {
          external = { key: EXTERNAL_KEY, label: EXTERNAL_LABEL, colorIndex: -1, external: true, nodes: [] };
          lanes.push(external);
        }
        lane = external;
      }
      lane.nodes.push(node);
    });
    lanes.forEach(function (lane) {
      lane.nodes.sort(function (a, b) {
        return columnOf[a.depth] - columnOf[b.depth]
          || rank(a.refs.task) - rank(b.refs.task)
          || a.label.localeCompare(b.label) || str(a.id).localeCompare(str(b.id));
      });
      lane.lastColumn = [];
      lane.nodes.forEach(function (node) {
        var column = columnOf[node.depth];
        node.column = column === undefined ? 0 : column;
        var row = 0;
        while (row < lane.lastColumn.length && lane.lastColumn[row] >= node.column) row += 1;
        if (row === lane.lastColumn.length) lane.lastColumn.push(node.column);
        else lane.lastColumn[row] = node.column;
        node.order = row;
      });
    });

    var y = PAD;
    var clusters = [];
    lanes.forEach(function (lane) {
      if (!lane.nodes.length) return;
      lane.rows = lane.lastColumn.length;
      lane.top = y;
      lane.head = PROJECT_HEAD;
      lane.height = lane.head + lane.rows * NODE_H + (lane.rows - 1) * GAP_Y;
      lane.nodes.forEach(function (node) {
        node.x = PAD + node.column * (NODE_W + GAP_X);
        node.y = lane.top + lane.head + node.order * (NODE_H + GAP_Y);
      });
      clusters.push({
        key: lane.key,
        label: lane.label,
        color: lane.colorIndex,
        external: lane.external === true,
        x: BAND_GAP, y: lane.top,
        width: Math.max(0, width - BAND_GAP * 2), height: lane.height,
        labelX: PAD - BAND_GAP, labelY: lane.top + 16,
        rows: lane.rows, nodes: lane.nodes.length,
      });
      y += lane.height + GAP_Y;
    });
    return { height: y - GAP_Y + PAD, clusters: clusters, lanes: lanes };
  }

  function layoutGroup(group, edges, known, index, options, hints) {
    var o = isObj(options) ? options : {};
    var mode = str(o.groupBy) === 'custom' ? 'custom' : 'project';
    var ids = group.tasks.map(function (t) { return str(t.id); });
    var inLane = new Set(ids);
    var nodes = group.tasks.map(function (t) { return nodeOf(t, o); });

    var laneEdges = [];
    var extPred = [];
    var extSucc = [];
    var seenPred = Object.create(null);
    var seenSucc = Object.create(null);
    edges.forEach(function (edge) {
      var fromIn = inLane.has(edge.from);
      var toIn = inLane.has(edge.to);
      if (!fromIn && !toIn) return;
      laneEdges.push(edge);
      if (!fromIn && !seenPred[edge.from]) { seenPred[edge.from] = true; extPred.push(edge.from); }
      if (!toIn && !seenSucc[edge.to]) { seenSucc[edge.to] = true; extSucc.push(edge.to); }
    });

    var depth = depthOf(ids, laneEdges);
    if (extPred.length) ids.forEach(function (id) { depth.set(id, depth.get(id) + 1); });

    var ghosts = [];
    var ghostByKey = Object.create(null);
    function ghostFor(id, role) {
      var key = role + ':' + id;
      if (!ghostByKey[key]) {
        var ghost = ghostNode(id, group.key, known, role, hints);
        /* 缺失任务的归属信息是空的：在「按项目」下它画在哪个项目里，就算哪个项目的节点。
           跨项目 ghost 保留对方项目名——那正是「它属于别的项目」这条信息。
           「按目录」下组外端点不冒充本组项目：落到哪条泳道由 laneKey 决定，标签保留真实归属。 */
        if (mode === 'project' && !ghost.workspace) { ghost.workspace = group.key; ghost.workspaceLabel = group.label; }
        ghost.lane = group.key;
        ghost.laneLabel = group.label;
        ghostByKey[key] = ghost;
        ghosts.push(ghost);
      }
      return ghostByKey[key];
    }
    extPred.forEach(function (id) { ghostFor(id, 'predecessor'); });
    extSucc.forEach(function (id) { ghostFor(id, 'successor'); });

    ghosts.forEach(function (ghost) {
      if (ghost.role === 'predecessor') {
        var min = Infinity;
        laneEdges.forEach(function (edge) {
          if (edge.from === ghost.id && inLane.has(edge.to)) min = Math.min(min, depth.get(edge.to));
        });
        ghost.depth = isFinite(min) ? Math.max(0, min - 1) : 0;
      } else {
        var max = 0;
        laneEdges.forEach(function (edge) {
          if (edge.to === ghost.id && inLane.has(edge.from)) max = Math.max(max, depth.get(edge.from));
        });
        ghost.depth = max + 1;
      }
    });
    nodes.forEach(function (node) { node.depth = depth.get(node.id) || 0; node.lane = group.key; node.laneLabel = group.label; });

    var all = nodes.concat(ghosts);
    /* 键、模式、泳道归属必须在摆位之前定下来：摆位要按 laneKey 把节点分到项目泳道。 */
    all.forEach(function (node) {
      /* ghost 的键要带角色：同一张图里，同一个 id 可能既是某项目的前置又是另一项目的后置。 */
      node.key = (node.ghost ? ('ghost:' + group.key + ':' + (node.role || 'ref') + ':') : 'task:') + node.id;
      node.mode = mode;
      if (mode === 'custom') {
        /* laneKey：本组项目节点按项目分道，组外端点（别的目录/缺失）统一落到最后一条泳道。 */
        node.laneKey = node.ghost ? EXTERNAL_KEY : node.workspace;
        node.project = node.workspace;
        node.projectLabel = node.workspaceLabel;
        /* 只有本组项目才有配色；组外 ghost 保持中性。 */
        node.projectColor = isObj(group.colorOf) ? group.colorOf[node.workspace] : undefined;
      } else {
        node.laneKey = group.key;
      }
    });
    /* 组外端点：标注它其实属于哪个自定义目录，而不是把线拉过去。 */
    ghosts.forEach(function (ghost) {
      var hit = known.get(ghost.id);
      if (!hit || !isObj(o.groupNames)) return;
      var name = o.groupNames[workspaceOf(hit).key];
      if (name) ghost.groupLabel = name;
    });
    var depthKeys = [];
    all.forEach(function (node) { if (depthKeys.indexOf(node.depth) < 0) depthKeys.push(node.depth); });
    depthKeys.sort(function (a, b) { return a - b; });
    var columnOf = Object.create(null);
    depthKeys.forEach(function (d, i) { columnOf[d] = i; });

    var columnsCount = depthKeys.length;
    var width = columnsCount ? PAD * 2 + columnsCount * NODE_W + (columnsCount - 1) * GAP_X : PAD * 2;
    var clusters = [];
    var swimlanes = null;
    var height;

    if (mode === 'custom') {
      swimlanes = placeProjectLanes(group, all, columnOf, width);
      height = swimlanes.height;
      clusters = swimlanes.clusters;
    } else {
      var columns = new Map();
      all.forEach(function (node) {
        if (!columns.has(node.depth)) columns.set(node.depth, []);
        columns.get(node.depth).push(node);
      });
      var maxRows = 0;
      depthKeys.forEach(function (d, columnIndex) {
        var column = columns.get(d);
        column.sort(function (a, b) {
          if (a.ghost !== b.ghost) return a.ghost ? 1 : -1;
          return rank(a.refs.task) - rank(b.refs.task) || a.label.localeCompare(b.label);
        });
        if (column.length > maxRows) maxRows = column.length;
        column.forEach(function (node, i) {
          /* x 用列序号而不是 depth 数值：ghost 撑出来的空洞不该在画布上留白。 */
          node.x = PAD + columnIndex * (NODE_W + GAP_X);
          node.y = PAD + LANE_HEAD + i * (NODE_H + GAP_Y);
          node.column = columnIndex;
          node.order = i;
        });
      });
      height = PAD * 2 + LANE_HEAD + (maxRows ? maxRows * NODE_H + (maxRows - 1) * GAP_Y : 0);
    }

    var byId = new Map();
    all.forEach(function (node) { byId.set(node.id, node); });
    var drawn = [];
    laneEdges.forEach(function (edge) {
      var a = byId.get(edge.from);
      var b = byId.get(edge.to);
      if (!a || !b) return;
      drawn.push(makeEdge(a, b, edge));
    });

    var graph = {
      mode: mode,
      nodes: all,
      edges: drawn,
      width: width,
      height: height,
      clusters: clusters,
    };

    return {
      key: group.key,
      id: str(group.id) || '',
      name: str(group.name) || str(group.label),
      label: group.label,
      path: group.path,
      custom: group.custom === true,
      singleProject: group.singleProject === true,
      mode: mode,
      ungrouped: group.ungrouped === true,
      index: index,
      tasks: group.tasks,
      total: group.total,
      open: group.open,
      done: group.done,
      blocked: group.blocked,
      members: arr(group.members),
      missingMembers: arr(group.missingMembers),
      projects: arr(group.projects),
      projectCount: group.projects ? group.projects.length : (group.tasks.length ? 1 : 0),
      projectColorOf: isObj(group.colorOf) ? group.colorOf : Object.create(null),
      clusters: clusters,
      nodes: all,
      taskNodes: nodes,
      ghosts: ghosts,
      edges: drawn,
      graph: graph,
      externalEdges: laneEdges.filter(function (e) { return e.crossProject !== false; }).length,
      width: width,
      height: height,
      columns: columnsCount,
    };
  }

  function emptyStats() {
    return {
      tasks: 0, open: 0, done: 0, blocked: 0, ready: 0,
      dependencyEdges: 0, provenanceEdges: 0,
      ghosts: 0, missingGhosts: 0, crossProject: 0, groups: 0,
    };
  }

  /**
   * 统计。默认按「有效边」口径（和宿主的 relationStats 一致）；
   * onlyVisible=true 时只数两端都在可见任务里的边，用于筛选后的当前选择统计。
   */
  function statsOf(tasks, relations, options) {
    var o = isObj(options) ? options : {};
    var onlyVisible = o.onlyVisible === true;
    var list = arr(tasks).filter(function (t) { return isObj(t) && str(t.id); });
    var edges = normalizeEdges(relations);
    var stats = emptyStats();
    stats.tasks = list.length;
    var known = new Map();
    list.forEach(function (task) {
      known.set(str(task.id), task);
      if (task.done === true) { stats.done += 1; return; }
      stats.open += 1;
      if (blockedOf(task)) stats.blocked += 1;
      else stats.ready += 1;
    });
    var missing = Object.create(null);
    var cross = Object.create(null);
    edges.forEach(function (edge) {
      var a = known.get(edge.from);
      var b = known.get(edge.to);
      if (onlyVisible && (!a || !b)) return;
      if (edge.kind === 'depends_on') stats.dependencyEdges += 1;
      else stats.provenanceEdges += 1;
      if (!a) missing[edge.from] = true;
      if (!b) missing[edge.to] = true;
      if (a && b) {
        var ka = workspaceOf(a).key;
        var kb = workspaceOf(b).key;
        if (ka !== kb) cross[ka + '>' + kb] = true;
      }
    });
    stats.missingGhosts = Object.keys(missing).length;
    stats.crossProject = Object.keys(cross).length;
    stats.groups = groupTasks(list).length;
    return stats;
  }

  /** 关系摘要里留着的 {id,title} —— 缺失任务的标题只能从这儿捡回来。 */
  function titleHints(tasks) {
    var hints = new Map();
    arr(tasks).forEach(function (task) {
      var rel = isObj(task) && isObj(task.relations) ? task.relations : null;
      if (!rel) return;
      ['predecessors', 'successors', 'sourceTasks', 'derivedTasks', 'blockedBy'].forEach(function (field) {
        arr(rel[field]).forEach(function (item) {
          if (!isObj(item)) return;
          var id = str(item.id);
          var title = collapse(item.title);
          if (id && title && !hints.has(id)) hints.set(id, title);
        });
      });
    });
    return hints;
  }

  /** 总入口：分组 + 分层 + 连边，返回 {groups, nodes, edges, stats}。任何输入都不抛。 */
  /** 把 scope 规整成 {kind:'all'|'group'|'project', id}；坏输入＝全部任务。 */
  function normScope(scope) {
    var s = isObj(scope) ? scope : {};
    var kind = str(s.kind);
    var id = str(s.id);
    if (kind === 'group' && id) return { kind: 'group', id: id };
    if (kind === 'project' && id) return { kind: 'project', id: id };
    return { kind: 'all', id: '' };
  }

  /** 这条泳道是不是 scope 指的那个目录（未分组桶用 UNGROUPED_KEY 指代）。 */
  function laneInScope(lane, scope) {
    var s = normScope(scope);
    if (s.kind === 'all') return true;
    if (s.kind !== 'group') return false;
    return lane.ungrouped ? s.id === UNGROUPED_KEY : lane.id === s.id;
  }

  /**
   * scope → 这次要画哪几张图。
   * - all：按自定义目录各一张（未分组桶也算一张）
   * - group：恰好一张（该目录的全部项目共用一个坐标系）
   * - project：恰好一张（只有这个项目）
   */
  function lanesForScope(groups, tasks, scope) {
    var all = groupByCustom(groups, tasks);
    var s = normScope(scope);
    if (s.kind === 'all') return all;
    if (s.kind === 'group') {
      var hit = all.filter(function (lane) { return laneInScope(lane, s); });
      return hit;
    }
    var out = [];
    all.forEach(function (lane) {
      lane.projects.forEach(function (project) {
        if (project.key !== s.id) return;
        var single = {
          key: GROUP_PREFIX + 'project:' + project.key,
          id: project.key, name: project.label, label: project.label,
          custom: true, ungrouped: false, singleProject: true,
          members: [project.key], labels: {}, missingMembers: [],
          projects: [project], tasks: project.tasks,
          total: project.total, open: project.open, done: project.done, blocked: project.blocked,
          taskCount: project.total, projectCount: 1,
        };
        single.colorOf = Object.create(null);
        /* 保留它在目录里的配色：同一个项目在任何 scope 下都是同一个颜色。 */
        single.colorOf[project.key] = project.colorIndex;
        out.push(single);
      });
    });
    return out;
  }

  /**
   * 左栏那棵树的纯构造：只有三层 —— 全部任务 / 目录 / 项目。
   * 返回 {rows, byKey, lanes, scope}：rows 是**可见**的扁平行（折叠的目录不展开子行），
   * 每行 {key, kind, id, label, depth, count, selected, collapsed, ...}。
   * 任何输入都不抛。
   */
  function buildTree(groups, tasks, options) {
    var o = isObj(options) ? options : {};
    var collapsed = isObj(o.collapsed) ? o.collapsed : {};
    var scope = normScope(o.selection);
    var lanes = groupByCustom(groups, tasks);
    var list = arr(tasks).filter(function (t) { return isObj(t) && str(t.id); });
    var rows = [];
    var byKey = Object.create(null);
    var selected = null;

    /* visible=false：折叠起来的子行不进 rows（不上屏），但仍进 byKey ——
       否则「选中项被折叠」会被误判成「选中项没了」，把用户的选择重置掉。 */
    function push(row, visible) {
      row.selected = scope.kind === row.kind && scope.id === str(row.id);
      if (row.selected) selected = row;
      byKey[row.key] = row;
      if (visible !== false) rows.push(row);
      return row;
    }

    var allRow = push({
      key: 'all', kind: 'all', id: '', label: '全部任务', depth: 0,
      count: list.length, open: 0, done: 0, blocked: 0,
    });
    list.forEach(function (task) {
      if (task.done === true) allRow.done += 1;
      else if (blockedOf(task)) allRow.blocked += 1;
      else allRow.open += 1;
    });

    lanes.forEach(function (lane) {
      var bucket = lane.ungrouped === true;
      var id = bucket ? UNGROUPED_KEY : lane.id;
      var row = push({
        key: GROUP_PREFIX + id, kind: 'group', id: id, depth: 0,
        label: lane.label, count: lane.projectCount, tasks: lane.total,
        ungrouped: bucket, members: lane.members,
        missing: arr(lane.missingMembers).length,
        collapsed: collapsed[GROUP_PREFIX + id] === true,
      });
      lane.projects.forEach(function (project) {
        push({
          key: 'project:' + project.key, kind: 'project', id: project.key, depth: 1,
          label: project.label, count: project.total, tasks: project.total,
          groupId: bucket ? UNGROUPED_KEY : lane.id, groupLabel: lane.label,
          open: project.open, done: project.done, blocked: project.blocked,
          path: project.path, colorIndex: project.colorIndex,
        }, !row.collapsed);
      });
    });
    return { rows: rows, byKey: byKey, lanes: lanes, scope: scope, selected: selected };
  }

  function layout(tasks, relations, options) {
    var o = isObj(options) ? options : {};
    var groupBy = GROUP_BY[str(o.groupBy)] ? str(o.groupBy) : 'project';
    var scope = normScope(o.scope);
    var opts = {
      groupBy: groupBy,
      titleWidth: o.titleWidth,
      groupNames: Object.create(null),
    };
    var list = arr(tasks).filter(function (t) { return isObj(t) && str(t.id); });
    var edges = normalizeEdges(relations);
    var known = new Map();
    list.forEach(function (task) { known.set(str(task.id), task); });
    var hints = titleHints(list);
    /* 按自定义目录：每个目录一张图；按项目：每个项目一张图（默认，保持旧口径）。 */
    var custom = groupBy === 'custom';
    var source = custom ? lanesForScope(o.groups, list, scope) : groupTasks(list);
    /* 组外端点要知道自己属于哪个目录（用来在 ghost 上标注），先建一张 workspace key → 目录名 的表。 */
    if (custom) {
      groupByCustom(o.groups, list).forEach(function (lane) {
        if (lane.ungrouped) return;
        lane.members.forEach(function (key) { opts.groupNames[key] = lane.name; });
      });
    }
    var lanes = source.map(function (group, index) {
      return layoutGroup(group, edges, known, index, opts, hints);
    });
    var nodes = [];
    var drawn = [];
    lanes.forEach(function (lane) {
      nodes = nodes.concat(lane.nodes);
      drawn = drawn.concat(lane.edges);
    });
    var stats = statsOf(list, relations);
    /* 分组数按「这次真的画了几张图」算：自定义目录口径和按项目口径都成立。 */
    stats.groups = lanes.length;
    stats.ghosts = nodes.filter(function (n) { return n.ghost === true; }).length;
    stats.missingGhosts = nodes.filter(function (n) { return n.ghost === true && n.missing === true; }).length;
    return {
      version: VERSION,
      groupBy: groupBy,
      scope: scope,
      groups: lanes,
      nodes: nodes,
      edges: drawn,
      stats: stats,
      titleBudget: num(o.titleWidth, TITLE_WIDTH),
    };
  }

  /**
   * 筛选：workspaces 空数组＝全部；status ∈ all|open|done|blocked|ready；keyword 匹配标题/编号/id。
   */
  function filterTasks(tasks, criteria) {
    var c = isObj(criteria) ? criteria : {};
    var keys = arr(c.workspaces).map(str).filter(Boolean);
    var keyword = collapse(c.keyword).toLowerCase();
    var status = str(c.status) || 'all';
    return arr(tasks).filter(function (task) {
      if (!isObj(task) || !str(task.id)) return false;
      if (keys.length) {
        var ws = workspaceOf(task);
        if (keys.indexOf(ws.key) < 0 && keys.indexOf(ws.label) < 0) return false;
      }
      var state = stateOf(task);
      if (status === 'open' && state === 'done') return false;
      if (status === 'done' && state !== 'done') return false;
      if (status === 'blocked' && state !== 'blocked') return false;
      if (status === 'ready' && state !== 'open') return false;
      if (status === 'suspended' && state !== 'suspended') return false;
      if (keyword) {
        var no = taskNo(task);
        var hay = (collapse(task.title) + ' ' + str(task.id) + ' ' + (no > 0 ? ('t' + no + ' #' + no + ' ' + no) : '')).toLowerCase();
        if (hay.indexOf(keyword) < 0) return false;
      }
      return true;
    });
  }

  /** 任务 id → 该任务在画布上的节点（优先真实节点，其次 ghost），供详情里跳转用。 */
  function indexNodes(model) {
    var index = Object.create(null);
    arr(isObj(model) ? model.nodes : null).forEach(function (node) {
      var cur = index[node.id];
      if (!cur || (cur.ghost === true && node.ghost !== true)) index[node.id] = node;
    });
    return index;
  }

  return {
    version: VERSION,
    constants: {
      UNGROUPED_KEY: UNGROUPED_KEY,
      UNGROUPED_LABEL: UNGROUPED_LABEL,
      EXTERNAL_KEY: EXTERNAL_KEY,
      EXTERNAL_LABEL: EXTERNAL_LABEL,
      GROUP_PREFIX: GROUP_PREFIX,
      SCOPES: { all: true, group: true, project: true },
      NODE_W: NODE_W,
      NODE_H: NODE_H,
      GAP_X: GAP_X,
      GAP_Y: GAP_Y,
      PAD: PAD,
      LANE_HEAD: LANE_HEAD,
      PROJECT_HEAD: PROJECT_HEAD,
      PROJECT_COLORS: PROJECT_COLORS,
      BAND_GAP: BAND_GAP,
      TITLE_WIDTH: TITLE_WIDTH,
      ELLIPSIS: ELLIPSIS,
    },
    isObj: isObj,
    arr: arr,
    str: str,
    measure: measure,
    truncateTitle: truncateTitle,
    taskNo: taskNo,
    taskLabel: taskLabel,
    workspaceOf: workspaceOf,
    dirOf: dirOf,
    shortenPath: shortenPath,
    blockedOf: blockedOf,
    stateOf: stateOf,
    normalizeEdges: normalizeEdges,
    groupTasks: groupTasks,
    normalizeCustomGroups: normalizeCustomGroups,
    groupByCustom: groupByCustom,
    normScope: normScope,
    lanesForScope: lanesForScope,
    buildTree: buildTree,
    nodeOf: nodeOf,
    ghostNode: ghostNode,
    titleHints: titleHints,
    layout: layout,
    statsOf: statsOf,
    filterTasks: filterTasks,
    indexNodes: indexNodes,
  };
})();
/* OVERVIEW_LAYOUT:END */
</script>

<script>
(function () {
  'use strict';

  var L = OVERVIEW_LAYOUT;
  var STATE_URL = '/dsh-feishu/api/state';
  /* 本页唯一允许写的接口：自定义目录（把若干个 workspace 拖成一个「项目」）。
     不碰任务 / 同步 / 授权 / 评论那些写接口。 */
  var GROUPS_URL = '/dsh-feishu/api/workspace-groups';
  var POLL_MS = 60000;

  /* 视图状态存 localStorage（固定前缀键）：当前选中项、目录展开状态、搜索词。
     目录的成员关系**不存本地**：以宿主快照 data.state.workspaceGroups 为准。 */
  var STORE_PREFIX = 'dsh-feishu-overview:';
  var STORE_SELECTION = STORE_PREFIX + 'selection';
  var STORE_TREE = STORE_PREFIX + 'tree-collapsed';
  var STORE_COLLAPSED = STORE_PREFIX + 'collapsed';
  var STORE_KEYWORD = STORE_PREFIX + 'keyword';

  function readStore(key, fallback) {
    try {
      var raw = window.localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (error) { return fallback; }
  }

  function writeStore(key, value) {
    try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (error) { /* 隐私模式：忽略 */ }
  }

  function selectionSetting() {
    var value = readStore(STORE_SELECTION, null);
    return L.normScope(value);
  }

  /* 只有一个视图：关系图。渲染入口统一走 renderActiveView()。 */
  var VIEWS = [{ id: 'relations', label: '关系图', mount: mountRelationsView }];

  var app = {
    status: 'loading',
    error: '',
    version: '',
    now: 0,
    raw: [],
    relations: [],
    stats: null,
    filtered: [],
    /* 宿主是目录成员关系的唯一事实来源：本地只缓存快照，写操作后以返回的 groups 覆盖。 */
    customGroups: [],
    /* 当前选中项：{kind:'all'|'group'|'project', id} —— 正文只渲染它。 */
    selection: { kind: 'all', id: '' },
    /* 树上哪些目录被折叠（key = 'group:<id>'）。 */
    treeCollapsed: {},
    /* 正文里哪些画布卡片被折叠（key = 泳道 key）。 */
    collapsed: {},
    tree: null,
    focusKey: 'all',
    /* render 之前树里有没有焦点：有的话重建后要把焦点还给 app.focusKey 那一行。 */
    treeHadFocus: false,
    creating: false,
    renamingId: '',
    /* 正在输入的目录名：整个 render 都是重建 DOM，不镜像的话轮询一刷新就把用户打的字吞掉。 */
    draftName: '',
    dragKey: '',
    focusPending: false,
    focusPrev: '',
    groupError: null,
    saving: false,
    filters: { keyword: '' },
    activeView: VIEWS[0].id,
    selected: null,
    model: null,
    nodeIndex: null,
    busy: false,
  };

  function $(id) { return document.getElementById(id); }

  function el(tag, attrs, text) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (attrs[k] === undefined || attrs[k] === null) return;
      if (k === 'class') node.className = attrs[k];
      else if (k === 'text') node.textContent = String(attrs[k]);
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, String(attrs[k]));
    });
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function svgEl(tag, attrs) {
    var node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (attrs[k] === undefined || attrs[k] === null) return;
      node.setAttribute(k, String(attrs[k]));
    });
    return node;
  }

  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }

  /* ---------------- 数据 ---------------- */

  function tasksOf(data) {
    var state = L.isObj(data.state) ? data.state : {};
    return L.arr(state.tasks);
  }

  function relationsOf(data) {
    var state = L.isObj(data.state) ? data.state : {};
    return L.arr(state.relations);
  }

  function groupsOf(data) {
    var state = L.isObj(data.state) ? data.state : {};
    return L.normalizeCustomGroups(state.workspaceGroups);
  }

  function load(quiet) {
    if (app.busy) return Promise.resolve();
    app.busy = true;
    if (!quiet) { app.status = app.status === 'ready' ? 'ready' : 'loading'; render(); }
    return fetch(STATE_URL, { headers: { accept: 'application/json' }, credentials: 'same-origin' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
        return res.json();
      })
      .then(function (data) {
        if (!L.isObj(data) || data.ok !== true) throw new Error('接口返回 ok=false，宿主可能还没完成首次同步');
        app.raw = tasksOf(data);
        app.relations = relationsOf(data);
        app.customGroups = groupsOf(data);
        app.version = L.str(data.version);
        app.now = Number(data.now) || 0;
        app.status = 'ready';
        app.error = '';
      })
      .catch(function (error) {
        app.status = 'error';
        app.error = (error && error.message) ? error.message : String(error);
      })
      .then(function () {
        app.busy = false;
        render();
      });
  }

  /**
   * 唯一写入口：POST 自定义目录。**不做乐观更新**——成功后一律以宿主返回的 groups 为准，
   * 失败就把 error 放到对应位置（组头或新建区）用 role=alert 显示，不假装成功。
   */
  function saveGroups(body) {
    if (app.saving) return Promise.resolve();
    app.saving = true;
    render();
    return fetch(GROUPS_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json', accept: 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body),
    })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          return { ok: res.ok && data.ok === true, data: data };
        });
      })
      .then(function (out) {
        if (!out.ok) throw new Error(L.str(out.data.error) || '目录操作失败');
        var groups = Array.isArray(out.data.groups) ? out.data.groups : app.customGroups;
        app.customGroups = L.normalizeCustomGroups(groups);
        app.groupError = null;
        app.creating = false;
        app.renamingId = '';
        app.draftName = '';
      })
      .catch(function (error) {
        app.groupError = {
          groupId: L.str(body && body.id),
          text: (error && error.message) ? error.message : String(error),
        };
      })
      .then(function () {
        app.saving = false;
        render();
      });
  }

  /* ---------------- 左栏：VSCode 式列表树 ---------------- */

  function projectByKey(key) {
    var hit = null;
    L.groupTasks(app.raw).forEach(function (project) { if (project.key === key) hit = project; });
    return hit;
  }

  /** 某个 workspace 当前所在的目录 id（''＝未分组）。 */
  function currentGroupId(key) {
    var found = '';
    app.customGroups.forEach(function (def) {
      if (def.members.indexOf(key) >= 0) found = def.id;
    });
    return found;
  }

  function currentGroup(key) {
    var hit = null;
    app.customGroups.forEach(function (def) { if (def.id === key) hit = def; });
    return hit;
  }

  /**
   * 左栏那棵树。整个左栏就这一棵：
   *   全部任务 / 目录（▾▸ 可折叠）/ 项目（状态色点 + 任务数）/ 未分组 / ＋ 新建目录
   * 目录行 hover（或键盘聚焦）才出现 ✎ 🗑，不常驻一排按钮。
   */
  function renderTree() {
    var host = $('ovTree');
    if (!host) return;
    var rows = app.tree ? app.tree.rows : [];
    var focusId = app.treeHadFocus ? app.focusKey : '';
    clear(host);

    rows.forEach(function (row) {
      if (app.renamingId && row.kind === 'group' && row.id === app.renamingId) {
        host.appendChild(treeRenameRow(row));
        return;
      }
      host.appendChild(treeRow(row));
      if (row.kind === 'group' && row.missing) {
        host.appendChild(el('div', {
          class: 'ov-tree-note', role: 'none',
          text: '⚠ ' + row.missing + ' 个成员不在场',
        }));
      }
    });

    if (app.creating) host.appendChild(treeCreateRow());

    /* 失败落在出事的那一行下面（组头 / 新建区），role=alert —— 不做乐观更新。 */
    if (app.groupError) {
      var anchor = app.groupError.groupId || '';
      var node = el('p', { class: 'ov-alert', role: 'alert', text: '目录操作失败：' + app.groupError.text });
      if (!anchor) { host.appendChild(node); return; }
      var target = null;
      Array.prototype.forEach.call(host.children, function (child) {
        if (child.getAttribute && child.getAttribute('data-group-id') === anchor) target = child;
      });
      if (target && target.nextSibling) host.insertBefore(node, target.nextSibling);
      else host.appendChild(node);
    }

    /* 键盘焦点：行是重建的，把 tabindex 和 DOM 焦点还给原来那一行。
       正在输入（重命名 / 新建）时不要抢焦点，交给下面那个输入框。 */
    var editing = !!(app.renamingId || app.creating);
    var focusRow = host.querySelector('[data-key="' + cssEscape(app.focusKey) + '"]');
    if (!focusRow) focusRow = host.querySelector('[data-key="all"]');
    if (focusRow) {
      Array.prototype.forEach.call(host.querySelectorAll('.ov-tree-row'), function (n) { n.setAttribute('tabindex', '-1'); });
      focusRow.setAttribute('tabindex', '0');
      if (focusId && !editing) setTimeout(function () { if (focusRow.isConnected) focusRow.focus(); }, 0);
    }
    if (app.creating) keepFocus($('ovNewGroupName'), 'ovNewGroupName', false);
    else if (app.renamingId) keepFocus($('ovRenameInput'), 'ovRenameInput', true);
  }

  function treeRow(row) {
    var isGroup = row.kind === 'group';
    var cls = 'ov-tree-row'
      + (row.selected ? ' is-selected' : '')
      + (app.renamingId && row.id === app.renamingId ? ' is-editing' : '');
    var node = el('div', {
      class: cls,
      role: 'treeitem',
      'data-key': row.key,
      'data-kind': row.kind,
      'data-id': row.id || null,
      'data-depth': String(row.depth),
      'data-group-id': isGroup && !row.ungrouped ? row.id : null,
      'aria-selected': row.selected ? 'true' : 'false',
      'aria-level': String(row.depth + 1),
      'aria-expanded': isGroup ? (row.collapsed ? 'false' : 'true') : null,
      tabindex: '-1',
      title: row.kind === 'project' ? (row.path || row.label) : row.label,
      onclick: function () { selectRow(row); },
      ondblclick: isGroup && !row.ungrouped ? function () { toggleGroup(row); } : null,
      onfocus: function () { app.focusKey = row.key; },
    });

    if (isGroup) node.appendChild(el('span', { class: 'ov-tree-twist', text: row.collapsed ? '▸' : '▾', 'aria-hidden': 'true' }));
    else if (row.kind === 'project') node.appendChild(el('span', { class: 'ov-tree-twist' }));
    else node.appendChild(el('span', { class: 'ov-tree-twist', 'aria-hidden': 'true' }));

    if (row.kind === 'project') node.appendChild(el('span', { class: 'ov-tree-dot', 'data-state': projectState(row) }));
    node.appendChild(el('span', { class: 'ov-tree-name', text: row.label }));
    node.appendChild(el('span', { class: 'ov-tree-count', text: String(row.count) }));

    if (isGroup && !row.ungrouped) {
      var actions = el('span', { class: 'ov-tree-actions' });
      actions.appendChild(el('button', {
        type: 'button', 'data-act': 'rename', 'data-key': row.id,
        'aria-label': '重命名目录 ' + row.label, title: '重命名',
        text: '✎',
        onclick: function (event) { event.stopPropagation(); openRename(row); },
      }));
      actions.appendChild(el('button', {
        type: 'button', 'data-act': 'delete', 'data-key': row.id, 'data-danger': 'true',
        'aria-label': '删除目录 ' + row.label, title: '删除目录（只删分组，不动任务）',
        text: '🗑',
        onclick: function (event) { event.stopPropagation(); askDelete(row); },
      }));
      node.appendChild(actions);
    }

    /* 拖拽：项目行拖到目录行＝移入，拖到「未分组」＝移出。 */
    if (row.kind === 'project' && row.groupId) {
      node.setAttribute('draggable', 'true');
      node.addEventListener('dragstart', function (event) {
        app.dragKey = row.id;
        node.classList.add('is-dragging');
        try {
          event.dataTransfer.setData('text/plain', row.id);
          event.dataTransfer.effectAllowed = 'move';
        } catch (error) { /* 某些宿主不给 dataTransfer：靠 app.dragKey 兜底 */ }
      });
      node.addEventListener('dragend', function () { node.classList.remove('is-dragging'); app.dragKey = ''; });
    }
    if (isGroup) {
      node.addEventListener('dragover', function (event) {
        event.preventDefault();
        try { event.dataTransfer.dropEffect = 'move'; } catch (error) { /* 忽略 */ }
        node.classList.add('is-drop-target');
      });
      node.addEventListener('dragleave', function () { node.classList.remove('is-drop-target'); });
      node.addEventListener('drop', function (event) {
        event.preventDefault();
        node.classList.remove('is-drop-target');
        var key = '';
        try { key = event.dataTransfer.getData('text/plain') || ''; } catch (error) { key = ''; }
        if (!key) key = app.dragKey;
        if (!key) return;
        moveWorkspace(key, row.ungrouped ? '' : row.id);
      });
    }
    return node;
  }

  /** 目录行的就地重命名：回车保存、Esc 取消，输入内容由 app.draftName 镜像。 */
  function treeRenameRow(row) {
    var node = el('div', {
      class: 'ov-tree-row is-editing', role: 'treeitem', 'data-key': row.key,
      'data-kind': 'group', 'data-group-id': row.id, 'data-depth': '0',
      'aria-selected': row.selected ? 'true' : 'false', 'aria-level': '1', 'aria-expanded': 'true',
    });
    var input = el('input', {
      class: 'ov-tree-input', type: 'text', id: 'ovRenameInput', maxlength: '40',
      value: app.draftName, 'aria-label': '目录名',
      oninput: function (event) { app.draftName = String(event.target.value || ''); },
      onkeydown: function (event) {
        if (event.key === 'Enter') { event.preventDefault(); commitRename(row.id); }
        else if (event.key === 'Escape') { event.preventDefault(); closeRename(); }
      },
    });
    node.appendChild(input);
    return node;
  }

  /** 底部「＋ 新建目录」展开成的输入行。 */
  function treeCreateRow() {
    var node = el('div', { class: 'ov-tree-row is-editing ov-tree-new-row', 'data-key': '__new__' });
    var input = el('input', {
      class: 'ov-tree-input', type: 'text', id: 'ovNewGroupName', maxlength: '40',
      placeholder: '目录名，回车创建', 'aria-label': '新目录的名字',
      value: app.draftName,
      oninput: function (event) { app.draftName = String(event.target.value || ''); },
      onkeydown: function (event) {
        if (event.key === 'Enter') { event.preventDefault(); createGroup(); }
        else if (event.key === 'Escape') { event.preventDefault(); closeCreate(); }
      },
    });
    node.appendChild(input);
    return node;
  }

  function projectState(row) {
    if (row.blocked) return 'blocked';
    if (row.open) return 'open';
    return 'done';
  }

  function selectRow(row) {
    app.selection = { kind: row.kind, id: row.id || '' };
    app.focusKey = row.key;
    app.treeHadFocus = true;
    app.groupError = null;
    writeStore(STORE_SELECTION, app.selection);
    render();
  }

  function toggleGroup(row) {
    var key = 'group:' + row.id;
    app.treeCollapsed[key] = !(app.treeCollapsed[key] === true);
    writeStore(STORE_TREE, app.treeCollapsed);
    app.focusKey = row.key;
    render();
  }

  /**
   * 方向的键盘操作（VSCode / ARIA tree 口径）：
   * ↑↓ 移动、→ 展开或进第一个子行、← 折叠或回父行、Enter/Space 选中、Home/End 到两端。
   */
  function treeKeydown(event) {
    var host = event.currentTarget;
    var rows = Array.prototype.slice.call(host.querySelectorAll('.ov-tree-row'));
    if (!rows.length) return;
    var at = -1;
    for (var i = 0; i < rows.length; i += 1) if (rows[i].getAttribute('data-key') === app.focusKey) at = i;
    if (at < 0) at = 0;
    var row = app.tree ? app.tree.byKey[rows[at].getAttribute('data-key')] : null;
    var key = event.key;

    function move(next) {
      event.preventDefault();
      var target = rows[Math.max(0, Math.min(rows.length - 1, next))];
      app.focusKey = target.getAttribute('data-key');
      app.treeHadFocus = true;
      target.focus();
    }
    if (key === 'ArrowDown') return move(at + 1);
    if (key === 'ArrowUp') return move(at - 1);
    if (key === 'Home') return move(0);
    if (key === 'End') return move(rows.length - 1);
    if (key === 'Enter' || key === ' ' || key === 'Spacebar') {
      event.preventDefault();
      if (row && row.kind === 'group') { selectRow(row); return; }
      if (row) selectRow(row);
      return;
    }
    if (key === 'ArrowRight') {
      if (!row || row.kind !== 'group') return;
      if (row.collapsed) { event.preventDefault(); toggleGroup(row); return; }
      if (rows[at + 1] && rows[at + 1].getAttribute('data-depth') === '1') {
        event.preventDefault();
        app.focusKey = rows[at + 1].getAttribute('data-key');
        rows[at + 1].focus();
      }
      return;
    }
    if (key === 'ArrowLeft') {
      if (!row) return;
      event.preventDefault();
      if (row.kind === 'group' && !row.collapsed) { toggleGroup(row); return; }
      if (row.depth === 1) {
        var parentKey = 'group:' + row.groupId;
        var parent = app.tree ? app.tree.byKey[parentKey] : null;
        if (parent) { app.focusKey = parentKey; render(); return; }
      }
      return;
    }
  }

  function askDelete(row) {
    if (!window.confirm('删除目录「' + row.label + '」？只删分组，任务和项目都不动。')) return;
    saveGroups({ action: 'delete', id: row.id });
  }

  function openRename(row) {
    app.renamingId = row.id;
    app.draftName = row.label;
    app.focusPending = true;
    app.groupError = null;
    render();
  }

  function closeRename() {
    app.renamingId = '';
    app.draftName = '';
    app.groupError = null;
    render();
  }

  function commitRename(id) {
    var input = $('ovRenameInput');
    var name = collapseName(input ? input.value : app.draftName);
    if (!name) { app.groupError = { groupId: id, text: '目录名不能为空' }; render(); return; }
    var def = currentGroup(id);
    if (def && name === def.name) { closeRename(); return; }
    saveGroups({ action: 'rename', id: id, name: name });
  }

  function openCreate() {
    app.creating = true;
    app.draftName = '';
    app.focusPending = true;
    app.groupError = null;
    render();
  }

  function closeCreate() {
    app.creating = false;
    app.draftName = '';
    app.groupError = null;
    render();
  }

  function createGroup() {
    var input = $('ovNewGroupName');
    var name = collapseName(input ? input.value : app.draftName);
    if (!name) { app.groupError = { groupId: '', text: '目录名不能为空' }; render(); return; }
    /* 当前选中的项目顺手成为第一个成员：新建目录→拖进去这两步并成一步。 */
    var body = { action: 'create', name: name };
    if (app.selection.kind === 'project') {
      var project = projectByKey(app.selection.id);
      if (project) {
        body.members = [project.key];
        body.labels = {};
        body.labels[project.key] = project.label;
      }
    }
    saveGroups(body);
  }

  /** 把一个 workspace 移入 / 移出目录；target 为 ''＝移出（拖到「未分组」）。 */
  function moveWorkspace(key, target) {
    if (!key) return;
    var current = currentGroupId(key);
    if (target === current) return;
    app.groupError = null;
    if (!target) {
      if (!current) return;
      saveGroups({ action: 'remove', id: current, key: key });
      return;
    }
    var project = projectByKey(key);
    saveGroups({ action: 'add', id: target, member: { key: key, label: project ? project.label : key } });
  }

  /**
   * 重建 DOM 之后把光标还回去：
   * - 刚点开（focusPending）：聚焦空框；
   * - 刚才是它拿着焦点（focusPrev）：轮询刷新后的续写。
   * 注意不要在轮询里把焦点从别处抢过来。
   */
  function keepFocus(input, id, selectAllOnOpen) {
    if (!input) return;
    var opened = app.focusPending === true;
    var wanted = opened || app.focusPrev === id;
    app.focusPending = false;
    if (!wanted) return;
    setTimeout(function () {
      if (!input.isConnected) return;
      input.focus();
      /* 刚点开时全选方便覆盖；轮询刷新导致的重建则把光标放回末尾，别打断续写。 */
      if (opened && selectAllOnOpen) input.select();
      else { try { input.setSelectionRange(input.value.length, input.value.length); } catch (error) { /* 忽略 */ } }
    }, 0);
  }

  /** 写操作失败的提示：贴着出事的地方显示（目录行 / 新建行），不假装成功。 */
  function alertBox(text) {
    return el('p', { class: 'ov-alert', role: 'alert', text: '目录操作失败：' + text });
  }

  function collapseName(value) { return String(value === undefined || value === null ? '' : value).replace(/\s+/g, ' ').trim(); }

  /* ---------------- 渲染入口 ---------------- */

  function activeView() {
    for (var i = 0; i < VIEWS.length; i += 1) if (VIEWS[i].id === app.activeView) return VIEWS[i];
    return VIEWS[0];
  }

  function render() {
    /* 记住焦点在谁身上：重建 DOM 之后好把光标还给正在输入的那个框 / 树里那一行。 */
    app.focusPrev = (document.activeElement && document.activeElement.id) ? document.activeElement.id : '';
    var active = document.activeElement;
    app.treeHadFocus = !!(active && active.closest && active.closest('#ovTree'));
    compute();
    renderTree();
    renderScopeName();
    renderHeader();
    renderActiveView();
  }

  /**
   * 一次算出：树、当前 scope 的图模型、scope 内筛选后的任务。
   * 正文只跟 app.selection 走 —— 全部任务＝按目录多张图，目录＝一张图，项目＝一张图。
   */
  function compute() {
    app.tree = L.buildTree(app.customGroups, app.raw, {
      collapsed: app.treeCollapsed,
      selection: app.selection,
    });
    app.model = L.layout(app.raw, app.relations, {
      groupBy: 'custom',
      groups: app.customGroups,
      scope: app.selection,
    });
    app.nodeIndex = L.indexNodes(app.model);
    /* 搜索只在当前 scope 的任务里过滤。 */
    var inScope = [];
    app.model.groups.forEach(function (lane) {
      inScope = inScope.concat(lane.tasks);
    });
    app.filtered = L.filterTasks(inScope, app.filters);
    app.stats = L.statsOf(app.filtered, app.relations, { onlyVisible: true });
    /* 选中项被删掉了（目录被删 / 项目没了）→ 退回「全部任务」。 */
    if (app.selection.kind !== 'all') {
      var known = app.tree.byKey[app.selection.kind === 'group'
        ? ('group:' + app.selection.id)
        : ('project:' + app.selection.id)];
      if (!known) {
        app.selection = { kind: 'all', id: '' };
        app.focusKey = 'all';
        writeStore(STORE_SELECTION, app.selection);
      }
    }
    if (app.selectedNode) {
      var stillThere = app.filtered.some(function (task) { return L.str(task.id) === app.selectedNode.id; });
      if (!stillThere) { app.selectedNode = null; app.selected = null; }
    }
  }

  /** 唯一的视图分发点：任何视图都必须从这里被挂载。 */
  function renderActiveView() {
    var lanes = $('ovLanes');
    clear(lanes);
    var body = $('ovBody');
    body.classList.remove('has-detail');
    var detail = $('ovDetail');
    if (detail && detail.parentNode) detail.parentNode.removeChild(detail);

    if (app.status === 'loading') { lanes.appendChild(skeleton()); return; }
    if (app.status === 'error') { lanes.appendChild(errorNotice()); return; }

    var view = activeView();
    if (!view || typeof view.mount !== 'function') {
      lanes.appendChild(notice('视图不可用', '这个视图没有注册 mount 函数。', null));
      return;
    }
    view.mount(view, lanes, {
      model: app.model,
      filtered: app.filtered,
      openDetail: openDetail,
    });
    renderDetail();
  }

  /** 顶部只留一行：当前选中名字 + 一行灰字（任务 / 依赖 / 派生 / 阻塞）。 */
  function renderScopeName() {
    var name = $('ovScopeName');
    if (!name) return;
    var row = app.tree ? app.tree.selected : null;
    if (!row && app.tree && app.selection.kind !== 'all') {
      row = app.tree.byKey[app.selection.kind === 'group'
        ? ('group:' + app.selection.id)
        : ('project:' + app.selection.id)] || null;
    }
    if (app.selection.kind === 'all') name.textContent = '全部任务';
    else name.textContent = row ? row.label : '全部任务';
  }

  function renderHeader() {
    var sub = $('ovSubtitle');
    if (app.status === 'error') { sub.textContent = '读取失败，数据未更新。'; }
    else if (app.status === 'loading') { sub.textContent = '正在读取 /dsh-feishu/api/state …'; }
    else {
      var stats = app.stats || L.statsOf([], [], { onlyVisible: true });
      var scopeTasks = 0;
      if (app.model) app.model.groups.forEach(function (lane) { scopeTasks += lane.tasks.length; });
      /* 一行灰字：N 任务 · M 条依赖 · K 条派生 · L 个阻塞（搜索时给出 N / 本范围总数）。 */
      var shown = app.filters.keyword ? (app.filtered.length + ' / ' + scopeTasks) : String(app.filtered.length);
      sub.textContent = shown + ' 任务 · ' + stats.dependencyEdges + ' 条依赖 · '
        + stats.provenanceEdges + ' 条派生 · ' + stats.blocked + ' 个阻塞'
        + (app.selection.kind === 'all' ? (' · ' + (app.model ? app.model.groups.length : 0) + ' 张图') : '');
    }

    var keyword = $('ovKeyword');
    if (keyword && keyword.value !== app.filters.keyword) keyword.value = app.filters.keyword;

    var refresh = $('ovRefresh');
    refresh.disabled = app.busy;
    refresh.textContent = app.busy ? '读取中…' : '刷新';
    var ver = $('ovVersion');
    ver.textContent = app.status === 'ready' ? ('只读 · 插件 ' + (app.version || '?')) : '只读视图';
  }

  /* ---------------- 视图：关系图 ---------------- */

  function mountRelationsView(view, mountEl, ctx) {
    var model = ctx.model;
    var filtered = ctx.filtered;
    if (!model || !filtered.length) {
      mountEl.appendChild(emptyNotice());
