      return;
    }
    /* 可见性 = 任务节点在筛选结果里；ghost 只要还连着可见节点就保留，
       否则依赖方向会断链、看起来像没关系的孤立任务。 */
    var visibleIds = Object.create(null);
    filtered.forEach(function (task) { visibleIds[L.str(task.id)] = true; });

    var shown = 0;
    model.groups.forEach(function (lane) {
      var visibleKeys = Object.create(null);
      lane.taskNodes.forEach(function (node) {
        if (visibleIds[node.id] === true) visibleKeys[node.key] = true;
      });
      if (!Object.keys(visibleKeys).length) {
        /* 空目录（成员都不在场）也要露一张卡片：否则它连重命名/删除的入口都没有。 */
        if (lane.mode === 'custom' && !lane.ungrouped && !lane.projectCount) {
          shown += 1;
          mountEl.appendChild(laneCard({ lane: lane, nodes: [], tasks: [], edges: [] }));
        }
        return;
      }
      lane.nodes.forEach(function (node) {
        if (node.ghost !== true) return;
        var attached = lane.edges.some(function (edge) {
          return (visibleKeys[edge.fromKey] && edge.toKey === node.key)
            || (visibleKeys[edge.toKey] && edge.fromKey === node.key);
        });
        if (attached) visibleKeys[node.key] = true;
      });
      var nodes = lane.nodes.filter(function (node) { return visibleKeys[node.key] === true; });
      var tasks = lane.taskNodes.filter(function (node) { return visibleIds[node.id] === true; });
      var edges = lane.edges.filter(function (edge) { return visibleKeys[edge.fromKey] && visibleKeys[edge.toKey]; });
      shown += 1;
      mountEl.appendChild(laneCard({ lane: lane, nodes: nodes, tasks: tasks, edges: edges }));
    });
    if (!shown) mountEl.appendChild(emptyNotice());
  }

  /**
   * 一张图＝一个自定义目录（按项目模式就是一个项目）。
   * 自定义目录的卡片是可放置目标：把 chip 拖上来即「移入这个目录」；
   * 组头有重命名 / 删除，组内图例既是配色说明也是「只看这个项目」的筛选按钮。
   */
  /**
   * 一张图＝当前 scope 的一个分组（全部任务模式下每个目录一张，目录/项目选中时只有一张）。
   * 头部保持最小：名字 + 数字 + 折叠；分组管理（重命名/删除/拖入拖出）统一在左栏树上做。
   */
  function laneCard(entry) {
    var lane = entry.lane;
    var collapsed = app.collapsed[lane.key] === true;
    var card = el('section', {
      class: 'ov-lane' + (collapsed ? ' is-collapsed' : ''),
      'aria-label': lane.label,
    });
    var head = el('div', { class: 'ov-lane-head' });
    var titleWrap = el('div', { style: 'display:flex;flex-direction:column;min-width:0' });
    titleWrap.appendChild(el('span', { class: 'ov-lane-name', text: lane.label }));
    if (lane.singleProject) titleWrap.appendChild(el('span', { class: 'ov-lane-path', text: '项目视图' }));
    else if (lane.projectCount > 1) titleWrap.appendChild(el('span', { class: 'ov-lane-path', text: lane.projectCount + ' 个项目共用一个坐标系' }));
    head.appendChild(titleWrap);

    var body = el('div', { class: 'ov-lane-body' });
    var meta = el('div', { class: 'ov-lane-meta' });
    meta.appendChild(el('span', { class: 'ov-tag', text: entry.tasks.length + ' 任务' }));
    meta.appendChild(el('span', { class: 'ov-tag', text: entry.edges.length + ' 条边' }));
    if (lane.blocked) meta.appendChild(el('span', { class: 'ov-tag', 'data-tone': 'danger', text: lane.blocked + ' 阻塞' }));
    var ghosts = entry.nodes.filter(function (n) { return n.ghost === true; });
    if (ghosts.length) meta.appendChild(el('span', { class: 'ov-tag', text: '↔ ' + ghosts.length + ' 组外/缺失' }));
    var toggle = el('button', {
      type: 'button', class: 'ov-btn ov-lane-toggle',
      'aria-expanded': collapsed ? 'false' : 'true',
      text: collapsed ? '展开' : '折叠',
      onclick: function () {
        var next = !(app.collapsed[lane.key] === true);
        app.collapsed[lane.key] = next;
        writeStore(STORE_COLLAPSED, app.collapsed);
        card.classList.toggle('is-collapsed', next);
        body.hidden = next;
        toggle.setAttribute('aria-expanded', next ? 'false' : 'true');
        toggle.textContent = next ? '展开' : '折叠';
      },
    });
    meta.appendChild(toggle);
    head.appendChild(meta);
    card.appendChild(head);

    if (!entry.tasks.length && !entry.nodes.length) {
      body.appendChild(notice(
        lane.ungrouped ? '没有未分组的项目' : '这个目录里还没有在场的工作区',
        lane.ungrouped
          ? '所有项目都已经归入某个目录。'
          : '它的成员当前任务集里一个都没有（可能被删或改名）。在左栏把项目拖进这个目录即可。',
        null,
      ));
    } else {
      body.appendChild(graphCanvas(entry));
    }

    var grid = el('div', { class: 'ov-card-grid' });
    entry.tasks.forEach(function (node) { grid.appendChild(taskCard(node)); });
    body.appendChild(grid);
    body.hidden = collapsed;
    card.appendChild(body);
    return card;
  }

  function graphCanvas(entry) {
    var lane = entry.lane;
    var customMode = lane.mode === 'custom';
    var wrap = el('div', { class: 'ov-canvas', 'data-mode': customMode ? 'custom' : 'project' });
    var svg = svgEl('svg', {
      viewBox: '0 0 ' + lane.width + ' ' + lane.height,
      width: lane.width,
      height: lane.height,
      'data-mode': customMode ? 'custom' : 'project',
      role: 'img',
      'aria-label': customMode
        ? (lane.label + '：' + lane.projectCount + ' 个项目、' + entry.tasks.length + ' 个任务画在同一张图里')
        : (lane.label + ' 的任务关系图，' + entry.tasks.length + ' 个任务'),
    });
    var defs = svgEl('defs');
    var marker = svgEl('marker', {
      id: 'ovArrow',
      viewBox: '0 0 8 8', refX: '7', refY: '4',
      markerWidth: '7', markerHeight: '7', orient: 'auto',
    });
    marker.appendChild(svgEl('path', { d: 'M0 1.2 L7 4 L0 6.8 z', fill: 'var(--p-accent-line)' }));
    defs.appendChild(marker);
    svg.appendChild(defs);

    if (customMode) svg.appendChild(bandLayer(lane));

    var edgeLayer = svgEl('g', { 'aria-hidden': 'true' });
    entry.edges.forEach(function (edge) {
      var attrs = {
        class: 'ov-edge',
        'data-kind': edge.kind,
        'data-from': edge.from,
        'data-to': edge.to,
        d: edge.path,
      };
      if (edge.kind === 'depends_on') attrs['marker-end'] = 'url(#ovArrow)';
      edgeLayer.appendChild(svgEl('path', attrs));
    });
    svg.appendChild(edgeLayer);

    var nodeLayer = svgEl('g');
    entry.nodes.forEach(function (node) { nodeLayer.appendChild(graphNode(node, entry)); });
    svg.appendChild(nodeLayer);
    wrap.appendChild(svg);
    return wrap;
  }

  /**
   * 项目背景带：同一张图里把项目分开，但**不切坐标空间**——
   * 带与带之间照样是一条条正交的边，直接从项目簇连到项目簇。
   */
  function bandLayer(lane) {
    var layer = svgEl('g', { 'aria-hidden': 'true', class: 'ov-band-layer' });
    L.arr(lane.clusters).forEach(function (band) {
      var attrs = {
        class: 'ov-band',
        x: band.x, y: band.y, width: band.width, height: band.height, rx: 14,
      };
      if (band.external) {
        attrs.style = 'fill: var(--p-ghost); stroke: var(--p-line-strong); stroke-dasharray: 4 4; stroke-opacity: .9';
      } else {
        attrs.style = 'fill: var(--ov-c' + band.color + '); fill-opacity: .055; stroke: var(--ov-c' + band.color + '); stroke-opacity: .32';
      }
      layer.appendChild(svgEl('rect', attrs));
      var label = svgEl('text', { class: 'ov-band-label', x: band.labelX, y: band.labelY });
      label.setAttribute('style', band.external ? 'fill: var(--p-text-3)' : ('fill: var(--ov-c' + band.color + ')'));
      label.textContent = band.external ? band.label : (band.label + ' · ' + band.nodes + ' 任务');
      layer.appendChild(label);
    });
    return layer;
  }

  function graphNode(node, entry) {
    var interactive = !node.ghost;
    var g = svgEl('g', {
      class: 'ov-node' + (node.ghost ? ' is-ghost' : ''),
      'data-key': node.key,
      'data-id': node.id,
      'data-state': node.state,
      'data-project': node.projectColor === undefined ? null : String(node.projectColor),
      tabindex: interactive ? '0' : null,
      /* ghost 不可点选（它不是一个真实任务），但仍要让读屏知道这里缺了什么。 */
      role: interactive ? 'button' : 'img',
      'aria-label': describeNode(node),
    });
    var tip = svgEl('title');
    tip.textContent = node.fullTitle || node.id;
    g.appendChild(tip);

    g.appendChild(svgEl('rect', {
      class: 'ov-node-bg',
      x: node.x, y: node.y, width: node.w, height: node.h, rx: 13,
    }));
    if (!node.ghost) {
      var spine = svgEl('rect', {
        class: 'ov-node-spine',
        x: node.x, y: node.y + 8, width: 3, height: node.h - 16, rx: 1.5,
      });
      /* 按目录分组：色条＝项目（状态由圆点与文案表达）；按项目分组：色条＝状态。 */
      if (node.projectColor !== undefined) spine.setAttribute('style', 'fill: var(--ov-c' + node.projectColor + ')');
      g.appendChild(spine);
    }
    g.appendChild(svgEl('circle', { class: 'ov-dot', cx: node.x + 18, cy: node.y + 21, r: 3.6 }));

    var noText = svgEl('text', { class: 'ov-node-no', x: node.x + 29, y: node.y + 25 });
    noText.textContent = node.no > 0 ? ('T' + node.no) : (node.ghost ? (node.missing ? '缺失' : (node.mode === 'custom' ? '组外' : '跨项目')) : node.id.slice(0, 8));
    g.appendChild(noText);

    var titleText = svgEl('text', { class: 'ov-node-title', x: node.x + 16, y: node.y + 47 });
    titleText.textContent = node.label || node.id;
    g.appendChild(titleText);

    var metaText = svgEl('text', { class: 'ov-node-meta', x: node.x + 16, y: node.y + 62 });
    metaText.textContent = nodeMeta(node);
    g.appendChild(metaText);

    g.addEventListener('click', function () { openDetail(node); });
    g.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ' || event.key === 'Spacebar') {
        event.preventDefault();
        openDetail(node);
      }
    });
    return g;
  }

  function nodeMeta(node) {
    if (node.ghost) {
      if (node.missing) return '任务不存在 · 仅剩关系';
      var owner = node.workspaceLabel || '其他项目';
      if (node.groupLabel) return '属于 ' + owner + '（目录 ' + node.groupLabel + '）';
      return '属于 ' + owner + (node.dirLabel ? ' · ' + node.dirLabel : '');
    }
    var bits = [];
    if (node.state === 'blocked') bits.push('阻塞 ' + node.refs.blockedBy.length);
    else if (node.state === 'done') bits.push('已完成');
    else if (node.state === 'suspended') bits.push('挂起');
    else bits.push('就绪');
    var out = node.refs.successors.length;
    if (out) bits.push('后置 ' + out);
    return bits.join(' · ');
  }

  function describeNode(node) {
    if (node.ghost) {
      var where = node.groupLabel ? ('目录 ' + node.groupLabel) : (node.dirLabel || '');
      return (node.missing ? '缺失任务 ' : '组外任务 ') + node.id + '：' + (node.fullTitle || '') + (where ? ('（' + where + '）') : '');
    }
    return (node.no > 0 ? ('T' + node.no + ' ') : '') + (node.fullTitle || node.id) + '，' + nodeMeta(node);
  }

  function taskCard(node) {
    var card = el('article', {
      class: 'ov-task-card' + (app.selected === node.key ? ' is-selected' : ''),
      'data-key': node.key,
      'data-state': node.state,
      tabindex: '0',
      role: 'button',
      title: node.fullTitle || node.id,
      onclick: function () { openDetail(node); },
      onkeydown: function (event) {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openDetail(node); }
      },
    });
    var top = el('div', { class: 'ov-task-card-top' });
    top.appendChild(el('span', { class: 'ov-dot-mark', 'data-state': node.state }));
    top.appendChild(el('span', { class: 'ov-task-no', text: node.no > 0 ? ('T' + node.no) : node.id.slice(0, 8) }));
    card.appendChild(top);
    card.appendChild(el('div', { class: 'ov-task-title', text: node.label || node.id }));
    var foot = el('div', { class: 'ov-task-foot' });
    foot.appendChild(el('span', { class: 'ov-tag', text: node.workspaceLabel || '未归属' }));
    if (node.state === 'blocked') foot.appendChild(el('span', { class: 'ov-tag', 'data-tone': 'danger', text: '阻塞 ' + node.refs.blockedBy.length }));
    else if (node.state === 'done') foot.appendChild(el('span', { class: 'ov-tag', 'data-tone': 'ok', text: '已完成' }));
    else if (node.state === 'suspended') foot.appendChild(el('span', { class: 'ov-tag', 'data-tone': 'accent', text: '挂起' }));
    card.appendChild(foot);
    return card;
  }

  /* ---------------- 详情 ---------------- */

  function openDetail(node) {
    app.selected = node.key;
    app.selectedNode = node;
    document.querySelectorAll('.ov-node.is-selected').forEach(function (n) { n.classList.remove('is-selected'); });
    document.querySelectorAll('.ov-task-card.is-selected').forEach(function (n) { n.classList.remove('is-selected'); });
    var svgHit = document.querySelector('.ov-node[data-key="' + cssEscape(node.key) + '"]');
    if (svgHit) svgHit.classList.add('is-selected');
    document.querySelectorAll('.ov-task-card[data-key="' + cssEscape(node.key) + '"]').forEach(function (n) { n.classList.add('is-selected'); });
    highlightEdges(node);
    renderDetail();
  }

  function cssEscape(value) { return String(value).replace(/["\\]/g, '\\$&'); }

  function highlightEdges(node) {
    document.querySelectorAll('.ov-edge').forEach(function (edge) {
      var hit = edge.getAttribute('data-from') === node.id || edge.getAttribute('data-to') === node.id;
      edge.classList.toggle('is-active', hit);
    });
  }

  function renderDetail() {
    var lanes = $('ovLanes');
    var body = $('ovBody');
    var node = app.selectedNode;
    if (!node || app.status !== 'ready') { body.classList.remove('has-detail'); return; }
    body.classList.add('has-detail');
    var old = $('ovDetail');
    if (old) old.parentNode.removeChild(old);
    var panel = el('aside', { class: 'ov-detail', id: 'ovDetail', 'aria-label': '任务详情' });

    var eyebrow = el('div', { class: 'ov-detail-eyebrow' });
    eyebrow.appendChild(el('span', { class: 'ov-dot-mark', 'data-state': node.state }));
    eyebrow.appendChild(el('span', { text: node.ghost ? (node.missing ? '缺失任务' : '跨项目任务') : ('任务 ' + (node.no > 0 ? ('T' + node.no) : node.id.slice(0, 8))) }));
    panel.appendChild(eyebrow);
    panel.appendChild(el('h2', { class: 'ov-detail-title', text: node.fullTitle || node.id }));

    var kv = el('dl', { class: 'ov-kv' });
    function row(key, value, mono) {
      kv.appendChild(el('dt', { text: key }));
      kv.appendChild(el('dd', { class: mono ? 'ov-mono' : null, text: value }));
    }
    row('项目', node.workspaceLabel || '未归属');
    if (node.workspacePath) row('目录', node.workspacePath, true);
    row('状态', statusText(node));
    row('编号', node.no > 0 ? ('T' + node.no) : '—', true);
    row('任务 ID', node.id, true);
    if (node.sessionId) row('绑定会话', node.sessionId, true);
    else row('绑定会话', '未绑定');
    panel.appendChild(kv);

    var refs = node.refs || {};
    appendRefs(panel, '前置（必须先完成）', refs.blockedBy && refs.blockedBy.length ? refs.blockedBy : refs.predecessors, '前置');
    appendRefs(panel, '后置（等这个）', refs.successors, '后置');
    appendRefs(panel, '来源任务', refs.sourceTasks, '来源');
    appendRefs(panel, '派生任务', refs.derivedTasks, '派生');

    if (node.ghost) {
      panel.appendChild(el('p', {
        class: 'ov-muted',
        text: node.missing
          ? '这个任务只在关系里出现，任务表里查不到：可能是跨清单引用或被删掉的条目。'
          : ('这个任务属于 ' + (node.workspaceLabel || '另一个项目')
             + (node.groupLabel ? ('（目录「' + node.groupLabel + '」）') : (node.dirLabel ? ('（' + node.dirLabel + '）') : ''))
             + '，画在这里只是为了让依赖方向不断链，不跨组拉长线。'),
      }));
    }
    var close = el('button', {
      type: 'button', class: 'ov-btn', text: '关闭详情',
      onclick: function () {
        app.selectedNode = null;
        app.selected = null;
        document.querySelectorAll('.is-selected').forEach(function (n) { n.classList.remove('is-selected'); });
        document.querySelectorAll('.ov-edge').forEach(function (e) { e.classList.remove('is-active'); });
        renderDetail();
      },
    });
    panel.appendChild(close);
    body.appendChild(panel);
  }

  function statusText(node) {
    if (node.ghost) {
      if (node.missing) return '任务表中不存在';
      if (node.groupLabel) return '属于目录「' + node.groupLabel + '」';
      return '属于其他项目' + (node.dirLabel ? ('（' + node.dirLabel + '）') : '');
    }
    if (node.state === 'done') return '已完成';
    if (node.state === 'blocked') return '阻塞（' + (node.refs.blockedBy || []).length + ' 个前置未完成）';
    if (node.state === 'suspended') return '已挂起';
    return '就绪';
  }

  function appendRefs(panel, label, list, kind) {
    var items = L.arr(list);
    var sec = el('section', { class: 'ov-detail-sec' });
    sec.appendChild(el('span', { class: 'ov-detail-sec-label', text: label }));
    if (!items.length) {
      sec.appendChild(el('span', { class: 'ov-muted', text: '无' }));
      panel.appendChild(sec);
      return;
    }
    items.forEach(function (item) {
      var id = typeof item === 'string' ? item : L.str(item && item.id);
      var title = typeof item === 'string' ? '' : L.str(item && item.title);
      var known = app.nodeIndex && app.nodeIndex[id];
      /* 只有「任务表里确实没有这个 id」才算缺失：跨项目 ghost 仍然可以点过去看。 */
      var missing = (typeof item === 'object' && item && item.missing === true)
        || !known
        || (known.ghost === true && known.missing === true);
      var btn = el('button', {
        type: 'button', class: 'ov-ref',
        'data-missing': missing ? 'true' : 'false',
        title: title || id,
        disabled: missing ? 'disabled' : null,
        onclick: missing ? null : function () { openDetail(known); },
      });
      btn.appendChild(el('span', { class: 'ov-task-no', text: kind }));
      btn.appendChild(el('span', { text: title || id }));
      sec.appendChild(btn);
    });
    panel.appendChild(sec);
  }

  /* ---------------- 状态块 ---------------- */

  function skeleton() {
    var wrap = el('div', { class: 'ov-skeleton', 'aria-hidden': 'true' });
    for (var i = 0; i < 3; i += 1) wrap.appendChild(el('div', { class: 'ov-skeleton-row' }));
    return wrap;
  }

  function notice(title, body, action) {
    var box = el('div', { class: 'ov-notice', role: 'status' });
    box.appendChild(el('h2', { class: 'ov-notice-title', text: title }));
    if (body) box.appendChild(el('p', { class: 'ov-notice-body', text: body }));
    if (action) {
      var actions = el('div', { class: 'ov-notice-actions' });
      actions.appendChild(action);
      box.appendChild(actions);
    }
    return box;
  }

  function errorNotice() {
    var retry = el('button', {
      type: 'button', class: 'ov-btn', id: 'ovRetry', text: '重试',
      onclick: function () { load(false); },
    });
    var box = notice('读不到飞书任务数据', '请求 GET ' + STATE_URL + ' 失败：' + (app.error || '未知错误'), retry);
    box.setAttribute('data-tone', 'error');
    box.setAttribute('role', 'alert');
    return box;
  }

  function emptyNotice() {
    var hasFilter = !!app.filters.keyword;
    var clearBtn = hasFilter ? el('button', {
      type: 'button', class: 'ov-btn', text: '清除搜索',
      onclick: function () {
        app.filters.keyword = '';
        writeStore(STORE_KEYWORD, '');
        var kw = $('ovKeyword');
        if (kw) kw.value = '';
        render();
      },
    }) : null;
    if (app.raw.length === 0) {
      return notice('还没有任何任务', '插件同步到飞书任务后，这里会按「自定义目录」把项目合起来画。可以先用侧边栏里的「同步」拉一次。', null);
    }
    return notice('没有匹配的任务', '当前筛选条件下一个任务都没有。', clearBtn);
  }

  /* ---------------- 启动 ---------------- */

  $('ovRefresh').addEventListener('click', function () { load(false); });
  $('ovKeyword').addEventListener('input', function (event) {
    app.filters.keyword = event.target.value || '';
    writeStore(STORE_KEYWORD, app.filters.keyword);
    render();
  });
  $('ovNewGroup').addEventListener('click', function () { openCreate(); });

  /* 键盘走 ARIA tree 口径：↑↓ 移动、←→ 折叠展开、Enter 选中、Home/End 到两端。 */
  $('ovTree').addEventListener('keydown', treeKeydown);

  /* 视图状态是「上次怎么看的，这次还怎么看」；目录成员关系以宿主为准，不存本地。 */
  app.selection = selectionSetting();
  app.focusKey = app.selection.kind === 'all' ? 'all' : (app.selection.kind + ':' + app.selection.id);
  var treeSetting = readStore(STORE_TREE, {});
  app.treeCollapsed = L.isObj(treeSetting) ? treeSetting : {};
  var collapsedSetting = readStore(STORE_COLLAPSED, {});
  app.collapsed = L.isObj(collapsedSetting) ? collapsedSetting : {};
  app.filters.keyword = L.str(readStore(STORE_KEYWORD, ''));

  window.addEventListener('message', function (event) {
    if (!event || event.source !== window.parent || event.origin !== window.location.origin) return;
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'dsh-feishu:theme') {
      if (data.dark) document.body.classList.add('dark');
      else document.body.classList.remove('dark');
      document.documentElement.setAttribute('data-theme-source', 'host');
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) load(true);
  });

  /* 主题不用主动问宿主：client.js 在 iframe onLoad 时推一次，主题变化时再推。
     本页是「全局面板」，刻意不要会话上下文，所以不发 request-context。 */

  load(false);
  setInterval(function () { if (!document.hidden) load(true); }, POLL_MS);
})();
</script>
</body>
</html>
