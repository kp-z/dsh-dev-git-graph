<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>dsh-dev-agent-mode 冒烟测试 v3（DOM 增强 MVP）</title>
<style>
  body { font-family: system-ui; margin: 16px; background: #f8fafc; }
  #log { white-space: pre-wrap; font-family: monospace; font-size: 12px; background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; max-height: 300px; overflow: auto; }
  .pass { color: #22c55e; }
  .fail { color: #ef4444; }
  #sidebar { margin-top: 12px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; background: #fff; width: 260px; font-family: system-ui; }
  #sidebar [role="treeitem"] { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  #sidebar [role="treeitem"]:hover { background: #f1f5f9; }
  #sidebar [class*="folder"] { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
  #sidebar [class*="title"] { font-size: 13px; color: #0f172a; }
</style>
</head>
<body>
<h3>dsh-dev-agent-mode 冒烟测试 v3（DOM 增强 MVP：头像注入 + 选择器 + 持久化 + 自愈）</h3>
<div id="log"></div>

<div id="sidebar" data-pane="sidebar">
  <div class="sectionHeader">
    <span class="sectionLabel">Workspaces</span>
    <div class="searchSlot"></div>
    <div class="headerActions">
      <button type="button" aria-label="视图选项" title="视图选项">⚙</button>
      <button type="button" aria-label="添加工作区">＋</button>
    </div>
  </div>
  <div role="treeitem" class="projectRow ws-row">
    <span class="slot folder">📁</span>
    <span class="projectText"><span class="title">dsh-plugins</span></span>
  </div>
  <div role="treeitem" class="projectRow ws-row">
    <span class="slot folder">📁</span>
    <span class="projectText"><span class="title">other-project</span></span>
  </div>
  <div role="treeitem" class="sessionRow">
    <span class="slot"></span>
    <span class="title">一个会话（无 folder，不应注入）</span>
  </div>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
  const log = document.getElementById('log');
  function out(cls, msg) {
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = msg;
    log.appendChild(div);
  }
  const results = [];
  function check(name, ok, detail) {
    results.push({ name, ok });
    out(ok ? 'pass' : 'fail', (ok ? '✅ ' : '❌ ') + name + (detail ? ' — ' + detail : ''));
  }

  // 清理 localStorage（避免旧模式残留）
  localStorage.removeItem('dsh-dev-agent-mode.mode');
  localStorage.removeItem('dsh-dev-agent-mode.avatars');

  // ===== 假 ctx =====
  const fakeCtx = {
    get(service) {
      if (service === 'workspaces') {
        return {
          list: {
            getSnapshot: () => ({
              items: [
                { workspaceId: 'ws-1', title: 'dsh-plugins', path: '/Users/kp/DEV/dsh-plugins' },
                { workspaceId: 'ws-2', title: 'other-project', path: '/Users/kp/DEV/other' },
              ]
            }),
            subscribe: () => () => {}
          }
        };
      }
      return undefined;
    },
    slots: {
      inject: (name, factory) => { try { return factory(); } catch (e) { return () => {}; } },
      register: (opts, comp) => { window.__registered = { opts, comp }; return () => {}; },
      entries: () => [],
      subscribe: () => () => {}
    },
    effect(fn) {
      const d = fn();
      window.__disposers = window.__disposers || [];
      if (typeof d === 'function') window.__disposers.push(d);
    }
  };

  window.__ModuleLoader__ = {
    load(manifest) {
      try {
        const mod = manifest.factory((name) => {
          if (name === 'react') return window.React;
          throw new Error('unknown require: ' + name);
        });
        window.__loadedPlugin = mod;
        check('client.js 加载成功 (apply/name)', !!(mod && mod.apply && mod.name === 'dev-agent-mode'));
      } catch (e) {
        check('client.js 加载成功 (apply/name)', false, e.message);
        window.__loadedPlugin = null;
      }
    }
  };

  const script = document.createElement('script');
  script.src = 'fixtures/client.js';
  script.onload = () => {
    out('pass', 'client.js 已加载');
    try {
      window.__loadedPlugin.apply(fakeCtx);
      check('apply(ctx) 执行无异常', true);
    } catch (e) {
      check('apply(ctx) 执行无异常', false, e.message);
    }

    // 诊断 + 等 MutationObserver 首轮注入（300ms 初始 + 60ms 防抖）
    setTimeout(() => {
      // 诊断输出
      const rows = document.querySelectorAll('[data-pane="sidebar"] [role="treeitem"]');
      out('pass', '诊断: treeitem=' + rows.length + ', mode=' + localStorage.getItem('dsh-dev-agent-mode.mode'));
      rows.forEach((row, idx) => {
        const folder = row.querySelector('[class*="folder"]');
        const titleEl = row.querySelector('[class*="title"]');
        out('pass', `诊断: 行${idx} folder=${!!folder} title=${titleEl ? titleEl.textContent.trim() : 'N/A'} injected=${row.getAttribute('data-dsh-agent-avatar-injected')}`);
      });

      // 1. 头像注入：2 个 workspace 行各有头像，session 行无
      const avatars = document.querySelectorAll('[data-dsh-agent-avatar]');
      check('workspace 行注入头像（2 个）', avatars.length === 2, '头像=' + avatars.length);
      check('session 行未注入（无 folder）', !document.querySelector('.sessionRow [data-dsh-agent-avatar]'));

      // 2. 头像内容：默认确定性（色块 + 首字母）
      const ws1Avatar = document.querySelector('[data-dsh-agent-avatar="ws-1"]');
      check('ws-1 头像为默认色块', ws1Avatar && ws1Avatar.dataset.kind === 'default' && ws1Avatar.textContent === 'D', 'kind=' + (ws1Avatar && ws1Avatar.dataset.kind) + ' text=' + (ws1Avatar && ws1Avatar.textContent));
      check('ws-1 头像有确定性渐变背景', ws1Avatar && ws1Avatar.style.background.includes('linear-gradient'));

      // 2.5 头部「分组方式」旁的模式切换按钮
      const toggle = document.querySelector('[data-dsh-agent-mode-toggle]');
      check('头部注入模式切换按钮', !!toggle, toggle ? ('位置=' + (toggle.parentElement.className || 'N/A')) : '');
      if (toggle) {
        const headerActions = toggle.parentElement;
        check('按钮在 headerActions 内（分组方式按钮旁）', !!headerActions && headerActions.className.includes('headerActions'), 'parent=' + (headerActions && headerActions.className));
        const viewBtn = headerActions.querySelector('button[aria-label="视图选项"]');
        check('与视图选项按钮同容器', !!viewBtn);
        check('默认 Agent 模式显示 🤖', toggle.textContent === '🤖', 'text=' + toggle.textContent);

        // 点击切官方模式 -> 头像移除
        toggle.click();
        setTimeout(() => {
          const avatarsOff = document.querySelectorAll('[data-dsh-agent-avatar]');
          check('点击切换后头像移除', avatarsOff.length === 0, '头像=' + avatarsOff.length);
          check('切官方模式按钮变 👁️', toggle.textContent === '👁️', 'text=' + toggle.textContent);

          // 再点击切回 Agent -> 头像恢复
          toggle.click();
          setTimeout(() => {
            const avatarsBack = document.querySelectorAll('[data-dsh-agent-avatar]');
            check('切回 Agent 头像恢复', avatarsBack.length === 2, '头像=' + avatarsBack.length);
            continueFlow();
          }, 120);
        }, 120);
        return; // 异步继续走 continueFlow
      }
      function continueFlow() {
        // 3. 点击头像弹选择器
      ws1Avatar.click();
      setTimeout(() => {
        const picker = document.querySelector('[data-dsh-agent-picker]');
        check('点头像弹出选择器', !!picker);
        if (!picker) { finish(); return; }

        // 4. 选择色块 -> 头像更新 + localStorage 持久化
        const swatch = picker.querySelector('.dsh-agent-picker-swatch');
        swatch.click();
        setTimeout(() => {
          const updated = document.querySelector('[data-dsh-agent-avatar="ws-1"]');
          check('选择色块后头像更新', updated && updated.dataset.kind === 'color', 'kind=' + (updated && updated.dataset.kind));
          const stored = JSON.parse(localStorage.getItem('dsh-dev-agent-mode.avatars') || '{}');
          check('头像偏好已持久化到 localStorage', stored['ws-1'] && stored['ws-1'].type === 'color', JSON.stringify(stored));

          // 5. 再点头像选 emoji
          updated.click();
          setTimeout(() => {
            const picker2 = document.querySelector('[data-dsh-agent-picker]');
            const emojiBtn = picker2.querySelector('.dsh-agent-picker-emoji');
            emojiBtn.click();
            setTimeout(() => {
              const updated2 = document.querySelector('[data-dsh-agent-avatar="ws-1"]');
              check('选 emoji 后头像为 emoji', updated2 && updated2.dataset.kind === 'emoji' && updated2.textContent.length > 0, 'text=' + (updated2 && updated2.textContent));
              const stored2 = JSON.parse(localStorage.getItem('dsh-dev-agent-mode.avatars') || '{}');
              check('emoji 偏好持久化', stored2['ws-1'] && stored2['ws-1'].type === 'emoji', JSON.stringify(stored2));

              // 6. 重置默认
              updated2.click();
              setTimeout(() => {
                const picker3 = document.querySelector('[data-dsh-agent-picker]');
                picker3.querySelector('.dsh-agent-picker-reset').click();
                setTimeout(() => {
                  const updated3 = document.querySelector('[data-dsh-agent-avatar="ws-1"]');
                  check('重置后回默认色块', updated3 && updated3.dataset.kind === 'default', 'kind=' + (updated3 && updated3.dataset.kind));
                  const stored3 = JSON.parse(localStorage.getItem('dsh-dev-agent-mode.avatars') || '{}');
                  check('重置后 localStorage 清掉该 ws', !stored3['ws-1']);

                  // 7. 自愈：模拟 React 重渲染（替换行 DOM）
                  const row = document.querySelector('.ws-row');
                  const clone = row.cloneNode(true);
                  clone.removeAttribute('data-dsh-agent-avatar-injected');
                  row.replaceWith(clone);
                  setTimeout(() => {
                    const avatarsAfter = document.querySelectorAll('[data-dsh-agent-avatar="ws-1"]');
                    check('重渲染后自愈重新注入', avatarsAfter.length === 1, '头像=' + avatarsAfter.length);

                    // 7.5 收尾
                    finish();
                  }, 120);
                }, 80);
              }, 60);
            }, 60);
          }, 60);
        }, 60);
      }, 60);
      }
    }, 500);
  };
  script.onerror = () => {
    check('client.js 加载无错误', false, 'script onerror');
    finish();
  };
  document.head.appendChild(script);

  function finish() {
    const failed = results.filter(r => !r.ok).length;
    out(failed === 0 ? 'pass' : 'fail', `\n==== 结果: ${results.length - failed}/${results.length} 通过 ====`);
  }
</script>
</body>
</html>
