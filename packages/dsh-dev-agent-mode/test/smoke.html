<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>dsh-dev-agent-mode 冒烟测试 v3（DOM 增强 MVP）</title>
<style>
  body { font-family: system-ui; margin: 16px; background: #f8fafc; }
  #log { white-space: pre-wrap; font-family: monospace; font-size: 12px; background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; max-height: 300px; overflow: auto; }
  .pass { color: #22c55e; }
  .fail { color: #ef4444; }
  #sidebar { margin-top: 12px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; background: #fff; width: 260px; font-family: system-ui; }
  /* 复刻官方 sectionHeader/headerActions 布局约束（官方 headerActions: max-width:60px + overflow:hidden） */
  #sidebar .sectionHeader { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-bottom: 4px; }
  #sidebar .headerActions { display: flex; align-items: center; gap: 4px; max-width: 60px; overflow: hidden; flex: none; }
  #sidebar [role="treeitem"] { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  #sidebar [role="treeitem"]:hover { background: #f1f5f9; }
  #sidebar [class*="folder"] { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
  #sidebar [class*="title"] { font-size: 13px; color: #0f172a; }
</style>
</head>
<body>
<h3>dsh-dev-agent-mode 冒烟测试 v3（DOM 增强 MVP：头像注入 + 选择器 + 持久化 + 自愈）</h3>
<div id="log"></div>

<div id="sidebar" data-pane="sidebar">
  <div class="sectionHeader">
    <span class="sectionLabel">Workspaces</span>
    <div class="searchSlot"></div>
    <div class="headerActions">
      <button type="button" aria-label="视图选项" title="视图选项">⚙</button>
      <button type="button" aria-label="添加工作区">＋</button>
    </div>
  </div>
  <div role="treeitem" class="projectRow ws-row">
    <span class="slot folder">📁</span>
    <span class="projectText"><span class="title">dsh-plugins</span></span>
  </div>
  <div role="treeitem" class="projectRow ws-row">
    <span class="slot folder">📁</span>
    <span class="projectText"><span class="title">other-project</span></span>
  </div>
  <div role="treeitem" class="sessionRow">
    <span class="slot"></span>
    <span class="title">一个会话（无 folder，不应注入）</span>
  </div>
</div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
  const log = document.getElementById('log');
  function out(cls, msg) {
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = msg;
    log.appendChild(div);
  }
  const results = [];
  function check(name, ok, detail) {
    results.push({ name, ok });
    out(ok ? 'pass' : 'fail', (ok ? '✅ ' : '❌ ') + name + (detail ? ' — ' + detail : ''));
  }

  // 清理 localStorage（避免旧模式残留）
  localStorage.removeItem('dsh-dev-agent-mode.mode');
  localStorage.removeItem('dsh-dev-agent-mode.avatars');

  // ===== fetch mock：DiceBear + 本地 AI 路由 =====
  // 注意：浏览器渲染 data:image/svg+xml 必须有 xmlns——mock 用真实世界的合法 SVG
  const MOCK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#2653eb"/></svg>';
  const realFetch = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    const u = String(url);
    if (u.includes('api.dicebear.com')) {
      return Promise.resolve(new Response(MOCK_SVG, { status: 200, headers: { 'content-type': 'image/svg+xml' } }));
    }
    if (u === '/dsh-dev-agent-mode/api/avatar-suggest' || u.endsWith('/dsh-dev-agent-mode/api/avatar-suggest')) {
      const body = opts && opts.body ? JSON.parse(opts.body) : {};
      if (!body.prompt) return Promise.resolve(new Response(JSON.stringify({ error: 'bad-prompt' }), { status: 400 }));
      return new Promise((resolve) => setTimeout(() => {
        resolve(new Response(JSON.stringify({ dataUrl: 'data:image/svg+xml;utf8,' + encodeURIComponent(MOCK_SVG), promptEcho: body.prompt }), { status: 200 }));
      }, 30));
    }
    return realFetch(url, opts);
  };

  // ===== 假 ctx =====
  const fakeCtx = {
    get(service) {
      if (service === 'workspaces') {
        return {
          list: {
            getSnapshot: () => ({
              items: [
                { workspaceId: 'ws-1', title: 'dsh-plugins', path: '/Users/kp/DEV/dsh-plugins' },
                { workspaceId: 'ws-2', title: 'other-project', path: '/Users/kp/DEV/other' },
              ]
            }),
            subscribe: () => () => {}
          }
        };
      }
      return undefined;
    },
    slots: {
      inject: (name, factory) => { try { return factory(); } catch (e) { return () => {}; } },
      register: (opts, comp) => { window.__registered = { opts, comp }; return () => {}; },
      entries: () => [],
      subscribe: () => () => {}
    },
    effect(fn) {
      const d = fn();
      window.__disposers = window.__disposers || [];
      if (typeof d === 'function') window.__disposers.push(d);
    }
  };

  window.__ModuleLoader__ = {
    load(manifest) {
      try {
        const mod = manifest.factory((name) => {
          if (name === 'react') return window.React;
          throw new Error('unknown require: ' + name);
        });
        window.__loadedPlugin = mod;
        check('client.js 加载成功 (apply/name)', !!(mod && mod.apply && mod.name === 'dev-agent-mode'));
      } catch (e) {
        check('client.js 加载成功 (apply/name)', false, e.message);
        window.__loadedPlugin = null;
      }
    }
  };

  const script = document.createElement('script');
  script.src = 'fixtures/client.js';
  script.onload = () => {
    out('pass', 'client.js 已加载');
    try {
      window.__loadedPlugin.apply(fakeCtx);
      check('apply(ctx) 执行无异常', true);
    } catch (e) {
      check('apply(ctx) 执行无异常', false, e.message);
    }

    // 诊断 + 等 MutationObserver 首轮注入（300ms 初始 + 60ms 防抖）
    setTimeout(() => {
      // 诊断输出
      const rows = document.querySelectorAll('[data-pane="sidebar"] [role="treeitem"]');
      out('pass', '诊断: treeitem=' + rows.length + ', mode=' + localStorage.getItem('dsh-dev-agent-mode.mode'));
      rows.forEach((row, idx) => {
        const folder = row.querySelector('[class*="folder"]');
        const titleEl = row.querySelector('[class*="title"]');
        out('pass', `诊断: 行${idx} folder=${!!folder} title=${titleEl ? titleEl.textContent.trim() : 'N/A'} injected=${row.getAttribute('data-dsh-agent-avatar-injected')}`);
      });

      // 1. 头像注入：2 个 workspace 行各有头像，session 行无
      const avatars = document.querySelectorAll('[data-dsh-agent-avatar]');
      check('workspace 行注入头像（2 个）', avatars.length === 2, '头像=' + avatars.length);
      check('session 行未注入（无 folder）', !document.querySelector('.sessionRow [data-dsh-agent-avatar]'));

      // 2. 头像内容：默认确定性（色块 + 首字母）
      const ws1Avatar = document.querySelector('[data-dsh-agent-avatar="ws-1"]');
      check('ws-1 头像为默认色块', ws1Avatar && ws1Avatar.dataset.kind === 'default' && ws1Avatar.textContent === 'D', 'kind=' + (ws1Avatar && ws1Avatar.dataset.kind) + ' text=' + (ws1Avatar && ws1Avatar.textContent));
      check('ws-1 头像有确定性渐变背景', ws1Avatar && ws1Avatar.style.background.includes('linear-gradient'));

      // 2.5 头部「分组方式」旁的模式切换按钮
      const toggle = document.querySelector('[data-dsh-agent-mode-toggle]');
      check('头部注入模式切换按钮', !!toggle, toggle ? ('位置=' + (toggle.parentElement.className || 'N/A')) : '');
      if (toggle) {
        const sectionHeader = toggle.parentElement;
        check('按钮在 sectionHeader 内', !!sectionHeader && sectionHeader.className.includes('sectionHeader'), 'parent=' + (sectionHeader && sectionHeader.className));
        // 关键：不能进 headerActions（官方 max-width:60px+overflow:hidden 会裁掉按钮）
        const headerActions = sectionHeader.querySelector('[class*="headerActions"]');
        check('按钮不在 headerActions 内（避免被裁剪）', toggle.parentElement !== headerActions, 'parent=' + (toggle.parentElement && toggle.parentElement.className));
        check('sectionHeader 含官方 headerActions', !!headerActions);
        const viewBtn = headerActions && headerActions.querySelector('button[aria-label="视图选项"], button[aria-label="View options"]');
        check('官方视图选项按钮存在', !!viewBtn);
        // 按钮 = 纯图标(SVG)，无文字、不用 emoji
        const toggleSvg = toggle.querySelector('svg');
        check('按钮含 SVG 图标', !!toggleSvg, 'svg=' + !!toggleSvg);
        check('按钮无文字（纯图标）', toggle.textContent.trim() === '', 'text=' + JSON.stringify(toggle.textContent));
        check('按钮无 emoji', !/🤖|👁️|👻/.test(toggle.textContent), 'text=' + toggle.textContent);
        check('Agent 模式按钮为机器人图标', toggleSvg && toggleSvg.querySelectorAll('rect').length > 0 && toggleSvg.querySelectorAll('circle').length > 0, 'rect/circle=' + (toggleSvg && toggleSvg.querySelectorAll('rect,circle').length));
        const agentIconHtml = toggleSvg && toggleSvg.innerHTML;
        check('按钮保留 aria-label', (toggle.getAttribute('aria-label') || '').includes('Agent 模式'), 'aria=' + toggle.getAttribute('aria-label'));

        // 点击切官方模式 -> 头像移除
        toggle.click();
        setTimeout(() => {
          const avatarsOff = document.querySelectorAll('[data-dsh-agent-avatar]');
          check('点击切换后头像移除', avatarsOff.length === 0, '头像=' + avatarsOff.length);
          const svg2 = toggle.querySelector('svg');
          check('切官方模式后图标变为文件夹', !!svg2 && svg2.innerHTML !== agentIconHtml && svg2.querySelectorAll('path').length > 0, 'changed=' + (svg2 && svg2.innerHTML !== agentIconHtml));
          check('切官方模式后仍无文字', toggle.textContent.trim() === '', 'text=' + JSON.stringify(toggle.textContent));
          check('切官方模式后 aria-label 更新', (toggle.getAttribute('aria-label') || '').includes('官方模式'), 'aria=' + toggle.getAttribute('aria-label'));

          // 再点击切回 Agent -> 头像恢复
          toggle.click();
          setTimeout(() => {
            const avatarsBack = document.querySelectorAll('[data-dsh-agent-avatar]');
            check('切回 Agent 头像恢复', avatarsBack.length === 2, '头像=' + avatarsBack.length);
            continueFlow();
          }, 120);
        }, 120);
        return; // 异步继续走 continueFlow
      }
      function continueFlow() {
        // 3. 点击头像弹配置窗口（含三源：预选/AI/上传 + 预览）
      ws1Avatar.click();
      setTimeout(() => {
        const picker = document.querySelector('[data-dsh-agent-picker]');
        check('点头像弹出配置窗口', !!picker);
        if (!picker) { finish(); return; }
        const fileInput = picker.querySelector('input[type="file"][accept^="image"]');
        check('配置窗口含上传图片入口', !!fileInput, 'input=' + !!fileInput);
        const preview = picker.querySelector('.dsh-agent-picker-preview');
        check('配置窗口含当前头像预览', !!preview, 'preview=' + !!preview);
        const uploadLabel = picker.querySelector('.dsh-agent-picker-upload');
        check('上传入口为文字标签', !!uploadLabel && uploadLabel.textContent.includes('选择图片'), 'label=' + (uploadLabel && uploadLabel.textContent));
        // 3.1 三个新区块存在
        check('配置窗口含预选头像区', !!picker.querySelector('.dsh-agent-picker-preset-grid'));
        check('配置窗口含 AI 生成输入', !!picker.querySelector('.dsh-agent-picker-ai-input'));
        check('配置窗口含 AI 生成按钮', !!picker.querySelector('.dsh-agent-picker-ai-btn'));
        check('预选区有状态提示元素', !!picker.querySelector('.dsh-agent-picker-preset-status'));

        // 3.2 等 DiceBear mock fetch 回包 -> 预选按钮出现
        setTimeout(() => {
          const presets = picker.querySelectorAll('.dsh-agent-picker-preset');
          check('预选头像加载完成（>0 个）', presets.length > 0, 'count=' + presets.length);
          const presetImg = presets[0] && presets[0].querySelector('img');
          check('预选头像 img 为 data:image/svg', !!presetImg && presetImg.src.startsWith('data:image/svg'), 'src=' + (presetImg && presetImg.src.slice(0, 30)));

          // 3.3 点第一个预选头像 -> 写 localStorage + 关闭
          if (presets[0]) presets[0].click();
          setTimeout(() => {
            const storedP = JSON.parse(localStorage.getItem('dsh-dev-agent-mode.avatars') || '{}');
            check('选预选头像后持久化 image 类型', storedP['ws-1'] && storedP['ws-1'].type === 'image' && storedP['ws-1'].dataUrl.startsWith('data:image/svg'), JSON.stringify(storedP).slice(0, 80));
            const avatarAfterPreset = document.querySelector('[data-dsh-agent-avatar="ws-1"]');
            check('选预选头像后头像 kind=image', !!avatarAfterPreset && avatarAfterPreset.dataset.kind === 'image');
            // 重开 picker 做 AI 生成测试
            avatarAfterPreset.click();
            setTimeout(() => runAiTest(), 80);
          }, 100);
        }, 250);
      }, 80);
      }

      function runAiTest() {
        const picker2 = document.querySelector('[data-dsh-agent-picker]');
        if (!picker2) { check('重开配置窗口', false); finish(); return; }
        const aiInput = picker2.querySelector('.dsh-agent-picker-ai-input');
        const aiBtn = picker2.querySelector('.dsh-agent-picker-ai-btn');
        aiInput.value = '蓝色机器猫';
        aiBtn.click();
        // 生成中按钮态
        check('AI 生成中按钮禁用', aiBtn.disabled === true || aiBtn.textContent.includes('生成中'), 'text=' + aiBtn.textContent);
        setTimeout(() => {
          const aiPreview = picker2.querySelector('.dsh-agent-picker-ai-preview');
          check('AI 生成后出现预览', !!aiPreview && aiPreview.style.display !== 'none', 'display=' + (aiPreview && aiPreview.style.display));
          const avatarPv = aiPreview && aiPreview.querySelector('.dsh-agent-picker-ai-avatar');
          check('AI 预览含头像', !!avatarPv, 'pv=' + !!avatarPv);
          const acceptBtn = aiPreview && aiPreview.querySelector('.dsh-agent-picker-ai-accept');
          check('AI 预览含采用按钮', !!acceptBtn);
          if (acceptBtn) acceptBtn.click();
          setTimeout(() => {
            const storedAi = JSON.parse(localStorage.getItem('dsh-dev-agent-mode.avatars') || '{}');
            check('AI 采用后持久化 image 类型', storedAi['ws-1'] && storedAi['ws-1'].type === 'image', JSON.stringify(storedAi).slice(0, 80));
            // 继续原本流程：选中色块
            continueColorFlow();
          }, 100);
        }, 200);
      }

      function continueColorFlow() {
        // 重开 picker 走色块流程
        const avatar = document.querySelector('[data-dsh-agent-avatar="ws-1"]');
        avatar.click();
        setTimeout(() => {
          const picker3 = document.querySelector('[data-dsh-agent-picker]');

        // 3.5 面板结构：无 emoji 区块（用户 2026-09-09 拍板移除）、AI 模型下拉、AI 描述 textarea
        check('面板不含 Emoji 区块（已移除）', !picker3.querySelector('.dsh-agent-picker-emoji, [class*="picker-emoji"]'), 'emoji区块=' + !!picker3.querySelector('[class*="emoji"]'));
        check('面板含 AI 模型下拉', !!picker3.querySelector('.dsh-agent-picker-model-select'), 'modelSelect=' + !!picker3.querySelector('.dsh-agent-picker-model-select'));
        const aiTextarea = picker3.querySelector('.dsh-agent-picker-ai-input');
        check('AI 描述为多行 textarea', !!aiTextarea && aiTextarea.tagName === 'TEXTAREA', 'tag=' + (aiTextarea && aiTextarea.tagName));

        // 4. 选择色块 -> 头像更新 + localStorage 持久化
        const swatch = picker3.querySelector('.dsh-agent-picker-swatch');
        swatch.click();
        setTimeout(() => {
          const updated = document.querySelector('[data-dsh-agent-avatar="ws-1"]');
          check('选择色块后头像更新', updated && updated.dataset.kind === 'color', 'kind=' + (updated && updated.dataset.kind));
          const stored = JSON.parse(localStorage.getItem('dsh-dev-agent-mode.avatars') || '{}');
          check('头像偏好已持久化到 localStorage', stored['ws-1'] && stored['ws-1'].type === 'color', JSON.stringify(stored));

          // 5.1 再选一个不同色块（验证二次选择仍工作）
          updated.click();
          setTimeout(() => {
            const picker5 = document.querySelector('[data-dsh-agent-picker]');
            const swatches5 = picker5.querySelectorAll('.dsh-agent-picker-swatch');
            swatches5[1].click();
            setTimeout(() => {
              const updated2 = document.querySelector('[data-dsh-agent-avatar="ws-1"]');
              check('二次选色块后头像更新', updated2 && updated2.dataset.kind === 'color', 'kind=' + (updated2 && updated2.dataset.kind));
              const stored2 = JSON.parse(localStorage.getItem('dsh-dev-agent-mode.avatars') || '{}');
              check('二次选择偏好已持久化', stored2['ws-1'] && stored2['ws-1'].type === 'color', JSON.stringify(stored2));

              // 5.5 图片头像：直接写 store -> 渲染为 image（background-image）
              const imgDataUrl = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==';
              localStorage.setItem('dsh-dev-agent-mode.avatars', JSON.stringify({ 'ws-1': { type: 'image', dataUrl: imgDataUrl } }));
              out('pass', '诊断: 写入后 localStorage=' + localStorage.getItem('dsh-dev-agent-mode.avatars').slice(0, 60));
              out('pass', '诊断: mode=' + localStorage.getItem('dsh-dev-agent-mode.mode'));
              const tmp = document.createElement('div');
              document.body.appendChild(tmp);
              tmp.remove(); // 触发 observer 重注入
              setTimeout(() => {
                // 等 observer 防抖完成。注意：直接改 localStorage 无 onChange 同步替换，
                // 只能靠 observer 自愈；flush(60ms) 的 timer 在微任务里注册，晚于本处同步
                // 注册的 check timer，故等待必须显著大于防抖值，否则读到旧头像。
                const imgAvatar = document.querySelector('[data-dsh-agent-avatar="ws-1"]');
                check('图片头像渲染为 image 类型', imgAvatar && imgAvatar.dataset.kind === 'image', 'kind=' + (imgAvatar && imgAvatar.dataset.kind));
                check('图片头像用 background-image', imgAvatar && imgAvatar.style.backgroundImage.includes('data:image/png'), 'bg=' + (imgAvatar && imgAvatar.style.backgroundImage.slice(0, 40)));
                out('pass', '诊断: image bg=' + (imgAvatar && imgAvatar.style.backgroundImage.slice(0, 30)));

                // 6. 重置默认（先写色块再重置）
                localStorage.setItem('dsh-dev-agent-mode.avatars', JSON.stringify({ 'ws-1': { type: 'color', hue: 90 } }));
                const tmp2 = document.createElement('div');
                document.body.appendChild(tmp2);
                tmp2.remove();
                setTimeout(() => {
                  // 等 observer 自愈完成（色块头像重建后再点击）
                  const colorAvatar = document.querySelector('[data-dsh-agent-avatar="ws-1"]');
                  colorAvatar.click();
                  setTimeout(() => {
                    const picker6 = document.querySelector('[data-dsh-agent-picker]');
                    picker6.querySelector('.dsh-agent-picker-reset').click();
                    setTimeout(() => {
                      const updated3 = document.querySelector('[data-dsh-agent-avatar="ws-1"]');
                      check('重置后回默认色块', updated3 && updated3.dataset.kind === 'default', 'kind=' + (updated3 && updated3.dataset.kind));
                      const stored3 = JSON.parse(localStorage.getItem('dsh-dev-agent-mode.avatars') || '{}');
                      check('重置后 localStorage 清掉该 ws', !stored3['ws-1']);

                      // 7. 自愈：模拟 React 重渲染（替换行 DOM）
                      const row = document.querySelector('.ws-row');
                      const clone = row.cloneNode(true);
                      clone.removeAttribute('data-dsh-agent-avatar-injected');
                      row.replaceWith(clone);
                      setTimeout(() => {
                        const avatarsAfter = document.querySelectorAll('[data-dsh-agent-avatar="ws-1"]');
                        check('重渲染后自愈重新注入', avatarsAfter.length === 1, '头像=' + avatarsAfter.length);

                        // 7.5 收尾
                        finish();
                      }, 160);
                    }, 100);
                  }, 100);
                }, 160);
              }, 200);
            }, 60);
          }, 60);
        }, 60);
      }, 60);
      }
    }, 500);
  };
  script.onerror = () => {
    check('client.js 加载无错误', false, 'script onerror');
    finish();
  };
  document.head.appendChild(script);

  function finish() {
    const failed = results.filter(r => !r.ok).length;
    out(failed === 0 ? 'pass' : 'fail', `\n==== 结果: ${results.length - failed}/${results.length} 通过 ====`);
  }
</script>
</body>
</html>
