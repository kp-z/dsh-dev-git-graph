# 本 bundle 的 patch：只把本插件自己插进 profile 的层栈。
#
# ── 为什么这里**不**顺带插入 dsh-mermaid 的 entry（曾经的 CARRIER 方案，已撤销）──
#
# v0.3.0 曾在此追加一行 `{id: ui-mermaid, name: dsh-mermaid}`，想让「装本插件」一步
# 到位地挂上渲染器。实测**必然炸**：dsh-mermaid 自己带 `dsh.bundle.patch`，所以只要它
# 成为 profile 的顶层依赖，`reconcilePlugins` 就会把它提升进 `dsh.profile.bundles`，
# 它自己的 patch 也插入 `ui-mermaid` —— 两处同 id，而 cordis 对重复 loader entry id
# 是**硬失败**（整棵树起不来，报错还不会点名任何插件）：
#
#     重复的 loader 条目 id "ui-mermaid"
#
# 触发它的不是误操作，而是**正常安装路径**：任何把依赖落实为 profile 顶层依赖的安装器
# （市场/插件管理 UI 都会）都会让 dsh-mermaid 变成 bundle。换句话说，只要 dsh-mermaid
# 可能被独立安装，carrier 就与它互斥 —— 这不是能靠文档规避的边界，而是设计冲突。
#
# 所以职责切开：
#   * **代码供给**交给 `dependencies: { dsh-mermaid }`（pnpm 必装，装本插件就带上）；
#   * **挂载**交给 dsh-mermaid 自己的 patch（把它作为 bundle 装上即可）。
# 二者都不依赖对方，任何安装顺序/路径都不会产生重复 id。
- insert:
    - id: mermaid-comm
      name: dsh-mermaid-comm
